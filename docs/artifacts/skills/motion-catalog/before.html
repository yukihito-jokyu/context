<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おすすめの本</title>
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --ink: #2b2b2b; --muted: #6b6b6b; --accent: #c2410c; --line: #e4e0d8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 32px 24px 8px; max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  header p { margin: 0; color: var(--muted); }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 24px; max-width: 960px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .tag { display: inline-block; font-size: 12px; color: var(--accent); margin-bottom: 8px; }
  .card h2 { margin: 0 0 8px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>今月のおすすめの本</h1>
  <p>スタッフが選んだ6冊です。</p>
</header>
<main class="list">
  <article class="card"><span class="tag">小説</span><h2>灯台の見える町</h2><p>海辺の小さな町で、古い灯台を守る家族の一年を描く物語。</p></article>
  <article class="card"><span class="tag">エッセイ</span><h2>朝の台所</h2><p>毎朝の料理から季節の移り変わりを綴った短い随筆集。</p></article>
  <article class="card"><span class="tag">科学</span><h2>雲のかたちの図鑑</h2><p>空を見上げるのが楽しくなる、雲の種類と見分け方。</p></article>
  <article class="card"><span class="tag">旅</span><h2>北の鉄道を歩く</h2><p>ローカル線の駅を一つずつ訪ねた旅の記録。</p></article>
  <article class="card"><span class="tag">絵本</span><h2>ねこのポストマン</h2><p>手紙を届けるねこの、ちいさな冒険のおはなし。</p></article>
  <article class="card"><span class="tag">歴史</span><h2>港と商人の五百年</h2><p>交易の港町がどう栄え、どう変わってきたかをたどる。</p></article>
</main>
</body>
</html>
