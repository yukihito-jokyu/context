# ブラウザゲームのタイトル画面用。明るい8小節ループ。ナレーションなし。

[song]
bpm = 152
key = "D"
mode = "major"
bars = 8
beats_per_bar = 4
seed = 7
humanize_ms = 2.0
chords = ["1", "4", "6", "5", "1", "4", "27", "5"]

[mix]
target_lufs = -16.0
highpass_hz = 35.0
voice_dip_db = 0.0   # ナレーションを重ねないので削らない
voice_dip_hz = 2000.0
reverb_t60 = 1.0

# ---- リズム ----
[parts.bongo_lo]
kind = "drum"
instrument = "bongo_lo"
gain_db = -7
pan = -0.2
reverb = 0.08
pattern = """
X . . . . x . . | X . . . . x . x
"""

[parts.bongo_hi]
kind = "drum"
instrument = "bongo_hi"
gain_db = -7
pan = 0.25
reverb = 0.08
pattern = """
. . x . . . X . | . . x . . . X x
"""

[parts.tambourine]
kind = "drum"
instrument = "tambourine"
gain_db = -14
pan = 0.4
reverb = 0.05
pattern = "o o x o o o x o"

# ---- ベース ----
[parts.bass]
kind = "bass"
instrument = "pizz_bass"
octave = 2
gain_db = -7
reverb = 0.03
pattern = """
R . 5 . R . 5 8 | R . 5 . 8 . R 5 | R . 5 . R . 5 8 | R . 3 5 8 . 5 3
"""

# ---- コード ----
[parts.chords]
kind = "chord"
instrument = "pizz_violin"
octave = 4
gain_db = -10
pan = -0.3
reverb = 0.16
strum_ms = 7
pattern = """
. x . x . x . x | . x . x . x x .
"""

# ---- メロディ ----
[parts.melody]
kind = "melody"
instrument = "xylophone"
octave = 5
gain_db = -5
reverb = 0.16
pattern = """
1' . 5 6 5 . 3 5
6 . 4 6 1' . 6 1'
3' . 1' 2' 3' . 1' 6
2' . 7 1' 2' - . 5
3' . 1' 3' 5' . 3' 5'
6' . 4' 5' 6' . 4' 1'
4' . 2' 4' 6' . 4' 2'
5' . 2' 7 5 . 7 2'
"""

# ---- アレンジ ----
[parts.melody_octave]
copy_of = "melody"
octave = 6
gain_db = -17
pan = 0.15
reverb = 0.2

[parts.glockenspiel]
kind = "melody"
instrument = "glockenspiel"
octave = 6
gain_db = -15
pan = 0.35
reverb = 0.3
pattern = """
1 . 3 . 5 . . . | . | . | . | 3 . 5 . 1' . . . | . | . | .
"""
