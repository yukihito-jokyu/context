# ユーザーの設定。setup.py で作った。依頼に指定の無い値をここから補う（依頼文や作業の途中の指示がいつも優先される）
# null の項目は settings/skill-setting.yaml（スキルの設定）の値を使う。# から行末まではコメント
inputs: # 入力の既定値
  targets: [codex] # 対象の製品。claude、codex から1つ以上
  language: ja # 言語。ja、en のどれか
  measure: ask # 収束テストの実行。ask、run、skip のどれか
  eval: make # Eval の作成。make、skip のどれか
  hooks: null # hooks の方針。all、check、none のどれか
convergence: # 収束テストの動かし方
  runners: [subagent] # エージェントを動かすもの。claude、codex、subagent から1つ以上
  agents: 2 # runner ごとのエージェントの人数。1 以上の整数
  max_rounds: 3 # ラウンドの上限。超えると続けるかを聞かれる。1 以上の整数
  thresholds: # 課題が基準を満たす揃い方（1 は全員が一致）
    files: 0.8 # 作った・変えたファイルの集合の一致度。0 から 1 の数
    structure: 0.8 # 共通のファイルの骨格（見出し、JSON のキーと型など）が一致する割合。0 から 1 の数
    names: 0.8 # 作業で新しく作った名前（英字の識別子）の一致度。0 から 1 の数
  model: # runner ごとのエージェントのモデル。null なら runner の既定
    claude: null # claude -p の --model。正式名（例 claude-opus-5-5）も書ける。例 opus、sonnet、haiku、fable
    codex: gpt-6.1-sol # codex exec の -m。~/.codex/config.toml の model と同じ書き方。空でない文字列
    subagent: gpt-6.1-sol # Agent ツールの model。例 opus、sonnet、haiku、fable
  effort: # runner ごとの推論エフォート。null なら runner の既定
    claude: null # claude -p の --effort。例 low、medium、high、xhigh、max
    codex: medium # codex の model_reasoning_effort（使える値はモデルによる）。例 low、medium、high、xhigh、max
    subagent: medium # Agent ツールの effort。例 low、medium、high、xhigh、max
  analysis: # 各エージェントの動きを分析する AI
    runner: subagent # 分析役の runner。null なら runners の先頭。claude、codex、subagent のどれか
    model: gpt-6.1-sol # 分析役のモデル。null なら分析役の runner の model。例 opus、sonnet、haiku、fable
    effort: high # 分析役の推論エフォート。null なら分析役の runner の effort。例 low、medium、high、xhigh、max
  parallel: 8 # 同時に動かすエージェントの数。1 以上の整数
  timeout: 1800 # エージェント1人の上限の秒数。1 以上の整数
