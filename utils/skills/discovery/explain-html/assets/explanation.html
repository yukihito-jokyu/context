<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>
:root{--page:#faf9f6;--surface:#fff;--text:#30302e;--secondary:#62625d;--border:#deddd5;--purple:#675082;--purple-bg:#eeedfe;--sans:system-ui,-apple-system,"Noto Sans JP",sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--text);font:19px/1.8 var(--sans)}main{max-width:1220px;margin:auto;padding:32px 40px 80px}h1{font-size:34px;font-weight:500;margin:0 0 12px}h2{font-size:28px;font-weight:500}h3{font-size:24px;font-weight:500}p{margin:16px 0}a{color:var(--purple);text-underline-offset:4px;overflow-wrap:anywhere}button{font:18px/1.6 var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer}button:hover{border-color:var(--purple)}:focus-visible{outline:3px solid var(--purple);outline-offset:4px}.app-header{border-bottom:1px solid var(--border);padding-bottom:20px}.shared-scope{color:var(--secondary);margin:4px 0}.topic-nav,.concern-nav{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:19px}.topic-nav a,.concern-nav a{text-decoration:none;padding:4px 0}.topic-nav a[aria-current="page"],.concern-nav a[aria-current="true"]{border-bottom:2px solid var(--purple)}[hidden]{display:none!important}.prose{max-width:760px;margin:24px auto}.lead,.focus{font-size:29px;font-weight:500;line-height:1.6}.concern-page{padding-top:12px}.concern-whole-map{margin:24px 0}.archify-overview-image{position:relative;max-width:1120px;margin:auto}.whole-map-image{display:block;width:100%;height:auto}.diagram-scroll{overflow-x:auto}.diagram-hotspot{position:absolute;border:2px solid transparent;border-radius:5px}.diagram-hotspot:hover,.diagram-hotspot:focus-visible{border-color:var(--purple);background:#67508212}.concern-whole-map figcaption{max-width:760px;margin:18px auto;font-size:19px}.diagram-links{max-width:760px;margin:16px auto;display:flex;flex-wrap:wrap;gap:8px 20px}.page-turn{display:flex;justify-content:space-between;gap:24px;border-top:1px solid var(--border);padding-top:24px;margin-top:36px}details{max-width:760px;margin:24px auto;border-top:1px solid var(--border);padding-top:14px}summary{cursor:pointer;font-weight:500}table{width:100%;border-collapse:collapse;font-size:19px}td,th{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}th{font-weight:500}pre{margin:0;overflow-x:auto;font:18px/1.8 var(--mono);white-space:pre}code{font-family:var(--mono);font-size:18px}.code-panel{max-width:1120px;margin:24px auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}.code-heading{padding:12px 18px;border-bottom:1px solid var(--border);font-weight:500}.code-lines{padding:14px 18px}.code-line{display:block;scroll-margin-top:40px}.line-number::before{content:attr(data-line);display:inline-block;min-width:3ch;margin-right:2ch;color:var(--secondary)}.code-line:target{background:var(--purple-bg)}.note{background:var(--purple-bg);padding:16px 20px;border-left:3px solid var(--purple)}.flow-controls{display:flex;gap:10px;flex-wrap:wrap;max-width:760px;margin:24px auto}.flow-status,.flow-note{max-width:760px;margin:16px auto}.flow-status{min-height:2em}.trace-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.trace-signal{fill:none;stroke:var(--purple);stroke-width:4;stroke-dasharray:.085 .915;stroke-linecap:round;opacity:0}.stage-highlight{fill:transparent;stroke:transparent;stroke-width:3}.stage-highlight.flow-active{fill:#67508210;stroke:var(--purple)}[data-flow-select][aria-current="step"]{border-color:var(--purple);background:var(--purple-bg)}.navigation-status{padding:8px 12px;border-left:3px solid var(--purple);background:var(--purple-bg)}.navigation-source{outline:3px solid var(--purple);outline-offset:3px}.navigation-arrival{outline:2px solid var(--purple);outline-offset:8px;scroll-margin-top:40px}
figure{margin:0}.diagram-scroll .archify-overview-image[data-zoomed]{width:2800px;min-width:2800px;max-width:none}.diagram-tools{max-width:760px;margin:16px auto}.syntax-keyword{color:#70549b}.syntax-string{color:#3e6454}.flow-active:not(rect){border-left:3px solid var(--purple);background:var(--purple-bg);padding-left:12px}
@media(max-width:700px){main{padding:24px 20px 60px}h1{font-size:30px}.topic-nav{gap:8px 16px}.diagram-scroll .archify-overview-image{min-width:1000px}.page-turn{flex-direction:column}.table-scroll{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.trace-signal{display:none!important}}
@media print{[data-page][hidden]{display:block!important}.topic-nav,.concern-nav,.page-turn,.flow-controls,.trace-svg,.navigation-status{display:none!important}.diagram-scroll{overflow:visible}.diagram-scroll .archify-overview-image{min-width:0}details{display:block}.navigation-arrival{outline:none}}
</style></head><body><main><header class="app-header"><h1>{{TITLE}}</h1><p class="shared-scope">{{SCOPE}}</p>{{CONCERN_NAV_HTML}}{{TOPIC_NAV_HTML}}<p id="navigation-status" class="navigation-status" role="status" aria-live="polite" aria-atomic="true" hidden></p></header>{{PAGES_HTML}}<nav class="page-turn" aria-label="前後のページ"><a id="page-previous" hidden></a><a id="page-next"></a></nav></main><script>{{NAVIGATION_SCRIPT}}</script><script>{{FLOW_SCRIPT}}</script></body></html>
