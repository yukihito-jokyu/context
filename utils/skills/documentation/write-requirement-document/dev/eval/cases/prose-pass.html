<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重複する予約を防ぐ</title><style>body{margin:0;background:#f4f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.8}main{max-width:860px;margin:32px auto;padding:32px;background:white;border:1px solid #dae1e8;border-radius:12px}h1{font-size:24px;line-height:1.5;margin:8px 0 20px}h2{font-size:19px;margin-top:28px}p{max-width:44em}.label{font-size:13px;color:#526474}dt{font-weight:700}dd{margin:0 0 12px}figure{margin:16px 0;padding:20px;background:#f2f6fc;border:1px solid #cad9eb;border-radius:8px}figcaption{margin-top:12px;font-size:14px}svg{display:block;width:100%;height:auto}.req{border-left:4px solid #3267a8;padding-left:16px}li{margin:5px 0}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head><body><main><p class="label">評価用の抜粋 · 社内備品予約</p><h1>重複する予約を防ぐ</h1><p>同じ備品に重複する時間帯の予約がある場合、新しい予約を受け付けない。</p><p>部署ごとに予約を受け付けると、同じ備品の予定が重なる。この問題を防ぐため、社員が入力した備品・開始時刻・終了時刻を、確定済みの予約と照合する。</p><p>重複があれば予約を確定せず、重複があることを社員に表示する。重複がなければ予約を確定する。</p><p>前の予約の終了時刻と、次の予約の開始時刻が同じ場合に受け付けるかは、業務担当者への確認が必要である。</p></main></body></html>
