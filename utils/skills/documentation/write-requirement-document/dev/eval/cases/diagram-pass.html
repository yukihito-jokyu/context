<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約が確定する条件</title><style>body{margin:0;background:#f4f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.8}main{max-width:860px;margin:32px auto;padding:32px;background:white;border:1px solid #dae1e8;border-radius:12px}h1{font-size:24px;line-height:1.5;margin:8px 0 20px}h2{font-size:19px;margin-top:28px}p{max-width:44em}.label{font-size:13px;color:#526474}dt{font-weight:700}dd{margin:0 0 12px}figure{margin:16px 0;padding:20px;background:#f2f6fc;border:1px solid #cad9eb;border-radius:8px}figcaption{margin-top:12px;font-size:14px}svg{display:block;width:100%;height:auto}.req{border-left:4px solid #3267a8;padding-left:16px}li{margin:5px 0}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head><body><main><p class="label">評価用の抜粋 · 社内備品予約</p><h1>予約が確定する条件</h1><p>社員が予約を入力した後、重複の有無で受付結果が変わる。次の図は、この分岐を示す。</p><figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="flow-title"><title id="flow-title">予約の入力から、重複の有無による結果まで</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#456484"/></marker></defs><g fill="#fff" stroke="#456484" stroke-width="2"><rect x="180" y="10" width="360" height="48" rx="8"/><path d="M360 95L500 150L360 205L220 150Z"/><rect x="5" y="245" width="300" height="48" rx="8"/><rect x="415" y="245" width="300" height="48" rx="8"/></g><g stroke="#456484" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M360 58V93"/><path d="M220 150H155V242"/><path d="M500 150H565V242"/></g><g fill="#17212b" text-anchor="middle" font-size="17"><text x="360" y="40">社員が備品・開始・終了時刻を入力</text><text x="360" y="156">同じ備品・時間帯に重複？</text><text x="189" y="183">あり</text><text x="530" y="183">なし</text><text x="155" y="276">予約を受け付けない</text><text x="565" y="276">予約を確定する</text></g></svg><figcaption>重複があると受け付けず、ないと予約を確定する。拒否する条件は <a href="#R-02">重複する予約を受け付けない</a> で定義する。</figcaption></figure><div class="req" id="R-02"><h2>重複する予約を受け付けない</h2><p>同じ備品に重複する時間帯の予約がある場合は、新しい予約を確定しない。</p><p>確認例：10時から11時まで予約済みの備品について、10時30分から11時30分までの予約を申し込むと、予約は確定しない。</p></div></main></body></html>
