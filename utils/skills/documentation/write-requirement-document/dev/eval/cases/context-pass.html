<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>何のために、どこまで作るか</title><style>body{margin:0;background:#f4f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.8}main{max-width:860px;margin:32px auto;padding:32px;background:white;border:1px solid #dae1e8;border-radius:12px}h1{font-size:24px;line-height:1.5;margin:8px 0 20px}h2{font-size:19px;margin-top:28px}p{max-width:44em}.label{font-size:13px;color:#526474}dt{font-weight:700}dd{margin:0 0 12px}figure{margin:16px 0;padding:20px;background:#f2f6fc;border:1px solid #cad9eb;border-radius:8px}figcaption{margin-top:12px;font-size:14px}svg{display:block;width:100%;height:auto}.req{border-left:4px solid #3267a8;padding-left:16px}li{margin:5px 0}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head><body><main><p class="label">評価用の抜粋 · 社内備品予約</p><h1>何のために、どこまで作るか</h1><p>部署ごとの紙台帳で起きているプロジェクターの重複予約を防ぐため、社員が空き時間を確認して予約するシステムを作る。</p><h2>使う人と扱う範囲</h2><dl><dt>社員</dt><dd>備品の空き時間を確認し、開始・終了時刻を指定して予約する。</dd><dt>管理担当者</dt><dd>予約できる備品を登録する。</dd><dt>予約の確定</dt><dd>同じ備品に重複する時間帯の予約がないとき、予約を受け付けた状態を指す。</dd></dl><h2>対象外</h2><p>貸出・返却の記録と備品購入は扱わない。予約の範囲に絞り、重複予約を防ぐ。</p></main></body></html>
