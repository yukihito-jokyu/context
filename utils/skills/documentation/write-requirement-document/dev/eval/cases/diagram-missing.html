<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約が確定する条件</title><style>body{margin:0;background:#f4f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.8}main{max-width:860px;margin:32px auto;padding:32px;background:white;border:1px solid #dae1e8;border-radius:12px}h1{font-size:24px;line-height:1.5;margin:8px 0 20px}h2{font-size:19px;margin-top:28px}p{max-width:44em}.label{font-size:13px;color:#526474}dt{font-weight:700}dd{margin:0 0 12px}figure{margin:16px 0;padding:20px;background:#f2f6fc;border:1px solid #cad9eb;border-radius:8px}figcaption{margin-top:12px;font-size:14px}svg{display:block;width:100%;height:auto}.req{border-left:4px solid #3267a8;padding-left:16px}li{margin:5px 0}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head><body><main><p class="label">評価用の抜粋 · 社内備品予約</p><h1>予約が確定する条件</h1><p>社員が予約を入力した後、重複の有無で受付結果が変わる。次の図は、この分岐を示す。</p><div class="req" id="R-02"><h2>重複する予約を受け付けない</h2><p>同じ備品に重複する時間帯の予約がある場合は、新しい予約を確定しない。</p><p>確認例：10時から11時まで予約済みの備品について、10時30分から11時30分までの予約を申し込むと、予約は確定しない。</p></div></main></body></html>
