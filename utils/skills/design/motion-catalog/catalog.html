        { id: "inertialization", name: "慣性ブレンド", en: "Inertialization (inertial blending)", cat: "character" },
        {
          id: "sync-markers",
          name: "足音の印で合わせる",
          en: "Marker-based animation synchronization",
          cat: "character",
        },
        { id: "layered-animation", name: "部位ごとの重ね", en: "Per-bone animation layering", cat: "character" },
        { id: "ik-fk-switch", name: "IK と FK の切り替え", en: "IK/FK switching with pose matching", cat: "character" },
        { id: "full-body-ik", name: "全身の IK", en: "Full-body inverse kinematics", cat: "character" },
        {
          id: "corrective-shapes",
          name: "曲げに合わせた補正の形",
          en: "Pose-space corrective shapes",
          cat: "character",
        },
        {
          id: "dual-quaternion-skinning",
          name: "デュアルクォータニオン・スキニング",
          en: "Dual-quaternion skinning",
          cat: "character",
        },
        { id: "dynamic-wrinkles", name: "動きで出るしわ", en: "Dynamic skin wrinkling", cat: "character" },
        {
          id: "dynamic-parenting",
          name: "持ち替え（親の切り替え）",
          en: "Dynamic parenting / space switching",
          cat: "character",
        },
        {
          id: "twist-distribution",
          name: "ねじれを間の関節に分ける",
          en: "Two-ended twist distribution",
          cat: "character",
        },
        { id: "twist-correction", name: "ねじれ補助の骨", en: "Twist correction (twist bones)", cat: "character" },
        { id: "distance-constraint", name: "距離を保つ制約", en: "Radial distance constraint", cat: "character" },
        {
          id: "motion-inbetweening",
          name: "動きの中割りの自動生成",
          en: "Path-conditioned motion in-betweening",
          cat: "character",
        },
        {
          id: "motion-capture",
          name: "モーションキャプチャ",
          en: "Performance capture / motion capture",
          cat: "character",
        },
        { id: "turn-in-place", name: "その場で向きを変える", en: "Turn-in-place animation", cat: "character" },
        { id: "weight-shift", name: "重心の移動", en: "Weight shift / weight transfer", cat: "character" },
        { id: "eye-darts", name: "目の素早い動き", en: "Eye darts / saccades", cat: "character" },
        { id: "coarticulation", name: "前後の音につられる口の形", en: "Speech coarticulation", cat: "character" },
      ];

      /* ============================================================ */
      const app = document.getElementById("app");
      let filter = { cat: "all", q: "" };
      try {
        filter.cat = sessionStorage.getItem("catalog-cat") || "all";
      } catch {}

      const card = (a) => `
  <a class="c-card" href="animations/${a.id}.html">
    <div class="c-stage" data-src="animations/${a.id}.html#preview" data-title="${a.name}のプレビュー"></div>
    <div class="c-card-body">
      <div class="c-card-name">${a.name}</div>
      <div class="c-card-en">${a.en}</div>
    </div>
  </a>`;

      app.innerHTML = `
  <h1 class="c-h1">アニメーション</h1>
  <p class="c-lead">選ぶと、説明・動きの値・実装用のプロンプトを確認できます。全 ${ANIMATIONS.length} 件</p>
  <div class="c-tools">
    <input class="c-search" type="search" placeholder="名前・英語名で探す（例: stagger、スプリング）" aria-label="アニメーションを探す">
    <div class="c-chips" role="group" aria-label="カテゴリで絞り込む">
      <button class="c-chip" type="button" data-cat="all">すべて</button>
      ${CATEGORIES.map((c) => `<button class="c-chip" type="button" data-cat="${c.id}">${c.label}</button>`).join("")}
    </div>
  </div>
  <div id="list"></div>`;

      const list = document.getElementById("list");

      /* 見えているカードのプレビューだけを読み込んで動かす。画面から離れたら iframe ごと外す（重さ対策） */
      const io = new IntersectionObserver(
        (entries) => {
          for (const { target: st, isIntersecting } of entries) {
            const f = st.querySelector("iframe");
            if (isIntersecting && !f) {
              const n = document.createElement("iframe");
              Object.assign(n, { src: st.dataset.src, title: st.dataset.title, tabIndex: -1 });
              n.setAttribute("aria-hidden", "true");
              st.append(n);
            } else if (!isIntersecting && f) f.remove();
          }
        },
        { rootMargin: "300px 0px" },
      );

      function render() {
        const q = filter.q.trim().toLowerCase();
        const hit = (a) => !q || [a.name, a.en, a.id].some((s) => s.toLowerCase().includes(q));
        const html = CATEGORIES.filter((c) => filter.cat === "all" || filter.cat === c.id)
          .map((c) => {
            const items = ANIMATIONS.filter((a) => a.cat === c.id && hit(a));
            if (!items.length) return "";
            return `
        <section class="c-cat">
          <div class="c-cat-head"><h2>${c.label}</h2><span>${c.en} · ${items.length} 件</span></div>
          <div class="c-grid">${items.map(card).join("")}</div>
        </section>`;
          })
          .join("");
        io.disconnect();
        list.innerHTML = html || `<p class="c-empty">見つかりませんでした。</p>`;
        list.querySelectorAll(".c-stage[data-src]").forEach((st) => io.observe(st));
        document
          .querySelectorAll(".c-chip")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cat === filter.cat)));
      }

      document.querySelectorAll(".c-chip").forEach((b) =>
        b.addEventListener("click", () => {
          filter.cat = b.dataset.cat;
          try {
            sessionStorage.setItem("catalog-cat", filter.cat);
          } catch {}
          render();
        }),
      );
      document.querySelector(".c-search").addEventListener("input", (e) => {
        filter.q = e.target.value;
        render();
      });
      render();
    </script>
  </body>
</html>
