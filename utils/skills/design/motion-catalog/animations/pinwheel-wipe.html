<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>風車のワイプ（Pinwheel wipe） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-pinwheel-wipe"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div
          class="ac-pinwheel-wipe-s ac-pinwheel-wipe-a"
          style="
            background:
              radial-gradient(circle at 72% 30%, #fff 0 12px, transparent 13px),
              radial-gradient(ellipse at 25% 115%, var(--cobalt) 0 46%, transparent 47%),
              radial-gradient(ellipse at 85% 120%, var(--navy) 0 50%, transparent 51%),
              linear-gradient(160deg, var(--ice), var(--sky));
          "
        ></div>
        <div
          class="ac-pinwheel-wipe-s ac-pinwheel-wipe-b"
          style="
            background:
              radial-gradient(circle at 30% 32%, #eaf2ff 0 11px, transparent 12px),
              radial-gradient(circle at 62% 22%, #fff 0 1.5px, transparent 2px),
              radial-gradient(circle at 82% 40%, #fff 0 1.5px, transparent 2px),
              radial-gradient(ellipse at 70% 118%, #0f2563 0 52%, transparent 53%),
              linear-gradient(200deg, #2a3f8f, var(--navy));
          "
        ></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-pinwheel-wipe .ac-pinwheel-wipe-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      @property --a {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      .ac-pinwheel-wipe .ac-pinwheel-wipe-b {
        -webkit-mask: repeating-conic-gradient(from 20deg, #000 0 var(--a), transparent 0 60deg);
        mask: repeating-conic-gradient(from 20deg, #000 0 var(--a), transparent 0 60deg);
      }
      .ac-pinwheel-wipe .ac-pinwheel-wipe-b {
        animation: ac-pinwheel-wipe-t var(--dur, 2600ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
      }
      @keyframes ac-pinwheel-wipe-t {
        0%,
        25% {
          --a: 0deg;
        }
        75%,
        100% {
          --a: 60deg;
        }
      }
      @keyframes ac-pinwheel-wipe-rf2 {
        0%,
        45% {
          opacity: 0;
        }
        55%,
        100% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-pinwheel-wipe .ac-pinwheel-wipe-b {
          animation-name: ac-pinwheel-wipe-rf2;
          clip-path: none;
          -webkit-mask: none;
          mask: none;
          transform: none;
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "pinwheel-wipe",
        name: "風車のワイプ",
        en: "Pinwheel wipe",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "中心から放射状に分かれたいくつもの羽根が、風車のように同時に回りながら広がって、次のショットを見せる切り替えです。にぎやかで遊びのある印象になります。",
        use: "子ども向け・ゲームの場面転換、セール告知、楽しい雰囲気のスライドショー。",
        params: [{ key: "dur", label: "片道の長さ", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "<code>mask: repeating-conic-gradient(#000 0 var(--a), transparent 0 90deg)</code>（羽根4枚なら 90deg ごと）。<code>--a: 0 → 90deg</code>",
          ],
          ["羽根の数", "繰り返しの角度（360 ÷ 枚数）で決まる。6〜8枚でにぎやかに"],
          ["組み合わせ", "羽根の角度を <code>from</code> で同時に回すと、回転しながら開く"],
          ["対応", "<code>@property --a</code> が要る。未対応のブラウザでは途中で一度に切り替わる"],
          ["動きを減らす設定", "切り替えを短いクロスフェード（200ms 前後）にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/premiere/desktop/add-video-effects/effects-and-transitions-library/list-of-video-transitions.html" target="_blank" rel="noopener">Adobe Premiere: List of Video transitions</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
