<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>びっくり箱（Jack-in-the-box） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-jack-in-the-box"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="sb-card ac-jack-in-the-box-c"
          style="width: 140px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 46px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 77px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 49px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-jack-in-the-box .ac-jack-in-the-box-c {
        transform-origin: center bottom;
        animation: ac-jack-in-the-box-in var(--in, 900ms) ease-out both;
      }
      @keyframes ac-jack-in-the-box-in {
        0% {
          opacity: 0;
          transform: scale(0.1) rotate(var(--tilt, 30deg));
        }
        50% {
          transform: rotate(-10deg);
        }
        70% {
          transform: rotate(3deg);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes ac-jack-in-the-box-rf {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-jack-in-the-box .ac-jack-in-the-box-c {
          animation: ac-jack-in-the-box-rf 200ms ease-out both !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "jack-in-the-box",
        name: "びっくり箱",
        en: "Jack-in-the-box",
        cat: "登場・退出",
        kind: "motion",
        description:
          "下の辺を支点に、小さく傾いた状態から飛び出し、左右に揺れて止まる動きです。びっくり箱の人形のように、楽しげに現れます。",
        use: "ご褒美・ガチャの結果、キャラクターの登場、楽しい通知。",
        params: [
          { key: "in", label: "登場の時間", value: 900, min: 400, max: 2000, step: 50, unit: "ms" },
          { key: "tilt", label: "最初の傾き", value: 30, min: 0, max: 60, step: 5, unit: "deg" },
        ],
        total: (p) => p["in"],
        spec: [
          [
            "登場",
            "<code>scale(0.1) rotate(傾き) → rotate(-10deg) → rotate(3deg) → scale(1)</code>｜<code>transform-origin: center bottom</code>｜ease-out",
          ],
          ["区間", "0% → 50% → 70% → 100%"],
          ["動きを減らす設定", "傾きと拡大をやめ、透明度の切り替えだけにする"],
          ["出典", '<a href="https://animate.style/" target="_blank" rel="noopener">Animate.css</a>'],
        ],
        loop: 2400,
      });
    </script>
  </body>
</html>
