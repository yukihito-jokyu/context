<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スリットスキャン（Slit-scan / Time displacement） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-slit-scan"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "slit-scan",
        name: "スリットスキャン",
        en: "Slit-scan / Time displacement",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "画面の行（または列）ごとに、少しずつ違う時刻の映像を並べて表示する表現です。動く物が、時間のずれによってぐにゃりと引き伸ばされ、ねじれた不思議な形になります。",
        use: "音楽・アート系の映像、ロゴの実験的な演出、時間の流れを感じさせるモーショングラフィックス、カメラのエフェクト。",
        params: [{ key: "lag", label: "1行ごとの時間差", value: 8, min: 0, max: 20, step: 1, unit: "ms" }],
        spec: [
          ["仕組み", "直近のフレームを数十枚ためておき、上の行ほど新しく、下の行ほど古いフレームから 1 行ずつ写す"],
          [
            "ずらし方",
            "1 行ごとの時間差（例：1〜3 フレーム）で、ねじれ方が変わる。グラデーション画像の明るさで時間差を決める方法もある（Time Displacement）",
          ],
          ["Web では", "canvas に動画や描画を 1 行ずつ写す、WebGL ならテクスチャの配列から読む"],
          ["動きを減らす設定", "時間差をなくし、ふつうの動きにする（または止める）"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Time）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const pos = (tt) => [110 + 60 * sin(tt * 2.2), 0.6 * sin(tt * 3.1)];
            return raf((t) => {
              g.clearRect(0, 0, W, H);
              const tt = rm ? 0.6 : t;
              for (let y = 10; y < 140; y += 2) {
                const [x, rot] = pos(tt - ((y - 10) * v.lag) / 1000),
                  w = 22 + 14 * Math.abs(cos(rot * 2 + y / 30));
                g.fillStyle = Math.floor(y / 12) % 2 ? col("blue") : col("sky");
                g.fillRect(x - w / 2 + (y - 75) * sin(rot) * 0.3, y, w, 2.2);
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
