<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>リキッドモーション（Liquid Motion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-liquid-motion"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <span class="ac-liquid-motion-blob sb-grad-hero"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-liquid-motion .ac-liquid-motion-blob {
        width: 110px;
        height: 110px;
        border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-liquid-motion .ac-liquid-motion-blob {
          animation: ac-liquid-motion-morph var(--dur, 6000ms) cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
      }
      @keyframes ac-liquid-motion-morph {
        0%,
        100% {
          border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
          transform: rotate(0) scale(1);
        }
        33% {
          border-radius: 63% 37% 41% 59% / 58% 63% 37% 42%;
          transform: rotate(60deg) scale(1.05);
        }
        66% {
          border-radius: 37% 63% 56% 44% / 49% 37% 63% 51%;
          transform: rotate(120deg) scale(0.96);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "liquid-motion",
        name: "リキッドモーション",
        en: "Liquid Motion",
        cat: "表現スタイル",
        kind: "style",
        description:
          "形が液体のように伸び縮みし、うねりながら変わり続ける表現形式です。角丸の値を絶えず変えて、有機的でやわらかい印象を作ります。",
        use: "ヒーローの背景、ブランドの装飾、音声入力やAIの待機、ローディング。",
        params: [{ key: "dur", label: "ひと巡りの時間", value: 6000, min: 2000, max: 12000, step: 250, unit: "ms" }],
        spec: [
          ["表現形式", "やわらかい有機的な形（グラデーションの塊）"],
          ["演出", "形が絶えず変わり続ける、ゆっくりした背景の動き"],
          [
            "個別の動き",
            "角丸の Morph（<code>border-radius</code> の8つの値を変える）+ ゆっくりした Rotate。くっつく表現は Gooey",
          ],
          ["時間・質感", "数秒かけてゆっくり、ease-in-out で無限に"],
          ["カタログの関連", "morph / gooey / breathing / float"],
          ["動きを減らす設定", "形の変化をやめ、止めた形で表示する"],
          ["出典", "ChatGPT との会話（表現スタイルの語彙）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
