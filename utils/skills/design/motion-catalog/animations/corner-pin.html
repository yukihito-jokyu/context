<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>四隅の遠近（Corner pin） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-corner-pin"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <span class="ac-corner-pin-scr"></span>
        <div class="ac-corner-pin-img"><i></i><i></i><i></i></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-corner-pin .ac-corner-pin-scr {
        position: absolute;
        left: 0;
        top: 0;
        width: 220px;
        height: 150px;
        background: linear-gradient(160deg, #f2f8ff, var(--ice));
      }
      .ac-corner-pin .ac-corner-pin-img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100px;
        height: 70px;
        transform-origin: 0 0;
        border-radius: 6px;
        background: linear-gradient(150deg, var(--sky), var(--cobalt));
        display: grid;
        align-content: center;
        gap: 7px;
        padding: 0 14px;
        box-sizing: border-box;
        box-shadow: 0 6px 18px rgba(27, 58, 138, 0.2);
      }
      .ac-corner-pin .ac-corner-pin-img i {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.85);
      }
      .ac-corner-pin .ac-corner-pin-img i:nth-child(2) {
        width: 70%;
      }
      .ac-corner-pin .ac-corner-pin-img i:nth-child(3) {
        width: 45%;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "corner-pin",
        name: "四隅の遠近",
        en: "Corner pin",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "画像の四隅を1つずつ好きな位置へ動かして、平らな画像を斜めの画面や看板にぴったり貼り付けたように見せる変形です。回転や遠近の組み合わせでは作れない、自由な四角形にはめ込めます。",
        use: "スマホやパソコンの画面に UI のスクショをはめ込む紹介、看板やポスターへの合成、3D 風のカードの演出。",
        params: [{ key: "dur", label: "片道の時間", value: 2400, min: 800, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "元の四隅 → 移したい四隅の対応から射影変換（ホモグラフィ）の 3×3 行列を解き、<code>transform: matrix3d(…)</code> にして <code>transform-origin: 0 0</code> で当てる",
          ],
          ["動かすとき", "四隅の座標を補間し、毎フレーム行列を計算し直す"],
          ["ツールでは", "After Effects の Corner Pin / CC Power Pin、トラッキングと組み合わせて動く画面に追従させる"],
          ["動きを減らす設定", "四隅の動きを止め、はめ込んだ形で止める"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Distort）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const el = stage.querySelector(".ac-corner-pin-img"),
              w = 100,
              h = 70;
            const A = [
                [60, 40],
                [160, 40],
                [60, 110],
                [160, 110],
              ],
              B = [
                [40, 30],
                [170, 50],
                [62, 128],
                [182, 104],
              ];
            const solve = (src, dst) => {
              const M = [],
                r = [];
              for (let i = 0; i < 4; i++) {
                const [x, y] = src[i],
                  [u, v2] = dst[i];
                M.push([x, y, 1, 0, 0, 0, -u * x, -u * y]);
                r.push(u);
                M.push([0, 0, 0, x, y, 1, -v2 * x, -v2 * y]);
                r.push(v2);
              }
              for (let c = 0; c < 8; c++) {
                let p = c;
                for (let i = c + 1; i < 8; i++) if (Math.abs(M[i][c]) > Math.abs(M[p][c])) p = i;
                [M[c], M[p]] = [M[p], M[c]];
                [r[c], r[p]] = [r[p], r[c]];
                for (let i = 0; i < 8; i++)
                  if (i !== c) {
                    const f = M[i][c] / M[c][c];
                    for (let j = c; j < 8; j++) M[i][j] -= f * M[c][j];
                    r[i] -= f * r[c];
                  }
              }
              return r.map((x, i) => x / M[i][i]);
            };
            return raf((t) => {
              const T = v.dur / 1000,
                ph = rm ? 1 : 0.5 - 0.5 * Math.cos((t / T) * Math.PI),
                e = ph;
              const D = A.map((a, i) => [a[0] + (B[i][0] - a[0]) * e, a[1] + (B[i][1] - a[1]) * e]);
              const [a, b, c, d, e2, f, g7, h7] = solve(
                [
                  [0, 0],
                  [w, 0],
                  [0, h],
                  [w, h],
                ],
                D,
              );
              el.style.transform = `matrix3d(${a},${d},0,${g7},${b},${e2},0,${h7},0,0,1,0,${c},${f},0,1)`;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
