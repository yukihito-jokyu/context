<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>屈折するガラス（Refractive glass motion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-refractive-glass-motion"
        style="position: relative; width: 220px; height: 140px; border-radius: 20px; overflow: hidden"
      >
        <div class="ac-refractive-glass-motion-bg"></div>
        <div class="ac-refractive-glass-motion-lens">
          <div class="ac-refractive-glass-motion-bg ac-refractive-glass-motion-in"></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-refractive-glass-motion .ac-refractive-glass-motion-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 220px;
        height: 140px;
        background:
          radial-gradient(circle at 70% 40%, var(--sky) 0 18px, transparent 19px),
          repeating-linear-gradient(135deg, var(--blue-soft) 0 10px, var(--surface) 10px 20px);
      }
      .ac-refractive-glass-motion .ac-refractive-glass-motion-lens {
        position: absolute;
        left: 0;
        top: 30px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow:
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.9),
          inset 0 -6px 10px rgba(255, 255, 255, 0.35),
          inset 0 6px 10px rgba(18, 26, 43, 0.1),
          0 10px 24px rgba(18, 26, 43, 0.18);
      }
      .ac-refractive-glass-motion .ac-refractive-glass-motion-in {
        top: -30px;
        filter: saturate(1.8);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "refractive-glass-motion",
        name: "屈折するガラス",
        en: "Refractive glass motion",
        cat: "移動・変形",
        kind: "style",
        description:
          "透明なガラスの塊が動き、その向こうの模様がゆがんで拡大されて見える表現です。縁に光が乗り、中身は少し大きく、少し鮮やかに見えます。プレビューは拡大した複製を丸く切り抜いて近い形を作っています（元の作例は WebGL の屈折）。",
        use: "ヒーローの装飾、ガラス風（Liquid Glass）の UI、レンズ・虫眼鏡の演出。",
        params: [
          { key: "zoom", label: "拡大", value: 1.35, min: 1, max: 2, step: 0.05, unit: "" },
          { key: "speed", label: "速さ", value: 0.8, min: 0.2, max: 2, step: 0.1, unit: "" },
        ],
        spec: [
          ["表現形式", "背景の模様の上を、丸いガラスがゆっくり往復する"],
          [
            "屈折",
            "ガラスの中に背景の複製を置き、ガラスの中心を基準に拡大する。本格的には WebGL のシェーダーか SVG の <code>feDisplacementMap</code>",
          ],
          [
            "質感",
            "縁に白い内側の影（<code>inset</code> の <code>box-shadow</code>）、下に柔らかい影、中身は <code>saturate</code> を上げる",
          ],
          ["動きを減らす設定", "ガラスを止めて置く"],
          [
            "出典",
            '<a href="https://reactbits.dev/components/fluid-glass" target="_blank" rel="noopener">React Bits</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const lens = stage.querySelector(".ac-refractive-glass-motion-lens"),
              inn = stage.querySelector(".ac-refractive-glass-motion-in");
            const place = (x) => {
              lens.style.transform = `translateX(${x}px)`;
              inn.style.transformOrigin = `${x + 40}px 70px`;
              inn.style.transform = `translateX(${-x}px) scale(${v.zoom})`;
            }; /* 中身は逆向きに動かし、ガラスの中心を基準に拡大 */
            if (rm) {
              place(70);
              return null;
            }
            return raf((t) => place(70 + 66 * Math.sin(t * v.speed * 1.6)));
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
