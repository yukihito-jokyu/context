    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-shrinking-navbar .ac-shrinking-navbar-nv {
        position: sticky;
        top: 0;
        z-index: 1;
        margin: 0 auto;
        width: 100%;
        height: 38px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: rgba(255, 255, 255, 0.9);
        transition:
          width var(--dur, 400ms) cubic-bezier(0.34, 1.2, 0.64, 1),
          border-radius var(--dur, 400ms),
          top var(--dur, 400ms),
          box-shadow var(--dur, 400ms);
      }
      .ac-shrinking-navbar .ac-shrinking-navbar-nv.is-small {
        width: var(--w, 70%);
        top: 8px;
        border-radius: 999px;
        box-shadow: var(--shadow-float);
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-shrinking-navbar .ac-shrinking-navbar-nv {
          transition: box-shadow 200ms;
        }
        .ac-shrinking-navbar .ac-shrinking-navbar-nv.is-small {
          width: 100%;
          top: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "shrinking-navbar",
        name: "スクロールで縮むヘッダー",
        en: "Shrinking navbar",
        cat: "画面移動・ナビ",
        kind: "motion",
        description:
          "ページの上ではいっぱいの幅だったナビゲーションバーが、スクロールを始めると幅が縮んで角が丸くなり、浮いたカプセル型のバーに変わる動きです。読み進めている間は控えめに、でもいつでも手が届く位置に残ります。",
        use: "ランディングページ、ポートフォリオ、SaaS のサイト、ドキュメントサイトのヘッダー。",
        params: [
          { key: "dur", label: "時間", value: 400, min: 150, max: 800, step: 10, unit: "ms" },
          { key: "w", label: "縮んだ幅", value: 70, min: 40, max: 95, step: 5, unit: "%" },
        ],
        spec: [
          ["きっかけ", "スクロール位置が少しでも下がったら（例 20px）縮める、最上部に戻ったら広げる"],
          [
            "動き",
            "幅 <code>100% → 縮んだ幅</code>、角丸 <code>0 → 999px</code>、上の余白 <code>0 → 8px</code>、影を付ける｜spring",
          ],
          ["中身", "縮んだときは補助的なリンクを隠し、主要なものだけ残す"],
          ["動きを減らす設定", "大きさの変化をやめ、影と背景色の変化だけにする"],
          [
            "出典",
            '<a href="https://ui.aceternity.com/components/resizable-navbar" target="_blank" rel="noopener">Aceternity UI: Resizable Navbar</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const auto = (sc, ms) => {
              let raf,
                start = null;
              const tick = (now) => {
                if (start === null) start = now;
                const t = (now - start) % (ms + 1000),
                  p = Math.min(1, t / ms),
                  max = sc.scrollHeight - sc.clientHeight;
                sc.scrollTop = max * (0.5 - Math.cos(Math.PI * p) / 2);
                raf = requestAnimationFrame(tick);
              };
              raf = requestAnimationFrame(tick);
              return () => cancelAnimationFrame(raf);
            };
            const sc = stage.querySelector(".ac-shrinking-navbar-sc"),
              nv = stage.querySelector(".ac-shrinking-navbar-nv");
            const on = () => nv.classList.toggle("is-small", sc.scrollTop > 20);
            sc.addEventListener("scroll", on);
            const stop = auto(sc, 3600);
            return () => {
              stop();
              sc.removeEventListener("scroll", on);
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
