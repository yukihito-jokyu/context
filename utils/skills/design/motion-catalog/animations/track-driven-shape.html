<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>追跡点で動くシェイプ（Track-driven shape deformation） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-track-driven-shape"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "track-driven-shape",
        name: "追跡点で動くシェイプ",
        en: "Track-driven shape deformation",
        cat: "スクロール",
        kind: "motion",
        description:
          "動画の中で動いている物の特徴点（角・模様）を追跡し、その点の動きをシェイプやマスクの各頂点に 1 つずつつなげて、形ごと物に付いていかせる方法です。物が動いたり向きを変えたりしても、ハイライトや切り抜きがぴったり付いてきます。",
        use: "動画の物を囲む・塗る演出、画面のはめ込み、AR 風の注釈。",
        params: [],
        spec: [
          [
            "仕組み",
            "動画の各フレームで特徴点の位置を追跡し（トラッキング）、シェイプの頂点 1 つ 1 つに、対応する追跡点の位置を毎フレーム入れる",
          ],
          [
            "ツールでは",
            "Apple Motion の「シェイプにトラッキングを適用」、After Effects のマスクのトラッキング（Mocha のメッシュトラッキング）",
          ],
          [
            "Web では",
            "追跡の結果（各フレームの点の座標）を JSON にして、再生時刻に合わせて SVG の <code>path</code> の頂点を書き換える",
          ],
          ["動きを減らす設定", "動きを止め、物とシェイプが重なった静止画にする"],
          [
            "出典",
            '<a href="https://support.apple.com/en-bn/guide/motion/motn49eb59de/mac" target="_blank" rel="noopener">support.apple.com（mac）</a>、<a href="https://support.apple.com/en-bn/guide/motion/motn173b6838/mac" target="_blank" rel="noopener">support.apple.com（mac）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const loc = [
              [-26, -14],
              [22, -18],
              [30, 10],
              [-4, 20],
              [-30, 8],
            ];
            return raf((t) => {
              const T = rm ? 0.8 : t,
                x = 110 + 40 * sin(T * 0.8),
                y = 75 + 14 * sin(T * 1.3),
                a = 0.3 * sin(T * 0.9),
                s = 1 + 0.15 * sin(T * 1.1),
                sk = 0.25 * sin(T * 0.7);
              const tp = loc.map(([lx, ly]) => {
                const X = lx * s * (1 + (sk * ly) / 40),
                  Y = ly * s;
                return [x + X * cos(a) - Y * sin(a), y + X * sin(a) + Y * cos(a)];
              });
              g.clearRect(0, 0, W, H);
              g.fillStyle = "#eef4ff";
              g.fillRect(0, 0, W, H);
              g.save();
              g.translate(x, y);
              g.rotate(a);
              g.scale(s, s);
              g.fillStyle = col("sky");
              g.beginPath();
              g.ellipse(0, 0, 34, 24, 0, 0, TAU);
              g.fill();
              g.fillStyle = col("ice");
              g.beginPath();
              g.ellipse(-6, -4, 12, 7, 0, 0, TAU);
              g.fill();
              g.restore();
              g.beginPath();
              tp.forEach((p, i) => {
                const q = tp[(i + 1) % tp.length],
                  mx = (p[0] + q[0]) / 2,
                  my = (p[1] + q[1]) / 2;
                i ? g.quadraticCurveTo(p[0], p[1], mx, my) : g.moveTo(mx, my);
              });
              g.closePath();
              g.fillStyle = "rgba(37,99,235,.18)";
              g.fill();
              g.strokeStyle = col("blue");
              g.lineWidth = 2;
              g.stroke();
              for (const [px, py] of tp) {
                g.strokeStyle = col("cobalt");
                g.lineWidth = 1.2;
                g.beginPath();
                g.moveTo(px - 5, py);
                g.lineTo(px + 5, py);
                g.moveTo(px, py - 5);
                g.lineTo(px, py + 5);
                g.stroke();
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
