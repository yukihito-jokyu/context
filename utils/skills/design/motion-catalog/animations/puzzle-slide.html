    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-puzzle-slide .ac-puzzle-slide-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-puzzle-slide .ac-puzzle-slide-c {
        position: absolute;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        animation: ac-puzzle-slide-t var(--dur, 2600ms) cubic-bezier(0.55, 0, 1, 0.45) infinite alternate;
        animation-delay: calc(var(--k) * 300ms);
      }
      @keyframes ac-puzzle-slide-t {
        0%,
        30% {
          transform: none;
          opacity: 1;
        }
        75%,
        100% {
          transform: translate(var(--dx), var(--dy)) rotate(var(--r));
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-puzzle-slide .ac-puzzle-slide-c {
          animation: ac-puzzle-slide-rf3 var(--dur, 2600ms) infinite alternate;
        }
      }
      @keyframes ac-puzzle-slide-rf3 {
        0%,
        45% {
          opacity: 1;
        }
        55%,
        100% {
          opacity: 0;
        }
      }
    </style>

    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "puzzle-slide",
        name: "パズルの切り替え",
        en: "Puzzle slide",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "前のショットがいくつものピースに割れ、それぞれが別の方向へすべり出していくと、下から次のショットが現れる切り替えです。プレビューは四角いピースで近い形を見せています。",
        use: "ゲームや子ども向けの場面転換、謎解き・クイズの画面、楽しい雰囲気のスライドショー。",
        params: [{ key: "dur", label: "片道の長さ", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "A を格子（例：4×3）のピースに分け、ピースごとに方向 <code>--dx / --dy</code> を決めて <code>translate</code> と <code>rotate</code>｜in。<code>animation-delay</code> を少しずつずらす",
          ],
          ["本格的に", "ジグソーの形は SVG の <code>clipPath</code>（凸凹のパス）でピースを切り抜く"],
          ["戻り", "逆再生でピースが集まって組み上がる"],
          ["動きを減らす設定", "ピースの移動をやめ、クロスフェードにする"],
          [
            "出典",
            '<a href="https://raw.githubusercontent.com/CommandPost/CommandPost/develop/src/extensions/cp/apple/finalcutpro/plugins.lua" target="_blank" rel="noopener">Final Cut Pro の内蔵トランジション一覧（CommandPost）</a>',
