<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>バレットタイム（Frozen moment (bullet time)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-bullet-time"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "bullet-time",
        name: "バレットタイム",
        en: "Frozen moment (bullet time)",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "ある瞬間の時間を止めた（またはごく遅くした）まま、カメラだけが被写体のまわりを回り込む表現です。空中で止まった人や飛び散る破片の間をカメラが動くので、その瞬間を立体的にじっくり見せられます。プレビューは 2D で近い形にしています。",
        use: "アクションの決定的な瞬間、製品の 360° の見せ場、スポーツのリプレイ、広告のハイライト。",
        params: [{ key: "dur", label: "回り込む時間", value: 2400, min: 1000, max: 5000, step: 100, unit: "ms" }],
        spec: [
          [
            "撮り方",
            "被写体を囲むように並べた多数のカメラで同じ瞬間を撮り、カメラの並び順に 1 コマずつつなぐ（タイムスライス）",
          ],
          [
            "見せ方",
            "通常の速さ → 一気に遅くして止める → 回り込む → 元の速さに戻す。止まっている間も、破片などを少しだけ動かすと生きて見える",
          ],
          [
            "本格的に",
            "3D（three.js など）なら時間を止めてカメラを軌道上で動かすだけで作れる。実写は複数カメラか、AI の視点補間で作る",
          ],
          ["動きを減らす設定", "回り込みをやめ、止まった瞬間の静止画にする"],
          [
            "出典",
            '<a href="https://digitalair.com/techniques/frozen_moment.html" target="_blank" rel="noopener">digitalair.com（frozen_moment）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const deb = Array.from({ length: 18 }, (_, i) => [
              cos(i * 2.4) * (30 + (i % 4) * 8),
              -20 + (i % 5) * 12,
              sin(i * 2.4) * (30 + (i % 4) * 8),
            ]);
            return raf((t) => {
              const T = t % (v.dur / 1000 + 1.6),
                M = v.dur / 1000,
                yaw = rm ? 0.6 : T < 0.8 ? 0 : T < 0.8 + M ? ((T - 0.8) / M) * Math.PI * 0.9 : Math.PI * 0.9;
              g.fillStyle = "#e6efff";
              g.fillRect(0, 0, W, H);
              g.fillStyle = col("ice");
              g.fillRect(0, 100, W, 50);
              for (let i = -6; i <= 6; i++) {
                const a = i * 0.5 - yaw,
                  x = 110 + sin(a) * 160,
                  z = cos(a);
                if (z < 0) continue;
                g.fillStyle = `rgba(147,197,253,${z})`;
                g.fillRect(x - 6, 50, 12, 50);
              }
              const pts = deb
                .map(([x, y, z]) => {
                  const X = x * cos(yaw) - z * sin(yaw),
                    Z = x * sin(yaw) + z * cos(yaw);
                  return [110 + X, 70 + y, Z];
                })
                .sort((a, b) => a[2] - b[2]);
              const draw = (p) => {
                const s = 1 + p[2] / 120;
                g.fillStyle = col("cobalt");
                g.fillRect(p[0] - 2.5 * s, p[1] - 2.5 * s, 5 * s, 5 * s);
              };
              pts.filter((p) => p[2] < 0).forEach(draw);
              const bw = 12 + 6 * Math.abs(cos(yaw));
              g.fillStyle = col("blue");
              g.beginPath();
              g.ellipse(110, 64, bw, 20, 0, 0, TAU);
              g.fill();
              g.beginPath();
              g.arc(110 + sin(yaw) * 2, 36, 10, 0, TAU);
              g.fill();
              pts.filter((p) => p[2] >= 0).forEach(draw);
              g.strokeStyle = col("line");
              g.lineWidth = 1;
              g.beginPath();
              g.ellipse(190, 132, 18, 8, 0, 0, TAU);
              g.stroke();
              dot(190 + sin(yaw) * 18, 132 + cos(yaw) * 8, 2.5, col("navy"));
              dot(190, 132, 2, col("blue"));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
