<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>伸び縮みするツールバー（Expanding toolbar） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-expanding-toolbar" style="position: relative; width: 230px; height: 120px">
        <div class="ac-expanding-toolbar-t">
          <span class="ac-expanding-toolbar-b sb-shape sb-shape--round sb-shape--on"></span
          ><span class="ac-expanding-toolbar-b sb-shape sb-shape--round"></span
          ><span class="ac-expanding-toolbar-b sb-shape sb-shape--round"></span
          ><span class="ac-expanding-toolbar-x"
            ><span class="sb-search" style="width: 120px; height: 28px; padding: 0 10px"
              ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 60px"></span></span
          ></span>
        </div>
        <span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-expanding-toolbar .ac-expanding-toolbar-t {
        position: absolute;
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        width: 92px;
        box-sizing: border-box;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow-float);
        overflow: hidden;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-expanding-toolbar .ac-expanding-toolbar-t {
          transition: width var(--dur, 380ms) cubic-bezier(0.34, 1.3, 0.64, 1);
        }
      }
      .ac-expanding-toolbar .ac-expanding-toolbar-b {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .ac-expanding-toolbar .ac-expanding-toolbar-x {
        flex: none;
        opacity: 0;
        filter: blur(4px);
        transition:
          opacity 120ms,
          filter 120ms;
      }
      .ac-expanding-toolbar .ac-expanding-toolbar-t.is-open {
        width: 222px;
      }
      .ac-expanding-toolbar .ac-expanding-toolbar-t.is-open .ac-expanding-toolbar-x {
        opacity: 1;
        filter: none;
        transition:
          opacity 200ms 120ms,
          filter 200ms 120ms;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "expanding-toolbar",
        name: "伸び縮みするツールバー",
        en: "Expanding toolbar",
        cat: "画面移動・ナビ",
        kind: "motion",
        description:
          "小さなツールバーのボタンを押すと、バーの幅がなめらかに伸びて、追加の道具や入力欄がその場に現れる動きです。閉じるとまた小さなバーに戻ります。画面を広く使いながら、必要なときだけ道具を出せます。",
        use: "エディタの書式バー、検索の展開、メディアの操作、フローティングの操作パネル。",
        params: [{ key: "dur", label: "時間", value: 380, min: 150, max: 800, step: 10, unit: "ms" }],
        spec: [
          [
            "外枠",
            "幅（と高さ）を中身に合わせて変える｜spring（Motion の <code>layout</code>、または幅の transition）",
          ],
          [
            "中身",
            "前の中身は <code>opacity → 0</code>、新しい中身は外枠が伸びはじめてから <code>opacity 0 → 1</code> と <code>blur(4px) → 0</code>",
          ],
          ["閉じる", "中身を先に消してから外枠を縮める。閉じた中身は <code>inert</code>"],
          ["動きを減らす設定", "幅の変化をやめ、中身の透明度だけで切り替える"],
          [
            "出典",
            '<a href="https://motion-primitives.com/docs/toolbar-dynamic" target="_blank" rel="noopener">Motion Primitives: Toolbar Dynamic</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const t = stage.querySelector(".ac-expanding-toolbar-t"),
              x = stage.querySelector(".ac-expanding-toolbar-x");
            const open = (on) => () => {
              t.classList.toggle("is-open", on);
              x.inert = !on;
            }; // 閉じている中身はフォーカスも受けない
            move(200, 110, 0);
            x.inert = true;
            return seq(4000, [
              [
                100,
                () => {
                  show(1);
                  move(84, 62, 500);
                },
              ],
              [700, open(true)],
              [900, () => move(200, 110, 500)],
              [1300, () => show(0)],
              [2800, open(false)],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
