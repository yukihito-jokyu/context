<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>追いかけっこする点（Chasing dots loader） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-chasing-dots-loader"
        style="position: relative; width: 200px; height: 130px; display: grid; place-items: center"
      >
        <div class="ac-chasing-dots-loader-c"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c {
        position: relative;
        width: 44px;
        height: 44px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-chasing-dots-loader .ac-chasing-dots-loader-c {
          animation: ac-chasing-dots-loader-r calc(var(--dur, 2500ms)) linear infinite;
        }
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i {
        position: absolute;
        inset: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-chasing-dots-loader .ac-chasing-dots-loader-c i {
          animation: ac-chasing-dots-loader-d var(--dur, 2500ms) cubic-bezier(0.65, 0, 0.35, 1) infinite both;
        }
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i::before {
        content: "";
        display: block;
        width: 25%;
        height: 25%;
        margin: 0 auto;
        border-radius: 50%;
        background: var(--blue);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-chasing-dots-loader .ac-chasing-dots-loader-c i::before {
          animation: ac-chasing-dots-loader-s var(--dur, 2500ms) cubic-bezier(0.65, 0, 0.35, 1) infinite both;
        }
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(2),
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(2)::before {
        animation-delay: -1.1s;
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(3),
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(3)::before {
        animation-delay: -1s;
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(4),
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(4)::before {
        animation-delay: -0.9s;
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(5),
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(5)::before {
        animation-delay: -0.8s;
      }
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(6),
      .ac-chasing-dots-loader .ac-chasing-dots-loader-c i:nth-child(6)::before {
        animation-delay: -0.7s;
      }
      @keyframes ac-chasing-dots-loader-r {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ac-chasing-dots-loader-d {
        80%,
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes ac-chasing-dots-loader-s {
        50% {
          transform: scale(0.4);
        }
        100%,
        0% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "chasing-dots-loader",
        name: "追いかけっこする点",
        en: "Chasing dots loader",
        cat: "読み込み・進捗",
        kind: "motion",
        description:
          "円周上に並んだ点が、少しずつ遅れて回りながら、大きくなったり小さくなったりして互いを追いかけるローダーです。くるくると絶えず動き、待っている間の退屈を和らげます。",
        use: "ボタン・カード・画面の読み込み中、待ち時間の短い処理。",
        params: [{ key: "dur", label: "周期", value: 2500, min: 300, max: 4000, step: 50, unit: "ms" }],
        spec: [
          [
            "動き",
            "6つの点をそれぞれ <code>rotate(0 → 360deg)</code>（周期の 80% で回り切って休む）、点の大きさを <code>scale(1 → .4 → 1)</code>",
          ],
          ["ずらし", "点ごとに 0.1 秒ずつ遅らせ、全体もゆっくり回す"],
          [
            "使いどころ",
            "1秒以上かかりそうなときに出す。すぐ終わる処理では出さない（ちらつく）。数秒以上なら進捗の分かる表示を使う",
          ],
          [
            "動きを減らす設定",
            "回転や移動をやめ、ゆっくりした透明度の明滅（または静止した「読み込み中」の表示）にする",
          ],
          [
            "出典",
            '<a href="https://raw.githubusercontent.com/tobiasahlin/SpinKit/master/spinkit.css" target="_blank" rel="noopener">SpinKit</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
