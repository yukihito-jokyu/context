<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>モーフ（Morph） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-morph"
        style="
          position: relative;
          width: 220px;
          height: 120px;
          display: grid;
          place-items: start center;
          padding-top: 16px;
          box-sizing: border-box;
        "
      >
        <div class="ac-morph-s">
          <span class="sb-thumb sb-grad-aqua" style="width: 34px; height: 34px; border-radius: 12px"></span>
          <div class="ac-morph-in">
            <span class="sb-bar sb-bar--sm sb-bar--on-dark" style="width: 90px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--on-dark" style="width: 60px; opacity: 0.6"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-morph .ac-morph-s {
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: border-box;
        width: 96px;
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--toast);
        overflow: hidden;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-morph .ac-morph-s {
          transition:
            width var(--dur, 450ms) cubic-bezier(0.34, 1.56, 0.64, 1),
            height var(--dur, 450ms) cubic-bezier(0.34, 1.56, 0.64, 1),
            border-radius var(--dur, 450ms) cubic-bezier(0.22, 1, 0.36, 1);
        }
      }
      .ac-morph .ac-morph-s > * {
        opacity: 0;
        transform: scale(0.8);
        transition:
          opacity 120ms,
          transform 120ms;
      }
      .ac-morph .ac-morph-in {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ac-morph .ac-morph-s.open {
        width: 200px;
        height: 68px;
        border-radius: 30px;
      }
      .ac-morph .ac-morph-s.open > * {
        opacity: 1;
        transform: none;
        transition:
          opacity 200ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--dur, 450ms) * 0.5),
          transform 200ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--dur, 450ms) * 0.5);
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-morph .ac-morph-s > * {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "morph",
        name: "モーフ",
        en: "Morph",
        cat: "状態の遷移",
        kind: "motion",
        description:
          "ある形が、別の形へなめらかに変わっていく動きです。小さなピルが、中身を持った大きな形に変わります（iPhone の Dynamic Island のような動き）。",
        use: "通知が広がる、ボタンが入力欄に変わる、アイコンの形の変化（再生 ↔ 停止、メニュー ↔ 閉じる）。",
        params: [{ key: "dur", label: "時間", value: 450, min: 200, max: 1000, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "動き",
            "幅・高さ・角丸を同時に変える｜spring <code>cubic-bezier(0.34, 1.56, 0.64, 1)</code>（少し行き過ぎて止まる）",
          ],
          ["中身", "形が広がってから <code>opacity</code> と少しの <code>scale</code> で出す"],
          [
            "SVG の形",
            "パスの形を変えるなら、コマンドの数・種類・順序をそろえて <code>d</code> を補間する（そろわない形は Flubber や GSAP MorphSVG）",
          ],
          ["動きを減らす設定", "形の変化をやめ、クロスフェードで切り替える"],
          ["出典", "Animation Vocabulary（Transitions Between States）"],
        ],
        loop: 0,
        run: (stage) => {
          const el = stage.querySelector(".ac-morph-s");
          const t = setInterval(() => el.classList.toggle("open"), 1600);
          return () => clearInterval(t);
        },
      });
    </script>
  </body>
</html>
