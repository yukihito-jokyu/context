<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>枠を回る光（Border beam） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-border-beam"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div class="ac-border-beam-c">
          <span class="ac-border-beam-b"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 90px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 120px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 70px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-border-beam .ac-border-beam-c {
        position: relative;
        width: 170px;
        padding: 18px;
        display: grid;
        gap: 9px;
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }
      .ac-border-beam .ac-border-beam-b {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 2px;
        overflow: hidden;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
      }
      .ac-border-beam .ac-border-beam-b::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 300px;
        margin: -150px 0 0 -150px;
        background: conic-gradient(transparent 0 75%, var(--sky) 88%, var(--blue) 95%, transparent);
        rotate: 200deg;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-border-beam .ac-border-beam-b::before {
          animation: ac-border-beam-r var(--dur, 3000ms) linear infinite;
        }
      }
      @keyframes ac-border-beam-r {
        from {
          rotate: 0deg;
        }
        to {
          rotate: 360deg;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "border-beam",
        name: "枠を回る光",
        en: "Border beam",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "カードの枠に沿って、短い光の帯がぐるぐると回り続ける動きです。静かなカードの中で、ここが特別だと控えめに知らせます。",
        use: "おすすめの料金プラン、新機能のカード、AI の入力欄、注目させたいボタン。",
        params: [{ key: "dur", label: "一周の時間", value: 3000, min: 1000, max: 8000, step: 100, unit: "ms" }],
        spec: [
          [
            "光",
            "<code>conic-gradient(透明 0 80%, 光の色 90%, 透明)</code> の大きな層を枠の内側で <code>rotate(0 → 360deg)</code>｜linear｜くり返し",
          ],
          [
            "枠だけにする",
            "<code>mask</code> の <code>content-box</code> と <code>exclude</code> で中を抜く（または中に背景色の要素を重ねる）",
          ],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          [
            "出典",
            '<a href="https://magicui.design/docs/components/border-beam" target="_blank" rel="noopener">Magic UI</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
