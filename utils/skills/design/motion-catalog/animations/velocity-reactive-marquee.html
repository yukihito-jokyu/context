    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->

  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "velocity-reactive-marquee",
        name: "スクロール速度で流れる帯",
        en: "Velocity-reactive marquee",
        cat: "スクロール",
        kind: "motion",
        description:
          "ずっと流れている文字やロゴの帯が、スクロールの速さに合わせて加速し、スクロールの向きに合わせて流れる向きも変わる動きです。ページを動かすたびに、帯が反応して勢いが伝わります。",
        use: "ブランドサイトのキャッチコピー、ロゴの帯、ポートフォリオ、ファッション系のランディングページ。",
        params: [
          { key: "base", label: "ふだんの速さ", value: 30, min: 0, max: 100, step: 5, unit: "px/s" },
          { key: "boost", label: "スクロールへの反応", value: 4, min: 0, max: 10, step: 0.5, unit: "倍" },
        ],
        spec: [
          [
            "速さ",
            "流れる速さ = ふだんの速さ × 向き + スクロールの速さ × 反応｜スクロールの速さは毎フレーム差分から計算し、spring でならす",
          ],
          ["向き", "下へスクロールしたら左へ、上へなら右へ（向きはスクロールが止まっても保つ）"],
          ["帯", "同じ中身を2つ並べて、<code>translateX</code> を中身の幅で折り返してつなぎ目をなくす"],
          ["動きを減らす設定", "帯を止め、中身が見える状態で表示する"],
          ["出典", '<a href="https://magicui.design/docs/components" target="_blank" rel="noopener">Magic UI</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const sc = stage.querySelector(".ac-velocity-reactive-marquee-sc"),
              tr = stage.querySelector(".ac-velocity-reactive-marquee-tr");
            const kids = tr.children,
              W = kids[kids.length / 2].offsetLeft - kids[0].offsetLeft;
            /* 複製の先頭までの距離（間隔も含む） */ let x = 0,
              last = 0,
              lastY = 0,
              vel = 0,
              dir = 1;
            return raf((t) => {
              const dt = Math.min(0.05, t - last) || 0.016;
              last = t;
              const max = sc.scrollHeight - sc.clientHeight;
              sc.scrollTop = max * (0.5 - 0.5 * Math.cos(t * 1.4));
              const sv = (sc.scrollTop - lastY) / dt;
              lastY = sc.scrollTop;
              vel += (sv - vel) * 0.15;
              if (Math.abs(sv) > 5) dir = Math.sign(sv);
              if (rm) return;
              x -= (v.base * dir + vel * v.boost * 0.1) * dt;
              x = ((x % W) - W) % W;
              tr.style.transform = `translateX(${x}px)`;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
