<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>テキストスクランブル（Text Scramble） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-text-scramble"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="ac-text-scramble-t"
          style="
            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
          "
          aria-hidden="true"
        >
          アニメーション
        </div>
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
          "
          >アニメーション</span
        >
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "text-scramble",
        name: "テキストスクランブル",
        en: "Text Scramble",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "文字がランダムな文字にめまぐるしく入れ替わったあと、左から順に正しい文字に落ち着いていく表現です。暗号が解けるような、デジタルな印象になります。",
        use: "ヒーローの見出し、テック系のサイト、ホバーしたリンク、ローディングの演出。",
        params: [{ key: "dur", label: "落ち着くまでの時間", value: 900, min: 300, max: 2000, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "動き",
            "毎フレーム、まだ確定していない文字をランダムな文字にし、左から順に「時間 × 位置の割合」で確定させる",
          ],
          ["文字の候補", "カタカナや記号など、本文と同じくらいの幅の文字にするとガタつかない"],
          ["読み上げ", "全文は視覚的に隠し、演出は <code>aria-hidden</code>"],
          ["動きを減らす設定", "入れ替えをやめ、正しい文字を表示する"],
          ["出典", "ChatGPT との会話の分類表（テキスト・視覚効果）"],
        ],
        loop: 2400,
        run: (stage, v) => {
          const el = stage.querySelector(".ac-text-scramble-t"),
            text = "アニメーション",
            pool = "アイウエオカキクケコサシスセソタチツテトナニヌネノ";
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
            el.textContent = text;
            return;
          }
          const segmenter = new Intl.Segmenter("ja", { granularity: "grapheme" });
          const graphemes = Array.from(segmenter.segment(text), ({ segment }) => segment);
          let raf,
            t0 = null;
          const tick = (now) => {
            if (t0 === null) t0 = now;
            const p = (now - t0) / v.dur;
            el.textContent = graphemes
              .map((ch, i) => (p > (i + 1) / graphemes.length ? ch : pool[Math.floor(Math.random() * pool.length)]))
              .join("");
            if (p < 1) raf = requestAnimationFrame(tick);
            else el.textContent = text;
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        },
      });
    </script>
  </body>
</html>
