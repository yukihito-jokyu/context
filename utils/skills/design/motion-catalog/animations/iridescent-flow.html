<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>玉虫色の流れ（Iridescent flow） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-iridescent-flow"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas
          width="55"
          height="38"
          style="position: absolute; left: 0; top: 0; width: 220px; height: 150px"
        ></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "iridescent-flow",
        name: "玉虫色の流れ",
        en: "Iridescent flow",
        cat: "背景",
        kind: "motion",
        description:
          "シャボン玉や玉虫の羽のように、見る角度で色が移ろう薄い膜の色が、ゆっくり波打ちながら流れる背景です。柔らかい虹色が、未来的で上品な雰囲気を作ります。プレビューは画素ごとの色の計算を粗い解像度で行い、近い形を作っています。",
        use: "AI・テック系のヒーロー、プレミアム商品の背景、カードの装飾。",
        params: [{ key: "speed", label: "速さ", value: 0.6, min: 0.1, max: 2, step: 0.1, unit: "" }],
        spec: [
          [
            "色",
            "画素ごとに、位置と時間の波（<code>sin</code> の重ね合わせ）から色相を決める。色相の範囲を青〜紫〜水色に絞ると上品",
          ],
          ["描画", "本来は WebGL のシェーダー（画素ごとの計算）。canvas なら粗い解像度で計算して引き伸ばす"],
          [
            "控えめに",
            "背景は主役ではない。コントラストと速さを抑え、前景の文字が読めることを優先する。画面外・非表示のときは止める",
          ],
          ["動きを減らす設定", "背景の動きを止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/backgrounds/iridescence" target="_blank" rel="noopener">React Bits: Iridescence</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              g = cv.getContext("2d"),
              w = 55,
              h = 38,
              img = g.createImageData(w, h);
            const draw = (t) => {
              for (let y = 0; y < h; y++)
                for (let x = 0; x < w; x++) {
                  const u = x / w,
                    q = y / h,
                    s = Math.sin(u * 6 + Math.sin(q * 5 + t) * 1.5 + t * 0.7) + Math.sin(q * 7 - t * 0.5);
                  const hue = 222 + s * 22,
                    l = 78 + Math.sin(s * 2) * 8,
                    i = (y * w + x) * 4,
                    [r, gg, b] = hsl(hue, 60, l);
                  img.data[i] = r;
                  img.data[i + 1] = gg;
                  img.data[i + 2] = b;
                  img.data[i + 3] = 255;
                }
              g.putImageData(img, 0, 0);
            };
            const hsl = (H, S, L) => {
              S /= 100;
              L /= 100;
              const k = (n) => (n + H / 30) % 12,
                a = S * Math.min(L, 1 - L),
                f = (n) => L - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
              return [f(0) * 255, f(8) * 255, f(4) * 255];
            };
            if (rm) {
              draw(0);
              return null;
            }
            let last = -1;
            return raf((t) => {
              if (t - last < 1 / 30) return;
              last = t;
              draw(t * v.speed);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
