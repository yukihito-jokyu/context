<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ライフゲーム（Cellular automaton (Game of Life)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-game-of-life"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "game-of-life",
        name: "ライフゲーム",
        en: "Cellular automaton (Game of Life)",
        cat: "背景",
        kind: "motion",
        description:
          "格子のマスが「生きている／死んでいる」の 2 状態を持ち、周りの 8 マスのうち生きているマスの数だけで次の状態を決める、という規則を世代ごとにくり返す動きです。形が生まれては動き、ぶつかって消えていきます。",
        use: "テック・研究系のサイトの背景、404 ページ、ジェネラティブなローディング。",
        params: [{ key: "gen", label: "1世代の時間", value: 140, min: 50, max: 600, step: 10, unit: "ms" }],
        spec: [
          [
            "規則",
            "生きているマスは周りが 2 か 3 なら生き残る。死んでいるマスは周りがちょうど 3 なら生まれる。それ以外は死ぬ",
          ],
          [
            "見せ方",
            "1 世代 100〜200ms。消えたマスはすぐ消さず、少し残してフェードさせると動きが追いやすい。端は反対側とつなげる",
          ],
          ["止まったとき", "形が動かなくなったら、少し待ってから新しく種をまき直す"],
          ["動きを減らす設定", "世代を進めず、1世代の静止画にする"],
          [
            "出典",
            '<a href="https://p5js.org/examples/Math-And-Physics-Game-Of-Life/" target="_blank" rel="noopener">p5js.org（Math-And-Physics-Game-Of-Lif）</a>、<a href="https://thecodingtrain.com/challenges/85-the-game-of-life" target="_blank" rel="noopener">thecodingtrain.com（85-the-game-of-life）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const nx = 44,
              ny = 30,
              cs = 5;
            let c = new Uint8Array(nx * ny),
              n2 = new Uint8Array(nx * ny);
            const age = new Float32Array(nx * ny);
            let lastG = 0,
              born = 0;
            const seed = () => {
              for (let i = 0; i < c.length; i++) c[i] = rnd() < 0.3 ? 1 : 0;
              born = 0;
            };
            const step = () => {
              let ch = 0;
              for (let y = 0; y < ny; y++)
                for (let x = 0; x < nx; x++) {
                  let s = 0;
                  for (let dy = -1; dy <= 1; dy++)
                    for (let dx = -1; dx <= 1; dx++)
                      if (dx || dy) s += c[((y + dy + ny) % ny) * nx + ((x + dx + nx) % nx)];
                  const i = y * nx + x,
                    v2 = c[i] ? (s === 2 || s === 3 ? 1 : 0) : s === 3 ? 1 : 0;
                  n2[i] = v2;
                  if (v2 !== c[i]) ch++;
                }
              [c, n2] = [n2, c];
              born++;
              still = ch === 0 ? still + 1 : 0;
              if (still > 8 || born > 120) seed();
            };
            let still = 0;
            seed();
            return raf((t) => {
              if (!rm && (t - lastG) * 1000 > v.gen) {
                lastG = t;
                step();
              }
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
              for (let i = 0; i < c.length; i++) {
                age[i] = c[i] ? 1 : Math.max(0, age[i] - 0.06);
                if (age[i] <= 0) continue;
                g.fillStyle = c[i] ? col("blue") : `rgba(124,170,255,${age[i] * 0.5})`;
                g.fillRect((i % nx) * cs + 0.5, Math.floor(i / nx) * cs + 0.5, cs - 1, cs - 1);
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
