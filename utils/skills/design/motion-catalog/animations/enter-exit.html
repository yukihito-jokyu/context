<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>追加・削除（Enter / Exit） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-enter-exit"
        style="
          position: relative;
          width: 210px;
          height: 170px;
          display: flex;
          flex-direction: column;
          gap: 0;
          justify-content: center;
        "
      >
        <div class="sb-item" style="width: 210px; padding: 10px 14px; gap: 12px; box-sizing: border-box">
          <span class="sb-thumb sb-grad-aqua" style="width: 32px; height: 32px; border-radius: 10px"></span
          ><span class="sb-lines" style="gap: 8px"
            ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 80px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 60px"></span
          ></span>
        </div>
        <div class="ac-enter-exit-w">
          <div class="sb-item" style="width: 210px; padding: 10px 14px; gap: 12px; box-sizing: border-box">
            <span class="sb-thumb sb-grad-sky" style="width: 32px; height: 32px; border-radius: 10px"></span
            ><span class="sb-lines" style="gap: 8px"
              ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 100px"></span
              ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 50px"></span
            ></span>
          </div>
        </div>
        <div class="sb-item" style="width: 210px; padding: 10px 14px; gap: 12px; box-sizing: border-box">
          <span class="sb-thumb sb-grad-deep" style="width: 32px; height: 32px; border-radius: 10px"></span
          ><span class="sb-lines" style="gap: 8px"
            ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 70px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 60px"></span
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-enter-exit > .sb-item {
        margin: 5px 0;
      }
      .ac-enter-exit .ac-enter-exit-w {
        overflow: hidden;
        height: 62px;
        animation:
          ac-enter-exit-in var(--in, 260ms) cubic-bezier(0.22, 1, 0.36, 1) both,
          ac-enter-exit-out var(--out, 200ms) cubic-bezier(0.55, 0, 1, 0.45) calc(var(--in, 260ms) + 1200ms) forwards;
      }
      .ac-enter-exit .ac-enter-exit-w > .sb-item {
        margin: 5px 0;
      }
      @keyframes ac-enter-exit-in {
        from {
          height: 0;
          opacity: 0;
        }
        to {
          height: 62px;
          opacity: 1;
        }
      }
      @keyframes ac-enter-exit-out {
        from {
          height: 62px;
          opacity: 1;
        }
        to {
          height: 0;
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-enter-exit-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        @keyframes ac-enter-exit-out {
          from {
            opacity: 1;
          }
          to {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "enter-exit",
        name: "追加・削除",
        en: "Enter / Exit",
        cat: "登場・退出",
        kind: "motion",
        description:
          "要素が画面に加わるとき（Enter）と取り除かれるとき（Exit）に再生する動きです。高さを開いてから現れ、消えるときは薄くなってから高さを閉じるので、まわりの要素が急に跳びません。",
        use: "リストへの追加・削除、通知の積み重ね、フォームの入力欄の出し入れ。",
        params: [
          { key: "in", label: "追加の時間", value: 260, min: 100, max: 600, step: 10, unit: "ms" },
          { key: "out", label: "削除の時間", value: 200, min: 100, max: 600, step: 10, unit: "ms" },
        ],
        total: (p) => p["in"] + 1200 + p["out"],
        spec: [
          [
            "追加",
            "高さ <code>0 → 行の高さ</code> と <code>opacity 0 → 1</code>｜out <code>cubic-bezier(0.22, 1, 0.36, 1)</code>",
          ],
          [
            "削除",
            "<code>opacity 1 → 0</code> と高さ <code>行の高さ → 0</code>｜in <code>cubic-bezier(0.55, 0, 1, 0.45)</code>",
          ],
          ["実装", "React は AnimatePresence、Vue は &lt;Transition&gt;、素の DOM は削除をアニメーション終了まで待つ"],
          ["動きを減らす設定", "高さの動きをやめ、透明度の切り替えだけにする"],
          ["出典", "Animation Vocabulary（Entrances & Exits）"],
        ],
        loop: 2800,
      });
    </script>
  </body>
</html>
