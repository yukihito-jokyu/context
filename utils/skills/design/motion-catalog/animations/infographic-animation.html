<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>インフォグラフィックアニメーション（Infographic Animation） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-infographic-animation" style="position: relative; width: 210px; height: 120px">
        <div
          class="sb-card"
          style="
            width: 210px;
            padding: 14px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-sizing: border-box;
          "
        >
          <div style="position: relative; width: 78px; height: 78px; flex: none">
            <svg viewBox="0 0 36 36" width="78" height="78" style="transform: rotate(-90deg)">
              <circle cx="18" cy="18" r="15" fill="none" stroke="var(--bar)" stroke-width="5" />
              <circle
                class="ac-infographic-animation-ring"
                cx="18"
                cy="18"
                r="15"
                fill="none"
                stroke="var(--blue)"
                stroke-width="5"
                stroke-linecap="round"
                pathLength="100"
              />
            </svg>
            <span
              class="ac-infographic-animation-n"
              style="
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                font-weight: 800;
                color: var(--ink);
                letter-spacing: 0.02em;
                font-size: 18px;
                font-variant-numeric: tabular-nums;
              "
              >0%</span
            >
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
            <span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 60px"></span>
            <div
              style="display: flex; align-items: flex-end; gap: 7px; height: 58px; border-bottom: 2px solid var(--bar)"
            >
              <span class="ac-infographic-animation-b sb-grad-aqua" style="height: 40%; --i: 0"></span
              ><span class="ac-infographic-animation-b sb-grad-sky" style="height: 65%; --i: 1"></span
              ><span class="ac-infographic-animation-b sb-grad-sky" style="height: 50%; --i: 2"></span
              ><span class="ac-infographic-animation-b sb-grad-deep" style="height: 90%; --i: 3"></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-infographic-animation .ac-infographic-animation-ring {
        stroke-dasharray: 86 100;
        stroke-dashoffset: 86;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-infographic-animation .ac-infographic-animation-ring {
          animation: ac-infographic-animation-draw var(--dur, 900ms) cubic-bezier(0.22, 1, 0.36, 1) 200ms forwards;
        }
      }
      .ac-infographic-animation .ac-infographic-animation-b {
        flex: 1;
        border-radius: 6px 6px 0 0;
        transform-origin: bottom;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-infographic-animation .ac-infographic-animation-b {
          animation: ac-infographic-animation-grow 600ms cubic-bezier(0.22, 1, 0.36, 1)
            calc(200ms + var(--dur, 900ms) + var(--i) * 80ms) both;
        }
      }
      @keyframes ac-infographic-animation-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes ac-infographic-animation-grow {
        from {
          transform: scaleY(0);
        }
        to {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-infographic-animation .ac-infographic-animation-ring {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "infographic-animation",
        name: "インフォグラフィックアニメーション",
        en: "Infographic Animation",
        cat: "表現スタイル",
        kind: "style",
        description:
          "数値・図形・グラフを動かして、情報を順を追って説明する表現形式です。円グラフが描かれ、数値が数え上がり、棒が順に伸びます。",
        use: "実績の紹介、レポート、ダッシュボードの初回表示。",
        params: [{ key: "dur", label: "基本の時間", value: 900, min: 400, max: 2000, step: 50, unit: "ms" }],
        total: (p) => p["dur"] + 1040,
        spec: [
          ["表現形式", "Flat 2D Motion Graphics（フラットな図形・余計な装飾なし）"],
          ["演出", "Sequential Reveal（円と数値を一緒に → 棒の順）"],
          ["個別の動き", "円は Line drawing、数値は Number ticker、棒は Animated chart + Stagger"],
          ["時間・質感", "円と数値は基本の時間、棒は 80ms ずつずらす。ease-out"],
          ["カタログの関連", "line-drawing / number-ticker / animated-chart / stagger / sequential-reveal"],
          ["動きを減らす設定", "描く・数える・伸びる動きをやめ、完成した図を透明度で表示する"],
          ["出典", "ChatGPT との会話（表現スタイルの語彙）"],
        ],
        loop: 3200,
        run: (stage, v) => {
          const el = stage.querySelector(".ac-infographic-animation-n");
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
            el.textContent = "86%";
            return;
          }
          const anim = stage.querySelector(".ac-infographic-animation-ring").getAnimations()[0];
          let raf; /* 円の線と同じ時計で数える */
          const tick = () => {
            const p = anim ? Math.max(0, Math.min(1, (anim.currentTime - 200) / v.dur)) : 1;
            el.textContent = Math.round(86 * (1 - Math.pow(1 - p, 3))) + "%";
            if (p < 1) raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        },
      });
    </script>
  </body>
</html>
