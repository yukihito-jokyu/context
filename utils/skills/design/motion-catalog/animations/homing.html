<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ホーミング（Homing flight） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-homing"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "homing",
        name: "ホーミング",
        en: "Homing flight",
        cat: "移動・変形",
        kind: "motion",
        description:
          "飛んでいる弾や物が、動く目標へ向けて飛びながら進む向きを少しずつ曲げ続け、追いかけて当たる動きです。一度に曲がれる角度を制限するので、大きな弧を描いて回り込みます。",
        use: "ゲームの追尾ミサイル・魔法、カートへ飛んでいく商品、獲得したポイントがメーターへ飛ぶ演出。",
        params: [{ key: "turn", label: "1/60 秒に曲がれる角度", value: 3, min: 0.5, max: 10, step: 0.5, unit: "°" }],
        spec: [
          [
            "仕組み",
            "毎フレーム、目標への向きと今の向きの差を求め、1 フレームに曲がれる角度（例：4°）までだけ向きを変えて前へ進む",
          ],
          ["調整", "曲がれる角度を時間とともに大きくすると、外れずに必ず当たる。速さを上げていくと勢いが出る"],
          ["UI では", "獲得したコインがスコアへ飛ぶ演出は、目標が止まっているので曲線（ベジェ）で決めてもよい"],
          ["動きを減らす設定", "エージェントの動きを止め、向きと目標の静止画にする"],
          [
            "出典",
            '<a href="https://docs.daimahougames.com/abilities/projectiles/" target="_blank" rel="noopener">docs.daimahougames.com（projectiles）</a>、<a href="https://www.red3d.com/cwr/steer/gdc99/" target="_blank" rel="noopener">Craig Reynolds: Steering Behaviors For Autonomous Characters</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const lim = (x, y, m) => {
              const l = Math.hypot(x, y);
              return l > m && l > 0 ? [(x / l) * m, (y / l) * m] : [x, y];
            };
            const ag = (x, y, a = 0, s = 1) => ({ x, y, vx: cos(a) * s, vy: sin(a) * s, w: rnd() * TAU });
            const seek = (a, tx, ty, ms) => {
              const dx = tx - a.x,
                dy = ty - a.y,
                l = Math.hypot(dx, dy) || 1;
              return [(dx / l) * ms - a.vx, (dy / l) * ms - a.vy];
            };
            const go = (a, f, mf, ms) => {
              const [fx, fy] = lim(f[0], f[1], mf);
              a.vx += fx;
              a.vy += fy;
              [a.vx, a.vy] = lim(a.vx, a.vy, ms);
              a.x += a.vx;
              a.y += a.vy;
            };
            const wrap = (a) => {
              if (a.x < -8) a.x += W + 16;
              if (a.x > W + 8) a.x -= W + 16;
              if (a.y < -8) a.y += H + 16;
              if (a.y > H + 8) a.y -= H + 16;
            };
            const sep = (a, all, r) => {
              let fx = 0,
                fy = 0;
              for (const b of all) {
                if (b === a) continue;
                const dx = a.x - b.x,
                  dy = a.y - b.y,
                  d = Math.hypot(dx, dy);
                if (d > 0 && d < r) {
                  fx += ((dx / d) * (r - d)) / r;
                  fy += ((dy / d) * (r - d)) / r;
                }
              }
              return [fx, fy];
            };
            const tri = (a, c, s = 1) => {
              g.save();
              g.translate(a.x, a.y);
              g.rotate(Math.atan2(a.vy, a.vx));
              g.fillStyle = c;
              g.beginPath();
              g.moveTo(7 * s, 0);
              g.lineTo(-5 * s, 4 * s);
              g.lineTo(-5 * s, -4 * s);
              g.closePath();
              g.fill();
              g.restore();
            };
            const bg = () => {
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
            };
            const steps = (() => {
              let acc = 0,
                last = null,
                warmed = false;
              return (t, fn, warm = 90) => {
                if (rm) {
                  if (!warmed) {
                    warmed = true;
                    for (let i = 0; i < warm; i++) fn();
                  }
                  return;
                }
                if (last !== null) acc += Math.min(0.1, t - last);
                last = t;
                for (let n = 0; acc >= 1 / 60 && n < 6; n++) {
                  fn();
                  acc -= 1 / 60;
                }
              };
            })();
            let M = null,
              tr = [],
              t0 = -9;
            return raf((t) => {
              if (rm) t = 0;
              const tx = 170 + 30 * sin(t * 1.3),
                ty = 40 + 50 * sin(t * 0.9);
              if (!M || t - t0 > 4) {
                M = { x: 20, y: 130, a: -0.3, s: 2 };
                tr = [];
                t0 = t;
              }
              steps(t, () => {
                const want = Math.atan2(ty - M.y, tx - M.x);
                let d = ((want - M.a + Math.PI * 3) % TAU) - Math.PI;
                const mx = ((v.turn * Math.PI) / 180) * (1 + (t - t0));
                M.a += Math.max(-mx, Math.min(mx, d));
                M.s = Math.min(3.5, M.s + 0.02);
                M.x += cos(M.a) * M.s;
                M.y += sin(M.a) * M.s;
                tr.push([M.x, M.y]);
                if (tr.length > 40) tr.shift();
                if (Math.hypot(tx - M.x, ty - M.y) < 8) t0 = t - 3.7;
              });
              bg();
              g.strokeStyle = "rgba(59,130,246,.35)";
              g.lineWidth = 2;
              g.beginPath();
              tr.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p)));
              g.stroke();
              g.strokeStyle = "#e5484d";
              g.lineWidth = 1.5;
              g.beginPath();
              g.arc(tx, ty, 8, 0, TAU);
              g.stroke();
              dot(tx, ty, 2.5, "#e5484d");
              tri({ x: M.x, y: M.y, vx: cos(M.a), vy: sin(M.a) }, col("blue"));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
