<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アピール（Appeal） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-appeal"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          place-items: center;
        "
      >
        <div class="ac-appeal-l">
          <span class="sb-check-circle ac-appeal-a" style="filter: grayscale(1); opacity: 0.55"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" /></svg
          ></span>
        </div>
        <div class="ac-appeal-r">
          <span class="sb-check-circle ac-appeal-b"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" /></svg
            ><i class="ac-appeal-e"></i><i class="ac-appeal-e"></i
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-appeal .ac-appeal-a {
        animation: ac-appeal-f var(--dur, 500ms) linear both;
      }
      .ac-appeal .ac-appeal-b {
        position: relative;
        animation: ac-appeal-pop var(--dur, 500ms) cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .ac-appeal .ac-appeal-e {
        position: absolute;
        top: 24px;
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: #fff;
        left: 22px;
        animation: ac-appeal-blink 2600ms ease both;
      }
      .ac-appeal .ac-appeal-e + .ac-appeal-e {
        left: auto;
        right: 22px;
      }
      .ac-appeal .ac-appeal-b svg {
        opacity: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-appeal .ac-appeal-b svg {
          animation: ac-appeal-f 200ms 1500ms both;
        }
      }
      .ac-appeal .ac-appeal-e {
        animation: ac-appeal-eye 1500ms both;
      }
      @keyframes ac-appeal-f {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ac-appeal-pop {
        from {
          opacity: 0;
          transform: scale(0.4) rotate(-12deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ac-appeal-eye {
        0%,
        55% {
          transform: scaleY(1);
          opacity: 1;
        }
        62% {
          transform: scaleY(0.1);
        }
        70%,
        95% {
          transform: scaleY(1);
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-appeal .ac-appeal-b {
          animation: ac-appeal-f 200ms both;
        }
        .ac-appeal .ac-appeal-e {
          display: none;
        }
        .ac-appeal .ac-appeal-b svg {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "appeal",
        name: "アピール",
        en: "Appeal",
        cat: "原則",
        kind: "concept",
        description:
          "動きに、思わず見てしまう魅力と個性を持たせるという原則です。UI では、形が読み取りやすく、動きに少しだけ性格（はずみ・ためらい・うれしさ）があることを指します。左の完了マークはただ現れるだけ、右は弾んで現れ、ウインクするように一度だけまばたきします。",
        use: "ブランドの印象を作るアイコン・マスコット、空の状態、完了・成功の表示、オンボーディング。",
        params: [{ key: "dur", label: "時間", value: 500, min: 200, max: 1000, step: 10, unit: "ms" }],
        spec: [
          [
            "UI での意味",
            "形はシンプルで読み取りやすく。動きにはブランドに合った「性格」を一貫して与える（元気なら spring、落ち着きなら out）",
          ],
          ["やりすぎない", "魅力は控えめな一手で足りる。毎回・長く見せると邪魔になる"],
          ["比べる", "左（灰色）がこの原則なし、右（青）がこの原則あり"],
          ["動きを減らす設定", "弾みとまばたきをやめ、透明度で表示する"],
          [
            "出典",
            '<a href="https://www.adobe.com/creativecloud/animation/discover/principles-of-animation.html" target="_blank" rel="noopener">Adobe: 12 principles of animation</a>',
          ],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
