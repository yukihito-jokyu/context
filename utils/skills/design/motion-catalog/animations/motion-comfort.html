<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>酔わせない動き（Motion comfort (vestibular safety)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-motion-comfort" style="position: relative; width: 220px; height: 150px">
        <div class="ac-motion-comfort-p ac-motion-comfort-bad">
          <div class="ac-motion-comfort-w"><i></i></div>
        </div>
        <div class="ac-motion-comfort-p ac-motion-comfort-good">
          <div class="ac-motion-comfort-fr"><i class="ac-motion-comfort-o"></i></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-motion-comfort .ac-motion-comfort-p {
        position: absolute;
        top: 14px;
        width: 98px;
        height: 104px;
        border-radius: 14px;
        overflow: hidden;
        background: var(--ice);
      }
      .ac-motion-comfort .ac-motion-comfort-bad {
        left: 6px;
      }
      .ac-motion-comfort .ac-motion-comfort-good {
        left: 116px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
      }
      .ac-motion-comfort .ac-motion-comfort-w {
        position: absolute;
        inset: -40px;
        background: linear-gradient(180deg, var(--sky) 0 50%, var(--cobalt) 50%);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-motion-comfort .ac-motion-comfort-w {
          animation: ac-motion-comfort-r 4800ms ease-in-out infinite alternate;
        }
      }
      .ac-motion-comfort .ac-motion-comfort-w i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 40px;
        margin: -20px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.6;
      }
      @keyframes ac-motion-comfort-r {
        from {
          transform: rotate(-14deg);
        }
        to {
          transform: rotate(14deg) translateX(10px);
        }
      }
      .ac-motion-comfort .ac-motion-comfort-fr {
        position: absolute;
        inset: 8px;
        border-radius: 10px;
        box-shadow: inset 0 0 0 2px var(--line);
        background: linear-gradient(180deg, transparent 70%, var(--ice) 70%);
      }
      .ac-motion-comfort .ac-motion-comfort-o {
        position: absolute;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: var(--blue);
        left: 12px;
        top: 40px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-motion-comfort .ac-motion-comfort-o {
          animation: ac-motion-comfort-f 3200ms ease-in-out infinite;
        }
      }
      @keyframes ac-motion-comfort-f {
        0%,
        35% {
          opacity: 1;
          transform: none;
        }
        45% {
          opacity: 0;
          transform: none;
        }
        46% {
          opacity: 0;
          transform: translateX(38px);
        }
        56%,
        85% {
          opacity: 1;
          transform: translateX(38px);
        }
        95% {
          opacity: 0;
          transform: translateX(38px);
        }
        96% {
          opacity: 0;
          transform: none;
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      .ac-motion-comfort::after {
        content: "避ける　　　　　　　おすすめ";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
        text-align: center;
        white-space: pre;
        font: 600 11px var(--font-sans);
        color: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "motion-comfort",
        name: "酔わせない動き",
        en: "Motion comfort (vestibular safety)",
        cat: "原則",
        kind: "concept",
        description:
          "見ている人が乗り物酔いのような気分にならないよう、特に VR・空間の体験や大きな画面で、視界全体が動く・回る・揺れ続けるのを避ける考え方です。動いている物を見せるときも、動かない基準の枠を残し、場所を移すときはフェードで切り替えます。",
        use: "VR・AR・空間コンピューティングのアプリ、全画面の背景アニメーション、パララックスの強いサイト、ゲームのカメラの設計。",
        params: [],
        spec: [
          [
            "避ける",
            "視界の端での動き、大きな物の急な接近、利用者が操作していない世界の回転、0.2Hz 前後のゆっくりした揺れが続くこと",
          ],
          [
            "代わりに",
            "動かない基準（画面の枠・床・手元の UI）を残す。物を遠くへ移すときは、その場でフェードアウト → 移した先でフェードイン",
          ],
          [
            "大きな物",
            "大きな物を動かすときは半透明・低いコントラストにする。動きを減らす設定では、全体の動きをやめる",
          ],
          ["動きを減らす設定", "見本の動きも止める（回転と移動をしない）"],
          [
            "出典",
            '<a href="https://developer.apple.com/design/human-interface-guidelines/motion" target="_blank" rel="noopener">Apple Human Interface Guidelines: Motion</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
