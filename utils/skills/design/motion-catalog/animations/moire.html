<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>モアレ（Animated moiré interference） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-moire"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "moire",
        name: "モアレ",
        en: "Animated moiré interference",
        cat: "背景",
        kind: "motion",
        description:
          "細い線や同心円の模様を 2 枚重ね、片方を少しずつ動かすと、どちらの模様にもない大きな縞（干渉縞）が現れて、ゆっくり波のように動きます。わずかな動きで、大きく揺らめく模様が生まれます。",
        use: "アート・音楽系のビジュアル、オプアート風の背景、催眠的なローディング。",
        params: [{ key: "speed", label: "動く速さ", value: 1, min: 0, max: 3, step: 0.1, unit: "" }],
        spec: [
          [
            "仕組み",
            "線の間隔が同じ（または少し違う）2 つの模様を重ね、片方を平行移動・回転・拡大する。2 枚のずれが縞になる",
          ],
          [
            "書き方",
            "SVG や canvas で同心円や平行線を 2 組描き、片方の <code>transform</code> だけを動かす。CSS なら <code>repeating-radial-gradient</code> を 2 枚重ねてもよい",
          ],
          [
            "気をつけること",
            "強い明滅や細かい縞の速い動きは目に負担がかかる。ゆっくり動かし、動きを減らす設定では止める",
          ],
          ["動きを減らす設定", "模様の動きを止め、2枚を重ねた静止画にする"],
          [
            "出典",
            '<a href="https://animorio.com/en/animations/moire-rings-background/" target="_blank" rel="noopener">animorio.com（moire-rings-background）</a>、<a href="https://github.com/aljazfrancic/generative-art-gallery" target="_blank" rel="noopener">github.com（generative-art-gallery）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const ring = (x, y) => {
              g.beginPath();
              for (let r = 4; r < 260; r += 6) {
                g.moveTo(x + r, y);
                g.arc(x, y, r, 0, TAU);
              }
              g.stroke();
            };
            return raf((t) => {
              const T = rm ? 0.6 : t * v.speed;
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
              g.strokeStyle = col("navy");
              g.lineWidth = 2.2;
              ring(110 + 26 * cos(T * 0.7), 75 + 14 * sin(T * 0.9));
              ring(110 - 26 * cos(T * 0.7), 75 - 14 * sin(T * 0.9));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
