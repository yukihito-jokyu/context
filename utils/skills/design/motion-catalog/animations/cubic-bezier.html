<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キュービックベジェ（Cubic-bezier） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-cubic-bezier"
        style="
          position: relative;
          width: 200px;
          height: 150px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        "
      >
        <div class="ac-cubic-bezier-g">
          <svg viewBox="0 0 80 80" width="80" height="80" style="overflow: visible">
            <path d="M0,80 L80,80 M0,80 L0,0" stroke="var(--bar)" stroke-width="2" fill="none" />
            <path d="M0,80 L80,0" stroke="var(--bar)" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
            <path
              class="ac-cubic-bezier-curve"
              d="M0,80 C17.6,0.0 28.8,0.0 80,0"
              stroke="var(--cobalt)"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            /></svg
          ><span class="ac-cubic-bezier-dx"><span class="ac-cubic-bezier-dy"></span></span>
        </div>
        <div style="position: relative; width: 200px; height: 32px">
          <span
            style="
              position: absolute;
              left: 0;
              right: 0;
              top: 15px;
              height: 2px;
              border-radius: 2px;
              background: var(--bar);
            "
          ></span
          ><span
            class="sb-thumb sb-grad-sky ac-cubic-bezier-t"
            style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-cubic-bezier .ac-cubic-bezier-g {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .ac-cubic-bezier .ac-cubic-bezier-dx {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 10px;
        height: 80px;
        margin-left: -5px;
        animation: ac-cubic-bezier-x var(--dur, 1000ms) linear both;
      }
      .ac-cubic-bezier .ac-cubic-bezier-dy {
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px #fff;
        animation: ac-cubic-bezier-y var(--dur, 1000ms)
          cubic-bezier(var(--x1, 0.22), var(--y1, 1), var(--x2, 0.36), var(--y2, 1)) both;
      }
      .ac-cubic-bezier .ac-cubic-bezier-t {
        animation: ac-cubic-bezier-m var(--dur, 1000ms)
          cubic-bezier(var(--x1, 0.22), var(--y1, 1), var(--x2, 0.36), var(--y2, 1)) both;
      }
      @keyframes ac-cubic-bezier-x {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(80px);
        }
      }
      @keyframes ac-cubic-bezier-y {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-80px);
        }
      }
      @keyframes ac-cubic-bezier-m {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(168px);
        }
      }
      @keyframes ac-cubic-bezier-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-cubic-bezier .ac-cubic-bezier-dx {
          transform: translateX(80px);
          animation-name: none;
        }
        .ac-cubic-bezier .ac-cubic-bezier-dy {
          transform: translateY(-80px);
          animation-name: ac-cubic-bezier-fade;
        }
        .ac-cubic-bezier .ac-cubic-bezier-t {
          transform: translateX(168px);
          animation-name: ac-cubic-bezier-fade;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cubic-bezier",
        name: "キュービックベジェ",
        en: "Cubic-bezier",
        cat: "イージング",
        kind: "motion",
        description:
          "2つの制御点（x1, y1, x2, y2）で、自分だけの速度変化の曲線を作る書き方です。y を 0〜1 の外に出すと、行き過ぎて戻る動きや、一度下がってから進む動きも作れます。バーで曲線を変えてみてください。",
        use: "ブランド独自の動きの質感を決めるとき、既定のイージングでは物足りないとき。",
        params: [
          { key: "x1", label: "x1", value: 0.22, min: 0, max: 1, step: 0.01, unit: "" },
          { key: "y1", label: "y1", value: 1, min: -1, max: 2, step: 0.05, unit: "" },
          { key: "x2", label: "x2", value: 0.36, min: 0, max: 1, step: 0.01, unit: "" },
          { key: "y2", label: "y2", value: 1, min: -1, max: 2, step: 0.05, unit: "" },
          { key: "dur", label: "時間", value: 1000, min: 200, max: 2000, step: 50, unit: "ms" },
        ],
        total: (p) => p["dur"],
        spec: [
          ["値", "<code>cubic-bezier(x1, y1, x2, y2)</code>。x は 0〜1、y は範囲外も可"],
          ["作り方", "cubic-bezier.com や DevTools のイージングエディタで調整し、値をトークンとして持つ"],
          ["グラフ", "横が時間、縦が進み具合。点線は等速（linear）"],
          ["動きを減らす設定", "終点に固定し、透明度だけを変える"],
          ["出典", "Animation Vocabulary（Easing）"],
        ],
        loop: 2600,
        run: (stage, v) => {
          const s = 80,
            y = (n) => ((1 - n) * s).toFixed(1);
          stage
            .querySelector(".ac-cubic-bezier-curve")
            .setAttribute(
              "d",
              `M0,${s} C${(v.x1 * s).toFixed(1)},${y(v.y1)} ${(v.x2 * s).toFixed(1)},${y(v.y2)} ${s},0`,
            );
        },
      });
    </script>
  </body>
</html>
