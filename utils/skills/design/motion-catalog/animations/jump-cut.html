<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ジャンプカット（Jump cut） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-jump-cut"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div
          class="ac-jump-cut-s"
          style="
            background:
              radial-gradient(ellipse at 50% 120%, var(--aqua) 0 45%, transparent 46%),
              repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.18) 0 2px, transparent 2px 28px),
              linear-gradient(180deg, #e6efff, var(--ice));
          "
        ></div>
        <span class="ac-jump-cut-p"><i></i></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-jump-cut .ac-jump-cut-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-jump-cut .ac-jump-cut-p {
        position: absolute;
        left: 30px;
        bottom: 30px;
        width: 34px;
        height: 58px;
        border-radius: 17px 17px 10px 10px;
        background: var(--blue);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-jump-cut .ac-jump-cut-p {
          animation: ac-jump-cut-t calc(var(--dur, 2600ms) * 1.6) step-end infinite;
        }
      }
      .ac-jump-cut .ac-jump-cut-p i {
        position: absolute;
        left: 7px;
        top: -24px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--blue);
      }
      @keyframes ac-jump-cut-t {
        0% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(64px, 0) scale(1.1);
        }
        40% {
          transform: translate(120px, -6px) scale(0.9);
        }
        60% {
          transform: translate(150px, 0) rotate(-8deg);
        }
        80% {
          transform: translate(40px, 0) scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "jump-cut",
        name: "ジャンプカット",
        en: "Jump cut",
        cat: "映像の切り替え",
        kind: "concept",
        description:
          "同じ構図のまま、時間だけを飛ばして切り替える方法です。人や物が画面の中でぽんぽんと位置を変え、時間の経過やせわしなさ、テンポの良さを表せます。",
        use: "作業の過程を早送りで見せる動画、SNS 向けの短い動画、ビフォー・アフター。",
        params: [{ key: "dur", label: "間隔 ×5", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          ["書き方", "背景は同じのまま、主役の位置・大きさ・ポーズだけを <code>step-end</code> で切り替える"],
          ["ずらし方", "1回ごとの変化は大きめに（小さすぎると撮り損ないに見える）"],
          ["リズム", "一定の間隔で切ると、意図した演出だと伝わる"],
          ["動きを減らす設定", "位置の切り替えをやめ、1つのショットで止める"],
          [
            "出典",
            '<a href="https://www.studiobinder.com/blog/types-of-editing-transitions-in-film/" target="_blank" rel="noopener">StudioBinder: Types of Editing Transitions</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
