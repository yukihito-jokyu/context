<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>光の柱（Light pillar） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-light-pillar"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas
        ><span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "light-pillar",
        name: "光の柱",
        en: "Light pillar",
        cat: "背景",
        kind: "motion",
        description:
          "画面の中央に、光の筋が渦を巻きながら立ちのぼる柱を立て、ポインターの方へ柱の上の方をゆっくり傾ける背景です。クリックすると柱が一瞬太く明るくなります。プレビューは canvas で近い形にしています（元の作例は WebGL）。",
        use: "ゲーム・エンタメのヒーロー、AI やテック系の製品紹介、イベントのティザー。",
        params: [{ key: "speed", label: "渦の速さ", value: 1, min: 0, max: 3, step: 0.1, unit: "" }],
        spec: [
          [
            "作り方",
            "数本の光の筋を、高さ y ごとに <code>x = 中心 + sin(y × k + t + 位相) × 幅</code> で描き、加算合成（<code>lighter</code>）とぼかしで重ねる。中心に細く明るい芯を入れる",
          ],
          [
            "傾き・高まり",
            "柱の上ほどポインターの方へずらす（ずれはばねでゆっくり追う）。クリックで幅と明るさを上げ、0.5〜1 秒で戻す",
          ],
          ["本格的に", "WebGL のシェーダーでボリュームの光（レイマーチング）として描くと、奥行きのある柱になる"],
          ["動きを減らす設定", "渦と傾きの動きを止め、柱の静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/llms.txt" target="_blank" rel="noopener">React Bits（コンポーネント一覧）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const mkway =
              (pts, seg, hold = 0.3) =>
              (t) => {
                const n = pts.length,
                  k = (t % (n * seg)) / seg,
                  i = Math.floor(k),
                  f0 = k - i,
                  f = Math.max(0, (f0 - hold) / (1 - hold)),
                  e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2,
                  a = pts[i],
                  b = pts[(i + 1) % n];
                return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
              };
            const loop8 = (t, cx = 110, cy = 75, rx = 85, ry = 45) => [
              cx + rx * Math.sin(t * 0.9),
              cy + ry * Math.sin(t * 1.7),
            ];
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            let lean = 0,
              last = 0,
              lastK = 9,
              surge = 0;
            show(1);
            cur.style.transition = "none";
            return raf((t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              const [px, py] = rm ? [110, 75] : loop8(t * 0.5, 110, 70, 90, 40);
              cur.style.transform = `translate(${px}px, ${py}px)`;
              const k = t % 3;
              if (!rm && k < lastK) {
                surge = 1;
                cur.animate([{ scale: 1 }, { scale: 0.8 }, { scale: 1 }], { duration: 220 });
              }
              lastK = k;
              surge = Math.max(0, surge - dt * 1.6);
              lean += (((px - 110) / 110) * 34 - lean) * 0.04;
              const T = rm ? 0 : t * v.speed,
                sw = 1 + surge * 0.8;
              g.globalCompositeOperation = "source-over";
              g.fillStyle = col("navy");
              g.fillRect(0, 0, W, H);
              g.globalCompositeOperation = "lighter";
              const base = g.createRadialGradient(110, H, 0, 110, H, 70);
              base.addColorStop(0, `rgba(90,150,255,${0.35 + surge * 0.3})`);
              base.addColorStop(1, "rgba(90,150,255,0)");
              g.fillStyle = base;
              g.fillRect(0, 0, W, H);
              blur(3);
              for (let s = 0; s < 5; s++) {
                g.beginPath();
                for (let y = H; y >= -4; y -= 3) {
                  const u = 1 - y / H,
                    x =
                      110 + lean * u * u + Math.sin(y * 0.06 + T * 2.2 + s * 1.26) * (6 + 3 * s) * sw * (0.6 + 0.4 * u);
                  y === H ? g.moveTo(x, y) : g.lineTo(x, y);
                }
                g.strokeStyle = `rgba(${[120, 170, 255]}, ${0.22 + surge * 0.2})`;
                g.lineWidth = 5 + s;
                g.stroke();
              }
              blur(0);
              g.beginPath();
              for (let y = H; y >= -4; y -= 3) {
                const u = 1 - y / H;
                g.lineTo(110 + lean * u * u, y);
              }
              g.strokeStyle = `rgba(235,245,255,${0.7 + surge * 0.3})`;
              g.lineWidth = 1.5 + surge * 2;
              g.stroke();
              g.globalCompositeOperation = "source-over";
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
