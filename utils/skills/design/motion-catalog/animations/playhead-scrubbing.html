<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>再生位置を飛ばす（Playhead scrubbing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-playhead-scrubbing" style="position: relative; width: 220px; height: 150px">
        <span class="ac-playhead-scrubbing-o"></span>
        <div class="ac-playhead-scrubbing-tl"><span class="ac-playhead-scrubbing-hd"></span></div>
        <span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-playhead-scrubbing .ac-playhead-scrubbing-o {
        position: absolute;
        left: 20px;
        top: 34px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--blue);
      }
      .ac-playhead-scrubbing .ac-playhead-scrubbing-tl {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 26px;
        height: 6px;
        border-radius: 3px;
        background: var(--bar-soft);
      }
      .ac-playhead-scrubbing .ac-playhead-scrubbing-hd {
        position: absolute;
        left: 0;
        top: -5px;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 0 0 2px var(--blue);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "playhead-scrubbing",
        name: "再生位置を飛ばす",
        en: "Playhead scrubbing",
        cat: "順序・タイミング",
        kind: "concept",
        description:
          "時間の流れを待たずに、アニメーションを好きな時刻の姿へ一気に飛ばし、そこから再生する考え方です。タイムラインの好きな位置を押すと、動きの途中の状態がすぐに現れます。",
        use: "動画風のプレイヤー、チュートリアルの「この段階から」、デザインツールのタイムライン、プレビューの確認。",
        params: [{ key: "len", label: "動きの長さ", value: 2000, min: 800, max: 4000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "<code>animation.currentTime = 時刻</code>（Web Animations）。GSAP は <code>seek()</code> / <code>progress()</code>",
          ],
          ["そのあと", "飛ばした位置から <code>play()</code> で続きを再生する。止めておくなら <code>pause()</code>"],
          ["このデモ", "丸が右へ進みながら大きくなり、色が濃くなる動き。指が押した位置から再生される"],
          ["動きを減らす設定", "再生位置の移動はそのままでよい。飛ばした後の自動再生はしない"],
          [
            "出典",
            '<a href="https://www.w3.org/TR/web-animations-1/" target="_blank" rel="noopener">W3C Web Animations</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const o = stage.querySelector(".ac-playhead-scrubbing-o"),
              hd = stage.querySelector(".ac-playhead-scrubbing-hd"),
              tw = hd.parentElement.clientWidth;
            const a = o.animate(
              [
                { transform: "translateX(0) scale(.7)", opacity: 0.4 },
                { transform: "translateX(150px) scale(1.3)", opacity: 1 },
              ],
              { duration: v.len, fill: "both" },
            );
            a.pause();
            const stopR = raf(() => {
              hd.style.transform = `translateX(${(tw * (a.currentTime || 0)) / v.len}px)`;
            }); /* left ではなく transform */
            const jump = (k) => () => {
              a.currentTime = k * v.len;
              if (!rm) a.play();
            };
            const x = (k) => 10 + 200 * k;
            move(x(0.2), 150, 0);
            const stopS = seq(4800, [
              [
                100,
                () => {
                  show(1);
                  move(x(0.7), 119, 500);
                },
              ],
              [700, jump(0.7)],
              [1500, () => move(x(0.15), 119, 500)],
              [2100, jump(0.15)],
              [3300, () => move(x(0.5), 119, 400)],
              [3800, jump(0.5)],
              [4400, () => show(0)],
            ]);
            return () => {
              stopR();
              stopS();
              a.cancel();
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
