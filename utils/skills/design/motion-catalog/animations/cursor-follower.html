<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>追いかける輪（Cursor follower） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-cursor-follower" style="position: relative; width: 220px; height: 150px">
        <span
          class="sb-btn sb-btn--soft ac-cursor-follower-btn"
          style="position: absolute; left: 120px; top: 90px; width: 80px"
          ><span class="sb-bar sb-bar--xs sb-bar--on-soft" style="width: 40px"></span></span
        ><span class="ac-cursor-follower-pt"></span><span class="ac-cursor-follower-r"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-cursor-follower .ac-cursor-follower-pt {
        position: absolute;
        left: 0;
        top: 0;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: var(--ink);
        z-index: 6;
      }
      .ac-cursor-follower .ac-cursor-follower-r {
        position: absolute;
        left: 0;
        top: 0;
        width: 32px;
        height: 32px;
        margin: -16px 0 0 -16px;
        z-index: 5;
      }
      .ac-cursor-follower .ac-cursor-follower-r::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid var(--ink);
        transition:
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          background-color 220ms,
          border-color 220ms;
      }
      .ac-cursor-follower .ac-cursor-follower-r.is-on::before {
        transform: scale(1.8);
        background: rgba(59, 130, 246, 0.15);
        border-color: var(--blue);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cursor-follower",
        name: "追いかける輪",
        en: "Cursor follower",
        cat: "カーソル",
        kind: "motion",
        description:
          "ポインターの位置には小さな点、そのまわりを大きめの輪が少し遅れてふわっと追いかけるカーソルです。リンクやボタンの上では輪が大きく広がり、押せることを知らせます。",
        use: "ポートフォリオ、ブランドサイト、ギャラリー、クリエイティブ系のランディングページ。",
        params: [{ key: "k", label: "追いかけの速さ", value: 0.15, min: 0.03, max: 0.5, step: 0.01, unit: "" }],
        spec: [
          [
            "点と輪",
            "点はポインターにそのまま。輪は毎フレーム <code>(ポインター - 輪) × 0.15</code> だけ近づける（または spring）",
          ],
          ["押せる物の上", "輪を <code>scale(1.8)</code> に広げ、塗りを薄い青に｜out 200ms"],
          ["速さ", "追いかけの係数が小さいほどゆったり。0.1–0.25 が目安"],
          ["タッチ端末", "マウスのない端末（<code>hover: none</code>）では出さない"],
          ["動きを減らす設定", "ポインターへの追従や軌跡をやめ、通常のカーソルだけにする"],
          [
            "出典",
            '<a href="https://motion.dev/examples/vue-cursor-follow" target="_blank" rel="noopener">Motion: cursor follow</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const mkway =
              (pts, seg, hold = 0.3) =>
              (t) => {
                const n = pts.length,
                  k = (t % (n * seg)) / seg,
                  i = Math.floor(k),
                  f0 = k - i,
                  f = Math.max(0, (f0 - hold) / (1 - hold)),
                  e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2,
                  a = pts[i],
                  b = pts[(i + 1) % n];
                return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
              };
            const loop8 = (t, cx = 110, cy = 75, rx = 85, ry = 45) => [
              cx + rx * Math.sin(t * 0.9),
              cy + ry * Math.sin(t * 1.7),
            ];
            const pt = stage.querySelector(".ac-cursor-follower-pt"),
              r = stage.querySelector(".ac-cursor-follower-r"),
              btn = stage.querySelector(".ac-cursor-follower-btn"),
              root = stage.firstElementChild;
            let x = 40,
              y = 40;
            const way = mkway(
              [
                [40, 40],
                [100, 60],
                [160, 108],
                [70, 110],
              ],
              1.3,
            );
            return raf((t) => {
              const [px, py] = way(t),
                k = rm ? 1 : v.k;
              x += (px - x) * k;
              y += (py - y) * k;
              pt.style.transform = `translate(${px}px, ${py}px)`;
              const b = root.getBoundingClientRect(),
                q = btn.getBoundingClientRect(),
                on = px > q.left - b.left && px < q.right - b.left && py > q.top - b.top && py < q.bottom - b.top;
              r.hidden = rm;
              if (rm) return;
              r.classList.toggle("is-on", on);
              r.style.transform = `translate(${x}px, ${y}px)`;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
