<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>点滅（Flash） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-flash" style="position: relative; width: 200px; height: 120px; display: grid; place-items: center">
        <span
          class="sb-chip ac-flash-c"
          style="gap: 8px; padding: 0 14px; height: 34px; display: inline-flex; align-items: center"
          ><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--blue)"></span
          ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 46px"></span
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      @media (prefers-reduced-motion: no-preference) {
        .ac-flash .ac-flash-c {
          animation: ac-flash-a var(--dur, 1000ms) both;
        }
      }
      @keyframes ac-flash-a {
        0%,
        50%,
        100% {
          opacity: 1;
        }
        25%,
        75% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "flash",
        name: "点滅",
        en: "Flash",
        cat: "操作への反応",
        kind: "motion",
        description:
          "透明度を素早く2回切り替えて、ぱっと目を引く動きです。とても強い合図なので、本当に気づいてほしいときだけに使います。",
        use: "録画中・ライブ中の印、見落とすと困る警告、検索で見つけた箇所の強調（1回だけ）。",
        params: [{ key: "dur", label: "時間", value: 1000, min: 300, max: 2500, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["動き", "<code>opacity 1 → 0 → 1 → 0 → 1</code>（0 / 25 / 50 / 75 / 100%）"],
          ["注意", "1秒に3回より速く点滅させない（光過敏の発作を防ぐ WCAG の基準）。ずっと点滅させない"],
          ["動きを減らす設定", "点滅をやめ、色を濃くするだけにする"],
          ["出典", '<a href="https://animate.style/" target="_blank" rel="noopener">Animate.css</a>'],
        ],
        loop: 2200,
      });
    </script>
  </body>
</html>
