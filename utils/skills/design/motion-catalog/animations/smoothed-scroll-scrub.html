            <div

                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 176px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-deep" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"

            </div>
            <div

            >
              <span class="sb-thumb sb-grad-aqua" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"

            </div>
            <div

              <span class="sb-thumb sb-grad-sky" style="width: 24px; height: 24px; border-radius: 8px"></span

            <div

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-smoothed-scroll-scrub .ac-smoothed-scroll-scrub-hd {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 14px;
        background: var(--bg);
        display: grid;
        gap: 6px;
      }
      .ac-smoothed-scroll-scrub .ac-smoothed-scroll-scrub-a,
      .ac-smoothed-scroll-scrub .ac-smoothed-scroll-scrub-b {
        position: absolute;
        left: 0;
        top: 1px;
        width: 28px;
        height: 28px;
        border-radius: 9px;
      }
      .ac-smoothed-scroll-scrub .ac-smoothed-scroll-scrub-a {
        background: var(--shape-idle);
      }
      .ac-smoothed-scroll-scrub .ac-smoothed-scroll-scrub-b {
        background: var(--blue);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "smoothed-scroll-scrub",
        name: "遅れて追うスクラブ",
        en: "Smoothed scroll scrubbing",
        cat: "スクロール",
        kind: "concept",
        description:
          "スクロール量に連動する動きを、スクロールにぴったり合わせず、少し遅れてなめらかに追いかけさせる考え方です。上はスクロールにそのまま合わせた動き、下は 0.6 秒ほど遅れて追う動きで、カクつかず柔らかく見えます。",
        use: "スクロールで進む図やイラスト、ストーリーテリング、パララックス、マウスホイールのカクつきを隠したいとき。",
        params: [{ key: "lag", label: "遅れ", value: 0.6, min: 0, max: 2, step: 0.1, unit: "s" }],
        spec: [
          [
            "計算",
            "毎フレーム <code>表示中の値 += (スクロールの進み具合 - 表示中の値) × (1 - e^(-経過時間 / 遅れ))</code>",
          ],
          ["GSAP", "ScrollTrigger の <code>scrub: 遅れの秒数</code>（<code>true</code> なら遅れなし）"],
          ["注意", "遅れが長すぎると、スクロールを止めた後も動き続けて酔いやすい。1秒以内に"],
          ["動きを減らす設定", "遅れをなくし、スクロールにそのまま合わせる"],
          [
            "出典",
            '<a href="https://gsap.com/docs/v3/Plugins/ScrollTrigger/" target="_blank" rel="noopener">GSAP ScrollTrigger</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const sc = stage.querySelector(".ac-smoothed-scroll-scrub-sc"),
              a = stage.querySelector(".ac-smoothed-scroll-scrub-a"),
              b = stage.querySelector(".ac-smoothed-scroll-scrub-b");
            let p = 0,
              last = 0,
              t0 = 0;
            return raf((t) => {
              const dt = t - last;
              last = t;
              const max = sc.scrollHeight - sc.clientHeight,
                k = (t % 4) / 4,
                wob = k < 0.5 ? Math.floor(k * 10) / 5 : Math.floor((1 - k) * 10) / 5;
              sc.scrollTop = max * Math.min(1, wob);
              const target = max > 0 ? sc.scrollTop / max : 0;
              p = rm || v.lag === 0 ? target : p + (target - p) * (1 - Math.exp(-dt / v.lag));
              a.style.transform = `translateX(${target * 144}px)`;
              b.style.transform = `translateX(${p * 144}px)`;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
