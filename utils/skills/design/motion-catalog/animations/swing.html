<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>振り子の揺れ（Swing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-swing" style="position: relative; width: 200px; height: 150px">
        <span
          style="position: absolute; left: 99px; top: 4px; width: 2px; height: 30px; background: var(--bar-strong)"
        ></span>
        <div class="ac-swing-c" style="position: absolute; left: 60px; top: 4px; width: 80px; padding-top: 30px">
          <div class="sb-card" style="padding: 12px; display: grid; gap: 8px; border-radius: 14px">
            <span class="sb-shape sb-shape--round sb-shape--on" style="width: 24px; height: 24px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 50px"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-swing .ac-swing-c {
        transform-origin: top center;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-swing .ac-swing-c {
          animation: ac-swing-a var(--dur, 1000ms) both;
        }
      }
      @keyframes ac-swing-a {
        20% {
          transform: rotate(15deg);
        }
        40% {
          transform: rotate(-10deg);
        }
        60% {
          transform: rotate(5deg);
        }
        80% {
          transform: rotate(-5deg);
        }
        100% {
          transform: rotate(0);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "swing",
        name: "振り子の揺れ",
        en: "Swing",
        cat: "操作への反応",
        kind: "motion",
        description:
          "上の一点を支点に、ぶら下がった札が左右に揺れて止まる動きです。軽く揺れるので、ほどよく目を引き、ぶら下がっている物らしさが出ます。",
        use: "値札・タグ、ベルの通知、吊り下げ型のバナー、新着のお知らせ。",
        params: [{ key: "dur", label: "時間", value: 1000, min: 300, max: 2500, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["動き", "<code>rotate 15° → -10° → 5° → -5° → 0</code>（20% ごと）"],
          ["支点", "<code>transform-origin: top center</code>（吊るしている点）"],
          ["動きを減らす設定", "動きをやめ、色や記号の変化だけで知らせる"],
          ["出典", '<a href="https://animate.style/" target="_blank" rel="noopener">Animate.css</a>'],
        ],
        loop: 2200,
      });
    </script>
  </body>
</html>
