<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>データへのなめらかなズーム（Smooth data zoom） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-smooth-data-zoom" style="position: relative; width: 220px; height: 150px">
        <svg
          class="ac-smooth-data-zoom-s"
          width="220"
          height="150"
          viewBox="0 0 220 150"
          style="position: absolute; inset: 0; overflow: visible"
        ></svg>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "smooth-data-zoom",
        name: "データへのなめらかなズーム",
        en: "Smooth data zoom",
        cat: "データの可視化",
        kind: "motion",
        description:
          "折れ線グラフの一部の範囲を選ぶと、選んだ範囲がグラフ全体の幅まで滑らかに引き伸ばされて拡大され、もう一度押すと全体に戻る動きです。どこを拡大したのかを見失わずに、細かい変化を確かめられます。",
        use: "株価・アクセス数などの時系列グラフ、地図、科学データ、ダッシュボードの詳細表示。",
        params: [{ key: "dur", label: "時間", value: 800, min: 300, max: 1500, step: 50, unit: "ms" }],
        spec: [
          [
            "仕組み",
            "表示する範囲（x の最小・最大）を補間し、毎フレーム折れ線を描き直す（D3 の <code>zoom</code> と <code>interpolateZoom</code>）",
          ],
          ["選択", "拡大する範囲を先に薄い青の帯で示してから拡大する"],
          ["時間", "in-out 600–900ms。目盛りも同時に付け直す（目盛りの付け直し を参照）"],
          ["動きを減らす設定", "補間をやめ、新しい状態の図をすぐ表示する（またはフェードで切り替える）"],
          ["出典", '<a href="https://d3js.org/d3-zoom" target="_blank" rel="noopener">D3 zoom</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const svg = stage.querySelector(".ac-smooth-data-zoom-s");
            const NS = "http://www.w3.org/2000/svg",
              el = (n, a = {}, p) => {
                const e = document.createElementNS(NS, n);
                for (const k in a) e.setAttribute(k, a[k]);
                (p || svg).appendChild(e);
                return e;
              };
            const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
            const tween = (ms, fn) => {
              const t0 = performance.now();
              let id;
              const f = (now) => {
                const k = Math.min(1, (now - t0) / ms);
                fn(rm ? 1 : ease(k));
                if (k < 1) id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => cancelAnimationFrame(id);
            };
            const data = Array.from(
              { length: 80 },
              (_, i) => 60 + Math.sin(i / 5) * 18 + Math.sin(i / 1.7) * 6 + (i % 7) * 1.5,
            );
            el("line", { x1: 14, x2: 210, y1: 132, y2: 132, stroke: "var(--line)" });
            const band = el("rect", { y: 14, height: 118, fill: "var(--blue-soft)", opacity: 0 }),
              path = el("path", { fill: "none", stroke: "var(--blue)", "stroke-width": 2, "stroke-linejoin": "round" });
            const sx = (i, a, b) => 14 + ((i - a) / (b - a)) * 196;
            const draw = (a, b) =>
              path.setAttribute(
                "d",
                data.map((d, i) => `${i ? "L" : "M"}${sx(i, a, b).toFixed(1)},${(140 - d).toFixed(1)}`).join(" "),
              );
            let A = 0,
              B = 79,
              stopT = null;
            draw(A, B);
            svg.style.clipPath = "inset(0 8px 0 12px)";
            const to = (a1, b1) => () => {
              const a0 = A,
                b0 = B;
              band.getAnimations().forEach((a) => a.cancel());
              band.setAttribute("opacity", 0);
              stopT && stopT();
              stopT = tween(v.dur, (k) => {
                A = a0 + (a1 - a0) * k;
                B = b0 + (b1 - b0) * k;
                draw(A, B);
              });
            };
            const mark = () => {
              band.setAttribute("x", sx(30, A, B));
              band.setAttribute("width", sx(50, A, B) - sx(30, A, B));
              band.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, fill: "forwards" });
            };
            const stop = seq(5000, [
              [600, mark],
              [1200, to(30, 50)],
              [3400, to(0, 79)],
            ]);
            return () => {
              stop();
              stopT && stopT();
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
