<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>絹のうねり（Silk waves） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-silk-waves"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas
          width="64"
          height="44"
          style="position: absolute; left: 0; top: 0; width: 220px; height: 150px"
        ></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "silk-waves",
        name: "絹のうねり",
        en: "Silk waves",
        cat: "背景",
        kind: "motion",
        description:
          "光沢のある絹の布が、ゆるやかな折り目を作りながら波打つような背景です。明るい筋と影がなめらかに流れます。プレビューは画素ごとの陰影を粗い解像度で計算した近い形です。",
        use: "プレミアム商品・ファッション・美容のヒーロー、ブランドの背景、ログイン画面。",
        params: [{ key: "speed", label: "速さ", value: 0.5, min: 0.1, max: 2, step: 0.1, unit: "" }],
        spec: [
          [
            "陰影",
            "画素ごとに、布の高さの波（<code>sin</code> の重ね合わせ）の傾きから明るさを決める（傾きが光の向きに近いほど明るい筋になる）",
          ],
          ["色", "1色の濃淡（ここでは blue の明暗）にすると絹らしい"],
          ["描画", "本来は WebGL のシェーダー。canvas なら粗い解像度で計算して引き伸ばす"],
          [
            "控えめに",
            "背景は主役ではない。コントラストと速さを抑え、前景の文字が読めることを優先する。画面外・非表示のときは止める",
          ],
          ["動きを減らす設定", "背景の動きを止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/backgrounds/silk" target="_blank" rel="noopener">React Bits: Silk</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              g = cv.getContext("2d"),
              w = 64,
              h = 44,
              img = g.createImageData(w, h);
            const draw = (t) => {
              for (let y = 0; y < h; y++)
                for (let x = 0; x < w; x++) {
                  const u = (x / w) * 6,
                    q = (y / h) * 4,
                    d = Math.cos(u + Math.sin(q * 1.3 + t) * 1.2 + t * 0.6) * 0.8 + Math.cos(q * 2 - t * 0.4) * 0.3;
                  const b = Math.pow((d + 1.1) / 2.2, 1.6),
                    i = (y * w + x) * 4;
                  img.data[i] = 30 + 170 * b;
                  img.data[i + 1] = 70 + 160 * b;
                  img.data[i + 2] = 170 + 85 * b;
                  img.data[i + 3] = 255;
                }
              g.putImageData(img, 0, 0);
            };
            if (rm) {
              draw(0);
              return null;
            }
            let last = -1;
            return raf((t) => {
              if (t - last < 1 / 30) return;
              last = t;
              draw(t * v.speed);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
