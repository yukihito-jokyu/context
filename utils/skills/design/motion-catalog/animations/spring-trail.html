<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ばねの連鎖（Spring trail） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-spring-trail" style="position: relative; width: 220px; height: 140px"></div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "spring-trail",
        name: "ばねの連鎖",
        en: "Spring trail",
        cat: "スプリング",
        kind: "motion",
        description:
          "先頭の要素を、次の要素がばねで追いかけ、その次がさらに追いかける…と動きが後ろへ伝わっていく動きです。しっぽのように遅れて付いてくるので、ひとかたまりの生き物のような流れが出ます。",
        use: "カーソルの後を追う飾り、リストの連続した登場、ロゴやアイコンの遊び。",
        params: [
          { key: "k", label: "ばねの硬さ", value: 120, min: 20, max: 400, step: 10, unit: "" },
          { key: "c", label: "減衰", value: 14, min: 2, max: 40, step: 1, unit: "" },
          { key: "n", label: "数", value: 6, min: 2, max: 10, step: 1, unit: "" },
        ],
        spec: [
          [
            "計算",
            "i 番目の点は i-1 番目の点を目標にして、ばね（硬さ・減衰）で追いかける。毎フレーム先頭から順に更新する",
          ],
          ["見た目", "後ろほど小さく・薄くする"],
          ["ライブラリ", "React Spring の <code>useTrail</code>、Motion の <code>useSpring</code> を連結しても作れる"],
          ["動きを減らす設定", "追いかけをやめ、先頭だけを表示する"],
          [
            "出典",
            '<a href="https://www.react-spring.dev/docs/components/use-trail" target="_blank" rel="noopener">React Spring: useTrail</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const box = stage.firstElementChild,
              pts = [];
            for (let i = 0; i < v.n; i++) {
              const d = document.createElement("span");
              const s = 26 - (i * 16) / v.n;
              d.style.cssText = `position:absolute;left:0;top:0;width:${s}px;height:${s}px;margin:${-s / 2}px 0 0 ${-s / 2}px;border-radius:50%;background:var(--${i ? "sky" : "blue"});opacity:${1 - (i * 0.6) / v.n}`;
              box.prepend(d);
              pts.push({ d, x: 110, y: 70, vx: 0, vy: 0 });
            }
            if (rm) {
              pts.forEach((p, i) => {
                p.d.style.display = i ? "none" : "";
                p.d.style.transform = "translate(110px, 70px)";
              });
              return null;
            } // 動きを減らす設定：先頭だけを止めて表示
            let last = 0;
            return raf((t) => {
              const dt = Math.min(0.033, t - last);
              last = t;
              const lx = 110 + 85 * Math.sin(t * 1.3),
                ly = 70 + 45 * Math.sin(t * 2.6);
              pts.forEach((p, i) => {
                if (i === 0) {
                  p.x = lx;
                  p.y = ly;
                } else {
                  const q = pts[i - 1];
                  p.vx += (v.k * (q.x - p.x) - v.c * p.vx) * dt;
                  p.vy += (v.k * (q.y - p.y) - v.c * p.vy) * dt;
                  p.x += p.vx * dt;
                  p.y += p.vy * dt;
                }
                p.d.style.transform = `translate(${p.x}px, ${p.y}px)`;
              });
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
