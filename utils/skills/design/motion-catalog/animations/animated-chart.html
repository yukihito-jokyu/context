<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アニメーションするグラフ（Animated Chart） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-animated-chart"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div class="sb-card" style="padding: 16px; width: 190px; box-sizing: border-box">
          <div
            style="display: flex; align-items: flex-end; gap: 12px; height: 96px; border-bottom: 2px solid var(--bar)"
            aria-hidden="true"
          >
            <span class="ac-animated-chart-b sb-grad-aqua" style="height: 45%; --i: 0"></span
            ><span class="ac-animated-chart-b sb-grad-sky" style="height: 70%; --i: 1"></span
            ><span class="ac-animated-chart-b sb-grad-sky" style="height: 55%; --i: 2"></span
            ><span class="ac-animated-chart-b sb-grad-deep" style="height: 90%; --i: 3"></span
            ><span class="ac-animated-chart-b sb-grad-sky" style="height: 65%; --i: 4"></span>
          </div>
          <span
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip-path: inset(50%);
              white-space: nowrap;
            "
            >A: 45%、B: 70%、C: 55%、D: 90%、E: 65%</span
          >
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-animated-chart .ac-animated-chart-b {
        flex: 1;
        border-radius: 8px 8px 0 0;
        transform-origin: bottom;
        animation: ac-animated-chart-grow var(--dur, 600ms) cubic-bezier(0.22, 1, 0.36, 1)
          calc(var(--i) * var(--step, 80ms)) both;
      }
      @keyframes ac-animated-chart-grow {
        from {
          transform: scaleY(0);
        }
        to {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-animated-chart-grow {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "animated-chart",
        name: "アニメーションするグラフ",
        en: "Animated Chart",
        cat: "仕上げ・効果",
        kind: "motion",
        description: "グラフの棒が下から順に伸びていく表現です。値の大小を、伸びる長さと順番で体感的に伝えられます。",
        use: "ダッシュボード、レポート、ランディングページの実績、インフォグラフィック。",
        params: [
          { key: "dur", label: "1本の時間", value: 600, min: 200, max: 1200, step: 50, unit: "ms" },
          { key: "step", label: "ずらす間隔", value: 80, min: 0, max: 200, step: 10, unit: "ms" },
        ],
        total: (p) => p["step"] * 4 + p["dur"],
        spec: [
          [
            "動き",
            "各棒 <code>scaleY(0 → 1)</code>（<code>transform-origin: bottom</code>）｜out <code>cubic-bezier(0.22, 1, 0.36, 1)</code>｜<code>animation-delay: 順番 × 間隔</code>",
          ],
          ["きっかけ", "グラフが画面に入ったとき（スクロールリビールと組み合わせる）"],
          ["実装", "Recharts・Chart.js・ECharts。項目名と値はテキストで、複数系列は表でも示す"],
          ["動きを減らす設定", "伸びる動きをやめ、最終の形を透明度で表示する"],
          ["出典", "ChatGPT との会話（演出・構成の語彙）"],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
