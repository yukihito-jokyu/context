<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ジグザグに進むローダー（Zigzag loader） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-zigzag-loader"
        style="position: relative; width: 200px; height: 130px; display: grid; place-items: center"
      >
        <div style="position: relative; width: 140px; height: 50px">
          <svg class="ac-zigzag-loader-s" width="140" height="50"><path d="M10,40 L40,10 L70,40 L100,10 L130,40" /></svg
          ><span class="ac-zigzag-loader-d"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-zigzag-loader .ac-zigzag-loader-s {
        overflow: visible;
      }
      .ac-zigzag-loader .ac-zigzag-loader-s path {
        fill: none;
        stroke: var(--blue-soft);
        stroke-width: 3;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .ac-zigzag-loader .ac-zigzag-loader-d {
        position: absolute;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
        offset-path: path("M10,40 L40,10 L70,40 L100,10 L130,40");
        offset-rotate: 0deg;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-zigzag-loader .ac-zigzag-loader-d {
          animation: ac-zigzag-loader-go var(--dur, 1800ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-zigzag-loader-go {
        from {
          offset-distance: 0%;
        }
        to {
          offset-distance: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-zigzag-loader .ac-zigzag-loader-d {
          offset-distance: 50%;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "zigzag-loader",
        name: "ジグザグに進むローダー",
        en: "Zigzag loader",
        cat: "読み込み・進捗",
        kind: "motion",
        description:
          "小さな点がジグザグの折れ線の上を、角で向きを変えながら行ったり来たりするローダーです。止まらず進み続けるリズムが、作業中の気配を伝えます。",
        use: "ボタン・カード・画面の読み込み中、待ち時間の短い処理。",
        params: [{ key: "dur", label: "周期", value: 1800, min: 300, max: 4000, step: 50, unit: "ms" }],
        spec: [
          [
            "動き",
            "折れ線の <code>offset-path</code> に沿って <code>offset-distance: 0 → 100%</code>｜in-out｜往復（alternate）",
          ],
          ["角", "角で一瞬ためるなら、角ごとの区間に分けて各区間を in-out にする"],
          [
            "使いどころ",
            "1秒以上かかりそうなときに出す。すぐ終わる処理では出さない（ちらつく）。数秒以上なら進捗の分かる表示を使う",
          ],
          [
            "動きを減らす設定",
            "回転や移動をやめ、ゆっくりした透明度の明滅（または静止した「読み込み中」の表示）にする",
          ],
          ["出典", '<a href="https://css-loaders.com/" target="_blank" rel="noopener">CSS Loaders</a>'],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
