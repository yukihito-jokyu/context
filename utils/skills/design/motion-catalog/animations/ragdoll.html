<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ラグドール（Ragdoll (handoff / active ragdoll)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-ragdoll"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "ragdoll",
        name: "ラグドール",
        en: "Ragdoll (handoff / active ragdoll)",
        cat: "キャラクター",
        kind: "motion",
        description:
          "攻撃を受けた瞬間などに、それまでの決まったアニメーションから、関節でつないだ物理の人形（ラグドール）に体を引き渡し、重力と衝突で崩れ落ちさせる方法です。毎回違う倒れ方になり、地形にも自然に合います。プレビューは 2D の簡単な物理で近い形にしています。",
        use: "アクションゲームの倒れ・吹き飛び、落下するキャラクター、物理で揺れる飾り。",
        params: [],
        spec: [
          [
            "引き渡し",
            "その瞬間のポーズと各部の速さをそのまま物理の体に移す（いきなり脱力させると不自然）。攻撃の向きに力を加える",
          ],
          [
            "アクティブラグドール",
            "関節にモーターを付け、決まったポーズへ戻ろうとする力をかけ続けると、よろめきながら踏ん張る動きになる",
          ],
          [
            "本格的に",
            "物理エンジンの関節（Unity の Character Joint、Unreal の Physics Asset）。起き上がりはポーズを合わせてアニメーションへ戻す",
          ],
          ["動きを減らす設定", "動きを止め、代表的なポーズの静止画にする"],
          [
            "出典",
            '<a href="https://opsive.com/support/documentation/ultimate-character-controller/character/abilities/included-abilities/ragdoll/" target="_blank" rel="noopener">opsive.com（ragdoll）</a>、<a href="https://www.unrealengine.com/tech-blog/download-the-latest-game-animation-sample-project-now-updated-for-ue-5-8" target="_blank" rel="noopener">unrealengine.com（download-the-latest-game-ani）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            const lp = (a, b, k) => {
              const o = {};
              for (const key in a) o[key] = a[key] + (b[key] - a[key]) * k;
              return o;
            };
            const ez = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
              cl = (u) => Math.min(1, Math.max(0, u));
            const txt = (s, x, y, c = col("ink-muted"), al = "left") => {
              g.fillStyle = c;
              g.font = "600 10px sans-serif";
              g.textAlign = al;
              g.fillText(s, x, y);
            };
            const GUARD = { lean: 0.05, t1: 0.35, s1: -0.3, t2: -0.3, s2: -0.1, u1: 2.2, f1: 1.6, u2: 2.4, f2: 1.7 };
            const L = [
                [0, -46],
                [0, -30],
                [0, -12],
                [-6, 6],
                [6, 6],
                [-7, 24],
                [8, 24],
                [-14, -26],
                [14, -26],
              ],
              E = [
                [0, 1],
                [1, 2],
                [2, 3],
                [2, 4],
                [3, 5],
                [4, 6],
                [1, 7],
                [1, 8],
                [0, 2],
              ];
            let P0,
              Q,
              t0 = -9;
            const R0 = E.map(([a, b]) => Math.hypot(L[a][0] - L[b][0], L[a][1] - L[b][1]));
            const init = () => {
              P0 = L.map(([x, y]) => [80 + x, 94 + y]);
              Q = P0.map(([x, y], i) => [x - (i < 3 ? 1.8 : 0.6), y + (i < 2 ? 0.6 : 0)]);
            };
            const frame = (t) => {
              if (t - t0 > 4) {
                init();
                t0 = t;
              }
              const T = t - t0;
              if (T > 0.8) {
                for (let i = 0; i < P0.length; i++) {
                  const p = P0[i],
                    q = Q[i],
                    vx = (p[0] - q[0]) * 0.99,
                    vy = (p[1] - q[1]) * 0.99;
                  q[0] = p[0];
                  q[1] = p[1];
                  p[0] += vx;
                  p[1] += vy + 0.25;
                }
                for (let k = 0; k < 6; k++) {
                  E.forEach(([a, b], i) => {
                    const A = P0[a],
                      B = P0[b],
                      dx = B[0] - A[0],
                      dy = B[1] - A[1],
                      d = Math.hypot(dx, dy) || 1,
                      f = ((d - R0[i]) / d) * 0.5;
                    A[0] += dx * f;
                    A[1] += dy * f;
                    B[0] -= dx * f;
                    B[1] -= dy * f;
                  });
                  for (let i = 0; i < P0.length; i++) {
                    const p = P0[i];
                    if (p[1] > 117) {
                      p[1] = 117;
                      Q[i][0] = p[0] - (p[0] - Q[i][0]) * 0.7;
                    }
                    p[0] = Math.min(W - 6, Math.max(6, p[0]));
                  }
                }
              } else if (T <= 0.8) init();
              g.clearRect(0, 0, W, H);
              ground(118, 0);
              const c = T > 0.8 ? col("cobalt") : col("blue");
              E.slice(0, 8).forEach(([a, b]) => line([P0[a], P0[b]], a < 3 && b < 3 ? 10 : 6, c));
              dot(P0[0][0], P0[0][1] - 4, 8, c);
              if (!rm && T > 0.75 && T < 0.9) {
                g.strokeStyle = "rgba(255,190,60,.9)";
                g.lineWidth = 2;
                g.beginPath();
                g.arc(P0[1][0] + 10, P0[1][1], 8, 0, TAU);
                g.stroke();
              }
              txt(T > 0.8 ? "物理へ引き渡し" : "アニメーション", 8, 16);
            };
            if (rm) {
              init();
              t0 = 0;
              for (let i = 0; i < 40; i++) frame(0.81 + i / 60);
              return null;
            } // 動きを減らす設定：引き渡しから少し後の姿勢を一度だけ描く
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
