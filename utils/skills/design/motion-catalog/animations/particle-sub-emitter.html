<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>粒から生まれる粒（Particle sub-emission） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-particle-sub-emitter"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "particle-sub-emitter",
        name: "粒から生まれる粒",
        en: "Particle sub-emission",
        cat: "移動・変形",
        kind: "motion",
        description:
          "飛んでいる粒が消える・ぶつかる瞬間に、その場所から別の粒の群れ（サブエミッター）を生み出す仕組みです。花火が頂点ではじけて火花になり、火花が地面でまた小さくはじけます。",
        use: "花火・爆発・着弾の演出、雨粒が地面ではねる表現、お祝いの演出。",
        params: [{ key: "n", label: "はじけたときの粒の数", value: 30, min: 8, max: 80, step: 1, unit: "個" }],
        spec: [
          [
            "仕組み",
            "親の粒に「死んだとき」「ぶつかったとき」「生きている間」のきっかけと、そのとき生み出す子の粒の設定（数・速さ・寿命・色）を持たせる",
          ],
          ["見せ方", "親と子で色や大きさを変える。子の速さは親の速さを少し受け継ぐと自然になる"],
          [
            "各環境では",
            "Unity の Particle System の Sub Emitters、VFX Graph の GPU Event、Unreal Niagara の Event Handler",
          ],
          ["動きを減らす設定", "粒の動きを止め、はじけた瞬間の静止画にする"],
          [
            "出典",
            '<a href="https://docs.unity.com/en-us/engine/6000.7/manual/visual-effects/particle-systems/particle-system-modules/part-sys-sub-emit-module" target="_blank" rel="noopener">docs.unity.com（part-sys-sub-emit-module）</a>、<a href="https://dev.epicgames.com/documentation/en-us/unreal-engine/effects-content-examples?application_version=4.27" target="_blank" rel="noopener">dev.epicgames.com（effects-content-examples）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const R = [],
              S0 = [],
              D = [];
            let last = 0,
              next = 0;
            if (rm) {
              for (let i = 0; i < 30; i++) {
                const a = (i / 30) * TAU;
                S0.push({ x: 110 + cos(a) * 34, y: 50 + sin(a) * 34, vx: 0, vy: 0, l: 1 });
              }
            }
            return raf((t) => {
              const dt = Math.min(0.03, t - last);
              last = t;
              if (!rm && t > next) {
                R.push({
                  x: 50 + rnd() * 120,
                  y: H,
                  vx: (rnd() - 0.5) * 20,
                  vy: -150 - rnd() * 30,
                  l: 0.8 + rnd() * 0.3,
                });
                next = t + 0.9;
              }
              if (!rm) {
                for (let i = R.length - 1; i >= 0; i--) {
                  const r = R[i];
                  r.vy += 120 * dt;
                  r.x += r.vx * dt;
                  r.y += r.vy * dt;
                  r.l -= dt;
                  if (r.l <= 0) {
                    for (let k = 0; k < v.n; k++) {
                      const a = rnd() * TAU,
                        s = 40 + rnd() * 50;
                      S0.push({
                        x: r.x,
                        y: r.y,
                        vx: cos(a) * s + r.vx,
                        vy: sin(a) * s + r.vy * 0.3,
                        l: 1.2 + rnd() * 0.5,
                      });
                    }
                    R.splice(i, 1);
                  }
                }
                for (let i = S0.length - 1; i >= 0; i--) {
                  const s = S0[i];
                  s.vy += 90 * dt;
                  s.x += s.vx * dt;
                  s.y += s.vy * dt;
                  s.l -= dt;
                  if (s.y > 140) {
                    for (let k = 0; k < 3; k++)
                      D.push({ x: s.x, y: 140, vx: (rnd() - 0.5) * 40, vy: -30 - rnd() * 30, l: 0.4 });
                    S0.splice(i, 1);
                    continue;
                  }
                  if (s.l <= 0) S0.splice(i, 1);
                }
                for (let i = D.length - 1; i >= 0; i--) {
                  const d = D[i];
                  d.vy += 200 * dt;
                  d.x += d.vx * dt;
                  d.y += d.vy * dt;
                  d.l -= dt;
                  if (d.l <= 0) D.splice(i, 1);
                }
              }
              g.fillStyle = col("navy");
              g.fillRect(0, 0, W, H);
              g.fillStyle = "#1c2f6b";
              g.fillRect(0, 140, W, 10);
              for (const r of R) dot(r.x, r.y, 2.2, "#fff");
              for (const s of S0) dot(s.x, s.y, 1.6, `rgba(147,197,253,${Math.min(1, s.l)})`);
              for (const d of D) dot(d.x, d.y, 1.1, `rgba(255,210,120,${d.l / 0.4})`);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
