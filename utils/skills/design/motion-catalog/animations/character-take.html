<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>テイク（Take / Double take） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-character-take" style="position: relative; width: 220px; height: 150px">
        <div class="ac-character-take-hd">
          <i class="ac-character-take-e ac-character-take-l"></i><i class="ac-character-take-e ac-character-take-r"></i
          ><i class="ac-character-take-m"></i>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-character-take .ac-character-take-hd {
        position: absolute;
        left: 65px;
        top: 30px;
        width: 90px;
        height: 90px;
        border-radius: 46% 46% 44% 44%;
        background: linear-gradient(160deg, var(--ice), var(--sky));
        box-shadow: inset -8px -10px 0 rgba(37, 99, 235, 0.12);
      }
      .ac-character-take .ac-character-take-e {
        position: absolute;
        top: 32px;
        width: 10px;
        height: 14px;
        border-radius: 5px;
        background: var(--navy);
      }
      .ac-character-take .ac-character-take-l {
        left: 26px;
      }
      .ac-character-take .ac-character-take-r {
        right: 26px;
      }
      .ac-character-take .ac-character-take-m {
        position: absolute;
        left: 50%;
        top: 60px;
        width: 22px;
        height: 4px;
        margin-left: -11px;
        border-radius: 3px;
        background: var(--navy);
      }
      .ac-character-take .ac-character-take-hd {
        transform-origin: 50% 100%;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-character-take .ac-character-take-hd {
          animation: ac-character-take-h var(--dur, 2400ms) cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
      }
      .ac-character-take .ac-character-take-e {
        animation: ac-character-take-e var(--dur, 2400ms) cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .ac-character-take .ac-character-take-m {
        animation: ac-character-take-m var(--dur, 2400ms) cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes ac-character-take-h {
        0%,
        30% {
          transform: none;
        }
        38% {
          transform: scale(1.12, 0.84);
        }
        43% {
          transform: scale(0.86, 1.32) translateY(-14px);
        }
        47% {
          transform: scale(0.92, 1.2) translateY(-10px);
        }
        49% {
          transform: scale(0.9, 1.22) translateY(-10px) rotate(1deg);
        }
        51% {
          transform: scale(0.9, 1.22) translateY(-10px) rotate(-1deg);
        }
        64% {
          transform: scale(0.9, 1.22) translateY(-10px);
        }
        78%,
        100% {
          transform: none;
        }
      }
      @keyframes ac-character-take-e {
        0%,
        30% {
          transform: none;
        }
        36%,
        38% {
          transform: scaleY(0.15);
        }
        43%,
        64% {
          transform: scale(1.6);
        }
        78%,
        100% {
          transform: none;
        }
      }
      @keyframes ac-character-take-m {
        0%,
        38% {
          height: 4px;
          width: 22px;
          margin-left: -11px;
          border-radius: 3px;
        }
        43%,
        64% {
          height: 18px;
          width: 16px;
          margin-left: -8px;
          border-radius: 50%;
        }
        78%,
        100% {
          height: 4px;
          width: 22px;
          margin-left: -11px;
          border-radius: 3px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-character-take .ac-character-take-e,
        .ac-character-take .ac-character-take-m {
          animation-timing-function: step-end;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "character-take",
        name: "テイク",
        en: "Take / Double take",
        cat: "キャラクター",
        kind: "motion",
        description:
          "キャラクターが何かに気づいて驚く瞬間を、いったん縮んでため（予備動作）、次に大きく伸び上がって目や口を大きくし、少し止めてから元に戻る、という流れで誇張して見せる演技です。一度目をそらしてから二度見する「ダブルテイク」もあります。",
        use: "マスコットの驚き・発見のリアクション、エラーや成功の演出、ゲームのイベント、チュートリアルのキャラクター。",
        params: [{ key: "dur", label: "ひと回りの時間", value: 2400, min: 1200, max: 5000, step: 100, unit: "ms" }],
        spec: [
          [
            "流れ",
            "ふつう → ため（<code>scale(1.1, 0.85)</code>、目を閉じる 100ms）→ 伸び（<code>scale(0.85, 1.3)</code>、目と口を大きく、80ms）→ 止め（300〜500ms、小さく震える）→ 戻る",
          ],
          ["アクセント", "伸びの瞬間をいちばん速く短く。止めの時間で気持ちが伝わる"],
          ["ダブルテイク", "何気なく見る → そらす → 0.3 秒後に素早く見直してからテイク"],
          ["動きを減らす設定", "誇張の動きをやめ、表情の切り替えだけにする"],
          [
            "出典",
            '<a href="https://openlibrary.org/books/OL24424817M/The_animator%27s_survival_kit" target="_blank" rel="noopener">The Animator\'s Survival Kit（目次）</a>、<a href="https://animatorschecklist.com/en/glossary/" target="_blank" rel="noopener">The Animator\'s Checklist: Glossary</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
