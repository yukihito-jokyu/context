<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>モンタージュ（Montage sequence） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-montage-sequence"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "montage-sequence",
        name: "モンタージュ",
        en: "Montage sequence",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "短いショットを次々とつないで、長い時間の流れや過程（練習・成長・旅）を数十秒に縮めて見せる編集です。1 つ 1 つのショットは短く、音楽に合わせてテンポよく切り替えます。",
        use: "成長・上達の過程、プロダクトの作り方、1 年の振り返り、旅の記録、オンボーディングの機能紹介。",
        params: [{ key: "shot", label: "1ショットの長さ", value: 700, min: 300, max: 1500, step: 50, unit: "ms" }],
        spec: [
          ["作り方", "同じ流れ（時間・成長）の中から、変化の分かる瞬間だけを選び、1 ショット 0.5〜2 秒でつなぐ"],
          [
            "つなぎ方",
            "カットかディゾルブ。音楽の拍に合わせて切ると、まとまって見える。終わりに向けて少しずつ短くすると盛り上がる",
          ],
          ["UI では", "機能の紹介や実績の振り返りを、短いカードの連続でテンポよく見せる"],
          ["動きを減らす設定", "切り替えをゆっくりしたクロスフェードにし、映像の中の動きを止める"],
          [
            "出典",
            '<a href="https://www.nyfa.edu/student-resources/a-beginners-guide-to-film-editing-vocabulary/" target="_blank" rel="noopener">nyfa.edu（a-beginners-guide-to-film-ed）</a>、<a href="https://filmglossary.ccnmtl.columbia.edu/term/editing/" target="_blank" rel="noopener">filmglossary.ccnmtl.columbia.edu（editing）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const VH = 106;
            const view = (c1, c2) => {
              const gr = g.createLinearGradient(0, 0, 0, VH);
              gr.addColorStop(0, c1);
              gr.addColorStop(1, c2);
              g.fillStyle = gr;
              g.fillRect(0, 0, W, VH);
            };
            const hill = (c, y, r, x = 110) => {
              g.fillStyle = c;
              g.beginPath();
              g.ellipse(x, y + r * 0.9, r * 1.6, r, 0, 0, TAU);
              g.fill();
            };
            const person = (x, y, s, c, dir = 1) => {
              g.fillStyle = c;
              g.beginPath();
              g.roundRect(x - 9 * s, y - 22 * s, 18 * s, 26 * s, 8 * s);
              g.fill();
              g.beginPath();
              g.arc(x, y - 30 * s, 8 * s, 0, TAU);
              g.fill();
              g.fillStyle = "#fff";
              g.beginPath();
              g.arc(x + dir * 4 * s, y - 31 * s, 1.6 * s, 0, TAU);
              g.fill();
            };
            const label = (s, x = 8, y = 14) => {
              g.font = "600 9px sans-serif";
              g.textAlign = "left";
              const w = g.measureText(s).width + 8;
              g.fillStyle = "rgba(15,37,99,.55)";
              g.beginPath();
              g.roundRect(x, y - 10, w, 13, 4);
              g.fill();
              g.fillStyle = "#fff";
              g.fillText(s, x + 4, y);
            };
            const bubble = (s, x, y) => {
              g.font = "600 10px sans-serif";
              g.textAlign = "center";
              const w = g.measureText(s).width + 12;
              g.fillStyle = "#fff";
              g.beginPath();
              g.roundRect(x - w / 2, y - 12, w, 17, 7);
              g.fill();
              g.fillStyle = col("navy");
              g.fillText(s, x, y + 1);
            };
            const tl = (clips, ph, total, audio = false) => {
              g.fillStyle = "#fff";
              g.fillRect(0, VH, W, H - VH);
              g.font = "600 8px sans-serif";
              g.textAlign = "left";
              g.fillStyle = col("ink-muted");
              g.fillText("映像", 4, VH + 15);
              if (audio) g.fillText("音", 4, VH + 32);
              const X = (s) => 28 + (s / total) * 184;
              for (const [tr, a, b, c, lab] of clips) {
                const y = VH + (tr ? 24 : 6);
                g.fillStyle = c;
                g.beginPath();
                g.roundRect(X(a) + 0.5, y, X(b) - X(a) - 1, tr ? 11 : 13, 3);
                g.fill();
                if (lab) {
                  g.fillStyle = "#fff";
                  g.fillText(lab, X(a) + 4, y + (tr ? 8.5 : 9.5));
                }
              }
              const x = X(ph);
              g.fillStyle = "#e5484d";
              g.fillRect(x - 0.75, VH + 2, 1.5, H - VH - 4);
            };
            const raf0 = raf,
              xf = (() => {
                if (!rm) return () => {};
                const mk = () => {
                    const c = document.createElement("canvas");
                    c.width = cv.width;
                    c.height = Math.ceil(VH * dpr);
                    return [c, c.getContext("2d")];
                  },
                  [pc, pg] = mk(),
                  [nc, ng] = mk();
                let lt = null;
                return () => {
                  const now = performance.now(),
                    dt = lt === null ? null : now - lt;
                  lt = now;
                  ng.clearRect(0, 0, nc.width, nc.height);
                  ng.drawImage(cv, 0, 0);
                  if (dt !== null) {
                    g.save();
                    g.setTransform(1, 0, 0, 1, 0, 0);
                    g.globalAlpha = 1;
                    g.drawImage(pc, 0, 0);
                    g.globalAlpha = 1 - Math.exp(-dt / 70);
                    g.drawImage(nc, 0, 0);
                    g.restore();
                  }
                  pg.clearRect(0, 0, pc.width, pc.height);
                  pg.drawImage(cv, 0, 0);
                };
              })();
            {
              const raf = (fn) =>
                raf0((t) => {
                  fn(t);
                  xf();
                });
              const draw = (k, f) => {
                view("#eaf2ff", "#dbeafe");
                g.fillStyle = "#c08a5a";
                g.fillRect(0, 90, W, 16);
                const h = [6, 18, 34, 54, 74][k];
                g.strokeStyle = "#2f8f5b";
                g.lineWidth = 3 + k;
                g.beginPath();
                g.moveTo(110, 90);
                g.lineTo(110, 90 - h);
                g.stroke();
                g.fillStyle = "#3fae6d";
                for (let i = 0; i < k * 2 + 1; i++) {
                  const y = 90 - h * (0.4 + (0.6 * i) / (k * 2 + 1)),
                    s = i % 2 ? 1 : -1;
                  g.beginPath();
                  g.ellipse(110 + s * (8 + k * 3), y, 6 + k * 2, 3 + k, s * 0.4, 0, TAU);
                  g.fill();
                }
                if (k === 4) {
                  g.fillStyle = "#3fae6d";
                  g.beginPath();
                  g.arc(110, 90 - h, 26, 0, TAU);
                  g.fill();
                }
                label(["1日目", "1週間", "1か月", "半年", "1年"][k]);
              };
              return raf((t) => {
                const M = v.shot / 1000,
                  T = t % (5 * M + 1),
                  k = Math.min(4, Math.floor(T / M)),
                  f = (T % M) / M;
                draw(k, f);
                if (!rm && f < 0.15 && k > 0 && T < 5 * M) {
                  g.globalAlpha = 1 - f / 0.15;
                  draw(k - 1, 1);
                  g.globalAlpha = 1;
                }
                tl(
                  [0, 1, 2, 3, 4].map((i) => [0, i * M, (i + 1) * M, i % 2 ? col("sky") : col("blue"), ""]),
                  Math.min(T, 5 * M),
                  5 * M,
                );
              });
            }
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
