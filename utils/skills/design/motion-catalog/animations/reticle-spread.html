<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>広がる照準（Dynamic aim reticle spread） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-reticle-spread"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "reticle-spread",
        name: "広がる照準",
        en: "Dynamic aim reticle spread",
        cat: "操作への反応",
        kind: "motion",
        description:
          "照準（十字）の 4 本の腕の間隔を、今の狙いの正確さに合わせて広げたり狭めたりする表示です。走ったり撃ち続けたりすると広がり、止まって構えると狭まって、弾がどの範囲に散らばるかが目で分かります。",
        use: "シューティングゲームの照準、ばらつきのある操作の精度の表示、ドラッグの吸着の強さ。",
        params: [],
        spec: [
          [
            "仕組み",
            "ばらつき（角度）を状態から決める：止まる 1°、歩く 3°、走る 6°、撃つたびに +1°。毎フレーム目標へ戻す。腕の間隔 = ばらつきに比例",
          ],
          ["戻り方", "撃った直後は速く広がり（反動）、ゆっくり（0.2〜0.4 秒）狭まる"],
          ["合わせる", "実際の弾のばらつきと表示を必ず一致させる（見た目だけ動かすと信頼を失う）"],
          ["動きを減らす設定", "腕の動きをなめらかにせず、状態ごとの間隔に切り替える"],
          [
            "出典",
            '<a href="https://www.fab.com/listings/255bfec2-36e5-4599-9690-86483b2c4cb0" target="_blank" rel="noopener">fab.com（255bfec2-36e5-4599-9690-8648）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            let sp = 4,
              last = 0,
              lastShot = 0;
            const hits = [];
            return raf((t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              const T = t % 6,
                moving = T > 3 && T < 5,
                firing = T > 1 && T < 2.6,
                base = moving ? 16 : 4;
              if (firing && !rm && t - lastShot > 0.15) {
                lastShot = t;
                sp += 5;
                const a = rnd() * TAU,
                  r = rnd() * sp;
                hits.push([110 + cos(a) * r, 75 + sin(a) * r, t]);
              }
              sp = rm ? base : sp + (base - sp) * Math.min(1, dt * 6);
              g.clearRect(0, 0, W, H);
              g.fillStyle = col("ice");
              g.fillRect(0, 0, W, H);
              g.fillStyle = col("sky");
              g.fillRect(90, 40, 40, 70);
              while (hits.length && t - hits[0][2] >= 2) hits.shift();
              for (const [x, y, ht] of hits) {
                g.fillStyle = `rgba(15,37,99,${1 - (t - ht) / 2})`;
                g.beginPath();
                g.arc(x, y, 1.8, 0, TAU);
                g.fill();
              }
              g.strokeStyle = col("navy");
              g.lineWidth = 2;
              for (const [dx, dy] of [
                [1, 0],
                [-1, 0],
                [0, 1],
                [0, -1],
              ]) {
                g.beginPath();
                g.moveTo(110 + dx * (sp + 2), 75 + dy * (sp + 2));
                g.lineTo(110 + dx * (sp + 10), 75 + dy * (sp + 10));
                g.stroke();
              }
              dot(110, 75, 1.5, col("navy"));
              g.fillStyle = col("ink-muted");
              g.font = "600 10px sans-serif";
              g.textAlign = "left";
              g.fillText(moving ? "走る" : firing ? "撃つ" : "構える", 8, 16);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
