<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>折れ線のイージング（Piecewise-linear easing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-piecewise-linear-easing"
        style="
          position: relative;
          width: 200px;
          height: 150px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        "
      >
        <div class="ac-piecewise-linear-easing-g">
          <svg viewBox="0 0 80 80" width="80" height="80" style="overflow: visible">
            <path d="M0,80 L80,80 M0,80 L0,0" stroke="var(--bar)" stroke-width="2" fill="none" />
            <path d="M0,80 L80,0" stroke="var(--bar)" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
            <path
              class="ac-piecewise-linear-easing-curve"
              d="M0,80 L28.8,0 L40,20 L51.2,0 L60,5.6 L68.8,0 L74.4,1.6 L80,0"
              stroke="var(--cobalt)"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            /></svg
          ><span class="ac-piecewise-linear-easing-dx"><span class="ac-piecewise-linear-easing-dy"></span></span>
        </div>
        <div style="position: relative; width: 200px; height: 32px">
          <span
            style="
              position: absolute;
              left: 0;
              right: 0;
              top: 15px;
              height: 2px;
              border-radius: 2px;
              background: var(--bar);
            "
          ></span
          ><span
            class="sb-thumb sb-grad-sky ac-piecewise-linear-easing-t"
            style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-piecewise-linear-easing .ac-piecewise-linear-easing-g {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .ac-piecewise-linear-easing .ac-piecewise-linear-easing-dx {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 10px;
        height: 80px;
        margin-left: -5px;
        animation: ac-piecewise-linear-easing-x var(--dur, 1000ms) linear both;
      }
      .ac-piecewise-linear-easing .ac-piecewise-linear-easing-dy {
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px #fff;
        animation: ac-piecewise-linear-easing-y var(--dur, 1000ms)
          linear(0, 1 36%, 0.75 50%, 1 64%, 0.93 75%, 1 86%, 0.98 93%, 1) both;
      }
      .ac-piecewise-linear-easing .ac-piecewise-linear-easing-t {
        animation: ac-piecewise-linear-easing-m var(--dur, 1000ms)
          linear(0, 1 36%, 0.75 50%, 1 64%, 0.93 75%, 1 86%, 0.98 93%, 1) both;
      }
      @keyframes ac-piecewise-linear-easing-x {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(80px);
        }
      }
      @keyframes ac-piecewise-linear-easing-y {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-80px);
        }
      }
      @keyframes ac-piecewise-linear-easing-m {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(168px);
        }
      }
      @keyframes ac-piecewise-linear-easing-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-piecewise-linear-easing .ac-piecewise-linear-easing-dx {
          transform: translateX(80px);
          animation-name: none;
        }
        .ac-piecewise-linear-easing .ac-piecewise-linear-easing-dy {
          transform: translateY(-80px);
          animation-name: ac-piecewise-linear-easing-fade;
        }
        .ac-piecewise-linear-easing .ac-piecewise-linear-easing-t {
          transform: translateX(168px);
          animation-name: ac-piecewise-linear-easing-fade;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "piecewise-linear-easing",
        name: "折れ線のイージング",
        en: "Piecewise-linear easing",
        cat: "イージング",
        kind: "concept",
        description:
          "時間と進み具合の点をいくつも並べ、その間を直線でつないで作るイージングです。点を細かく並べれば、跳ねる・揺れる・行ったり来たりなど、cubic-bezier では作れない複雑な動きを CSS だけで表せます。",
        use: "バウンド・ばね・揺れを CSS だけで作る、デザインツールで作った曲線を持ち込む、物理計算の結果を CSS にする。",
        params: [{ key: "dur", label: "時間", value: 1200, min: 400, max: 3000, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "値（このデモ）",
            "<code>linear(0, 1 36%, 0.75 50%, 1 64%, 0.93 75%, 1 86%, 0.98 93%, 1)</code>（跳ねて止まる）",
          ],
          ["書き方", "<code>linear(進み具合 時刻%, …)</code>。時刻を省くと等間隔になる。点が多いほどなめらか"],
          ["作り方", "ばねなどの計算結果を点に変換するツール（linear() generator）を使う"],
          ["グラフ", "横が時間、縦が進み具合"],
          ["動きを減らす設定", "終点に固定し、透明度だけを変える"],
          [
            "出典",
            '<a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/easing-function/linear" target="_blank" rel="noopener">MDN: linear()</a>',
          ],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
