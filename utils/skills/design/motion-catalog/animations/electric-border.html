<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>電気が走る縁（Electric border） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-electric-border" style="position: relative; width: 220px; height: 150px">
        <svg width="220" height="150" style="position: absolute; inset: 0; overflow: visible">
          <filter id="ac-eb-f" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence
              class="ac-electric-border-tu"
              type="turbulence"
              baseFrequency="0.06"
              numOctaves="2"
              seed="1"
            />
            <feDisplacementMap in="SourceGraphic" scale="6" />
          </filter>
          <rect x="40" y="25" width="140" height="100" rx="16" fill="var(--navy)" />
          <rect
            class="ac-electric-border-r"
            x="40"
            y="25"
            width="140"
            height="100"
            rx="16"
            fill="none"
            stroke="var(--sky)"
            stroke-width="2.5"
            filter="url(#ac-eb-f)"
          />
        </svg>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-electric-border .ac-electric-border-r {
        filter: url(#ac-eb-f) drop-shadow(0 0 4px var(--sky));
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "electric-border",
        name: "電気が走る縁",
        en: "Electric border",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "カードの縁の線が細かく震え、ところどころ火花のように乱れながら光り続ける動きです。電気が流れているような、エネルギーと危うさを感じさせます。",
        use: "ゲーム・エンタメのカード、限定・レアの表示、警告、パワフルな CTA。",
        params: [{ key: "fps", label: "1秒あたりの震え", value: 20, min: 5, max: 40, step: 1, unit: "" }],
        spec: [
          [
            "線",
            "枠の線（SVG の <code>rect</code> か <code>border</code>）に、<code>feTurbulence</code> と <code>feDisplacementMap</code> のフィルターをかけて細かくゆがめる",
          ],
          [
            "震え",
            "<code>feTurbulence</code> の <code>seed</code>（または <code>baseFrequency</code>）を 15–30 回/秒で変える",
          ],
          ["光", "同じ線をぼかして重ね（<code>drop-shadow</code>）、発光させる"],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/animations/electric-border" target="_blank" rel="noopener">React Bits</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const tu = stage.querySelector(".ac-electric-border-tu");
            if (rm) return null;
            let s = 1;
            const iv = setInterval(() => {
              s = (s % 50) + 1;
              tu.setAttribute("seed", s);
            }, 1000 / v.fps);
            return () => clearInterval(iv);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
