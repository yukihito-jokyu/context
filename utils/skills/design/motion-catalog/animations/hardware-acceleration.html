<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ハードウェアアクセラレーション（Hardware acceleration） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-hardware-acceleration"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <span
          class="sb-thumb sb-grad-sky ac-hardware-acceleration-t"
          style="width: 56px; height: 56px; border-radius: 18px"
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      @media (prefers-reduced-motion: no-preference) {
        .ac-hardware-acceleration .ac-hardware-acceleration-t {
          animation: ac-hardware-acceleration-m 2400ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
      }
      @keyframes ac-hardware-acceleration-m {
        0%,
        100% {
          transform: none;
          opacity: 1;
        }
        25% {
          transform: translateX(60px) rotate(45deg);
        }
        50% {
          transform: translateX(0) scale(1.3);
          opacity: 0.5;
        }
        75% {
          transform: translateX(-60px) rotate(-45deg);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "hardware-acceleration",
        name: "ハードウェアアクセラレーション",
        en: "Hardware acceleration",
        cat: "原則",
        kind: "concept",
        description:
          "transform と opacity だけを動かすと、ブラウザが GPU に任せて、メインスレッドが忙しくてもなめらかに動かせるという原則です。この四角は位置・大きさ・回転・透明度をすべて transform と opacity で変えています。",
        use: "すべての動きの実装方針。「動かすのは transform と opacity」を基本にする。",
        params: [],
        spec: [
          ["動かしてよいもの", "<code>transform</code>（translate・scale・rotate）、<code>opacity</code>"],
          [
            "置き換え方",
            "<code>left/top</code> → <code>translate</code>、<code>width/height</code> → <code>scale</code>（FLIP）、<code>box-shadow</code> の変化 → 影を別の要素にして <code>opacity</code>",
          ],
          ["関連", "コンポジット、will-change、レイアウトスラッシング"],
          ["動きを減らす設定", "四角を中央に静止表示"],
          ["出典", "Animation Vocabulary（Principles to Know）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
