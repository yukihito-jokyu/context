<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>クロスカット（Cross-cutting） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-cross-cut"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div
          class="ac-cross-cut-s ac-cross-cut-a"
          style="
            background:
              radial-gradient(circle at 72% 30%, #fff 0 12px, transparent 13px),
              radial-gradient(ellipse at 25% 115%, var(--cobalt) 0 46%, transparent 47%),
              radial-gradient(ellipse at 85% 120%, var(--navy) 0 50%, transparent 51%),
              linear-gradient(160deg, var(--ice), var(--sky));
          "
        ></div>
        <div
          class="ac-cross-cut-s ac-cross-cut-b"
          style="
            background:
              radial-gradient(circle at 30% 32%, #eaf2ff 0 11px, transparent 12px),
              radial-gradient(circle at 62% 22%, #fff 0 1.5px, transparent 2px),
              radial-gradient(circle at 82% 40%, #fff 0 1.5px, transparent 2px),
              radial-gradient(ellipse at 70% 118%, #0f2563 0 52%, transparent 53%),
              linear-gradient(200deg, #2a3f8f, var(--navy));
          "
        ></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-cross-cut .ac-cross-cut-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-cross-cut .ac-cross-cut-b {
        animation: ac-cross-cut-t var(--dur, 2600ms) step-end infinite;
      }
      @keyframes ac-cross-cut-t {
        0% {
          opacity: 0;
        }
        24% {
          opacity: 1;
        }
        44% {
          opacity: 0;
        }
        58% {
          opacity: 1;
        }
        70% {
          opacity: 0;
        }
        79% {
          opacity: 1;
        }
        86% {
          opacity: 0;
        }
        91% {
          opacity: 1;
        }
        95% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-cross-cut .ac-cross-cut-s {
          transition: opacity 200ms;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cross-cut",
        name: "クロスカット",
        en: "Cross-cutting",
        cat: "映像の切り替え",
        kind: "concept",
        description:
          "別の場所で同時に起きている2つの場面を、交互に切り替えて見せる方法です（並行編集）。切り替えの間隔をだんだん短くすると、2つが近づいていく緊張感を作れます。",
        use: "2つの立場（使う人と届ける人など）を並べるブランド動画、比較の演出、カウントダウン。",
        params: [{ key: "dur", label: "ひと回りの長さ ×2", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          ["書き方", "A と B を交互にカット。後になるほど1回の長さを短くする（例：800 → 500 → 300 → 150ms）"],
          ["つながり", "両方の場面に共通の要素（時計、同じ動き）を入れると関係が伝わる"],
          ["終わり", "最後に2つが1つの場面で出会うと、まとまりが出る"],
          ["動きを減らす設定", "もともとカットなので、そのままでよい"],
          [
            "出典",
            '<a href="https://www.studiobinder.com/blog/types-of-editing-transitions-in-film/" target="_blank" rel="noopener">StudioBinder: Types of Editing Transitions</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
