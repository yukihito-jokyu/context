<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>布が裂ける（Stress-driven cloth tearing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-cloth-tearing"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cloth-tearing",
        name: "布が裂ける",
        en: "Stress-driven cloth tearing",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "点をばねでつないだ布を物理で動かし、引っぱられて伸びすぎたつなぎ目を切ることで、布が引き裂かれていく動きです。裂け目は力の集まる所から自然に広がり、切れた端はだらりと垂れ下がります。",
        use: "ゲームの破れる旗・布、破いて開けるパッケージの演出、紙やポスターが破れる表現。",
        params: [
          { key: "limit", label: "裂ける伸び（元の長さの倍）", value: 1.8, min: 1.2, max: 3, step: 0.05, unit: "倍" },
        ],
        spec: [
          [
            "作り方",
            "格子の点を上下左右でつなぎ（ベルレ積分と距離の制約）、毎ステップ、つなぎ目の長さが元の長さの 1.6〜2 倍を超えたらその制約を消す",
          ],
          ["見せ方", "引く点（ポインター）を少しずつ強く引き、裂ける瞬間は一気に進む。切れた所の両側は別々に垂れる"],
          ["本格的に", "3D の布は物理エンジンの布（Ammo.js の softbody・PBD）で、破断のしきい値を設定する"],
          ["動きを減らす設定", "布の動きをやめ、少し裂けた状態の静止画にする"],
          [
            "出典",
            '<a href="https://www.sidefx.com/docs/houdini/vellum/breaking_tearing.html" target="_blank" rel="noopener">sidefx.com（breaking_tearing）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const nx = 16,
              ny = 10,
              sp = 9,
              ox = 110 - ((nx - 1) * sp) / 2,
              oy = 14;
            let P0, C;
            const init = () => {
              P0 = [];
              C = [];
              for (let y = 0; y < ny; y++)
                for (let x = 0; x < nx; x++) {
                  const p = {
                    x: ox + x * sp,
                    y: oy + y * sp,
                    px: ox + x * sp,
                    py: oy + y * sp,
                    pin: y === 0 && x % 3 === 0,
                  };
                  P0.push(p);
                  if (x) C.push([P0[y * nx + x - 1], p]);
                  if (y) C.push([P0[(y - 1) * nx + x], p]);
                }
            };
            init();
            let t0 = 0;
            const frame = (t) => {
              const T = t - t0;
              if (T > 6) {
                init();
                t0 = t;
              }
              const gl = P0[(ny - 1) * nx + nx / 2 - 1],
                gr = P0[(ny - 1) * nx + nx / 2],
                gx = ox + (nx / 2 - 0.5) * sp,
                pull = rm ? 0.6 : Math.min(1, T / 4);
              for (const p of P0) {
                if (p.pin) continue;
                const vx = (p.x - p.px) * 0.98,
                  vy = (p.y - p.py) * 0.98;
                p.px = p.x;
                p.py = p.y;
                p.x += vx;
                p.y += vy + 0.25;
              }
              for (let k = 0; k < 4; k++) {
                gl.x = gx - 4.5 - 46 * pull;
                gr.x = gx + 4.5 + 46 * pull;
                gl.y = gr.y = oy + (ny - 1) * sp + 18 * pull;
                for (let i = C.length - 1; i >= 0; i--) {
                  const [a, b] = C[i],
                    dx = b.x - a.x,
                    dy = b.y - a.y,
                    d = Math.hypot(dx, dy) || 1;
                  if (d > sp * v.limit) {
                    C.splice(i, 1);
                    continue;
                  }
                  const f = ((d - sp) / d) * 0.5;
                  if (!a.pin) {
                    a.x += dx * f;
                    a.y += dy * f;
                  }
                  if (!b.pin) {
                    b.x -= dx * f;
                    b.y -= dy * f;
                  }
                }
              }
              g.clearRect(0, 0, W, H);
              g.strokeStyle = col("blue");
              g.lineWidth = 1.4;
              g.beginPath();
              for (const [a, b] of C) {
                g.moveTo(a.x, a.y);
                g.lineTo(b.x, b.y);
              }
              g.stroke();
              g.fillStyle = col("navy");
              g.fillRect(ox - 6, oy - 4, (nx - 1) * sp + 12, 3);
              dot(gl.x, gl.y, 4, col("cobalt"));
              dot(gr.x, gr.y, 4, col("cobalt"));
            };
            if (rm) {
              for (let i = 0; i < 90; i++) frame(0.5);
              return null;
            } // 動きを減らす設定：少し進めた形で止める
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
