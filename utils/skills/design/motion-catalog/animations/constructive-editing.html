<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>組み立ての編集（Constructive editing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-constructive-editing"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "constructive-editing",
        name: "組み立ての編集",
        en: "Constructive editing",
        cat: "映像の切り替え",
        kind: "concept",
        description:
          "場所の全景を見せずに、部分の寄り（ドア・時計・顔）だけをつないで、見ている人の頭の中にその場所を組み立てさせる考え方です。限られた素材でも、空間や状況を感じさせられます。",
        use: "小さなセットの映像、緊張感のある場面、細部で全体を想像させる広告。",
        params: [{ key: "dur", label: "1ショットの長さ", value: 1100, min: 600, max: 2500, step: 50, unit: "ms" }],
        spec: [
          [
            "組み立て",
            "場所の手がかりになる部分を 3〜5 ショット選び、位置関係（左右・手前と奥）が矛盾しない順につなぐ。視線つなぎを使うと位置が伝わる",
          ],
          ["効果", "全景を見せないので、見えない部分への想像と緊張が生まれる"],
          ["UI では", "画面全体ではなく、変化した部分の寄りだけを順に見せて、何が起きたかを伝える"],
          ["動きを減らす設定", "切り替えを短いクロスフェード（200ms 前後）にし、映像の中の動きを止める"],
          [
            "出典",
            '<a href="https://www.davidbordwell.net/blog/2008/02/04/what-happens-between-shots-happens-between-your-ears/" target="_blank" rel="noopener">davidbordwell.net（what-happens-between-shots-h）</a>、<a href="https://www.davidbordwell.net/blog/2012/10/28/news-a-video-essay-on-constructive-editing/" target="_blank" rel="noopener">davidbordwell.net（news-a-video-essay-on-constr）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const VH = 106;
            const view = (c1, c2) => {
              const gr = g.createLinearGradient(0, 0, 0, VH);
              gr.addColorStop(0, c1);
              gr.addColorStop(1, c2);
              g.fillStyle = gr;
              g.fillRect(0, 0, W, VH);
            };
            const hill = (c, y, r, x = 110) => {
              g.fillStyle = c;
              g.beginPath();
              g.ellipse(x, y + r * 0.9, r * 1.6, r, 0, 0, TAU);
              g.fill();
            };
            const person = (x, y, s, c, dir = 1) => {
              g.fillStyle = c;
              g.beginPath();
              g.roundRect(x - 9 * s, y - 22 * s, 18 * s, 26 * s, 8 * s);
              g.fill();
              g.beginPath();
              g.arc(x, y - 30 * s, 8 * s, 0, TAU);
              g.fill();
              g.fillStyle = "#fff";
              g.beginPath();
              g.arc(x + dir * 4 * s, y - 31 * s, 1.6 * s, 0, TAU);
              g.fill();
            };
            const label = (s, x = 8, y = 14) => {
              g.font = "600 9px sans-serif";
              g.textAlign = "left";
              const w = g.measureText(s).width + 8;
              g.fillStyle = "rgba(15,37,99,.55)";
              g.beginPath();
              g.roundRect(x, y - 10, w, 13, 4);
              g.fill();
              g.fillStyle = "#fff";
              g.fillText(s, x + 4, y);
            };
            const bubble = (s, x, y) => {
              g.font = "600 10px sans-serif";
              g.textAlign = "center";
              const w = g.measureText(s).width + 12;
              g.fillStyle = "#fff";
              g.beginPath();
              g.roundRect(x - w / 2, y - 12, w, 17, 7);
              g.fill();
              g.fillStyle = col("navy");
              g.fillText(s, x, y + 1);
            };
            const tl = (clips, ph, total, audio = false) => {
              g.fillStyle = "#fff";
              g.fillRect(0, VH, W, H - VH);
              g.font = "600 8px sans-serif";
              g.textAlign = "left";
              g.fillStyle = col("ink-muted");
              g.fillText("映像", 4, VH + 15);
              if (audio) g.fillText("音", 4, VH + 32);
              const X = (s) => 28 + (s / total) * 184;
              for (const [tr, a, b, c, lab] of clips) {
                const y = VH + (tr ? 24 : 6);
                g.fillStyle = c;
                g.beginPath();
                g.roundRect(X(a) + 0.5, y, X(b) - X(a) - 1, tr ? 11 : 13, 3);
                g.fill();
                if (lab) {
                  g.fillStyle = "#fff";
                  g.fillText(lab, X(a) + 4, y + (tr ? 8.5 : 9.5));
                }
              }
              const x = X(ph);
              g.fillStyle = "#e5484d";
              g.fillRect(x - 0.75, VH + 2, 1.5, H - VH - 4);
            };
            const raf0 = raf,
              xf = (() => {
                if (!rm) return () => {};
                const mk = () => {
                    const c = document.createElement("canvas");
                    c.width = cv.width;
                    c.height = Math.ceil(VH * dpr);
                    return [c, c.getContext("2d")];
                  },
                  [pc, pg] = mk(),
                  [nc, ng] = mk();
                let lt = null;
                return () => {
                  const now = performance.now(),
                    dt = lt === null ? null : now - lt;
                  lt = now;
                  ng.clearRect(0, 0, nc.width, nc.height);
                  ng.drawImage(cv, 0, 0);
                  if (dt !== null) {
                    g.save();
                    g.setTransform(1, 0, 0, 1, 0, 0);
                    g.globalAlpha = 1;
                    g.drawImage(pc, 0, 0);
                    g.globalAlpha = 1 - Math.exp(-dt / 70);
                    g.drawImage(nc, 0, 0);
                    g.restore();
                  }
                  pg.clearRect(0, 0, pc.width, pc.height);
                  pg.drawImage(cv, 0, 0);
                };
              })();
            {
              const raf = (fn) =>
                raf0((t) => {
                  fn(t);
                  xf();
                });
              const sh = (k) => {
                view("#eaf2ff", "#dbeafe");
                if (k === 0) {
                  g.fillStyle = col("cobalt");
                  g.fillRect(70, 10, 80, 96);
                  dot(136, 60, 4, "#fff");
                  label("ドア");
                }
                if (k === 1) {
                  g.strokeStyle = col("navy");
                  g.lineWidth = 4;
                  g.beginPath();
                  g.arc(110, 54, 34, 0, TAU);
                  g.stroke();
                  g.beginPath();
                  g.moveTo(110, 54);
                  g.lineTo(110, 30);
                  g.moveTo(110, 54);
                  g.lineTo(128, 60);
                  g.stroke();
                  label("時計");
                }
                if (k === 2) {
                  person(110, 140, 3, col("blue"), -1);
                  label("顔");
                }
              };
              return raf((t) => {
                const M = v.dur / 1000,
                  T = t % (3 * M + 1.4),
                  k = Math.min(3, Math.floor(T / M));
                if (k < 3) sh(k);
                else {
                  view("#f8fbff", "#eef4ff");
                  g.globalAlpha = rm ? 1 : Math.min(1, (T - 3 * M) / 0.6);
                  g.strokeStyle = col("line");
                  g.lineWidth = 2;
                  g.strokeRect(40, 16, 140, 80);
                  g.fillStyle = col("cobalt");
                  g.fillRect(50, 16, 24, 6);
                  g.fillStyle = col("navy");
                  g.beginPath();
                  g.arc(160, 30, 7, 0, TAU);
                  g.fill();
                  dot(110, 70, 7, col("blue"));
                  g.globalAlpha = 1;
                  label("頭の中の部屋");
                }
                tl(
                  [
                    [0, 0, M, col("cobalt"), "ドア"],
                    [0, M, 2 * M, col("navy"), "時計"],
                    [0, 2 * M, 3 * M, col("blue"), "顔"],
                  ],
                  Math.min(T, 3 * M),
                  3 * M,
                );
              });
            }
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
