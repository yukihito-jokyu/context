<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ストラップの揺れ（Lanyard physics） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-lanyard-physics" style="position: relative; width: 220px; height: 160px">
        <div
          class="ac-lanyard-physics-p"
          style="position: absolute; left: 0; top: 0; width: 220px; height: 160px; transform-origin: 110px 4px"
        >
          <span
            style="position: absolute; left: 109px; top: 4px; width: 2px; height: 58px; background: var(--bar-strong)"
          ></span>
          <div
            class="ac-lanyard-physics-c"
            style="
              position: absolute;
              left: 84px;
              top: 60px;
              width: 52px;
              height: 70px;
              border-radius: 10px;
              background: var(--surface);
              box-shadow: var(--shadow-float);
              transform-origin: 26px 0;
              display: grid;
              place-items: center;
              align-content: center;
              gap: 6px;
            "
          >
            <span style="width: 22px; height: 22px; border-radius: 50%" class="sb-grad-sky"></span
            ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 30px"></span>
          </div>
        </div>
        <span
          style="
            position: absolute;
            left: 104px;
            top: 0;
            width: 12px;
            height: 8px;
            border-radius: 4px;
            background: var(--bar-strong);
          "
        ></span
        ><span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "lanyard-physics",
        name: "ストラップの揺れ",
        en: "Lanyard physics",
        cat: "移動・変形",
        kind: "motion",
        description:
          "ひもでぶら下がった名札を引っぱって離すと、重力と慣性で振り子のように揺れ、だんだん落ち着く動きです。名札そのものも少し遅れてねじれるので、本物の物のような重さが出ます。プレビューは 2D の振り子で近い形を作っています。",
        use: "イベントのチケット・社員証の見せ方、プロフィールカード、遊びのあるヒーロー。",
        params: [
          { key: "damp", label: "減衰", value: 1.2, min: 0.2, max: 4, step: 0.1, unit: "" },
          { key: "pull", label: "引っぱる角度", value: 40, min: 10, max: 70, step: 5, unit: "deg" },
        ],
        spec: [
          ["計算", "振り子：角加速度 = <code>-(g / 長さ) × sin(角度) - 減衰 × 角速度</code>。毎フレーム角度を更新する"],
          ["副次動作", "名札は振り子の角度の 30% だけ逆向きにねじる（遅れて付いてくる）"],
          ["操作", "ドラッグ中は名札をポインターに付け、離した瞬間の速度で振り子を始める"],
          ["動きを減らす設定", "揺れを止め、真下にぶら下がった状態で止める"],
          ["出典", '<a href="https://reactbits.dev/components/lanyard" target="_blank" rel="noopener">React Bits</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const p = stage.querySelector(".ac-lanyard-physics-p"),
              c = stage.querySelector(".ac-lanyard-physics-c");
            let th = 0,
              w = 0,
              last = 0;
            const K = 22,
              R = 95,
              pull = (v.pull * Math.PI) / 180;
            if (rm) return null;
            cur.style.transition = "opacity 200ms";
            return raf((t) => {
              const dt = Math.min(0.033, t - last);
              last = t;
              const k = t % 4.5;
              if (k < 0.5) {
                show(k > 0.1);
              } else if (k < 1.2) {
                const e = (k - 0.5) / 0.7,
                  s = e * e * (3 - 2 * e);
                th = th + (pull * s - th) * 0.2;
                w = 0;
              } else {
                if (k < 1.3) show(0);
                w += (-K * Math.sin(th) - v.damp * w) * dt;
                th += w * dt;
              }
              p.style.transform = `rotate(${-th}rad)`;
              c.style.transform = `rotate(${th * 0.3}rad)`;
              cur.style.transform = `translate(${110 - R * Math.sin(th)}px, ${4 + R * Math.cos(th)}px)`;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
