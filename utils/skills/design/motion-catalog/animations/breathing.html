<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ブリージング（Breathing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-breathing"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <span class="ac-breathing-b sb-grad-sky"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-breathing .ac-breathing-b {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.25);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-breathing .ac-breathing-b {
          animation: ac-breathing-breathe var(--dur, 2000ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-breathing-breathe {
        to {
          transform: scale(var(--size, 1.12));
          box-shadow:
            0 0 0 18px rgba(37, 99, 235, 0.08),
            0 12px 32px rgba(37, 99, 235, 0.35);
        }
      }
      @keyframes ac-breathing-glow {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-breathing .ac-breathing-b {
          position: relative;
          box-shadow: none;
        }
        .ac-breathing .ac-breathing-b::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          box-shadow: 0 0 0 18px rgba(37, 99, 235, 0.08);
          opacity: 0;
          animation: ac-breathing-glow var(--dur, 2000ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "breathing",
        name: "ブリージング",
        en: "Breathing",
        cat: "ループ・常時の動き",
        kind: "motion",
        description:
          "呼吸のように、ゆっくりと大きくなって光り、またしぼむのをくり返す動きです。パルスより穏やかで、落ち着いた「生きている」感じを出します。",
        use: "音声入力の待機、瞑想・リラックス系のアプリ、AI が考えている表示、スマートスピーカー風の光。",
        params: [
          { key: "dur", label: "ひと呼吸（片道）", value: 2000, min: 1000, max: 5000, step: 100, unit: "ms" },
          { key: "size", label: "ふくらむ大きさ", value: 1.12, min: 1.02, max: 1.3, step: 0.01, unit: "" },
        ],
        spec: [
          [
            "動き",
            "<code>scale(1 ↔ ふくらむ大きさ)</code> と光（<code>shadow-glow</code>）の強さ｜in-out｜<code>alternate infinite</code>",
          ],
          ["目安", "吸う・吐くで 4 秒前後（片道 2 秒）が落ち着く"],
          ["動きを減らす設定", "ふくらみをやめ、光の強さの変化だけにする"],
          ["出典", "ChatGPT との会話の分類表（継続・待機）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
