<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文字に光が流れる（Text shine） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-text-shine"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <span
          class="sb-chip"
          style="
            height: 40px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            background: var(--surface);
            box-shadow: var(--shadow-card);
          "
          ><span
            class="ac-text-shine-t"
            style="
              font-size: 24px;
              line-height: 32px;
              font-weight: 800;
              color: var(--ink);
              letter-spacing: 0.02em;
              font-size: 17px;
              line-height: 22px;
              font-weight: 700;
            "
            >✦ New feature</span
          ></span
        >
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-text-shine .ac-text-shine-t {
        background: linear-gradient(
          110deg,
          var(--ink-muted) calc(50% - var(--w, 20%) / 2),
          #fff 50%,
          var(--ink-muted) calc(50% + var(--w, 20%) / 2)
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-text-shine .ac-text-shine-t {
          animation: ac-text-shine-s var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
      }
      @keyframes ac-text-shine-s {
        0% {
          background-position: 100% 0;
        }
        60%,
        100% {
          background-position: -50% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-text-shine .ac-text-shine-t {
          background: none;
          color: var(--ink-muted) !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "text-shine",
        name: "文字に光が流れる",
        en: "Text shine",
        cat: "文字",
        kind: "motion",
        description:
          "控えめな色の文字の上を、明るい光の帯がすっと横切る表現です。金属や新品のような光沢が一瞬見え、さりげなく注意を引きます。",
        use: "新着・プレミアムのラベル、「お知らせ」のピル、ボタンの文字、ロゴ。",
        params: [
          { key: "dur", label: "一巡の時間", value: 2400, min: 800, max: 6000, step: 100, unit: "ms" },
          { key: "w", label: "光の幅", value: 20, min: 8, max: 40, step: 2, unit: "%" },
        ],
        spec: [
          [
            "書き方",
            "<code>background: linear-gradient(110deg, 地の色 40%, 光の色 50%, 地の色 60%)</code>、<code>background-size: 250%</code>、<code>background-clip: text</code>",
          ],
          [
            "動き",
            "<code>background-position: 100% → -100%</code>｜linear か in-out｜一巡のうち一部だけ光らせ、残りは休む",
          ],
          ["色", "地の色は muted、光は白に近い色"],
          ["動きを減らす設定", "光を流さず、地の色の文字にする"],
          [
            "出典",
            '<a href="https://magicui.design/docs/components/animated-shiny-text" target="_blank" rel="noopener">Magic UI: Animated Shiny Text</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
