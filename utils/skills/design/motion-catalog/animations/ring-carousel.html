<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>円弧に並ぶギャラリー（Ring carousel (circular gallery)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-ring-carousel"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-ring-carousel-v">
          <div class="ac-ring-carousel-ring">
            <i style="--k: 0"></i><i style="--k: 1"></i><i style="--k: 2"></i><i style="--k: 3"></i
            ><i style="--k: 4"></i><i style="--k: 5"></i><i style="--k: 6"></i><i style="--k: 7"></i
            ><i style="--k: 8"></i><i style="--k: 9"></i><i style="--k: 10"></i><i style="--k: 11"></i>
          </div>
        </div>
        <span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-ring-carousel .ac-ring-carousel-v {
        position: absolute;
        inset: 0;
        perspective: 420px;
        perspective-origin: 50% 40%;
      }
      .ac-ring-carousel .ac-ring-carousel-ring {
        position: absolute;
        left: 50%;
        top: 36px;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        transform: translateZ(-120px) rotateX(-6deg) rotateY(var(--a, 0deg));
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-ring-carousel .ac-ring-carousel-ring {
          transition: transform var(--dur, 700ms) cubic-bezier(0.65, 0, 0.35, 1);
        }
      }
      .ac-ring-carousel .ac-ring-carousel-ring i {
        position: absolute;
        left: -26px;
        top: 0;
        width: 52px;
        height: 72px;
        border-radius: 10px;
        background: linear-gradient(150deg, var(--ice), var(--sky));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        transform: rotateY(calc(var(--k) * 30deg)) translateZ(120px);
        backface-visibility: hidden;
      }
      .ac-ring-carousel .ac-ring-carousel-ring i:nth-child(3n + 1) {
        background: linear-gradient(150deg, var(--sky), var(--blue));
      }
      .ac-ring-carousel .ac-ring-carousel-ring.is-drag {
        transition: none;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "ring-carousel",
        name: "円弧に並ぶギャラリー",
        en: "Ring carousel (circular gallery)",
        cat: "移動・変形",
        kind: "motion",
        description:
          "カードや画像を、外から見た輪の上に曲げて並べ、ドラッグすると輪ごと回って次のカードが正面に来る動きです。両端のカードは奥へ回り込んで見え、平らな横並びより奥行きと続きが感じられます。プレビューは CSS の 3D 変形で作っています（元の作例は WebGL）。",
        use: "作品・商品のギャラリー、ポートフォリオ、イベントの写真、選択肢をめくるメニュー。",
        params: [{ key: "dur", label: "吸着の時間", value: 700, min: 200, max: 1600, step: 50, unit: "ms" }],
        spec: [
          [
            "並べ方",
            "入れ物に <code>transform-style: preserve-3d</code>。i 番目のカードに <code>rotateY(i × 360°/N) translateZ(R)</code>。入れ物を <code>translateZ(−R)</code> で奥へ下げ、親に <code>perspective</code>",
          ],
          [
            "回し方",
            "ドラッグの量を角度に変えて入れ物を <code>rotateY</code>（ドラッグ中は補間なし）。離したら一番近いカードの角度へ in-out で吸着。前・次のボタンも置く",
          ],
          [
            "本格的に",
            "画像そのものを輪に沿って曲げたいときは WebGL の平面を頂点で曲げる（React Bits の Circular Gallery の作り方）",
          ],
          ["動きを減らす設定", "輪を回す動きをやめ、次のカードへすぐ切り替える"],
          [
            "出典",
            '<a href="https://reactbits.dev/llms.txt" target="_blank" rel="noopener">React Bits（コンポーネント一覧）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const ring = stage.querySelector(".ac-ring-carousel-ring");
            let a = 0;
            return seq(2000, [
              [
                0,
                () => {
                  show(1);
                  move(160, 118, 0);
                },
              ],
              [
                150,
                () => {
                  move(70, 118, 650);
                  a -= 30;
                  ring.style.setProperty("--a", a + "deg");
                },
              ],
              [900, () => show(0)],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
