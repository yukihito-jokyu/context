<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>コンストレイント（Constraints） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-constraints"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "constraints",
        name: "コンストレイント",
        en: "Constraints",
        cat: "キャラクター",
        kind: "motion",
        description:
          "ある物の動き（位置・回転・向き）を、別の物の動きに「くっつける・制限する」ルールで自動的に決める方法です。車輪を回すと棒とピストンがついてくる、目が目標を向き続ける、などを 1 コマずつ付けずに作れます。",
        use: "機械やロボットの動き、キャラクターの目線・小物の追従、パスに沿って動くもの、ゲームの連動する仕掛け。",
        params: [{ key: "period", label: "1回転の時間", value: 1600, min: 600, max: 4000, step: 100, unit: "ms" }],
        spec: [
          ["種類", "親子づけ、向きを向ける（Look At）、回転のコピー、範囲の制限（Limit）、線に沿わせる（Path）、IK"],
          ["この例", "車輪の回転 → 棒の端を車輪のピンに固定 → ピストンは横線の上だけ動ける、の 3 つの制約で動く"],
          ["Web では", "Rive・Spine・Blender のコンストレイント。コードなら毎フレーム制約の順に計算する"],
          ["動きを減らす設定", "回転を止め、止まった形にする"],
          [
            "出典",
            '<a href="https://rive.app/features" target="_blank" rel="noopener">Rive Features</a>、<a href="https://esotericsoftware.com/spine-demos" target="_blank" rel="noopener">Spine Demos</a>、<a href="https://docs.blender.org/manual/en/latest/animation/" target="_blank" rel="noopener">Blender マニュアル: Animation & Rigging</a>、<a href="https://animatorschecklist.com/en/glossary/" target="_blank" rel="noopener">The Animator\'s Checklist: Glossary</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            return raf((t) => {
              const a = rm ? 0.6 : (t * TAU) / (v.period / 1000),
                c = [60, 80],
                r = 26,
                L = 78;
              g.clearRect(0, 0, W, H);
              const pin = [c[0] + r * cos(a), c[1] + r * sin(a)],
                px = pin[0] + Math.sqrt(L * L - (pin[1] - c[1]) ** 2),
                pc = [px, c[1]];
              g.fillStyle = col("ice");
              g.fillRect(100, c[1] - 16, 110, 32);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              g.strokeRect(100, c[1] - 16, 110, 32);
              g.fillStyle = col("blue");
              g.fillRect(px - 2, c[1] - 13, 30, 26);
              dot(c[0], c[1], r + 8, col("sky"));
              g.strokeStyle = col("cobalt");
              g.lineWidth = 3;
              for (let k = 0; k < 4; k++) {
                const b = a + (k * Math.PI) / 2;
                g.beginPath();
                g.moveTo(c[0], c[1]);
                g.lineTo(c[0] + (r + 4) * cos(b), c[1] + (r + 4) * sin(b));
                g.stroke();
              }
              line([pin, pc], 8, col("navy"));
              dot(pin[0], pin[1], 5, "#fff");
              dot(pc[0], pc[1], 5, "#fff");
              dot(c[0], c[1], 5, col("navy"));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
