<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パスに沿って動く（Motion path） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-motion-path" style="position: relative; width: 220px; height: 130px">
        <svg width="220" height="130" style="position: absolute; inset: 0; overflow: visible">
          <path
            d="M14,100 C50,0 100,10 110,66 S176,140 206,30"
            fill="none"
            stroke="var(--bar)"
            stroke-width="2"
            stroke-dasharray="4 5"
          /></svg
        ><span
          class="sb-thumb sb-grad-sky ac-motion-path-t"
          style="width: 28px; height: 28px; border-radius: 9px; position: absolute; left: 0; top: 0"
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-motion-path .ac-motion-path-t {
        offset-path: path("M14,100 C50,0 100,10 110,66 S176,140 206,30");
        offset-anchor: center;
        offset-rotate: auto;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-motion-path .ac-motion-path-t {
          animation: ac-motion-path-go var(--dur, 1800ms) cubic-bezier(0.65, 0, 0.35, 1) both;
        }
      }
      @keyframes ac-motion-path-go {
        from {
          offset-distance: 0%;
        }
        to {
          offset-distance: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-motion-path .ac-motion-path-t {
          offset-distance: 100%;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "motion-path",
        name: "パスに沿って動く",
        en: "Motion path",
        cat: "移動・変形",
        kind: "motion",
        description:
          "直線ではなく、あらかじめ決めた曲線（パス）に沿って要素を動かす動きです。弧や波のような軌道は、直線よりも自然で、行き先への流れが伝わります。",
        use: "カートに入るアイコン、地図のルート、紙飛行機の送信演出、説明図の矢印。",
        params: [{ key: "dur", label: "時間", value: 1800, min: 600, max: 4000, step: 100, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["動き", "<code>offset-path: path(…)</code> と <code>offset-distance: 0 → 100%</code>｜in-out"],
          ["向き", "<code>offset-rotate: auto</code> で進む方向を向く（<code>0deg</code> なら向きは固定）"],
          ["JS の場合", "GSAP の MotionPath、または SVG の <code>getPointAtLength()</code> で位置を計算する"],
          ["動きを減らす設定", "移動をやめ、終点に置く"],
          [
            "出典",
            '<a href="https://www.w3.org/TR/motion-1/" target="_blank" rel="noopener">W3C Motion Path</a>、<a href="https://gsap.com/docs/v3/Plugins/MotionPathPlugin/" target="_blank" rel="noopener">GSAP MotionPath</a>',
          ],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
