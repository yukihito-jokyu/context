<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>攻撃の予兆表示（Ground attack telegraph） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-attack-telegraph"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "attack-telegraph",
        name: "攻撃の予兆表示",
        en: "Ground attack telegraph",
        cat: "操作への反応",
        kind: "motion",
        description:
          "敵の大きな攻撃が来る前に、床に危険な範囲を半透明の色で示し、ため（予備動作）の間に範囲が中心から塗りつぶされていき、満ちた瞬間に攻撃が当たって光る演出です。いつ・どこへ来るかが分かり、よける判断ができます。",
        use: "アクション・MMO のボスの範囲攻撃、危険な操作の確認（長押しで実行）、カウントダウン。",
        params: [{ key: "wind", label: "予備動作の時間", value: 1000, min: 400, max: 2500, step: 50, unit: "ms" }],
        spec: [
          [
            "見せ方",
            "範囲の輪郭をすぐ出し、中を予備動作の時間（0.6〜1.5 秒）で外へ向かって塗る。満ちたら白く光らせて消す",
          ],
          [
            "色と形",
            "危険は赤・橙。円・扇形・帯など、当たる範囲の形そのものを描く。塗る速さは一定にし、当たる時刻が読めるようにする",
          ],
          ["UI では", "長押しで実行するボタンの塗り（ホールドで確定）も、同じく「満ちたら実行」を伝える"],
          ["動きを減らす設定", "塗り広がる動きをやめ、範囲を出して時間の数字で伝える"],
          [
            "出典",
            '<a href="https://forums.unrealengine.com/t/mustafa-kum-modular-boss-telegraph-aoe-attack-indicators/2848770" target="_blank" rel="noopener">forums.unrealengine.com（2848770）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            return raf((t) => {
              const Wd = v.wind / 1000,
                T = t % (Wd + 1.4),
                k = Math.min(1, T / Wd),
                flash = T > Wd && T < Wd + 0.25 ? 1 - (T - Wd) / 0.25 : 0,
                cx = 110,
                cy = 92,
                R = 46;
              g.clearRect(0, 0, W, H);
              g.fillStyle = col("ice");
              g.fillRect(0, 0, W, H);
              const px = T < Wd * 0.5 ? 120 : 120 + Math.min(1, (T - Wd * 0.5) / (Wd * 0.4)) * 60;
              if (T <= Wd + 0.25) {
                g.save();
                g.translate(cx, cy);
                g.scale(1, 0.45);
                g.strokeStyle = "rgba(229,72,77,.9)";
                g.lineWidth = 2.5;
                g.beginPath();
                g.arc(0, 0, R, 0, TAU);
                g.stroke();
                g.fillStyle = "rgba(229,72,77,.18)";
                g.fill();
                g.fillStyle = "rgba(229,72,77,.4)";
                g.beginPath();
                g.arc(0, 0, R * (rm ? 1 : k), 0, TAU);
                g.fill();
                if (flash) {
                  g.fillStyle = `rgba(255,255,255,${flash})`;
                  g.beginPath();
                  g.arc(0, 0, R, 0, TAU);
                  g.fill();
                }
                g.restore();
              }
              g.fillStyle = col("navy");
              g.beginPath();
              g.roundRect(cx - 12, 20 + (T > Wd ? 40 : 0), 24, 30, 6);
              g.fill();
              g.fillStyle = col("blue");
              g.beginPath();
              g.roundRect(px - 6, cy - 18, 12, 18, 4);
              g.fill();
              if (rm && T < Wd) {
                g.fillStyle = "#e5484d";
                g.font = "700 12px sans-serif";
                g.textAlign = "center";
                g.fillText((Wd - T).toFixed(1), cx, cy + 4);
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
