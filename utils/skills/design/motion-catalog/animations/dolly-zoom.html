<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ドリーズーム（Dolly zoom (Vertigo effect)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-dolly-zoom"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-dolly-zoom-cam">
          <div class="ac-dolly-zoom-L ac-dolly-zoom-sky"><i></i></div>
          <div class="ac-dolly-zoom-L ac-dolly-zoom-far"><i></i></div>
          <div class="ac-dolly-zoom-L ac-dolly-zoom-gr"><i></i></div>
          <div class="ac-dolly-zoom-L ac-dolly-zoom-mid"><i></i></div>
          <div class="ac-dolly-zoom-L ac-dolly-zoom-sub"><i></i></div>
          <div class="ac-dolly-zoom-L ac-dolly-zoom-near"><i></i></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-dolly-zoom .ac-dolly-zoom-cam,
      .ac-dolly-zoom .ac-dolly-zoom-L {
        position: absolute;
        inset: 0;
      }
      .ac-dolly-zoom .ac-dolly-zoom-L i {
        position: absolute;
        display: block;
      }
      .ac-dolly-zoom .ac-dolly-zoom-sky i {
        inset: -150px -160px -30px;
        background:
          radial-gradient(ellipse 26px 10px at 30% 22%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(ellipse 20px 8px at 72% 12%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(circle at 50% 70%, #fff 0 12px, transparent 13px) 0 0 / 220px 100% repeat-x,
          linear-gradient(180deg, #f2f8ff, var(--ice) 70%, var(--sky));
      }
      .ac-dolly-zoom .ac-dolly-zoom-far i {
        left: -330px;
        right: -330px;
        bottom: 30px;
        height: 70px;
        background: radial-gradient(ellipse 60px 46px at 50% 100%, #a9d0ff 98%, transparent) 0 100% / 120px 70px
          repeat-x;
      }
      .ac-dolly-zoom .ac-dolly-zoom-gr i {
        left: -330px;
        right: -330px;
        bottom: -60px;
        height: 96px;
        background: linear-gradient(#b6dcff, #8fc2ff);
      }
      .ac-dolly-zoom .ac-dolly-zoom-mid i {
        left: -304px;
        right: -356px;
        bottom: 26px;
        height: 64px;
        background:
          radial-gradient(circle 15px at 24px 22px, var(--cobalt) 97%, transparent) 0 0 / 52px 64px repeat-x,
          linear-gradient(90deg, transparent 22px, var(--navy) 22px 26px, transparent 26px) 0 100% / 52px 30px repeat-x;
      }
      .ac-dolly-zoom .ac-dolly-zoom-sub i {
        left: 100px;
        bottom: 26px;
        width: 20px;
        height: 34px;
        border-radius: 10px 10px 5px 5px;
        background: var(--blue);
      }
      .ac-dolly-zoom .ac-dolly-zoom-sub i::before {
        content: "";
        position: absolute;
        left: 3px;
        top: -16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
      }
      .ac-dolly-zoom .ac-dolly-zoom-near i {
        left: -330px;
        right: -330px;
        bottom: -16px;
        height: 46px;
        background: radial-gradient(ellipse 34px 26px at 50% 100%, #0f2563 97%, transparent) 0 100% / 110px 46px
          repeat-x;
      }
      .ac-dolly-zoom .ac-dolly-zoom-sky {
        transform: scale(1);
      }
      .ac-dolly-zoom .ac-dolly-zoom-far {
        transform: scale(1);
      }
      .ac-dolly-zoom .ac-dolly-zoom-gr {
        transform: scale(1);
      }
      .ac-dolly-zoom .ac-dolly-zoom-mid {
        transform: scale(1);
      }
      .ac-dolly-zoom .ac-dolly-zoom-near {
        transform: scale(1);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-dolly-zoom .ac-dolly-zoom-sky {
          animation: ac-dolly-zoom-k0 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-dolly-zoom .ac-dolly-zoom-far {
          animation: ac-dolly-zoom-k1 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-dolly-zoom .ac-dolly-zoom-gr {
          animation: ac-dolly-zoom-k2 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-dolly-zoom .ac-dolly-zoom-mid {
          animation: ac-dolly-zoom-k3 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-dolly-zoom .ac-dolly-zoom-near {
          animation: ac-dolly-zoom-k4 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-dolly-zoom-k0 {
        0%,
        20% {
          transform: scale(1);
        }
        80%,
        100% {
          transform: scale(1.9);
        }
      }
      @keyframes ac-dolly-zoom-k1 {
        0%,
        20% {
          transform: scale(1);
        }
        80%,
        100% {
          transform: scale(1.8);
        }
      }
      @keyframes ac-dolly-zoom-k2 {
        0%,
        20% {
          transform: scale(1);
        }
        80%,
        100% {
          transform: scale(1.4);
        }
      }
      @keyframes ac-dolly-zoom-k3 {
        0%,
        20% {
          transform: scale(1);
        }
        80%,
        100% {
          transform: scale(1.35);
        }
      }
      @keyframes ac-dolly-zoom-k4 {
        0%,
        20% {
          transform: scale(1);
        }
        80%,
        100% {
          transform: scale(0.8);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "dolly-zoom",
        name: "ドリーズーム",
        en: "Dolly zoom (Vertigo effect)",
        cat: "カメラ",
        kind: "motion",
        description:
          "カメラを後ろへ下げながら同時にズームインして、被写体の大きさは変えずに、背景だけがぐっと迫ってくる（または遠ざかる）ように見せる動きです。めまい・衝撃・気づきの瞬間を表せます。",
        use: "物語の衝撃的な場面、気づき・ひらめきの演出、ホラーやサスペンスの動画、ヒーローの印象的な導入。",
        params: [{ key: "dur", label: "片道の時間", value: 2400, min: 800, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "被写体の大きさは固定し、背景のレイヤーだけを奥ほど大きく <code>scale</code>（例：奥 1 → 1.8、中 1 → 1.35）｜in-out",
          ],
          ["向き", "背景が迫る：後ろへ下がりながらズームイン。背景が遠ざかる：前へ出ながらズームアウト"],
          [
            "本格的に",
            "3D ではカメラの位置と画角（FOV）を、被写体の見かけの幅が一定になるよう同時に変える：距離 × tan(FOV/2) = 一定",
          ],
          ["動きを減らす設定", "カメラの動きをやめ、最初（または最後）の構図で止める"],
          [
            "出典",
            '<a href="https://www.studiobinder.com/camera-shots/camera-movements/" target="_blank" rel="noopener">StudioBinder: Camera Movements</a>、<a href="https://www.masterclass.com/articles/guide-to-camera-moves" target="_blank" rel="noopener">MasterClass: Guide to Camera Moves</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
