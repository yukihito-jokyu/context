<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ペデスタル（Pedestal） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-camera-pedestal"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-camera-pedestal-cam">
          <div class="ac-camera-pedestal-L ac-camera-pedestal-sky"><i></i></div>
          <div class="ac-camera-pedestal-L ac-camera-pedestal-far"><i></i></div>
          <div class="ac-camera-pedestal-L ac-camera-pedestal-gr"><i></i></div>
          <div class="ac-camera-pedestal-L ac-camera-pedestal-mid"><i></i></div>
          <div class="ac-camera-pedestal-L ac-camera-pedestal-sub"><i></i></div>
          <div class="ac-camera-pedestal-L ac-camera-pedestal-near"><i></i></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-camera-pedestal .ac-camera-pedestal-cam,
      .ac-camera-pedestal .ac-camera-pedestal-L {
        position: absolute;
        inset: 0;
      }
      .ac-camera-pedestal .ac-camera-pedestal-L i {
        position: absolute;
        display: block;
      }
      .ac-camera-pedestal .ac-camera-pedestal-sky i {
        inset: -150px -160px -30px;
        background:
          radial-gradient(ellipse 26px 10px at 30% 22%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(ellipse 20px 8px at 72% 12%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(circle at 50% 70%, #fff 0 12px, transparent 13px) 0 0 / 220px 100% repeat-x,
          linear-gradient(180deg, #f2f8ff, var(--ice) 70%, var(--sky));
      }
      .ac-camera-pedestal .ac-camera-pedestal-far i {
        left: -330px;
        right: -330px;
        bottom: 30px;
        height: 70px;
        background: radial-gradient(ellipse 60px 46px at 50% 100%, #a9d0ff 98%, transparent) 0 100% / 120px 70px
          repeat-x;
      }
      .ac-camera-pedestal .ac-camera-pedestal-gr i {
        left: -330px;
        right: -330px;
        bottom: -60px;
        height: 96px;
        background: linear-gradient(#b6dcff, #8fc2ff);
      }
      .ac-camera-pedestal .ac-camera-pedestal-mid i {
        left: -304px;
        right: -356px;
        bottom: 26px;
        height: 64px;
        background:
          radial-gradient(circle 15px at 24px 22px, var(--cobalt) 97%, transparent) 0 0 / 52px 64px repeat-x,
          linear-gradient(90deg, transparent 22px, var(--navy) 22px 26px, transparent 26px) 0 100% / 52px 30px repeat-x;
      }
      .ac-camera-pedestal .ac-camera-pedestal-sub i {
        left: 100px;
        bottom: 26px;
        width: 20px;
        height: 34px;
        border-radius: 10px 10px 5px 5px;
        background: var(--blue);
      }
      .ac-camera-pedestal .ac-camera-pedestal-sub i::before {
        content: "";
        position: absolute;
        left: 3px;
        top: -16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
      }
      .ac-camera-pedestal .ac-camera-pedestal-near i {
        left: -330px;
        right: -330px;
        bottom: -16px;
        height: 46px;
        background: radial-gradient(ellipse 34px 26px at 50% 100%, #0f2563 97%, transparent) 0 100% / 110px 46px
          repeat-x;
      }
      .ac-camera-pedestal .ac-camera-pedestal-sky {
        transform: translateY(0);
      }
      .ac-camera-pedestal .ac-camera-pedestal-far {
        transform: translateY(0);
      }
      .ac-camera-pedestal .ac-camera-pedestal-gr {
        transform: translateY(0);
      }
      .ac-camera-pedestal .ac-camera-pedestal-mid {
        transform: translateY(0);
      }
      .ac-camera-pedestal .ac-camera-pedestal-sub {
        transform: translateY(0);
      }
      .ac-camera-pedestal .ac-camera-pedestal-near {
        transform: translateY(0);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-camera-pedestal .ac-camera-pedestal-sky {
          animation: ac-camera-pedestal-k0 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-camera-pedestal .ac-camera-pedestal-far {
          animation: ac-camera-pedestal-k1 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-camera-pedestal .ac-camera-pedestal-gr {
          animation: ac-camera-pedestal-k2 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-camera-pedestal .ac-camera-pedestal-mid {
          animation: ac-camera-pedestal-k3 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-camera-pedestal .ac-camera-pedestal-sub {
          animation: ac-camera-pedestal-k4 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
        .ac-camera-pedestal .ac-camera-pedestal-near {
          animation: ac-camera-pedestal-k5 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-camera-pedestal-k0 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(4px);
        }
      }
      @keyframes ac-camera-pedestal-k1 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(10px);
        }
      }
      @keyframes ac-camera-pedestal-k2 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(26px);
        }
      }
      @keyframes ac-camera-pedestal-k3 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(30px);
        }
      }
      @keyframes ac-camera-pedestal-k4 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(34px);
        }
      }
      @keyframes ac-camera-pedestal-k5 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(64px);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "camera-pedestal",
        name: "ペデスタル",
        en: "Pedestal",
        cat: "カメラ",
        kind: "motion",
        description:
          "カメラの向きは変えず、位置だけを真上・真下に上げ下げする動きです。手前の物ほど大きく動き、目の高さが変わっていくので、子どもの目線から大人の目線へ、のような視点の変化を表せます。",
        use: "高さのある商品の紹介、視点が変わる物語の場面、縦スクロールの視差、フロアを上下する案内。",
        params: [{ key: "dur", label: "片道の時間", value: 2400, min: 800, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "奥行きごとのレイヤーを <code>translateY</code>。手前ほど大きく（例：奥 6px、中 24px、手前 60px）｜in-out",
          ],
          ["ティルトとの違い", "ティルトは向きを振るので全体が同じ量動く。ペデスタルは位置が動くので視差が出る"],
          ["時間", "1.5〜3 秒。止めた構図で始めて止めた構図で終える"],
          ["動きを減らす設定", "カメラの動きをやめ、最初（または最後）の構図で止める"],
          [
            "出典",
            '<a href="https://www.studiobinder.com/camera-shots/camera-movements/" target="_blank" rel="noopener">StudioBinder: Camera Movements</a>、<a href="https://www.masterclass.com/articles/guide-to-camera-moves" target="_blank" rel="noopener">MasterClass: Guide to Camera Moves</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
