<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シールをはがす（Sticker peel） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-sticker-peel"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div class="ac-sticker-peel-s">
          <span class="ac-sticker-peel-face sb-grad-sky"
            ><span
              style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.85)"
            ></span></span
          ><span class="ac-sticker-peel-back"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-sticker-peel .ac-sticker-peel-s {
        position: relative;
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 4px 8px rgba(18, 26, 43, 0.15));
        animation: ac-sticker-peel-off 600ms cubic-bezier(0.55, 0, 1, 0.45) calc(500ms + var(--dur, 900ms) + 300ms)
          forwards;
      }
      .ac-sticker-peel .ac-sticker-peel-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 22px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-sticker-peel .ac-sticker-peel-face {
          animation: ac-sticker-peel-cut var(--dur, 900ms) cubic-bezier(0.65, 0, 0.35, 1) 500ms both;
        }
      }
      .ac-sticker-peel .ac-sticker-peel-back {
        position: absolute;
        right: 0;
        bottom: 0;
        width: var(--peel, 46px);
        height: var(--peel, 46px);
        transform-origin: 100% 100%;
        background: linear-gradient(315deg, #fff 30%, #dfe5ef);
        border-radius: 0 0 0 6px;
        clip-path: polygon(0 0, 100% 0, 0 100%);
        filter: drop-shadow(2px 2px 3px rgba(18, 26, 43, 0.25));
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-sticker-peel .ac-sticker-peel-back {
          animation: ac-sticker-peel-fold var(--dur, 900ms) cubic-bezier(0.65, 0, 0.35, 1) 500ms both;
        }
      }
      @keyframes ac-sticker-peel-cut {
        from {
          clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%);
        }
        to {
          clip-path: polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--peel, 46px)),
            calc(100% - var(--peel, 46px)) 100%,
            0 100%
          );
        }
      }
      @keyframes ac-sticker-peel-fold {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes ac-sticker-peel-off {
        to {
          transform: translateY(-14px) rotate(-8deg) scale(1.04);
          opacity: 0;
        }
      }
      @keyframes ac-sticker-peel-fade {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-sticker-peel .ac-sticker-peel-s {
          animation: ac-sticker-peel-fade 300ms 1200ms forwards;
        }
        .ac-sticker-peel .ac-sticker-peel-back {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "sticker-peel",
        name: "シールをはがす",
        en: "Sticker peel",
        cat: "操作への反応",
        kind: "motion",
        description:
          "シールの角がめくれ上がり、裏側（白い台紙の面）を見せながらはがれていく動きです。めくれた分だけ影が濃くなり、最後にシール全体が持ち上がって外れます。プレビューは角を三角に折り返して近い形を作っています。",
        use: "ご褒美・実績のシール、クーポンをはがして使う演出、オンボーディングの遊び、ステッカー型のバッジ。",
        params: [
          { key: "dur", label: "めくる時間", value: 900, min: 400, max: 2000, step: 50, unit: "ms" },
          { key: "peel", label: "めくる量", value: 46, min: 20, max: 70, step: 2, unit: "px" },
        ],
        spec: [
          [
            "めくれ",
            "右下の角を、めくる量の分だけ <code>clip-path</code> で切り取り、同じ大きさの三角（裏側）を折り返して重ねる｜in-out",
          ],
          ["影", "めくれた分だけ、裏側の三角に影を付ける"],
          [
            "はがれる",
            "最後に全体を <code>translateY(-12px) rotate(-8deg)</code>、影を大きくして持ち上げ、<code>opacity → 0</code>",
          ],
          ["動きを減らす設定", "めくる動きをやめ、透明度で消すだけにする"],
          [
            "出典",
            '<a href="https://reactbits.dev/animations/sticker-peel" target="_blank" rel="noopener">React Bits</a>',
          ],
        ],
        loop: 3400,
      });
    </script>
  </body>
</html>
