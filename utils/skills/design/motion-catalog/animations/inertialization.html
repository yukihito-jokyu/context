<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>慣性ブレンド（Inertialization (inertial blending)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-inertialization"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "inertialization",
        name: "慣性ブレンド",
        en: "Inertialization (inertial blending)",
        cat: "キャラクター",
        kind: "motion",
        description:
          "動きを切り替える瞬間に、2 つのアニメーションを混ぜず、すぐ新しい方へ切り替えて、前の動きとの差（ずれと勢い）だけを短い時間で 0 へ減らす方法です。混ぜる計算が要らず、切り替えが自然で軽くなります。",
        use: "キャラクターの動きの切り替え、モーションマッチングのつなぎ。",
        params: [],
        spec: [
          ["仕組み", "切り替えの瞬間の差 x₀ と変化の速さ v₀ を覚え、0.1〜0.3 秒で 0 へなめらかに減らす曲線で足す"],
          [
            "良い点",
            "2 つのアニメーションを同時に計算しなくてよい。前の動きの勢いを保つので、急な切り替えでもカクッとしない",
          ],
          ["各環境では", "Unreal・Unity のアニメーション機能（Unreal の Inertialization ノード）"],
          ["動きを減らす設定", "動きを止め、代表的なポーズの静止画にする"],
          [
            "出典",
            '<a href="https://dev.epicgames.com/documentation/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine?lang=en-US" target="_blank" rel="noopener">dev.epicgames.com（animation-blueprint-blend-no）</a>、<a href="https://dev.epicgames.com/documentation/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine" target="_blank" rel="noopener">dev.epicgames.com（animation-blueprint-blend-no）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            const lp = (a, b, k) => {
              const o = {};
              for (const key in a) o[key] = a[key] + (b[key] - a[key]) * k;
              return o;
            };
            const ez = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
              cl = (u) => Math.min(1, Math.max(0, u));
            const txt = (s, x, y, c = col("ink-muted"), al = "left") => {
              g.fillStyle = c;
              g.font = "600 10px sans-serif";
              g.textAlign = al;
              g.fillText(s, x, y);
            };
            const GUARD = { lean: 0.05, t1: 0.35, s1: -0.3, t2: -0.3, s2: -0.1, u1: 2.2, f1: 1.6, u2: 2.4, f2: 1.7 };
            const frame = (t) => {
              const T = rm ? 1.3 : t % 3,
                sw = 1.0,
                a = (u) => 0.9 * sin(u * 4),
                b = (u) => -0.4 + 0.1 * sin(u * 2),
                D = 0.35;
              const x0 = a(sw) - b(sw),
                v0 = (a(sw + 0.01) - a(sw)) / 0.01 - (b(sw + 0.01) - b(sw)) / 0.01,
                off = (u) => {
                  const s = u - sw;
                  if (s < 0) return 0;
                  if (s > D) return 0;
                  const k = s / D;
                  return x0 * (1 - 3 * k * k + 2 * k * k * k) + v0 * D * (k - 2 * k * k + k * k * k);
                };
              const val = (u) => (u < sw ? a(u) : b(u) + off(u)),
                cf = (u) => (u < sw ? a(u) : u > sw + D ? b(u) : a(u) + (b(u) - a(u)) * ((u - sw) / D));
              g.clearRect(0, 0, W, H);
              g.fillStyle = "#f8fbff";
              g.fillRect(10, 10, 200, 90);
              const X = (u) => 10 + (u / 3) * 200,
                Y = (vv) => 55 - vv * 40;
              g.strokeStyle = col("line");
              g.lineWidth = 1;
              g.beginPath();
              g.moveTo(X(sw), 12);
              g.lineTo(X(sw), 98);
              g.stroke();
              g.strokeStyle = "rgba(229,72,77,.6)";
              g.setLineDash([3, 3]);
              g.beginPath();
              for (let i = 0; i <= 150; i++) {
                const u = i / 50;
                i ? g.lineTo(X(u), Y(cf(u))) : g.moveTo(X(u), Y(cf(u)));
              }
              g.stroke();
              g.setLineDash([]);
              g.strokeStyle = col("blue");
              g.lineWidth = 2;
              g.beginPath();
              for (let i = 0; i <= 150; i++) {
                const u = i / 50;
                i ? g.lineTo(X(u), Y(val(u))) : g.moveTo(X(u), Y(val(u)));
              }
              g.stroke();
              dot(X(T), Y(val(T)), 4, col("navy"));
              txt("慣性ブレンド", 14, 116, col("blue"));
              txt("クロスフェード", 14, 132, "#e5484d");
              const ang = val(T);
              line(
                [
                  [160, 120],
                  [160 + sin(ang) * 24, 120 - cos(ang) * 24],
                ],
                5,
                col("blue"),
              );
              dot(160, 120, 4, col("navy"));
            };
            if (rm) {
              frame(0);
              return null;
            } // 動きを減らす設定：代表的なポーズを一度だけ描く
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
