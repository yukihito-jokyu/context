<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>粒子の渦（Particle vortex） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-particle-vortex"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "particle-vortex",
        name: "粒子の渦",
        en: "Particle vortex",
        cat: "背景",
        kind: "motion",
        description:
          "たくさんの小さな粒が、中心のまわりを回りながら少しずつ内側（または外側）へ流れ、渦を描き続ける背景です。吸い込まれるような奥行きと、エネルギーの集まる感じがあります。",
        use: "AI・宇宙・エネルギーをテーマにしたヒーロー、ローディング画面、ゲームのタイトル。",
        params: [
          { key: "n", label: "粒の数", value: 220, min: 50, max: 500, step: 10, unit: "個" },
          { key: "speed", label: "回る速さ", value: 1, min: 0.2, max: 3, step: 0.1, unit: "" },
        ],
        spec: [
          [
            "動き",
            "粒ごとに中心からの距離 r と角度 θ を持ち、毎フレーム θ を r に反比例して進め（内側ほど速い）、r を少しずつ縮める",
          ],
          ["尾", "画面を半透明の背景色で塗り重ねてから描くと、尾が残って流れが見える"],
          ["生まれ直し", "中心に着いた粒は外側のランダムな角度に戻す"],
          [
            "控えめに",
            "背景は主役ではない。コントラストと速さを抑え、前景の文字が読めることを優先する。画面外・非表示のときは止める",
          ],
          ["動きを減らす設定", "背景の動きを止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://ui.aceternity.com/components/vortex" target="_blank" rel="noopener">Aceternity UI: Vortex</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const cs = ["sky", "aqua", "ice"].map((k) => col(k) || "#8ab4ff"),
              ps = Array.from({ length: v.n }, () => ({
                r: 8 + Math.random() * 110,
                a: Math.random() * 7,
                c: cs[Math.floor(Math.random() * 3)],
              }));
            g.fillStyle = col("navy") || "#14245a";
            g.fillRect(0, 0, W, H);
            const step = (dt) => {
              g.fillStyle = "rgba(20,36,90,.2)";
              g.fillRect(0, 0, W, H);
              for (const p of ps) {
                p.a += ((v.speed * 30) / (p.r + 10)) * dt * 3;
                p.r -= 6 * dt;
                if (p.r < 4) {
                  p.r = 110;
                  p.a = Math.random() * 7;
                }
                g.fillStyle = p.c;
                g.fillRect(W / 2 + Math.cos(p.a) * p.r * 1.3, H / 2 + Math.sin(p.a) * p.r * 0.8, 1.6, 1.6);
              }
            };
            if (rm) {
              step(0);
              return null;
            }
            let last = 0;
            return raf((t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              step(dt);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
