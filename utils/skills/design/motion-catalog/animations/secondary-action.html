<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>副次動作（Secondary action） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-secondary-action"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          place-items: center;
        "
      >
        <div class="ac-secondary-action-l">
          <span
            class="sb-btn sb-btn--primary ac-secondary-action-a"
            style="width: 84px; filter: grayscale(1); opacity: 0.55"
            ><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l18-8-8 18-2-8z" /></svg
          ></span>
        </div>
        <div class="ac-secondary-action-r">
          <span class="sb-btn sb-btn--primary ac-secondary-action-b" style="width: 84px; overflow: visible"
            ><svg class="ac-secondary-action-pl" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 11l18-8-8 18-2-8z" /></svg
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-secondary-action .ac-secondary-action-a,
      .ac-secondary-action .ac-secondary-action-b {
        animation: ac-secondary-action-press 300ms cubic-bezier(0.22, 1, 0.36, 1) 600ms both;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-secondary-action .ac-secondary-action-pl {
          animation:
            ac-secondary-action-fly var(--dur, 600ms) cubic-bezier(0.55, 0, 1, 0.45) 700ms both,
            ac-secondary-action-back 300ms cubic-bezier(0.22, 1, 0.36, 1) calc(700ms + var(--dur, 600ms) + 400ms)
              forwards;
        }
      }
      @keyframes ac-secondary-action-press {
        0%,
        100% {
          transform: scale(1);
        }
        40% {
          transform: scale(0.92);
        }
      }
      @keyframes ac-secondary-action-fly {
        from {
          transform: none;
          opacity: 1;
        }
        to {
          transform: translate(40px, -40px) rotate(-10deg);
          opacity: 0;
        }
      }
      @keyframes ac-secondary-action-back {
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "secondary-action",
        name: "副次動作",
        en: "Secondary action",
        cat: "原則",
        kind: "concept",
        description:
          "主な動きに、それを支える小さな別の動きを添えて、より豊かに伝えるという原則です。左は送信ボタンが押されるだけ、右は押されると同時に紙飛行機のアイコンが飛び立ち、ボタンが「送った」ことをもう一押し伝えます。",
        use: "送信・保存・いいねなどのボタン、トグル、ナビゲーションのアイコン、キャラクターの表情。",
        params: [{ key: "dur", label: "時間", value: 600, min: 200, max: 1200, step: 10, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["主と副", "主な動き（ボタンが押し込まれる）を邪魔しない大きさ・速さで、副の動き（アイコンが飛ぶ）を重ねる"],
          ["タイミング", "副の動きは主と同時か、わずかに遅らせる。主より目立たせない"],
          ["比べる", "左（灰色）がこの原則なし、右（青）がこの原則あり"],
          ["動きを減らす設定", "副の動きをやめ、主の動き（または色の変化）だけにする"],
          [
            "出典",
            '<a href="https://www.adobe.com/creativecloud/animation/discover/principles-of-animation.html" target="_blank" rel="noopener">Adobe: 12 principles of animation</a>',
          ],
        ],
        loop: 2400,
      });
    </script>
  </body>
</html>
