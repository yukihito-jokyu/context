<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>粘菌の道（Physarum trail network） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-physarum-trails"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "physarum-trails",
        name: "粘菌の道",
        en: "Physarum trail network",
        cat: "背景",
        kind: "motion",
        description:
          "たくさんの小さな点（粘菌のエージェント）が、自分たちの残した跡の濃い方へ向きを変えながら進み、跡は少しずつ広がって薄れていきます。くり返すうちに、点どうしが網の目のような道をつくり、太い道に集まっていきます。",
        use: "ネットワーク・物流・生命科学のビジュアル、ジェネラティブなヒーロー、アート作品。",
        params: [{ key: "n", label: "エージェントの数", value: 1500, min: 300, max: 4000, step: 100, unit: "個" }],
        spec: [
          [
            "エージェント",
            "前・左前・右前の 3 か所の跡の濃さを調べ、いちばん濃い方へ少し向きを変えて 1 歩進み、今いる場所に跡を足す",
          ],
          ["跡の場", "毎ステップ、跡をまわりに少しぼかし（拡散）、全体を少し薄める（減衰）"],
          [
            "本格的に",
            "数万〜数百万のエージェントは、WebGPU のコンピュートか WebGL 2 のフラグメントシェーダー（2枚のテクスチャを交互に）で動かす",
          ],
          ["動きを減らす設定", "動きを止め、育った網の目の静止画にする"],
          [
            "出典",
            '<a href="https://arxiv.org/abs/1503.06579" target="_blank" rel="noopener">arxiv.org（1503.06579）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const lw = 110,
              lh = 75,
              off = document.createElement("canvas");
            off.width = lw;
            off.height = lh;
            const og = off.getContext("2d"),
              img = og.createImageData(lw, lh),
              px = img.data;
            const blit = () => {
              og.putImageData(img, 0, 0);
              g.imageSmoothingEnabled = false;
              g.drawImage(off, 0, 0, W, H);
            };
            const put = (i, r, gg, b) => {
              px[i * 4] = r;
              px[i * 4 + 1] = gg;
              px[i * 4 + 2] = b;
              px[i * 4 + 3] = 255;
            };
            const N = lw * lh;
            let T1 = new Float32Array(N),
              T2 = new Float32Array(N);
            const ag = Array.from({ length: 4000 }, () => [rnd() * lw, rnd() * lh, rnd() * TAU]);
            const smp = (x, y) => T1[((Math.round(y) + lh) % lh) * lw + ((Math.round(x) + lw) % lw)];
            const step = () => {
              const sa = 0.7,
                sd = 7,
                ra = 0.5;
              for (let k = 0; k < v.n; k++) {
                const a = ag[k];
                const F = smp(a[0] + cos(a[2]) * sd, a[1] + sin(a[2]) * sd),
                  L = smp(a[0] + cos(a[2] - sa) * sd, a[1] + sin(a[2] - sa) * sd),
                  R = smp(a[0] + cos(a[2] + sa) * sd, a[1] + sin(a[2] + sa) * sd);
                if (F < L && F < R) a[2] += (rnd() < 0.5 ? -1 : 1) * ra;
                else if (L > R) a[2] -= ra;
                else if (R > L) a[2] += ra;
                a[0] = (a[0] + cos(a[2]) + lw) % lw;
                a[1] = (a[1] + sin(a[2]) + lh) % lh;
                T1[Math.floor(a[1]) * lw + Math.floor(a[0])] += 1;
              }
              for (let y = 0; y < lh; y++)
                for (let x = 0; x < lw; x++) {
                  let s = 0;
                  for (let dy = -1; dy <= 1; dy++)
                    for (let dx = -1; dx <= 1; dx++) s += T1[((y + dy + lh) % lh) * lw + ((x + dx + lw) % lw)];
                  T2[y * lw + x] = (T1[y * lw + x] * 0.4 + (s / 9) * 0.6) * 0.85;
                }
              [T1, T2] = [T2, T1];
            };
            if (rm) for (let i = 0; i < 200; i++) step();
            let t0 = 0;
            return raf((t) => {
              if (!rm) {
                if (t - t0 > 20) {
                  T1.fill(0);
                  ag.forEach((a) => {
                    a[0] = rnd() * lw;
                    a[1] = rnd() * lh;
                    a[2] = rnd() * TAU;
                  });
                  t0 = t;
                }
                step();
              }
              for (let i = 0; i < N; i++) {
                const c = Math.min(1, T1[i] / 3);
                put(i, 15 + 150 * c, 30 + 190 * c, 80 + 175 * c);
              }
              blit();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
