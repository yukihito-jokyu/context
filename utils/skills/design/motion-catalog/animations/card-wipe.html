    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-card-wipe .ac-card-wipe-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-card-wipe .ac-card-wipe-g {
        position: absolute;
        inset: 0;
        perspective: 600px;
      }
      .ac-card-wipe .ac-card-wipe-c {
        position: absolute;
        width: 44px;
        height: 50px;
        transform-style: preserve-3d;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-card-wipe .ac-card-wipe-c {
          animation: ac-card-wipe-t var(--dur, 2600ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
          animation-delay: calc(var(--k) * 500ms);
        }
      }
      .ac-card-wipe .ac-card-wipe-c b {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
      }
      .ac-card-wipe .ac-card-wipe-c .ac-card-wipe-bk {
        transform: rotateY(180deg);
      }
      @keyframes ac-card-wipe-t {
        0%,
        25% {
          transform: rotateY(0);
        }
        65%,
        100% {
          transform: rotateY(180deg);
        }
      }
      @keyframes ac-card-wipe-rf {
        0%,
        45% {
          opacity: 0;
        }
        55%,
        100% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-card-wipe .ac-card-wipe-c .ac-card-wipe-bk {
          transform: none;
          animation: ac-card-wipe-rf var(--dur, 2600ms) linear infinite alternate;
        }
      }
    </style>

    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "card-wipe",
        name: "カードワイプ",
        en: "Card wipe",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "画面をトランプのような小さなカードに分け、表に前のショット、裏に次のショットを貼って、端から順にくるりと裏返していく切り替えです。",
        use: "写真ギャラリーの切り替え、ゲームの場面転換、イベントの告知、カードを集める演出。",
        params: [{ key: "dur", label: "片道の長さ", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "格子のカードごとに表（A の一部）と裏（B の一部）を重ね、<code>rotateY(0 → 180deg)</code>。<code>backface-visibility: hidden</code>",
          ],
          ["順番", "列ごとに <code>animation-delay</code> を 40〜80ms ずらす（斜めにすると波のよう）"],
          ["奥行き", "親に <code>perspective: 600px</code>"],
          ["動きを減らす設定", "裏返しをやめ、短いクロスフェードにする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Transition）</a>',
          ],
        ],
        loop: 0,
      });
    </script>
