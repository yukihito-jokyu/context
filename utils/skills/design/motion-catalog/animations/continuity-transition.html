<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>つながりのある変化（Continuity transition） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-continuity-transition"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div class="ac-continuity-transition-s sb-card">
          <span class="sb-shape sb-shape--round sb-shape--on" style="width: 20px; height: 20px"></span>
          <div class="ac-continuity-transition-in">
            <span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 110px"></span
            ><span class="sb-bar sb-bar--sm" style="width: 140px"></span
            ><span class="sb-bar sb-bar--sm sb-bar--soft" style="width: 90px"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-continuity-transition .ac-continuity-transition-s {
        position: relative;
        box-sizing: border-box;
        width: 110px;
        height: 44px;
        padding: 12px;
        border-radius: 22px;
        overflow: hidden;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-continuity-transition .ac-continuity-transition-s {
          transition:
            width var(--dur, 400ms) cubic-bezier(0.65, 0, 0.35, 1),
            height var(--dur, 400ms) cubic-bezier(0.65, 0, 0.35, 1),
            border-radius var(--dur, 400ms) cubic-bezier(0.65, 0, 0.35, 1);
        }
      }
      .ac-continuity-transition .ac-continuity-transition-in {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
        opacity: 0;
        transition: opacity 150ms;
      }
      .ac-continuity-transition .ac-continuity-transition-s.open {
        width: 200px;
        height: 130px;
        border-radius: 28px;
      }
      .ac-continuity-transition .ac-continuity-transition-s.open .ac-continuity-transition-in {
        opacity: 1;
        transition: opacity 200ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--dur, 400ms) * 0.7);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "continuity-transition",
        name: "つながりのある変化",
        en: "Continuity transition",
        cat: "状態の遷移",
        kind: "motion",
        description:
          "同じ要素が大きくなったり小さくなったりして、変化の前と後を目に見える形でつなぐ切り替えです。別物に入れ替わるのではなく「同じものが広がった」とわかるので、見失いません。",
        use: "チップからカードへの展開、検索ボックスの拡大、ミニプレーヤーから全画面プレーヤーへ。",
        params: [{ key: "dur", label: "時間", value: 400, min: 150, max: 1000, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "動き",
            "幅・高さ・角丸を、小さいピル ↔ 大きいカードのあいだで変える｜in-out <code>cubic-bezier(0.65, 0, 0.35, 1)</code>",
          ],
          ["中身", "広がったあとに中身を <code>opacity</code> で出す（広がりきる前に出さない）"],
          [
            "実装",
            "大きさの変化は FLIP（<code>transform: scale</code>）か Framer Motion の <code>layout</code> で行うとなめらか",
          ],
          ["動きを減らす設定", "大きさの変化をやめ、クロスフェードで切り替える"],
          ["出典", "Animation Vocabulary（Transitions Between States）"],
        ],
        loop: 0,
        run: (stage) => {
          const el = stage.querySelector(".ac-continuity-transition-s");
          const t = setInterval(() => el.classList.toggle("open"), 1800);
          return () => clearInterval(t);
        },
      });
    </script>
  </body>
</html>
