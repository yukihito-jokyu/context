<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>長押しで確定（Hold to confirm） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-hold-to-confirm" style="position: relative; width: 200px; height: 150px">
        <span
          class="sb-btn sb-btn--l sb-btn--soft ac-hold-to-confirm-b"
          style="position: absolute; left: 20px; top: 52px; width: 160px; overflow: hidden"
          ><i class="ac-hold-to-confirm-fill"></i
          ><span class="ac-hold-to-confirm-l"
            ><span class="sb-bar sb-bar--xs sb-bar--on-soft" style="width: 64px"></span></span
          ><span class="ac-hold-to-confirm-ok"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" /></svg></span></span
        ><span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-hold-to-confirm .ac-hold-to-confirm-fill {
        position: absolute;
        inset: 0;
        background: var(--blue);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .ac-hold-to-confirm .ac-hold-to-confirm-b.is-hold .ac-hold-to-confirm-fill {
        transform: scaleX(1);
        transition: transform var(--hold, 1200ms) linear;
      }
      .ac-hold-to-confirm .ac-hold-to-confirm-l,
      .ac-hold-to-confirm .ac-hold-to-confirm-ok {
        position: relative;
      }
      .ac-hold-to-confirm .ac-hold-to-confirm-ok {
        position: absolute;
        display: grid;
        place-items: center;
        inset: 0;
        color: var(--on-blue);
        opacity: 0;
        transform: scale(0.6);
        transition:
          opacity 200ms,
          transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .ac-hold-to-confirm .ac-hold-to-confirm-ok svg {
        width: 22px;
        height: 22px;
      }
      .ac-hold-to-confirm .ac-hold-to-confirm-b.is-done .ac-hold-to-confirm-l {
        opacity: 0;
      }
      .ac-hold-to-confirm .ac-hold-to-confirm-b.is-done .ac-hold-to-confirm-ok {
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-hold-to-confirm .ac-hold-to-confirm-ok {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "hold-to-confirm",
        name: "長押しで確定",
        en: "Hold to confirm",
        cat: "操作への反応",
        kind: "motion",
        description:
          "ボタンを押し続けている間だけ中が満ちていき、満ちきったら確定する動きです。途中で離すと元に戻ります。取り返しのつかない操作を、うっかり実行させないために使います。",
        use: "削除・送金・退会など取り消せない操作、長押しで起動する機能。",
        params: [{ key: "hold", label: "長押しの時間", value: 1200, min: 500, max: 3000, step: 100, unit: "ms" }],
        total: (p) => p["hold"],
        spec: [
          ["満ちる", "<code>pointerdown</code> で塗りを <code>scaleX(0 → 1)</code>｜linear｜長押し時間"],
          [
            "中断",
            "解放・離脱・<code>pointercancel</code>・<code>lostpointercapture</code> でタイマー解除、塗りを戻す｜200ms out",
          ],
          ["確定", "満了でチェック（spring）。キーは確認 <code>button</code> で確定"],
          ["動きを減らす設定", "塗りの伸びは進捗の情報なので残してよい。完了の弾みはやめる"],
          ["出典", "Animation Vocabulary（Feedback & Interaction）"],
        ],
        loop: 0,
        run: (stage, v) => {
          const seq = (period, steps) => {
            let ts = [];
            const once = () => {
              ts = steps.map(([at, fn]) => setTimeout(fn, at));
            };
            once();
            const iv = setInterval(once, period);
            return () => {
              clearInterval(iv);
              ts.forEach(clearTimeout);
            };
          };
          const cur = stage.querySelector(".ac-cursor");
          const move = (x, y, ms = 500) => {
            cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
            cur.style.transform = `translate(${x}px, ${y}px)`;
            if (!ms) void cur.offsetWidth;
          };
          const show = (on) => {
            cur.style.opacity = on ? 1 : 0;
          };
          const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
          const b = stage.querySelector(".ac-hold-to-confirm-b"),
            h = v.hold;
          move(170, 140, 0);
          return seq(h + 2200, [
            [
              100,
              () => {
                show(1);
                move(100, 78, 500);
              },
            ],
            [700, () => b.classList.add("is-hold")],
            [700 + h, () => b.classList.add("is-done")],
            [
              900 + h,
              () => {
                move(170, 140, 400);
              },
            ],
            [1200 + h, () => show(0)],
            [1900 + h, () => b.classList.remove("is-hold", "is-done")],
          ]);
        },
      });
    </script>
  </body>
</html>
