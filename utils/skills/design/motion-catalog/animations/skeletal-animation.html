<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>骨格アニメーション（Skeletal animation (rig)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-skeletal-animation"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "skeletal-animation",
        name: "骨格アニメーション",
        en: "Skeletal animation (rig)",
        cat: "キャラクター",
        kind: "motion",
        description:
          "キャラクターの中に「骨」を親子の階層でつないで入れ（リグ）、骨を回すと、くっついた体の部品が一緒に動くようにする方法です。肩を回せば腕全体が、肘を回せば前腕から先がついてきます。1枚ずつ絵を描かずに、少ないデータでなめらかに動かせます。",
        use: "Web やアプリのキャラクター（Spine・Rive・Live2D）、ゲームのキャラクター、動くマスコット、3D のアバター。",
        params: [{ key: "period", label: "1周の時間", value: 2000, min: 800, max: 4000, step: 100, unit: "ms" }],
        spec: [
          [
            "仕組み",
            "骨ごとに「親からの位置・回転」を持ち、親の変形を掛け合わせて自分の位置を決める（親 → 子の順に計算）",
          ],
          ["部品", "画像やパーツを骨に貼り付け、骨の変形をそのまま受け取る（なめらかに曲げるならウェイト）"],
          ["Web では", "Spine・Rive・Lottie のランタイム、3D なら three.js の <code>SkinnedMesh</code> で再生する"],
          ["動きを減らす設定", "動きを止め、骨を表示したポーズにする"],
          [
            "出典",
            '<a href="https://esotericsoftware.com/spine-in-depth" target="_blank" rel="noopener">Spine: In Depth（Features）</a>、<a href="https://rive.app/features" target="_blank" rel="noopener">Rive Features</a>、<a href="https://docs.blender.org/manual/en/latest/animation/" target="_blank" rel="noopener">Blender マニュアル: Animation & Rigging</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            return raf((t) => {
              const ph = rm ? 1 : (t * TAU) / (v.period / 1000),
                showB = rm || Math.floor(t / (v.period / 1000)) % 2 === 1;
              g.clearRect(0, 0, W, H);
              const hip = [100, 110],
                lean = 0.05 * sin(ph),
                neck = seg(hip[0], hip[1], Math.PI + lean, 44),
                sh = [neck[0], neck[1] + 6];
              const a1 = -2.4 + 0.35 * sin(ph),
                a2 = -0.6 - 0.5 * sin(ph * 2),
                el = seg(sh[0], sh[1], a1, 26),
                wr = seg(el[0], el[1], a1 + a2, 24);
              const part = (p, q, w, c) => line([p, q], w, c);
              part(hip, neck, 26, col("sky"));
              dot(neck[0] + sin(lean) * -2, neck[1] - 16, 15, col("sky"));
              part([hip[0] - 6, hip[1]], [hip[0] - 8, 140], 12, col("sky"));
              part([hip[0] + 6, hip[1]], [hip[0] + 10, 140], 12, col("sky"));
              part(sh, el, 12, col("cobalt"));
              part(el, wr, 11, col("cobalt"));
              dot(wr[0], wr[1], 7, col("cobalt"));
              if (showB) {
                const bone = (p, q) => {
                  const a = Math.atan2(q[1] - p[1], q[0] - p[0]),
                    L = Math.hypot(q[0] - p[0], q[1] - p[1]);
                  g.save();
                  g.translate(p[0], p[1]);
                  g.rotate(a);
                  g.fillStyle = "rgba(255,255,255,.9)";
                  g.strokeStyle = col("navy");
                  g.lineWidth = 1.5;
                  g.beginPath();
                  g.moveTo(0, 0);
                  g.lineTo(L * 0.2, -4);
                  g.lineTo(L, 0);
                  g.lineTo(L * 0.2, 4);
                  g.closePath();
                  g.fill();
                  g.stroke();
                  g.restore();
                  dot(p[0], p[1], 3, col("navy"));
                };
                bone(hip, neck);
                bone(sh, el);
                bone(el, wr);
                bone(neck, [neck[0], neck[1] - 28]);
              }
              g.fillStyle = col("ink-muted");
              g.font = "600 11px sans-serif";
              g.fillText(showB ? "骨を表示" : "見た目だけ", 150, 20);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
