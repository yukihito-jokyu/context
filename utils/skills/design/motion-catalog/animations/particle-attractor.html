<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>引き寄せる点（Point-attracted particles） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-particle-attractor"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "particle-attractor",
        name: "引き寄せる点",
        en: "Point-attracted particles",
        cat: "移動・変形",
        kind: "motion",
        description:
          "空間のある点（アトラクター）が粒を引き寄せ、粒は引かれて曲がりながら、点のまわりを回り込んだり吸い込まれたりする動きです。点を動かすと、粒の流れ全体がそれに引っぱられて形を変えます。",
        use: "魔法の吸い込み・ブラックホールの演出、カーソルに吸い寄せられる粒、集まる・収束を表す背景。",
        params: [{ key: "k", label: "引き寄せる強さ", value: 1, min: 0.2, max: 3, step: 0.1, unit: "" }],
        spec: [
          [
            "仕組み",
            "粒ごとに、アトラクターへ向かう力 <code>強さ / (距離² + ε)</code>（上限あり）を速さに足す。少し減衰させないと飛び回り続ける",
          ],
          ["変化", "強さを負にすると押しのける点（リペラー）になる。向きに垂直な力を足すと渦になる"],
          ["各環境では", "Unity の VFX Graph（Conform to Sphere・Gravity）、three.js の GPGPU の粒"],
          ["動きを減らす設定", "粒の動きを止め、引き寄せられた形の静止画にする"],
          [
            "出典",
            '<a href="https://dev.epicgames.com/documentation/en-us/unreal-engine/effects-content-examples?application_version=4.27" target="_blank" rel="noopener">dev.epicgames.com（effects-content-examples）</a>、<a href="https://dev.epicgames.com/documentation/unreal-engine/1.4---gpu-particles-with-point-gravity?application_version=4.27" target="_blank" rel="noopener">dev.epicgames.com（1.4---gpu-particles-with-poi）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const N = 220,
              P0 = Array.from({ length: N }, () => ({ x: rnd() * W, y: rnd() * H, vx: 0, vy: 0 }));
            const steps = (() => {
              let acc = 0,
                last = null,
                warmed = false;
              return (t, fn, warm = 90) => {
                if (rm) {
                  if (!warmed) {
                    warmed = true;
                    for (let i = 0; i < warm; i++) fn();
                  }
                  return;
                }
                if (last !== null) acc += Math.min(0.1, t - last);
                last = t;
                for (let n = 0; acc >= 1 / 60 && n < 6; n++) {
                  fn();
                  acc -= 1 / 60;
                }
              };
            })();
            return raf((t) => {
              if (rm) t = 0;
              const ax = 110 + 60 * sin(t * 0.6),
                ay = 75 + 35 * sin(t * 0.9);
              g.fillStyle = rm ? "#0f2563" : "rgba(15,37,99,.35)";
              g.fillRect(0, 0, W, H);
              steps(t, () => {
                for (const p of P0) {
                  const dx = ax - p.x,
                    dy = ay - p.y,
                    r2 = dx * dx + dy * dy,
                    d2 = r2 + 80,
                    f = Math.min(0.5, (220 * v.k) / d2),
                    d = Math.sqrt(d2);
                  p.vx = (p.vx + (dx / d) * f + (dy / d) * 0.02) * 0.985;
                  p.vy = (p.vy + (dy / d) * f - (dx / d) * 0.02) * 0.985;
                  p.x += p.vx;
                  p.y += p.vy;
                  if (r2 < 36 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
                    const e = (rnd() * 4) | 0;
                    p.x = e < 2 ? (e ? W : 0) : rnd() * W;
                    p.y = e >= 2 ? (e === 2 ? 0 : H) : rnd() * H;
                    p.vx = p.vy = 0;
                  }
                }
              });
              g.fillStyle = "#93c5fd";
              for (const p of P0) g.fillRect(p.x, p.y, 1.6, 1.6);
              dot(ax, ay, 4, "#fff");
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
