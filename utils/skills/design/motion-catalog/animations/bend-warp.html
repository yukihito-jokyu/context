<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>曲げる（Bend） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-bend-warp"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "bend-warp",
        name: "曲げる",
        en: "Bend",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "まっすぐな画像や文字の帯を、しなる棒や紙のように弓なりに曲げる変形です。曲がり具合を動かすと、柔らかくしなったり、丸まったりする動きになります。",
        use: "タイトルの文字を弓なりに曲げる演出、紙やリボンがしなる表現、ゆるいキャラクターの体のしなり。",
        params: [{ key: "amt", label: "曲げの強さ", value: 1, min: 0, max: 1.6, step: 0.05, unit: "" }],
        spec: [
          ["仕組み", "帯の各点を、曲がり具合 k の円弧の上へ移す（帯の横位置 → 円弧上の角度、縦位置 → 半径）"],
          [
            "Web では",
            "SVG の文字なら <code>textPath</code> の円弧を変える。画像なら細い帯に分けて少しずつ回転・移動するか、WebGL の頂点で曲げる",
          ],
          ["ツールでは", "After Effects の CC Bend It / CC Bender、Illustrator のエンベロープ"],
          ["動きを減らす設定", "曲げる動きを止め、少し曲げた形にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Distort）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const L = 160,
              Hh = 34,
              N = 40;
            return raf((t) => {
              const k = (rm ? 0.6 : sin(t * 1.6)) * v.amt * 0.025;
              g.clearRect(0, 0, W, H);
              const map = (s, y) => {
                if (Math.abs(k) < 1e-4) return [110 + s, 75 + y];
                const R = 1 / k,
                  a = s * k;
                return [110 + (R - y) * sin(a), 75 + R - (R - y) * cos(a)];
              };
              for (let i = 0; i < N; i++) {
                const s0 = -L / 2 + (L * i) / N,
                  s1 = s0 + L / N,
                  p = [map(s0, -Hh / 2), map(s1, -Hh / 2), map(s1, Hh / 2), map(s0, Hh / 2)];
                g.fillStyle = i % 8 < 4 ? col("blue") : col("sky");
                g.beginPath();
                g.moveTo(...p[0]);
                p.slice(1).forEach((q) => g.lineTo(...q));
                g.closePath();
                g.fill();
                g.strokeStyle = g.fillStyle;
                g.lineWidth = 0.6;
                g.stroke();
              }
              g.strokeStyle = "#fff";
              g.lineWidth = 3;
              g.lineCap = "round";
              g.beginPath();
              for (let i = 0; i <= N; i++) {
                const p = map(-L / 2 + 16 + ((L - 32) * i) / N, 0);
                i ? g.lineTo(...p) : g.moveTo(...p);
              }
              g.stroke();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
