<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>補間（トゥイーン）（Interpolation / Tween） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-tween" style="position: relative; width: 220px; height: 100px">
        <span
          class="sb-thumb sb-grad-sky ac-tween-g"
          style="position: absolute; top: 30px; left: 0px; width: 40px; height: 40px; border-radius: 12px; --k: 0"
        ></span
        ><span
          class="sb-thumb sb-grad-sky ac-tween-g"
          style="position: absolute; top: 30px; left: 45px; width: 40px; height: 40px; border-radius: 12px; --k: 1"
        ></span
        ><span
          class="sb-thumb sb-grad-sky ac-tween-g"
          style="position: absolute; top: 30px; left: 90px; width: 40px; height: 40px; border-radius: 12px; --k: 2"
        ></span
        ><span
          class="sb-thumb sb-grad-sky ac-tween-g"
          style="position: absolute; top: 30px; left: 135px; width: 40px; height: 40px; border-radius: 12px; --k: 3"
        ></span
        ><span
          class="sb-thumb sb-grad-sky ac-tween-g"
          style="position: absolute; top: 30px; left: 180px; width: 40px; height: 40px; border-radius: 12px; --k: 4"
        ></span
        ><span
          class="sb-thumb sb-grad-sky ac-tween-t"
          style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 12px; top: 30px"
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-tween .ac-tween-g {
        opacity: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-tween .ac-tween-g {
          animation: ac-tween-ghost 200ms ease-out calc(var(--dur, 1000ms) * var(--k) / 4) forwards;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-tween .ac-tween-t {
          animation: ac-tween-move var(--dur, 1000ms) linear both;
        }
      }
      @keyframes ac-tween-move {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(180px);
        }
      }
      @keyframes ac-tween-ghost {
        to {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-tween .ac-tween-t {
          transform: translateX(180px);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "tween",
        name: "補間（トゥイーン）",
        en: "Interpolation / Tween",
        cat: "順序・タイミング",
        kind: "concept",
        description:
          "始まりの値と終わりの値だけを決めると、そのあいだのコマ（中割り）を自動で作ってなめらかにつなぐ仕組みです。薄く残る影が、作られた途中のコマを表しています。",
        use: "位置・大きさ・色・数値など、2つの値のあいだを動かすすべての場面。",
        params: [{ key: "dur", label: "時間", value: 1000, min: 300, max: 3000, step: 100, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["始まりと終わり", "<code>translateX(0) → translateX(180px)</code>"],
          ["途中のコマ", "25%・50%・75% の位置にできるコマを薄い影で見せている（デモでは等速 <code>linear</code>）"],
          [
            "書き方",
            "<code>transition</code>、<code>@keyframes</code>、<code>element.animate()</code> のどれでも補間される",
          ],
          ["動きを減らす設定", "途中のコマを見せず、終わりの位置に切り替える"],
          ["出典", "Animation Vocabulary（Sequencing & Timing）"],
        ],
        loop: 2400,
      });
    </script>
  </body>
</html>
