<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雨（Rainfall） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-rainfall"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "rainfall",
        name: "雨",
        en: "Rainfall",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "細い雨の筋が、少し斜めにたくさん降り続け、地面に当たって小さなしぶきを上げる表現です。手前の筋ほど長く速く、奥ほど短く薄くすると奥行きが出ます。",
        use: "天気のアプリ、雰囲気のある背景、季節の演出、ゲームの環境効果、静かな気分を作るヒーロー。",
        params: [
          { key: "n", label: "雨の量", value: 120, min: 20, max: 300, step: 10, unit: "本" },
          { key: "wind", label: "風", value: 0.25, min: -0.6, max: 0.6, step: 0.05, unit: "" },
        ],
        spec: [
          ["筋", "長さ 8〜18px の線を、風の向きに少し傾けて落とす。奥行きを 2〜3 段に分け、手前ほど長く速く濃く"],
          ["しぶき", "地面に当たった位置に、小さな弧（または点 2〜3 個）を 150ms ほど出して消す"],
          ["ツールでは", "After Effects の CC Rainfall。Web では canvas で数百本まで軽く描ける"],
          ["動きを減らす設定", "雨を止め、薄い雨の筋を少し残した静止画にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Simulation）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const ds = Array.from({ length: 300 }, () => ({
                x: rnd() * 260 - 20,
                y: rnd() * 150,
                z: 0.4 + rnd() * 0.6,
              })),
              sp = [];
            let last = 0;
            const frame = (t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              g.clearRect(0, 0, W, H);
              g.lineCap = "round";
              ds.slice(0, v.n).forEach((d) => {
                const vy = 380 * d.z,
                  vx = vy * v.wind;
                if (!rm) {
                  d.y += vy * dt;
                  d.x += vx * dt;
                }
                if (d.y > 132) {
                  if (rm) return;
                  sp.push({ x: d.x, t: 0, z: d.z });
                  d.y = -10 - rnd() * 40;
                  d.x = rnd() * 260 - 20 - v.wind * 60;
                }
                const L = 8 + 10 * d.z;
                g.strokeStyle = `rgba(201,230,255,${0.25 + 0.55 * d.z})`;
                g.lineWidth = 0.8 + d.z;
                g.beginPath();
                g.moveTo(d.x, d.y);
                g.lineTo(d.x - v.wind * L, d.y - L);
                g.stroke();
              });
              g.fillStyle = "rgba(124,196,255,.25)";
              g.fillRect(0, 134, W, 16);
              for (let i = sp.length - 1; i >= 0; i--) {
                const s = sp[i];
                s.t += dt;
                if (s.t > 0.18) {
                  sp.splice(i, 1);
                  continue;
                }
                const k = s.t / 0.18;
                g.strokeStyle = `rgba(201,230,255,${(1 - k) * s.z})`;
                g.lineWidth = 1;
                g.beginPath();
                g.ellipse(s.x, 134, 2 + 6 * k, 1 + 2 * k, 0, Math.PI, TAU);
                g.stroke();
              }
            };
            if (rm) {
              frame(0);
              return null;
            } // 動きを減らす設定：止まった状態を一度だけ描く
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
