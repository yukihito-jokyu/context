<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>選択の印が滑る（Sliding active indicator） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-sliding-active-indicator"
        style="position: relative; width: 240px; height: 100px; display: grid; place-items: center"
      >
        <div class="ac-sliding-active-indicator-t">
          <span class="ac-sliding-active-indicator-i"
            ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 28px"></span></span
          ><span class="ac-sliding-active-indicator-i"
            ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 48px"></span></span
          ><span class="ac-sliding-active-indicator-i"
            ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 36px"></span></span
          ><span class="ac-sliding-active-indicator-i"
            ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 24px"></span></span
          ><span class="ac-sliding-active-indicator-u"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-sliding-active-indicator .ac-sliding-active-indicator-t {
        position: relative;
        display: flex;
        gap: 4px;
        padding: 0 4px;
        border-bottom: 2px solid var(--line);
      }
      .ac-sliding-active-indicator .ac-sliding-active-indicator-i {
        display: grid;
        place-items: center;
        height: 40px;
        padding: 0 8px;
      }
      .ac-sliding-active-indicator .ac-sliding-active-indicator-i .sb-bar {
        transition: background-color var(--dur, 300ms);
      }
      .ac-sliding-active-indicator .ac-sliding-active-indicator-i.is-on .sb-bar {
        background: var(--blue);
      }
      .ac-sliding-active-indicator .ac-sliding-active-indicator-u {
        position: absolute;
        left: 0;
        bottom: -2px;
        height: 3px;
        width: 10px;
        border-radius: 2px;
        background: var(--blue);
        transform-origin: 0 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-sliding-active-indicator .ac-sliding-active-indicator-u {
          transition: transform var(--dur, 300ms) cubic-bezier(0.34, 1.56, 0.64, 1);
        }
      }

      @media (forced-colors: active) {
        .ac-sliding-active-indicator .ac-sliding-active-indicator-u {
          background: none;
          height: 0;
          border-bottom: 3px solid Highlight;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "sliding-active-indicator",
        name: "選択の印が滑る",
        en: "Sliding active indicator",
        cat: "状態の遷移",
        kind: "motion",
        description:
          "タブを切り替えると、選択中を示す下線（または背景の面）が、前のタブから次のタブへ幅を合わせながら滑って移る動きです。どこからどこへ移ったかが目で追えます。",
        use: "タブ、ナビゲーションのメニュー、フィルターの切り替え、ページ内リンク。",
        params: [{ key: "dur", label: "時間", value: 300, min: 120, max: 700, step: 10, unit: "ms" }],
        spec: [
          [
            "動き",
            "印の <code>translateX</code> と幅（<code>scaleX</code> か <code>width</code>）を選んだタブに合わせる｜spring <code>cubic-bezier(0.34, 1.56, 0.64, 1)</code> か out",
          ],
          [
            "測り方",
            "選んだタブの <code>offsetLeft</code>・<code>offsetWidth</code> を測る。Motion の <code>layoutId</code>、CSS の anchor positioning でも作れる",
          ],
          ["文字", "選んだタブの文字色は印と同じ時間で切り替える"],
          ["動きを減らす設定", "滑らせず、選んだタブの下に印をすぐ移す"],
          ["出典", '<a href="https://animata.design/docs" target="_blank" rel="noopener">Animata</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const is = [...stage.querySelectorAll(".ac-sliding-active-indicator-i")],
              u = stage.querySelector(".ac-sliding-active-indicator-u");
            let k = 0;
            const go = (i) => {
              is.forEach((x, j) => x.classList.toggle("is-on", j === i));
              u.style.transform = `translateX(${is[i].offsetLeft}px) scaleX(${is[i].offsetWidth / 10})`;
            }; // 幅 10px の線を左端から伸ばす
            u.style.transition = "none";
            go(0);
            void u.offsetWidth;
            u.style.transition = "";
            const order = [2, 1, 3, 0];
            return seq(1100, [[0, () => go(order[k++ % 4])]]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
