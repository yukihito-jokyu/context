<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>持ち替え（親の切り替え）（Dynamic parenting / space switching） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-dynamic-parenting"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "dynamic-parenting",
        name: "持ち替え（親の切り替え）",
        en: "Dynamic parenting / space switching",
        cat: "キャラクター",
        kind: "motion",
        description:
          "物を、ある時点まではテーブルに、つかんだら手に、渡したら相手の手に、というように、動いている途中で「どれに付いて動くか（親）」を切り替える方法です。切り替えの瞬間に位置が飛ばないよう、今の位置を保ったまま親だけを替えます。",
        use: "物を拾う・渡す・置く、武器の持ち替え、乗り物の乗り降り。",
        params: [],
        spec: [
          [
            "仕組み",
            "切り替えの瞬間に、物の今の世界での位置・向きを、新しい親から見た値に計算し直して付け替える（見た目は動かない）",
          ],
          ["ツールでは", "Maya・Blender の Child Of 制約、Unity・Unreal の Attach（Keep World）"],
          ["組み合わせ", "手の位置は IK で物に合わせる、受け渡しの瞬間は両手を少し重ねる"],
          ["動きを減らす設定", "動きを止め、代表的なポーズの静止画にする"],
          [
            "出典",
            '<a href="https://docs.unity3d.com/Packages/com.unity.animation.rigging@1.4/manual/ConstraintComponents.html" target="_blank" rel="noopener">docs.unity3d.com（ConstraintComponents）</a>、<a href="https://docs.unity3d.com/Packages/com.unity.animation.rigging@1.4/manual/constraints/MultiReferentialConstraint.html" target="_blank" rel="noopener">docs.unity3d.com（MultiReferentialConstraint）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            const lp = (a, b, k) => {
              const o = {};
              for (const key in a) o[key] = a[key] + (b[key] - a[key]) * k;
              return o;
            };
            const ez = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
              cl = (u) => Math.min(1, Math.max(0, u));
            const txt = (s, x, y, c = col("ink-muted"), al = "left") => {
              g.fillStyle = c;
              g.font = "600 10px sans-serif";
              g.textAlign = al;
              g.fillText(s, x, y);
            };
            const GUARD = { lean: 0.05, t1: 0.35, s1: -0.3, t2: -0.3, s2: -0.1, u1: 2.2, f1: 1.6, u2: 2.4, f2: 1.7 };
            let par0 = -1,
              off = [0, 0],
              tSw = 0,
              pos0 = [0, 0];
            const frame = (t) => {
              const T = rm ? 1.6 : t % 4.8,
                hA = T < 2.4 ? [60 + 20 * sin(T * 2), 70 + 10 * cos(T * 2)] : [60, 70],
                hB = [150 + 15 * sin(T * 1.7), 70 + 12 * cos(T * 1.3)],
                par = T < 0.8 ? 0 : T < 2.4 ? 1 : T < 4 ? 2 : 0,
                table = [110, 112];
              g.clearRect(0, 0, W, H);
              g.fillStyle = col("ice");
              g.fillRect(80, 112, 60, 6);
              const pp = par === 0 ? [table[0], table[1]] : par === 1 ? hA : hB,
                grip = par === 0 ? [0, -7] : par === 1 ? [10, 0] : [-10, 0];
              if (par !== par0) {
                off = par0 < 0 ? grip : [pos0[0] - pp[0], pos0[1] - pp[1]];
                tSw = t;
                par0 = par;
              } /* 付け替え：今の世界の位置を新しい親から見た値に直す（見た目は動かない） */
              const e = Math.min(1, (t - tSw) / 0.3),
                k = e * e * (3 - 2 * e),
                pos = [pp[0] + off[0] + (grip[0] - off[0]) * k, pp[1] + off[1] + (grip[1] - off[1]) * k];
              pos0 = pos;
              line([[40, 110], [40, 80], hA], 6, col("blue"));
              line([[190, 110], [190, 80], hB], 6, col("cobalt"));
              g.fillStyle = "#f5b942";
              g.fillRect(pos[0] - 6, pos[1] - 7, 12, 14);
              g.strokeStyle = "rgba(229,72,77,.7)";
              g.setLineDash([2, 2]);
              g.beginPath();
              g.moveTo(pos[0], pos[1]);
              g.lineTo(pp[0], pp[1]);
              g.stroke();
              g.setLineDash([]);
              txt(["親：テーブル", "親：A の手", "親：B の手"][par], 8, 16, "#e5484d");
            };
            if (rm) {
              frame(0);
              return null;
            } // 動きを減らす設定：代表的なポーズを一度だけ描く
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
