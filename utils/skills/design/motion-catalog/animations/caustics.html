<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>水面の光（Caustics） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-caustics"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "caustics",
        name: "水面の光",
        en: "Caustics",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "プールの底や水の中に映る、ゆらゆらと形を変えながら揺れる光の網目の模様です。波で曲げられた光が集まる所が明るい線になり、涼しさや水の透明感を表せます。",
        use: "水・夏・リゾートのブランド、プールや海の背景、涼しげなヒーロー、ゲームの水中表現。",
        params: [{ key: "speed", label: "揺れの速さ", value: 1, min: 0.2, max: 2.5, step: 0.1, unit: "" }],
        spec: [
          [
            "仕組み",
            "時間で動く波の高さから光の集まり方を計算する。手軽には、ずらした sin 波を何回か重ねて、明るい網目になる所だけを強調する",
          ],
          ["Web では", "WebGL のシェーダーが向く。小さな canvas で計算して拡大してもよい（ここでは 1/4 の解像度）"],
          ["ツールでは", "After Effects の Caustics（Wave World と組み合わせる）"],
          ["動きを減らす設定", "揺れを止め、光の網目の静止画にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Simulation）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const w = 55,
              h = 38,
              off = document.createElement("canvas");
            off.width = w;
            off.height = h;
            const og = off.getContext("2d"),
              img = og.createImageData(w, h);
            return raf((t) => {
              const tm = (rm ? 2 : t) * 0.5 * v.speed + 23;
              for (let j = 0; j < h; j++)
                for (let i = 0; i < w; i++) {
                  let px = (i / w) * 6.28 * 1.4 - 250,
                    py = (j / h) * 6.28 - 250,
                    ix = px,
                    iy = py,
                    c = 1;
                  for (let n = 0; n < 4; n++) {
                    const tt = tm * (1 - 3.5 / (n + 1));
                    ix = px + cos(tt - ix) + sin(tt + iy);
                    iy = py + sin(tt - iy) + cos(tt + ix);
                    c += 1 / Math.hypot(px / (sin(ix + tt) / 0.005), py / (cos(iy + tt) / 0.005));
                  }
                  c /= 4;
                  c = 1.17 - Math.pow(c, 1.4);
                  const b = Math.min(1, Math.pow(Math.abs(c), 8)),
                    k = (j * w + i) * 4;
                  img.data[k] = 70 + 185 * b;
                  img.data[k + 1] = 150 + 105 * b;
                  img.data[k + 2] = 225 + 30 * b;
                  img.data[k + 3] = 255;
                }
              og.putImageData(img, 0, 0);
              g.imageSmoothingEnabled = true;
              g.drawImage(off, 0, 0, W, H);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
