<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2本指で回す（Pinch to rotate） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-pinch-to-rotate" style="position: relative; width: 200px; height: 150px">
        <span class="ac-pinch-to-rotate-img sb-grad-hero"><i></i></span
        ><span class="ac-pinch-to-rotate-f"
          ><i class="ac-cursor" style="left: 30px; top: 0"></i><i class="ac-cursor" style="left: -30px; top: 0"></i
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-pinch-to-rotate .ac-pinch-to-rotate-img {
        position: absolute;
        left: 50px;
        top: 25px;
        width: 100px;
        height: 100px;
        border-radius: 18px;
        animation: ac-pinch-to-rotate-r 3000ms both;
      }
      .ac-pinch-to-rotate .ac-pinch-to-rotate-img i {
        position: absolute;
        left: 14px;
        top: 14px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
      }
      .ac-pinch-to-rotate .ac-pinch-to-rotate-f {
        position: absolute;
        left: 100px;
        top: 75px;
        width: 0;
        height: 0;
        animation: ac-pinch-to-rotate-fr 3000ms both;
      }
      .ac-pinch-to-rotate .ac-pinch-to-rotate-f i {
        opacity: 1;
        animation: ac-pinch-to-rotate-show 3000ms both;
      }
      @keyframes ac-pinch-to-rotate-r {
        0%,
        15% {
          transform: rotate(0);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        55% {
          transform: rotate(62deg);
          animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        62%,
        100% {
          transform: rotate(90deg);
        }
      }
      @keyframes ac-pinch-to-rotate-fr {
        0%,
        15% {
          transform: rotate(0);
          animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
        }
        55%,
        100% {
          transform: rotate(62deg);
        }
      }
      @keyframes ac-pinch-to-rotate-show {
        0%,
        8% {
          opacity: 0;
        }
        12%,
        55% {
          opacity: 1;
        }
        60%,
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-pinch-to-rotate-r {
          0%,
          15% {
            transform: rotate(0);
          }
          55% {
            transform: rotate(62deg);
            animation-timing-function: step-end;
          }
          56%,
          100% {
            transform: rotate(90deg);
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "pinch-to-rotate",
        name: "2本指で回す",
        en: "Pinch to rotate",
        cat: "操作への反応",
        kind: "motion",
        description:
          "2本の指を画面に置いてひねると、その角度の変化に合わせて画像や地図が回る動きです。指を離すと、近いキリのよい角度（0°・90° など）へ吸い付くように収まります。",
        use: "写真の編集・トリミング、地図の向き、図形の回転、ステッカーの配置。",
        params: [{ key: "snap", label: "吸着の時間", value: 300, min: 100, max: 700, step: 10, unit: "ms" }],
        spec: [
          [
            "回転",
            "角度 = 2本の指を結ぶ線の角度の変化。<code>rotate</code> にそのまま入れる（指に付いてくる。イージングなし）",
          ],
          ["離したとき", "近い 90° の倍数へ（吸着しない設定なら慣性で少し回して止める）｜spring"],
          ["中心", "回転の中心は2本の指の中点。ボタン・キーボードでも回せるようにする"],
          ["動きを減らす設定", "離したときの吸着の動きをなくし、すぐその角度にする"],
          ["出典", '<a href="https://motion.dev/examples" target="_blank" rel="noopener">Motion examples</a>'],
        ],
        loop: 3400,
      });
    </script>
  </body>
</html>
