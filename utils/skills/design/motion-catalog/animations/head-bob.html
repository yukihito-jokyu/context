<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>歩きで揺れる視点（First-person head bob） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-head-bob"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "head-bob",
        name: "歩きで揺れる視点",
        en: "First-person head bob",
        cat: "カメラ",
        kind: "motion",
        description:
          "一人称の視点で歩いたり走ったりしているとき、足の運びに合わせて視点を小さく上下（と左右・傾き）に揺らす方法です。歩いている感覚と速さが伝わります。揺れが強いと酔いやすいので、弱くする設定を必ず用意します。",
        use: "一人称のゲーム、ウォークスルーの映像、手持ちカメラ風の演出。",
        params: [{ key: "amp", label: "揺れの大きさ", value: 4, min: 0, max: 10, step: 0.5, unit: "px" }],
        spec: [
          [
            "仕組み",
            "歩く速さに合わせた周期で、上下 <code>A·|sin(ωt)|</code>（1 歩ごとに 1 回）、左右 <code>A/2·sin(ωt)</code>（2 歩で 1 往復）、少しの傾きを足す",
          ],
          ["大きさ", "上下 1〜4px 相当。走るときは周期を速く、振れを大きく。止まったら 0.2〜0.3 秒で 0 に戻す"],
          ["気をつけること", "酔いの原因になりやすい。設定で弱く・切れるようにし、動きを減らす設定では切る"],
          ["動きを減らす設定", "揺れを切る（視点を動かさない）"],
          [
            "出典",
            '<a href="https://opsive.com/support/documentation/ultimate-character-controller/camera/view-types/included-view-types/first-person/" target="_blank" rel="noopener">opsive.com（first-person）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const GY = 112,
              LV = 900;
            const world = (cx, cy = 75, z = 1, extra) => {
              const gr = g.createLinearGradient(0, 0, 0, H);
              gr.addColorStop(0, "#f2f8ff");
              gr.addColorStop(1, "#dbeafe");
              g.fillStyle = gr;
              g.fillRect(0, 0, W, H);
              g.fillStyle = "#c7defc";
              for (let i = -1; i < 6; i++) {
                const x = ((((i * 90 - cx * 0.3) % 450) + 450) % 450) - 60;
                g.beginPath();
                g.ellipse(x, 100 - (cy - 75) * 0.3, 50, 34, 0, Math.PI, 0);
                g.fill();
              }
              g.save();
              g.translate(110, 75);
              g.scale(z, z);
              g.translate(-cx, -cy);
              g.fillStyle = "#93c5fd";
              g.fillRect(-200, GY, LV + 400, 60);
              g.fillStyle = "#7fb3f5";
              for (let x = -200; x < LV + 200; x += 20) g.fillRect(x, GY, 1.5, 60);
              g.fillStyle = col("cobalt");
              for (const [x, y, w] of [
                [240, 84, 50],
                [520, 74, 60],
                [720, 90, 50],
              ]) {
                g.beginPath();
                g.roundRect(x, y, w, 7, 3);
                g.fill();
              }
              if (extra) extra();
              g.restore();
            };
            const hero = (x, y, c = col("blue"), f = 1) => {
              g.fillStyle = c;
              g.beginPath();
              g.roundRect(x - 6, y - 18, 12, 18, 4);
              g.fill();
              g.fillStyle = "#fff";
              g.fillRect(x + f * 2 - 1, y - 14, 2, 2);
            };
            const walk = (t) => {
              const T = t % 8;
              let x, vx;
              if (T < 3) {
                x = 40 + T * 120;
                vx = 120;
              } else if (T < 4) {
                x = 400;
                vx = 0;
              } else if (T < 6.5) {
                x = 400 - (T - 4) * 100;
                vx = -100;
              } else {
                x = 150 - ((T - 6.5) / 1.5) * 110;
                vx = -73;
              }
              const jp = (a) => {
                  const u = (T - a) / 0.6;
                  return u > 0 && u < 1 ? 40 * 4 * u * (1 - u) : 0;
                },
                h = jp(1.2) + jp(5);
              return { x, y: GY - h, vx, air: h > 0, face: vx >= 0 ? 1 : -1 };
            };
            const box = (x, y, w, h, c = "rgba(229,72,77,.8)") => {
              g.strokeStyle = c;
              g.lineWidth = 1.5;
              g.setLineDash([4, 3]);
              g.strokeRect(x, y, w, h);
              g.setLineDash([]);
            };
            let DT = 1 / 60,
              LT = null;
            const clock = (t) => {
              DT = LT === null ? 1 / 60 : Math.min(0.05, Math.max(0, t - LT));
              LT = t;
            };
            const sm = (a, b, k) =>
              a +
              (b - a) *
                (k >= 1 ? 1 : 1 - Math.pow(1 - k, DT * 60)); /* k は 60Hz のときの1フレームの係数。経過時間に換算する */
            let ph = 0,
              last = 0,
              amp = 0;
            return raf((t) => {
              clock(t);
              const dt = Math.min(0.05, t - last);
              last = t;
              const T = t % 6,
                walking = T < 4.2,
                tg = rm ? 0 : walking ? v.amp : 0;
              amp = sm(amp, tg, 0.08);
              ph += dt * (walking ? 8 : 0);
              const by = -Math.abs(sin(ph)) * amp,
                bx = sin((ph / 2) * 2) * amp * 0.5,
                roll = sin((ph / 2) * 2) * amp * 0.004;
              g.save();
              g.translate(110 + bx, 75 + by);
              g.rotate(roll);
              g.translate(-110, -75);
              g.fillStyle = "#eaf2ff";
              g.fillRect(-20, -20, W + 40, 80);
              g.fillStyle = col("ice");
              g.fillRect(-20, 60, W + 40, 120);
              g.fillStyle = col("sky");
              g.fillRect(30, 20, 30, 40);
              g.fillRect(150, 10, 40, 50);
              g.strokeStyle = col("sky");
              g.lineWidth = 1;
              for (let i = 0; i < 8; i++) {
                const y = 60 + i * i * 2.4 + (((rm ? 0 : t) * (walking ? 30 : 0)) % 10) * i * 0.2;
                g.beginPath();
                g.moveTo(-20, y);
                g.lineTo(W + 20, y);
                g.stroke();
              }
              g.restore();
              g.strokeStyle = "rgba(255,255,255,.9)";
              g.lineWidth = 1.5;
              g.beginPath();
              g.moveTo(104, 75);
              g.lineTo(116, 75);
              g.moveTo(110, 69);
              g.lineTo(110, 81);
              g.stroke();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
