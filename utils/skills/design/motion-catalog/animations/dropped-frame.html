<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>フレーム落ち（Dropped frame） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-dropped-frame"
        style="
          position: relative;
          width: 200px;
          height: 100px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
        "
      >
        <div style="display: flex; gap: 4px; margin-bottom: 22px">
          <span class="ac-dropped-frame-f" style="--i: 0"></span><span class="ac-dropped-frame-f" style="--i: 1"></span
          ><span class="ac-dropped-frame-f" style="--i: 2"></span><span class="ac-dropped-frame-f" style="--i: 3"></span
          ><span class="ac-dropped-frame-f" style="--i: 4"></span><span class="ac-dropped-frame-f" style="--i: 5"></span
          ><span class="ac-dropped-frame-f" style="--i: 6"></span
          ><span class="ac-dropped-frame-f ac-dropped-frame-miss" style="--i: 7"></span
          ><span class="ac-dropped-frame-f" style="--i: 8"></span><span class="ac-dropped-frame-f" style="--i: 9"></span
          ><span class="ac-dropped-frame-f" style="--i: 10"></span
          ><span class="ac-dropped-frame-f" style="--i: 11"></span>
        </div>
        <div style="position: relative; width: 200px; height: 32px">
          <span
            style="
              position: absolute;
              left: 0;
              right: 0;
              top: 15px;
              height: 2px;
              border-radius: 2px;
              background: var(--bar);
            "
          ></span
          ><span
            class="sb-thumb sb-grad-sky ac-dropped-frame-t"
            style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-dropped-frame .ac-dropped-frame-f {
        width: 13px;
        height: 18px;
        border-radius: 4px;
        background: var(--bar);
      }
      .ac-dropped-frame .ac-dropped-frame-miss {
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--bar-strong);
      }
      .ac-dropped-frame .ac-dropped-frame-t {
        transform: translateX(84px);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-dropped-frame .ac-dropped-frame-f:not(.ac-dropped-frame-miss) {
          animation: ac-dropped-frame-on var(--dur, 1600ms) steps(1) calc(var(--dur, 1600ms) * var(--i) / 12) infinite;
        }
        .ac-dropped-frame .ac-dropped-frame-t {
          animation: ac-dropped-frame-drop var(--dur, 1600ms) step-end infinite;
        }
      }
      @keyframes ac-dropped-frame-on {
        0% {
          background: var(--blue);
        }
        8.33% {
          background: var(--bar);
        }
      }
      @keyframes ac-dropped-frame-drop {
        0.00% {
          transform: translateX(0px);
        }
        8.33% {
          transform: translateX(14px);
        }
        16.67% {
          transform: translateX(28px);
        }
        25.00% {
          transform: translateX(42px);
        }
        33.33% {
          transform: translateX(56px);
        }
        41.67% {
          transform: translateX(70px);
        }
        50.00% {
          transform: translateX(84px);
        }
        58.33% {
          transform: translateX(84px);
        }
        66.67% {
          transform: translateX(112px);
        }
        75.00% {
          transform: translateX(126px);
        }
        83.33% {
          transform: translateX(140px);
        }
        91.67% {
          transform: translateX(154px);
        }
        100.00% {
          transform: translateX(168px);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "dropped-frame",
        name: "フレーム落ち",
        en: "Dropped frame",
        cat: "パフォーマンス",
        kind: "concept",
        description:
          "描くべきタイミングに間に合わず、1枚のフレームが飛ばされることです。下の帯の1コマが描けず、そのあいだ四角が止まり、次のコマで一気に進むので、小さな引っかかりになります。",
        use: "カクつきの最小単位。ジャンクを調べるときに、どのフレームが落ちたかを見る。",
        params: [{ key: "dur", label: "12コマの時間", value: 1600, min: 800, max: 3000, step: 100, unit: "ms" }],
        spec: [
          ["仕組み", "1フレームの予算（60fps で 16.7ms）を超えると、そのフレームは表示されず前の絵が残る"],
          ["デモ", "帯は 12 コマ。7 コマ目（枠だけ）が落ちて、四角が止まってから跳ぶ"],
          ["測る", "DevTools の Performance パネルで赤い（Dropped）フレームを探す"],
          ["動きを減らす設定", "欠落の枠と停止位置を表示"],
          ["出典", "Animation Vocabulary（Performance）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
