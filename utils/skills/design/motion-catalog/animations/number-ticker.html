<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ナンバーティッカー（Number ticker） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-number-ticker"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div class="sb-card" style="width: 180px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
          <span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 70px"></span
          ><span
            class="ac-number-ticker-n"
            style="
              font-size: 24px;
              line-height: 32px;
              font-weight: 800;
              color: var(--ink);
              letter-spacing: 0.02em;
              font-size: 32px;
              line-height: 40px;
              font-variant-numeric: tabular-nums;
            "
            >0</span
          >
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "number-ticker",
        name: "ナンバーティッカー",
        en: "Number ticker",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "数字が 0 から目標の値まで、カウントアップしていく表現です。数の大きさや増えた勢いが、動きで印象に残ります。",
        use: "実績の数値、ダッシュボードの KPI、残高、ダウンロード数、カウントダウン。",
        params: [
          { key: "dur", label: "数える時間", value: 1200, min: 300, max: 3000, step: 100, unit: "ms" },
          { key: "to", label: "目標の値", value: 1280, min: 10, max: 99999, step: 10, unit: "" },
        ],
        total: (p) => p["dur"],
        spec: [
          [
            "動き",
            "<code>requestAnimationFrame</code> で毎フレーム、<code>目標 × イージング(経過 / 時間)</code> を表示｜out",
          ],
          ["数字の幅", "<code>font-variant-numeric: tabular-nums</code> で桁幅をそろえ、ガタつきを防ぐ"],
          ["区切り", "<code>Intl.NumberFormat</code> で 3 桁区切り"],
          ["別の見せ方", "桁ごとに数字が回るロール（odometer）もある"],
          ["動きを減らす設定", "数える動きをやめ、最終の値を表示する"],
          ["出典", "Animation Vocabulary（Polish & Effects）"],
        ],
        loop: 2800,
        run: (stage, v) => {
          const el = stage.querySelector(".ac-number-ticker-n"),
            fmt = new Intl.NumberFormat("ja-JP");
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
            el.textContent = fmt.format(v.to);
            return;
          }
          const ease = (t) => 1 - Math.pow(1 - t, 3);
          let raf,
            t0 = null;
          const tick = (now) => {
            if (t0 === null) t0 = now;
            const p = Math.min(1, (now - t0) / v.dur);
            el.textContent = fmt.format(Math.round(v.to * ease(p)));
            if (p < 1) raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        },
      });
    </script>
  </body>
</html>
