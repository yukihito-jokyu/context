<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>映像のフィードバック（Recursive video feedback） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-recursive-feedback"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "recursive-feedback",
        name: "映像のフィードバック",
        en: "Recursive video feedback",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "1 つ前のフレームの絵を少し拡大・回転してから今のフレームに重ね、その上に新しい絵を描く、をくり返す表現です。絵が自分自身の中へ何重にも入れ子になり、トンネルや渦、尾を引く軌跡が育っていきます。",
        use: "音楽・映像系のビジュアル、VJ 風の演出、サイケデリックな背景、アートの作品。",
        params: [
          { key: "zoom", label: "1フレームの拡大率", value: 1.03, min: 0.97, max: 1.08, step: 0.005, unit: "倍" },
        ],
        spec: [
          [
            "仕組み",
            "毎フレーム、前のフレーム（canvas）を中心から <code>scale(1.03) rotate(1.5°)</code> して少し薄く描き、その上に新しい図形を描く",
          ],
          [
            "調整",
            "拡大・回転・薄める量の小さな違いで、トンネル・渦・広がる模様に変わる。1 を超えると画面が飽和するので 0.9 前後で薄める",
          ],
          [
            "Web では",
            "canvas 2D なら別の canvas にコピーしてから描き戻す。WebGL なら前のフレームのテクスチャを入力にする（フレームバッファのピンポン）",
          ],
          ["動きを減らす設定", "くり返しの重ねをやめ、図形が1つの静止画にする"],
          [
            "出典",
            '<a href="https://satyarth.me/cactus-juice/hydra-workshop/" target="_blank" rel="noopener">satyarth.me（hydra-workshop）</a>、<a href="https://learn.derivative.ca/courses/100-fundamentals/lessons/102-tops-working-with-images/topic/creating-a-feedback/" target="_blank" rel="noopener">learn.derivative.ca（creating-a-feedback）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const off = document.createElement("canvas");
            off.width = cv.width;
            off.height = cv.height;
            const og = off.getContext("2d");
            return raf((t) => {
              const T = rm ? 1 : t;
              if (!rm) {
                og.clearRect(0, 0, off.width, off.height);
                og.drawImage(cv, 0, 0);
              }
              g.fillStyle = col("navy");
              g.fillRect(0, 0, W, H);
              if (!rm) {
                g.save();
                g.globalAlpha = 0.9;
                g.translate(110, 75);
                g.rotate(0.026);
                g.scale(v.zoom, v.zoom);
                g.translate(-110, -75);
                g.drawImage(off, 0, 0, W, H);
                g.restore();
              }
              const x = 110 + 40 * cos(T * 1.3),
                y = 75 + 26 * sin(T * 1.9);
              g.strokeStyle = `hsl(${210 + 30 * sin(T)}, 90%, 70%)`;
              g.lineWidth = 3;
              g.strokeRect(x - 10, y - 10, 20, 20);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
