<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ランダムウォーク（Random walk） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-random-walk"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "random-walk",
        name: "ランダムウォーク",
        en: "Random walk",
        cat: "背景",
        kind: "motion",
        description:
          "点が 1 歩ごとにでたらめな向きへ進み、その足あとを線として残していく動きです。行き先の決まっていない、気まぐれにさまよう線が少しずつ画面を埋めていきます。",
        use: "ジェネラティブアートの背景、思考・探索の比喩、手描き風の装飾、ローディング。",
        params: [{ key: "step", label: "1歩の長さ", value: 4, min: 2, max: 10, step: 1, unit: "px" }],
        spec: [
          [
            "規則",
            "毎ステップ、上下左右（または好きな角度）からでたらめに 1 つ選んで一定の距離だけ進み、前の位置と線でつなぐ",
          ],
          ["見せ方", "数本を色違いで同時に歩かせ、古い線はゆっくり薄める。画面の外に出たら反対側から入る"],
          [
            "変化をつける",
            "向きを少しずつしか変えない（相関のある歩き）とうねる線に、たまに大きく跳ぶ（レヴィ飛行）と点在する固まりになる",
          ],
          ["動きを減らす設定", "歩くのを止め、たまった線の静止画にする"],
          [
            "出典",
            '<a href="https://natureofcode.com/random/" target="_blank" rel="noopener">natureofcode.com（random）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const wk = Array.from({ length: 5 }, (_, i) => ({
                x: 110,
                y: 75,
                c: ["#2563eb", "#3b82f6", "#60a5fa", "#1b3a8a", "#93c5fd"][i],
              })),
              dirs = [
                [1, 0],
                [-1, 0],
                [0, 1],
                [0, -1],
              ];
            let t0 = -99;
            const clear = () => {
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
            };
            const walk = (n) => {
              for (let k = 0; k < n; k++)
                for (const w of wk) {
                  const d = dirs[Math.floor(rnd() * 4)],
                    x2 = w.x + d[0] * v.step,
                    y2 = w.y + d[1] * v.step;
                  g.strokeStyle = w.c;
                  g.lineWidth = 1.6;
                  g.beginPath();
                  g.moveTo(w.x, w.y);
                  g.lineTo(x2, y2);
                  g.stroke();
                  w.x = (x2 + W) % W;
                  w.y = (y2 + H) % H;
                }
            };
            if (rm) {
              clear();
              walk(500);
              return () => {};
            }
            return raf((t) => {
              if (t - t0 > 14) {
                clear();
                wk.forEach((w) => {
                  w.x = 110;
                  w.y = 75;
                });
                t0 = t;
              }
              g.fillStyle = "rgba(255,255,255,.012)";
              g.fillRect(0, 0, W, H);
              walk(2);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
