<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>カメラのキック（Camera kick (recoil)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-camera-kick"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-camera-kick-wd">
          <span class="ac-camera-kick-bg"></span><span class="ac-camera-kick-sh"></span
          ><span class="ac-camera-kick-fl"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-camera-kick .ac-camera-kick-cam,
      .ac-camera-kick .ac-camera-kick-L {
        position: absolute;
        inset: 0;
      }
      .ac-camera-kick .ac-camera-kick-L i {
        position: absolute;
        display: block;
      }
      .ac-camera-kick .ac-camera-kick-sky i {
        inset: -150px -160px -30px;
        background:
          radial-gradient(ellipse 26px 10px at 30% 22%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(ellipse 20px 8px at 72% 12%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(circle at 50% 70%, #fff 0 12px, transparent 13px) 0 0 / 220px 100% repeat-x,
          linear-gradient(180deg, #f2f8ff, var(--ice) 70%, var(--sky));
      }
      .ac-camera-kick .ac-camera-kick-far i {
        left: -330px;
        right: -330px;
        bottom: 30px;
        height: 70px;
        background: radial-gradient(ellipse 60px 46px at 50% 100%, #a9d0ff 98%, transparent) 0 100% / 120px 70px
          repeat-x;
      }
      .ac-camera-kick .ac-camera-kick-gr i {
        left: -330px;
        right: -330px;
        bottom: -60px;
        height: 96px;
        background: linear-gradient(#b6dcff, #8fc2ff);
      }
      .ac-camera-kick .ac-camera-kick-mid i {
        left: -304px;
        right: -356px;
        bottom: 26px;
        height: 64px;
        background:
          radial-gradient(circle 15px at 24px 22px, var(--cobalt) 97%, transparent) 0 0 / 52px 64px repeat-x,
          linear-gradient(90deg, transparent 22px, var(--navy) 22px 26px, transparent 26px) 0 100% / 52px 30px repeat-x;
      }
      .ac-camera-kick .ac-camera-kick-sub i {
        left: 100px;
        bottom: 26px;
        width: 20px;
        height: 34px;
        border-radius: 10px 10px 5px 5px;
        background: var(--blue);
      }
      .ac-camera-kick .ac-camera-kick-sub i::before {
        content: "";
        position: absolute;
        left: 3px;
        top: -16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
      }
      .ac-camera-kick .ac-camera-kick-near i {
        left: -330px;
        right: -330px;
        bottom: -16px;
        height: 46px;
        background: radial-gradient(ellipse 34px 26px at 50% 100%, #0f2563 97%, transparent) 0 100% / 110px 46px
          repeat-x;
      }
      .ac-camera-kick .ac-camera-kick-wd {
        position: absolute;
        inset: -20px;
      }
      .ac-camera-kick .ac-camera-kick-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle 3px, var(--sky) 97%, transparent) 0 0 / 34px 34px,
          linear-gradient(180deg, #f2f8ff, var(--ice));
      }
      .ac-camera-kick .ac-camera-kick-sh {
        position: absolute;
        left: 50px;
        top: 82px;
        width: 46px;
        height: 26px;
        border-radius: 8px 14px 14px 8px;
        background: var(--navy);
      }
      .ac-camera-kick .ac-camera-kick-sh::after {
        content: "";
        position: absolute;
        left: 40px;
        top: 9px;
        width: 18px;
        height: 8px;
        border-radius: 3px;
        background: var(--navy);
      }
      .ac-camera-kick .ac-camera-kick-fl {
        position: absolute;
        left: 116px;
        top: 86px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0 30%, #ffd36e 50%, transparent 72%);
        opacity: 0;
      }
      .ac-camera-kick .ac-b {
        position: absolute;
        left: 120px;
        top: 92px;
        width: 14px;
        height: 5px;
        border-radius: 3px;
        background: var(--blue);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "camera-kick",
        name: "カメラのキック",
        en: "Camera kick (recoil)",
        cat: "カメラ",
        kind: "motion",
        description:
          "ゲームで弾を撃った瞬間に、画面（カメラ）が撃った向きと反対へ一瞬だけ押し戻され、すぐ元へ戻る動きです。ランダムに揺らす画面の揺れと違って向きがあるので、反動の重さと手応えが伝わります。",
        use: "シューティングなどのゲーム、強い決定の操作（送信・購入）のフィードバック、打ち上げや発射の演出。",
        params: [
          { key: "kick", label: "押し戻す量", value: 6, min: 0, max: 16, step: 1, unit: "px" },
          { key: "back", label: "戻る時間", value: 160, min: 60, max: 400, step: 10, unit: "ms" },
        ],
        spec: [
          [
            "書き方",
            "撃つたびに、カメラを撃つ向きと逆へ 3〜8px <code>translate</code>（0ms で）→ 120〜200ms で 0 に戻す｜out",
          ],
          ["重ね方", "連射のときは戻り切る前に次のキックを足していく（上限を決める）"],
          ["組み合わせ", "マズルフラッシュ・ヒットストップ・小さな揺れと一緒に使うと手応えが増す"],
          ["動きを減らす設定", "キックをやめ、弾とマズルの光だけにする"],
          [
            "出典",
            '<a href="https://medienwissenschaft.uni-bayreuth.de/wp-content/uploads/GxD-10-Game-Feel.pdf#page=7" target="_blank" rel="noopener">The Art of Screenshake の解説（Bayreuth 大学）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const wd = stage.querySelector(".ac-camera-kick-wd"),
              fl = stage.querySelector(".ac-camera-kick-fl");
            const shoot = () => {
              const b = document.createElement("span");
              b.className = "ac-b";
              wd.appendChild(b);
              b.animate([{ transform: "none" }, { transform: "translateX(180px)" }], {
                duration: 400,
                easing: "linear",
              }).onfinish = () => b.remove();
              fl.animate(
                [
                  { opacity: 1, transform: "scale(1.3)" },
                  { opacity: 0, transform: "scale(.6)" },
                ],
                { duration: 90 },
              );
              if (rm) return; /* 戻り切る前の残りに足す（上限は押し戻す量の 2 倍） */
              const x0 = Math.max(-v.kick * 2, new DOMMatrixReadOnly(getComputedStyle(wd).transform).m41 - v.kick);
              wd.getAnimations().forEach((a) => a.cancel());
              wd.animate([{ transform: `translateX(${x0}px)` }, { transform: "none" }], {
                duration: v.back,
                easing: "cubic-bezier(0.22, 1, 0.36, 1)",
              });
            };
            return seq(2000, [
              [300, shoot],
              [700, shoot],
              [880, shoot],
              [1060, shoot],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
