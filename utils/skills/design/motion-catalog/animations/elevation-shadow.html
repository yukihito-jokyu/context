<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>浮き上がる影（Elevation shadow） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-elevation-shadow"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="sb-card ac-elevation-shadow-c"
          style="width: 130px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 40px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 71px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 45px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-elevation-shadow .ac-elevation-shadow-c {
        position: relative;
        transform: translateY(0);
        box-shadow:
          0 1px 2px rgba(18, 26, 43, 0.08),
          0 2px 6px rgba(18, 26, 43, 0.06);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-elevation-shadow .ac-elevation-shadow-c {
          transition: transform var(--dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1);
        }
      }
      .ac-elevation-shadow .ac-elevation-shadow-c::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow:
          0 6px 12px rgba(18, 26, 43, 0.08),
          0 22px 40px rgba(18, 26, 43, 0.18);
        opacity: 0;
        transition: opacity var(--dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1);
      }
      .ac-elevation-shadow .ac-elevation-shadow-c.is-on {
        transform: translateY(-6px);
      }
      .ac-elevation-shadow .ac-elevation-shadow-c.is-on::after {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-elevation-shadow .ac-elevation-shadow-c.is-on {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "elevation-shadow",
        name: "浮き上がる影",
        en: "Elevation shadow",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "カードが浮き上がるのに合わせて、下の影が大きく・柔らかく・下へ広がる動きです。影が高さを表すので、「手前に来た」「持ち上がった」ことが自然に伝わります。",
        use: "カードのホバー、ドラッグ中の要素、FAB、モーダルやメニューの重なり。",
        params: [{ key: "dur", label: "時間", value: 260, min: 100, max: 600, step: 10, unit: "ms" }],
        spec: [
          ["動き", "<code>translateY(0 → -6px)</code> と影を「低い影 → 高い影」へ｜out"],
          ["影", "高いほど、影のずれ（y）とぼかしを大きく、濃さは薄く。影は2層（近い影＋遠い影）にすると自然"],
          [
            "軽く",
            "<code>box-shadow</code> の変化は重い。影だけの疑似要素を用意して <code>opacity</code> を切り替えると軽い",
          ],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          ["出典", '<a href="https://ianlunn.github.io/Hover/" target="_blank" rel="noopener">Hover.css</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const el = stage.querySelector(".ac-elevation-shadow-c");
            return seq(2600, [
              [600, () => el.classList.add("is-on")],
              [1900, () => el.classList.remove("is-on")],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
