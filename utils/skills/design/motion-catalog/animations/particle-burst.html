<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パーティクル（Particle） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-particle-burst"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div style="position: relative; display: grid; place-items: center">
          <span
            class="sb-fab ac-particle-burst-b"
            style="background: var(--surface); color: var(--bar-strong); box-shadow: var(--shadow-card)"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" /></svg
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-particle-burst .ac-particle-burst-b {
        transition:
          background-color 200ms,
          color 200ms;
      }
      .ac-particle-burst .ac-particle-burst-b.on {
        background: var(--blue) !important;
        color: var(--on-blue) !important;
        box-shadow: var(--shadow-glow) !important;
      }
      .ac-particle-burst .ac-particle-burst-p {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        margin: -4px;
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "particle-burst",
        name: "パーティクル",
        en: "Particle",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "押した瞬間に、小さな粒がはじけるように四方へ飛び散って消える表現です。いいね・完了などのうれしい瞬間を、華やかに祝えます。",
        use: "いいね、お気に入り、達成・完了、購入完了、ゲームの得点。",
        params: [
          { key: "count", label: "粒の数", value: 10, min: 4, max: 24, step: 1, unit: "" },
          { key: "dur", label: "飛ぶ時間", value: 600, min: 300, max: 1200, step: 50, unit: "ms" },
        ],
        total: (p) => p["dur"],
        spec: [
          [
            "粒",
            "中心から角度を等分して、<code>translate(cosθ × 距離, sinθ × 距離)</code> と <code>scale(1 → 0)</code>、<code>opacity 1 → 0</code>｜out",
          ],
          ["本体", "同時に <code>scale(0.8 → 1)</code>｜spring で弾ませ、色を blue に"],
          ["実装", "<code>element.animate()</code> で粒を作って終わったら消す。canvas-confetti などのライブラリも"],
          ["動きを減らす設定", "粒を出さず、本体の色の切り替えだけにする"],
          ["出典", "ChatGPT との会話の分類表（テキスト・視覚効果）"],
        ],
        loop: 0,
        run: (stage, v) => {
          const b = stage.querySelector(".ac-particle-burst-b"),
            wrap = b.parentElement;
          const rm = matchMedia("(prefers-reduced-motion: reduce)").matches,
            colors = ["var(--blue)", "var(--sky)", "var(--aqua)", "var(--cobalt)"];
          const burst = () => {
            b.classList.add("on");
            if (rm) return;
            b.animate([{ transform: "scale(0.8)" }, { transform: "scale(1)" }], {
              duration: 300,
              easing: "cubic-bezier(0.34, 1.56, 0.64, 1)",
            });
            for (let i = 0; i < v.count; i++) {
              const a = (i / v.count) * Math.PI * 2,
                d = 44 + (i % 3) * 10,
                p = document.createElement("span");
              p.className = "ac-particle-burst-p";
              p.style.background = colors[i % colors.length];
              wrap.appendChild(p);
              p.animate(
                [
                  { transform: "translate(0, 0) scale(1)", opacity: 1 },
                  { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(0)`, opacity: 0 },
                ],
                { duration: v.dur, easing: "cubic-bezier(0.22, 1, 0.36, 1)" },
              ).onfinish = () => p.remove();
            }
          };
          const ts = [setTimeout(burst, 500)];
          const iv = setInterval(() => {
            b.classList.remove("on");
            ts.push(setTimeout(burst, 500));
          }, 2000);
          return () => {
            clearInterval(iv);
            ts.forEach(clearTimeout);
          };
        },
      });
    </script>
  </body>
</html>
