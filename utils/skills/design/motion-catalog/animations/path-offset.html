<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パスのオフセット（Animated path offset） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-path-offset"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "path-offset",
        name: "パスのオフセット",
        en: "Animated path offset",
        cat: "スクロール",
        kind: "motion",
        description:
          "図形の輪郭を、形を保ったまま外側へ広げたり内側へ縮めたりする量（オフセット）を動かす表現です。線の間隔が一定のまま、輪郭が等高線のように何重にも広がります。",
        use: "ロゴの登場・強調、アイコンの押した反応、波紋のような装飾。",
        params: [{ key: "amt", label: "広げる量", value: 10, min: 2, max: 20, step: 1, unit: "px" }],
        spec: [
          [
            "仕組み",
            "輪郭の各点を、その点の法線（外向き）の方向へ距離 d だけ動かす。d を時間で動かし、何本か d をずらして重ねると広がる輪になる",
          ],
          [
            "ツールでは",
            "After Effects のシェイプレイヤーの「パスのオフセット」、Illustrator のパスのオフセット。角は「マイター・ラウンド・ベベル」から選ぶ",
          ],
          ["Web では", "SVG の太い <code>stroke</code> で近い見た目になる。正確には JS（Clipper・paper.js）で計算する"],
          ["動きを減らす設定", "広がる動きをやめ、何重かの輪郭の静止画にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/drawing-painting-and-paths/shapes-and-shape-attributes/shape-attributes-paint-operations-path.html" target="_blank" rel="noopener">helpx.adobe.com（shape-attributes-paint-opera）</a>、<a href="https://helpx.adobe.com/after-effects/desktop/drawing-painting-and-paths/shapes-and-shape-attributes/use-offset-paths.html" target="_blank" rel="noopener">helpx.adobe.com（use-offset-paths）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const N = 120,
              base = Array.from({ length: N }, (_, i) => {
                const a = (i / N) * TAU,
                  r = 30 + 7 * sin(3 * a) + 4 * cos(5 * a + 1);
                return [110 + cos(a) * r, 75 + sin(a) * r];
              });
            const off = (d) =>
              base.map((p, i) => {
                const a = base[(i - 1 + N) % N],
                  b = base[(i + 1) % N],
                  tx = b[0] - a[0],
                  ty = b[1] - a[1],
                  l = Math.hypot(tx, ty) || 1;
                return [p[0] + (ty / l) * d, p[1] - (tx / l) * d];
              });
            const path = (P0) => {
              g.beginPath();
              P0.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
              g.closePath();
            };
            return raf((t) => {
              const k = rm ? 0.6 : (t * 0.6) % 1;
              g.clearRect(0, 0, W, H);
              path(base);
              g.fillStyle = col("sky");
              g.fill();
              for (let j = 0; j < 3; j++) {
                const f = (k + j / 3) % 1,
                  d = f * v.amt * 3.2;
                path(off(d));
                g.strokeStyle = `rgba(37,99,235,${1 - f})`;
                g.lineWidth = 2;
                g.stroke();
              }
              path(off(-6 + 3 * sin(t * 2) * (rm ? 0 : 1)));
              g.strokeStyle = "#fff";
              g.lineWidth = 1.5;
              g.stroke();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
