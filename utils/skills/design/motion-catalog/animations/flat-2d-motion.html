<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>フラット 2D モーション（Flat 2D Motion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-flat-2d-motion"
        style="position: relative; width: 220px; height: 120px; display: grid; place-items: center"
      >
        <div style="display: flex; gap: 16px; align-items: center">
          <span
            class="ac-flat-2d-motion-s ac-flat-2d-motion-c"
            style="--i: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--sky)"
          ></span
          ><span
            class="ac-flat-2d-motion-s ac-flat-2d-motion-q"
            style="--i: 1; width: 38px; height: 38px; border-radius: 8px; background: var(--cobalt)"
          ></span
          ><span
            class="ac-flat-2d-motion-s ac-flat-2d-motion-t"
            style="
              --i: 2;
              width: 0;
              height: 0;
              border-left: 22px solid transparent;
              border-right: 22px solid transparent;
              border-bottom: 38px solid var(--aqua);
            "
          ></span
          ><span
            class="ac-flat-2d-motion-s ac-flat-2d-motion-p"
            style="--i: 3; width: 22px; height: 44px; border-radius: 999px; background: var(--navy)"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-flat-2d-motion .ac-flat-2d-motion-s {
        display: block;
        animation: ac-flat-2d-motion-in 500ms cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--i) * var(--step, 120ms)) both;
      }
      /* ループは登場（ずらし + 500ms）が終わってから始める */
      .ac-flat-2d-motion .ac-flat-2d-motion-c {
        animation:
          ac-flat-2d-motion-in 500ms cubic-bezier(0.34, 1.56, 0.64, 1) 0ms both,
          ac-flat-2d-motion-bob 1600ms cubic-bezier(0.65, 0, 0.35, 1) 800ms infinite alternate;
      }
      .ac-flat-2d-motion .ac-flat-2d-motion-q {
        animation:
          ac-flat-2d-motion-in 500ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--step, 120ms) both,
          ac-flat-2d-motion-spin 1800ms cubic-bezier(0.65, 0, 0.35, 1) calc(var(--step, 120ms) + 780ms) infinite
            alternate;
      }
      .ac-flat-2d-motion .ac-flat-2d-motion-t {
        animation:
          ac-flat-2d-motion-in 500ms cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--step, 120ms) * 2) both,
          ac-flat-2d-motion-bob 1400ms cubic-bezier(0.65, 0, 0.35, 1) calc(var(--step, 120ms) * 2 + 760ms) infinite
            alternate;
      }
      .ac-flat-2d-motion .ac-flat-2d-motion-p {
        animation:
          ac-flat-2d-motion-in 500ms cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--step, 120ms) * 3) both,
          ac-flat-2d-motion-squish 1200ms cubic-bezier(0.65, 0, 0.35, 1) calc(var(--step, 120ms) * 3 + 740ms) infinite
            alternate;
      }
      @keyframes ac-flat-2d-motion-in {
        from {
          opacity: 0;
          transform: scale(0);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ac-flat-2d-motion-bob {
        to {
          transform: translateY(-12px);
        }
      }
      @keyframes ac-flat-2d-motion-spin {
        to {
          transform: rotate(90deg);
        }
      }
      @keyframes ac-flat-2d-motion-squish {
        to {
          transform: scaleY(0.7);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-flat-2d-motion .ac-flat-2d-motion-s {
          animation: ac-flat-2d-motion-fade 300ms both;
        }
        @keyframes ac-flat-2d-motion-fade {
          from {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "flat-2d-motion",
        name: "フラット 2D モーション",
        en: "Flat 2D Motion",
        cat: "表現スタイル",
        kind: "style",
        description:
          "影や立体感を使わない平面的な図形（丸・四角・三角）を、シンプルな変形でリズムよく動かす表現形式です。インフォグラフィックやアイコンのアニメーションの土台になります。",
        use: "説明セクションの図、空の状態のイラスト、ローディング、アイコンの動き。",
        params: [{ key: "step", label: "ずらす間隔", value: 120, min: 40, max: 300, step: 10, unit: "ms" }],
        total: (p) => p["step"] * 3 + 500,
        spec: [
          ["表現形式", "Flat 2D（単色・影なし・幾何学図形）"],
          ["演出", "図形が拍を刻んで順に現れ、そのあと小さく動き続ける"],
          ["個別の動き", "Pop in + Stagger で登場し、Rotate・Scale・Translate の小さなループ"],
          ["時間・質感", "登場は spring、ループは ease-in-out で 1–2 秒"],
          ["カタログの関連", "pop-in / stagger / rotate / float / loop"],
          ["動きを減らす設定", "ループをやめ、図形を止めて表示する"],
          ["出典", "ChatGPT との会話（表現スタイルの語彙）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
