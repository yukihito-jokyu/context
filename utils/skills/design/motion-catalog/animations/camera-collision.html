<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>壁をよけるカメラ（Camera collision avoidance） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-camera-collision"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "camera-collision",
        name: "壁をよけるカメラ",
        en: "Camera collision avoidance",
        cat: "カメラ",
        kind: "motion",
        description:
          "プレイヤーの後ろから追うカメラとプレイヤーの間に壁などが入ったとき、カメラを壁の手前まで近づけて、プレイヤーが隠れないようにする方法です。上から見た図で、点線が視線、灰色が壁です。",
        use: "三人称のアクションゲーム、3D の空間を歩くアプリ、建物の中のカメラ。",
        params: [],
        spec: [
          [
            "仕組み",
            "プレイヤーから理想のカメラ位置へ線（または球）を飛ばし、壁に当たったら、当たった点から少し手前にカメラを置く",
          ],
          [
            "動き",
            "近づくときは速く（すぐ隠れないように）、離れるときはゆっくり戻す。壁の角で前後に揺れないよう少し待つ",
          ],
          ["各環境では", "Unity Cinemachine の Deoccluder（Collider）、Unreal の Spring Arm の Probe"],
          ["動きを減らす設定", "近づく・離れる動きをなめらかにせず、すぐ決まった位置へ移す"],
          [
            "出典",
            '<a href="https://docs.unity.cn/Packages/com.unity.cinemachine@3.1/manual/CinemachineDeoccluder.html" target="_blank" rel="noopener">docs.unity.cn（CinemachineDeoccluder）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const GY = 112,
              LV = 900;
            const world = (cx, cy = 75, z = 1, extra) => {
              const gr = g.createLinearGradient(0, 0, 0, H);
              gr.addColorStop(0, "#f2f8ff");
              gr.addColorStop(1, "#dbeafe");
              g.fillStyle = gr;
              g.fillRect(0, 0, W, H);
              g.fillStyle = "#c7defc";
              for (let i = -1; i < 6; i++) {
                const x = ((((i * 90 - cx * 0.3) % 450) + 450) % 450) - 60;
                g.beginPath();
                g.ellipse(x, 100 - (cy - 75) * 0.3, 50, 34, 0, Math.PI, 0);
                g.fill();
              }
              g.save();
              g.translate(110, 75);
              g.scale(z, z);
              g.translate(-cx, -cy);
              g.fillStyle = "#93c5fd";
              g.fillRect(-200, GY, LV + 400, 60);
              g.fillStyle = "#7fb3f5";
              for (let x = -200; x < LV + 200; x += 20) g.fillRect(x, GY, 1.5, 60);
              g.fillStyle = col("cobalt");
              for (const [x, y, w] of [
                [240, 84, 50],
                [520, 74, 60],
                [720, 90, 50],
              ]) {
                g.beginPath();
                g.roundRect(x, y, w, 7, 3);
                g.fill();
              }
              if (extra) extra();
              g.restore();
            };
            const hero = (x, y, c = col("blue"), f = 1) => {
              g.fillStyle = c;
              g.beginPath();
              g.roundRect(x - 6, y - 18, 12, 18, 4);
              g.fill();
              g.fillStyle = "#fff";
              g.fillRect(x + f * 2 - 1, y - 14, 2, 2);
            };
            const walk = (t) => {
              const T = t % 8;
              let x, vx;
              if (T < 3) {
                x = 40 + T * 120;
                vx = 120;
              } else if (T < 4) {
                x = 400;
                vx = 0;
              } else if (T < 6.5) {
                x = 400 - (T - 4) * 100;
                vx = -100;
              } else {
                x = 150 - ((T - 6.5) / 1.5) * 110;
                vx = -73;
              }
              const jp = (a) => {
                  const u = (T - a) / 0.6;
                  return u > 0 && u < 1 ? 40 * 4 * u * (1 - u) : 0;
                },
                h = jp(1.2) + jp(5);
              return { x, y: GY - h, vx, air: h > 0, face: vx >= 0 ? 1 : -1 };
            };
            const box = (x, y, w, h, c = "rgba(229,72,77,.8)") => {
              g.strokeStyle = c;
              g.lineWidth = 1.5;
              g.setLineDash([4, 3]);
              g.strokeRect(x, y, w, h);
              g.setLineDash([]);
            };
            let DT = 1 / 60,
              LT = null;
            const clock = (t) => {
              DT = LT === null ? 1 / 60 : Math.min(0.05, Math.max(0, t - LT));
              LT = t;
            };
            const sm = (a, b, k) =>
              a +
              (b - a) *
                (k >= 1 ? 1 : 1 - Math.pow(1 - k, DT * 60)); /* k は 60Hz のときの1フレームの係数。経過時間に換算する */
            let d = 60;
            return raf((t) => {
              clock(t);
              const T = rm ? 1.2 : t,
                px = 80 + 60 * sin(T * 0.6),
                py = 75,
                a = Math.PI + 0.5 * sin(T * 0.9),
                ideal = 70,
                walls = [[120, 30, 14, 90]];
              let hit = ideal;
              for (let s = 4; s <= ideal; s += 2) {
                const x = px + cos(a) * s,
                  y = py + sin(a) * s;
                if (walls.some(([wx, wy, ww, wh]) => x > wx && x < wx + ww && y > wy && y < wy + wh) || x < 6) {
                  hit = Math.max(0, s - 6);
                  break;
                }
              }
              const pxx = 220 - px;
              d = rm ? hit : hit < d ? sm(d, hit, 0.5) : sm(d, hit, 0.05);
              const cx = px + cos(a) * d,
                cy = py + sin(a) * d;
              g.fillStyle = "#f8fbff";
              g.fillRect(0, 0, W, H);
              g.fillStyle = "#9ca3af";
              for (const [wx, wy, ww, wh] of walls) g.fillRect(wx, wy, ww, wh);
              g.strokeStyle = col("line");
              g.setLineDash([2, 3]);
              g.beginPath();
              g.arc(px, py, ideal, 0, TAU);
              g.stroke();
              g.strokeStyle = col("blue");
              g.beginPath();
              g.moveTo(cx, cy);
              g.lineTo(px, py);
              g.stroke();
              g.setLineDash([]);
              dot(px, py, 7, col("blue"));
              g.fillStyle = col("navy");
              g.save();
              g.translate(cx, cy);
              g.rotate(a + Math.PI);
              g.fillRect(-6, -5, 10, 10);
              g.beginPath();
              g.moveTo(4, 0);
              g.lineTo(10, -5);
              g.lineTo(10, 5);
              g.fill();
              g.restore();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
