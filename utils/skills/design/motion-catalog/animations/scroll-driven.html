<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スクロール連動（Scroll-driven animation） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-scroll-driven" style="position: relative; width: 200px; height: 160px">
        <div
          class="ac-scroll-driven-sc"
          style="
            width: 200px;
            height: 160px;
            overflow-y: auto;
            scrollbar-width: none;
            border-radius: 22px;
            background: var(--bg);
            box-shadow: inset 0 0 0 1px var(--line);
          "
        >
          <div class="ac-scroll-driven-bar"><i></i></div>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 6px 12px 12px">
            <div
              class="sb-item"
              style="width: 176px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-aqua" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 90px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div style="display: grid; place-items: center; height: 70px">
              <span
                class="sb-thumb sb-grad-sky ac-scroll-driven-t"
                style="width: 44px; height: 44px; border-radius: 14px"
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 176px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-sky" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 110px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 176px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-deep" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 80px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 176px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-aqua" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 100px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 176px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-sky" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 70px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-scroll-driven .ac-scroll-driven-bar {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 14px 4px;
        background: var(--bg);
      }
      .ac-scroll-driven .ac-scroll-driven-bar i {
        display: block;
        height: 6px;
        border-radius: 999px;
        background: var(--blue);
        transform-origin: left;
        transform: scaleX(0);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-scroll-driven .ac-scroll-driven-t {
          transform: rotate(var(--scroll-angle, 0deg));
        }
      }
      @supports (animation-timeline: scroll()) and (scroll-timeline: --ac-sd y) {
        .ac-scroll-driven .ac-scroll-driven-sc {
          scroll-timeline: --ac-sd y;
        }
        .ac-scroll-driven .ac-scroll-driven-bar i {
          animation: ac-scroll-driven-grow auto linear both;
          animation-timeline: --ac-sd;
        }
        @keyframes ac-scroll-driven-grow {
          from {
            transform: scaleX(0);
          }
          to {
            transform: scaleX(1);
          }
        }
        @media (prefers-reduced-motion: no-preference) {
          .ac-scroll-driven .ac-scroll-driven-t {
            animation: ac-scroll-driven-spin auto linear both;
            animation-timeline: --ac-sd;
          }
          @keyframes ac-scroll-driven-spin {
            from {
              transform: rotate(0deg);
            }
            to {
              transform: rotate(180deg);
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "scroll-driven",
        name: "スクロール連動",
        en: "Scroll-driven animation",
        cat: "スクロール",
        kind: "motion",
        description:
          "時間ではなく、スクロールした量に合わせて動きの進み具合が決まるアニメーションです。スクロールを止めれば動きも止まり、戻せば動きも戻ります。スクロールスクラブ（Scroll scrub）とも呼びます。",
        use: "読了の進捗バー、スクロールで回る・伸びる図、ストーリーテリングのページ。",
        params: [],
        spec: [
          [
            "進み方",
            "スクロール位置 0% → 100% に合わせて、進捗バー <code>scaleX(0 → 1)</code> と四角 <code>rotate(0 → 180deg)</code>",
          ],
          [
            "CSS",
            "スクロール領域に <code>scroll-timeline: --x y</code>、動かす要素に <code>animation-timeline: --x</code>（ページ全体なら <code>scroll()</code>）。イージングは <code>linear</code>",
          ],
          ["JS", "<code>CSS.supports</code> で対応を確認し、未対応なら <code>scroll</code> イベントで進捗を反映する"],
          ["動きを減らす設定", "回転などの大きな動きはやめ、進捗バーのような情報としての動きだけ残す"],
          ["出典", "Animation Vocabulary（Scroll）"],
        ],
        loop: 0,
        run: (stage) => {
          const auto = (sc, ms) => {
            let raf,
              start = null;
            const tick = (now) => {
              if (start === null) start = now;
              const t = (now - start) % (ms + 1000),
                p = Math.min(1, t / ms),
                max = sc.scrollHeight - sc.clientHeight;
              sc.scrollTop = max * (0.5 - Math.cos(Math.PI * p) / 2);
              raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
          };
          const sc = stage.querySelector(".ac-scroll-driven-sc");
          const stop = auto(sc, 3000);
          if (CSS.supports("(animation-timeline: scroll()) and (scroll-timeline: --ac-sd y)")) return stop;

          const bar = sc.querySelector(".ac-scroll-driven-bar i");
          const tile = sc.querySelector(".ac-scroll-driven-t");
          const update = () => {
            const max = sc.scrollHeight - sc.clientHeight;
            const progress = max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 0;
            bar.style.transform = `scaleX(${progress})`;
            tile.style.setProperty("--scroll-angle", `${progress * 180}deg`);
          };
          sc.addEventListener("scroll", update, { passive: true });
          update();
          return () => {
            stop();
            sc.removeEventListener("scroll", update);
          };
        },
      });
    </script>
  </body>
</html>
