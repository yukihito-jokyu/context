<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>すぼめる・膨らませる（Pucker and bloat） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-pucker-bloat"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <svg viewBox="-60 -60 120 120" width="130" height="130">
          <path class="ac-pucker-bloat-p" fill="var(--blue)" />
        </svg>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "pucker-bloat",
        name: "すぼめる・膨らませる",
        en: "Pucker and bloat",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "図形の辺を内側へすぼめると角のとがった星形に、外側へ膨らませると丸く膨らんだ花びらのような形になる変形です。After Effects の「パンク・膨張」のように、1つの形から表情の違う形へなめらかに変わります。",
        use: "ロゴ・アイコンのアニメーション、ボタンの押し込み、装飾、状態の変化（とげとげ → まるまる）。",
        params: [
          { key: "n", label: "角の数", value: 5, min: 3, max: 10, step: 1, unit: "" },
          { key: "dur", label: "周期", value: 2600, min: 800, max: 6000, step: 100, unit: "ms" },
        ],
        spec: [
          [
            "仕組み",
            "多角形の各辺を曲線（2次ベジェ）にし、制御点を辺の中点から中心方向へ動かす。中心へ寄せる＝すぼめる（星形）、外へ出す＝膨らませる",
          ],
          ["動き", "制御点の位置の係数（例 0.3 ↔ 1.6）を往復｜in-out"],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/be_nl/after-effects/desktop/drawing-painting-and-paths/shapes-and-shape-attributes/shape-attributes-paint-operations-path.html" target="_blank" rel="noopener">Adobe: shape operations</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const p = stage.querySelector(".ac-pucker-bloat-p"),
              n = v.n,
              R = 44;
            const draw = (k) => {
              let d = "";
              for (let i = 0; i < n; i++) {
                const a = (i / n) * Math.PI * 2 - Math.PI / 2,
                  b = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2,
                  m = (a + b) / 2,
                  rm2 = R * Math.cos(Math.PI / n) * k;
                const x1 = Math.cos(a) * R,
                  y1 = Math.sin(a) * R,
                  x2 = Math.cos(b) * R,
                  y2 = Math.sin(b) * R,
                  cx = Math.cos(m) * rm2 * 2 - ((x1 + x2) / 2) * 0,
                  cy = Math.sin(m) * rm2 * 2;
                d +=
                  (i ? "" : `M${x1.toFixed(1)},${y1.toFixed(1)}`) +
                  ` Q${(cx - (x1 + x2) / 2).toFixed(1)},${(cy - (y1 + y2) / 2).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
              }
              p.setAttribute("d", d + "Z");
            };
            if (rm) {
              draw(1);
              return null;
            }
            return raf((t) => draw(1 + Math.sin((t * 2 * Math.PI) / (v.dur / 1000)) * 0.7));
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
