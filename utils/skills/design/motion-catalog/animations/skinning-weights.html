<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ウェイト（スキニング）（Skinning weights） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-skinning-weights"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "skinning-weights",
        name: "ウェイト（スキニング）",
        en: "Skinning weights",
        cat: "キャラクター",
        kind: "motion",
        description:
          "画像や形の頂点を、複数の骨に「どのくらいついていくか」の割合（ウェイト）で結び付け、骨を曲げたときに関節のまわりがなめらかに曲がるようにする方法です。ウェイトを付けないと、関節で形が折れてつぶれます。",
        use: "2D のキャラクター（Spine・Live2D・Rive）の腕や体、3D のキャラクター、ぐにゃっと曲がるイラスト。",
        params: [{ key: "blend", label: "なじませる幅", value: 40, min: 0, max: 80, step: 2, unit: "px" }],
        spec: [
          ["仕組み", "頂点の位置 = Σ（骨の変形 × ウェイト）。ウェイトは頂点ごとに合計 1（線形ブレンドスキニング）"],
          ["なじませる幅", "関節の前後で、ウェイトを 0 → 1 にゆるやかに変える範囲。広いほど柔らかく、0 だと折れる"],
          [
            "Web では",
            "Spine・Rive のメッシュとウェイト、three.js の <code>SkinnedMesh</code>（<code>skinIndex</code> / <code>skinWeight</code>）",
          ],
          ["動きを減らす設定", "曲げる動きを止め、少し曲げた形にする"],
          [
            "出典",
            '<a href="https://esotericsoftware.com/spine-in-depth" target="_blank" rel="noopener">Spine: In Depth（Features）</a>、<a href="https://rive.app/features" target="_blank" rel="noopener">Rive Features</a>、<a href="https://aplusc.tv/blog/resource/glossary-of-animation-terms/" target="_blank" rel="noopener">A+C Studios: Glossary of Animation Terms</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            const N = 28,
              L1 = 70,
              L2 = 70,
              R = 15,
              hx = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)),
              lerpc = (a, b, w) => {
                const A = hx(a),
                  B = hx(b);
                return `rgb(${A.map((x, i) => Math.round(x + (B[i] - x) * w)).join(",")})`;
              };
            return raf((t) => {
              const bend = rm ? 0.8 : 0.9 + 0.75 * sin(t * 2);
              g.clearRect(0, 0, W, H);
              const r = [40, 110],
                j = [r[0] + L1, r[1]],
                c = Math.cos(-bend),
                s = Math.sin(-bend);
              const xf = (x, y, w) => {
                const ax = x,
                  ay = y;
                const bx = j[0] + (x - j[0]) * c - (y - j[1]) * s,
                  by = j[1] + (x - j[0]) * s + (y - j[1]) * c;
                return [ax * (1 - w) + bx * w, ay * (1 - w) + by * w];
              };
              const wt = (x) => {
                const d = x - j[0],
                  h = Math.max(0.5, v.blend / 2);
                if (v.blend < 1) return d > 0 ? 1 : 0;
                const u = Math.max(0, Math.min(1, (d + h) / (2 * h)));
                return u * u * (3 - 2 * u);
              };
              const top = [],
                bot = [];
              for (let i = 0; i <= N; i++) {
                const x = r[0] + ((L1 + L2) * i) / N,
                  w = wt(x);
                top.push([xf(x, r[1] - R, w), w]);
                bot.push([xf(x, r[1] + R, w), w]);
              }
              for (let i = 0; i < N; i++) {
                const w = (top[i][1] + top[i + 1][1]) / 2;
                g.fillStyle = lerpc(col("sky"), col("cobalt"), w);
                g.beginPath();
                g.moveTo(...top[i][0]);
                g.lineTo(...top[i + 1][0]);
                g.lineTo(...bot[i + 1][0]);
                g.lineTo(...bot[i][0]);
                g.closePath();
                g.fill();
                g.strokeStyle = "rgba(255,255,255,.55)";
                g.lineWidth = 1;
                g.beginPath();
                g.moveTo(...top[i][0]);
                g.lineTo(...bot[i][0]);
                g.stroke();
              }
              const e = [j[0] + L2 * c, j[1] + L2 * s];
              line([r, j], 3, col("navy"));
              line([j, e], 3, col("navy"));
              [r, j].forEach((p) => dot(p[0], p[1], 4, col("navy")));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
