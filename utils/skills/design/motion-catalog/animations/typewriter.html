<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>タイプライター（Typewriter） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-typewriter"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div
          style="
            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: 0.02em;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 3px;
          "
          aria-hidden="true"
        >
          <span class="ac-typewriter-t">動きで、伝える。</span><span class="sb-caret ac-typewriter-c"></span>
        </div>
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
          "
          >動きで、伝える。</span
        >
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      @media (prefers-reduced-motion: no-preference) {
        .ac-typewriter .ac-typewriter-c {
          animation: ac-typewriter-blink 1s steps(1) infinite;
        }
      }
      @keyframes ac-typewriter-blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "typewriter",
        name: "タイプライター",
        en: "Typewriter",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "文字が1文字ずつ、打ち込まれるように現れる表現です。点滅するキャレットと合わせると、いま書かれている・話している感じが出ます。",
        use: "ヒーローのキャッチコピー、チャットの返答、ターミナル風の演出、AI の生成中の表示。",
        params: [{ key: "speed", label: "1文字の間隔", value: 90, min: 20, max: 300, step: 10, unit: "ms" }],
        spec: [
          [
            "動き",
            "1文字ずつ表示を増やす（JS で文字列を伸ばす、または CSS の <code>steps(文字数)</code> で幅を広げる）",
          ],
          ["キャレット", "<code>opacity 1 ↔ 0</code>｜<code>steps(1)</code>｜1 秒周期"],
          ["読み上げ", "全文を視覚的に隠し、演出は <code>aria-hidden</code> にする"],
          ["動きを減らす設定", "全文を一度に表示し、キャレットの点滅を止める"],
          ["出典", "Animation Vocabulary（Polish & Effects）"],
        ],
        loop: 0,
        run: (stage, v) => {
          const el = stage.querySelector(".ac-typewriter-t");
          const text = el.textContent;
          const motion = matchMedia("(prefers-reduced-motion: no-preference)");
          const segmenter = new Intl.Segmenter("ja", { granularity: "grapheme" });
          const graphemes = Array.from(segmenter.segment(text), ({ segment }) => segment);
          let timer;
          const update = () => {
            clearInterval(timer);
            if (!motion.matches) {
              el.textContent = text;
              return;
            }
            let i = 0;
            el.textContent = "";
            timer = setInterval(() => {
              i = (i + 1) % (graphemes.length + 12);
              el.textContent = graphemes.slice(0, i).join("");
            }, v.speed);
          };
          update();
          motion.addEventListener("change", update);
          return () => {
            clearInterval(timer);
            motion.removeEventListener("change", update);
          };
        },
      });
    </script>
  </body>
</html>
