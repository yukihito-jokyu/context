<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アコーディオン（Accordion / Collapse） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-accordion" style="position: relative; width: 200px; height: 140px">
        <div class="sb-card ac-accordion-acc" style="width: 200px; padding: 14px 16px">
          <div style="display: flex; justify-content: space-between; align-items: center; height: 24px">
            <span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 100px"></span
            ><span class="ac-accordion-chev"
              ><svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="var(--bar-strong)"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 9l6 6 6-6" /></svg
            ></span>
          </div>
          <div class="ac-accordion-body">
            <div style="overflow: hidden">
              <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 14px">
                <span class="sb-bar sb-bar--sm" style="width: 160px"></span
                ><span class="sb-bar sb-bar--sm sb-bar--soft" style="width: 130px"></span
                ><span class="sb-bar sb-bar--sm" style="width: 150px"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-accordion .ac-accordion-body {
        display: grid;
        grid-template-rows: 0fr;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-accordion .ac-accordion-body {
          transition: grid-template-rows var(--dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1);
        }
      }
      .ac-accordion .ac-accordion-chev {
        display: grid;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-accordion .ac-accordion-chev {
          transition: transform var(--dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1);
        }
      }
      .ac-accordion .ac-accordion-acc.open .ac-accordion-body {
        grid-template-rows: 1fr;
      }
      .ac-accordion .ac-accordion-acc.open .ac-accordion-chev {
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "accordion",
        name: "アコーディオン",
        en: "Accordion / Collapse",
        cat: "状態の遷移",
        kind: "motion",
        description:
          "見出しを押すと、下の中身が高さをなめらかに広げて現れ、もう一度押すと閉じる動きです。矢印の回転も合わせて、開いているかどうかを伝えます。",
        use: "FAQ、設定の詳細、サイドバーのグループ、もっと見る。",
        params: [{ key: "dur", label: "開閉の時間", value: 260, min: 100, max: 600, step: 10, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "高さ",
            "<code>grid-template-rows: 0fr ↔ 1fr</code>（中身に <code>overflow: hidden</code>。閉じたら <code>inert</code>）｜out <code>cubic-bezier(0.22, 1, 0.36, 1)</code>",
          ],
          [
            "矢印",
            "<code>rotate(0 ↔ 180deg)</code>｜同じ時間。見出しは <code>aria-expanded</code> 付きの <code>button</code>",
          ],
          [
            "別の方法",
            "<code>interpolate-size: allow-keywords</code> で <code>height: auto</code> へ、または <code>&lt;details&gt;</code> の <code>::details-content</code>",
          ],
          ["動きを減らす設定", "高さの動きをやめ、開閉を瞬時に切り替える"],
          ["出典", "Animation Vocabulary（Transitions Between States）"],
        ],
        loop: 0,
        run: (stage) => {
          const el = stage.querySelector(".ac-accordion-acc");
          const t = setInterval(() => el.classList.toggle("open"), 1500);
          return () => clearInterval(t);
        },
      });
    </script>
  </body>
</html>
