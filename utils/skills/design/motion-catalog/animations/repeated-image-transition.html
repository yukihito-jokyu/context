<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像が連なって次へ（Repeated-image transition） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-repeated-image-transition" style="position: relative; width: 220px; height: 150px">
        <span class="ac-repeated-image-transition-i" style="--i: 6"></span
        ><span class="ac-repeated-image-transition-i" style="--i: 5"></span
        ><span class="ac-repeated-image-transition-i" style="--i: 4"></span
        ><span class="ac-repeated-image-transition-i" style="--i: 3"></span
        ><span class="ac-repeated-image-transition-i" style="--i: 2"></span
        ><span class="ac-repeated-image-transition-i" style="--i: 1"></span
        ><span class="ac-repeated-image-transition-i" style="--i: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-repeated-image-transition .ac-repeated-image-transition-i {
        position: absolute;
        left: 14px;
        top: 90px;
        width: 50px;
        height: 40px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 72% 30%, #fff 0 12px, transparent 13px),
          radial-gradient(ellipse at 25% 115%, var(--cobalt) 0 46%, transparent 47%),
          radial-gradient(ellipse at 85% 120%, var(--navy) 0 50%, transparent 51%),
          linear-gradient(160deg, var(--ice), var(--sky));
        box-shadow: var(--shadow-card);
        transform-origin: 0 0;
        opacity: calc(1 - var(--i) * 0.12);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-repeated-image-transition .ac-repeated-image-transition-i {
          animation: ac-repeated-image-transition-mv var(--dur, 1000ms) cubic-bezier(0.65, 0, 0.35, 1)
            calc(400ms + var(--i) * var(--gap, 60ms)) both;
        }
      }
      .ac-repeated-image-transition .ac-repeated-image-transition-i:not(:last-child) {
        animation:
          ac-repeated-image-transition-mv var(--dur, 1000ms) cubic-bezier(0.65, 0, 0.35, 1)
            calc(400ms + var(--i) * var(--gap, 60ms)) both,
          ac-repeated-image-transition-hide 1ms linear calc(400ms + var(--i) * var(--gap, 60ms) + var(--dur, 1000ms))
            forwards;
      }
      @keyframes ac-repeated-image-transition-mv {
        from {
          transform: none;
        }
        to {
          transform: translate(76px, -76px) scale(2.6, 3);
        }
      }
      @keyframes ac-repeated-image-transition-hide {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-repeated-image-transition .ac-repeated-image-transition-i:not(:last-child) {
          display: none;
        }
        .ac-repeated-image-transition .ac-repeated-image-transition-i:last-child {
          transform: translate(76px, -76px) scale(2.6, 3);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "repeated-image-transition",
        name: "画像が連なって次へ",
        en: "Repeated-image transition",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "画像の複製が少しずつ遅れながら連なって動き、画面を横切る列のようになって、最後の1枚が次の場面の位置に収まる遷移です。残像のリズムが、場面と場面を印象的につなぎます。",
        use: "一覧から詳細への遷移、ギャラリーの切り替え、ポートフォリオ、作品の拡大表示。",
        params: [
          { key: "dur", label: "時間", value: 1000, min: 400, max: 2000, step: 50, unit: "ms" },
          { key: "gap", label: "1枚ごとの遅れ", value: 60, min: 20, max: 150, step: 5, unit: "ms" },
        ],
        spec: [
          [
            "仕組み",
            "同じ画像を 5–8 枚重ね、同じ移動（位置・大きさ）を i × 遅れ（40–80ms）だけずらして再生。最後の1枚以外は途中で消す",
          ],
          ["動き", "in-out。移動先で最後の1枚だけ残り、本物の要素と入れ替える"],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          [
            "出典",
            '<a href="https://tympanus.net/Development/RepeatingImageTransition/" target="_blank" rel="noopener">Codrops: repeating images</a>',
          ],
        ],
        loop: 3000,
      });
    </script>
  </body>
</html>
