<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>被写界深度（Depth of field (bokeh)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-depth-of-field"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-depth-of-field-cam">
          <div class="ac-depth-of-field-L ac-depth-of-field-sky"><i></i></div>
          <div class="ac-depth-of-field-L ac-depth-of-field-bk">
            <b style="left: 20px; top: 30px; width: 16px; height: 16px; --d: 0s"></b
            ><b style="left: 60px; top: 14px; width: 22px; height: 22px; --d: 0.7s"></b
            ><b style="left: 120px; top: 40px; width: 14px; height: 14px; --d: 1.3s"></b
            ><b style="left: 170px; top: 20px; width: 20px; height: 20px; --d: 0.4s"></b
            ><b style="left: 196px; top: 60px; width: 12px; height: 12px; --d: 1.8s"></b
            ><b style="left: 90px; top: 70px; width: 18px; height: 18px; --d: 2.2s"></b
            ><b style="left: 30px; top: 80px; width: 12px; height: 12px; --d: 1.1s"></b>
          </div>
          <div class="ac-depth-of-field-L ac-depth-of-field-far"><i></i></div>
          <div class="ac-depth-of-field-L ac-depth-of-field-gr"><i></i></div>
          <div class="ac-depth-of-field-L ac-depth-of-field-mid"><i></i></div>
          <div class="ac-depth-of-field-L ac-depth-of-field-sub"><i></i></div>
          <div class="ac-depth-of-field-L ac-depth-of-field-near"><i></i></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-depth-of-field .ac-depth-of-field-cam,
      .ac-depth-of-field .ac-depth-of-field-L {
        position: absolute;
        inset: 0;
      }
      .ac-depth-of-field .ac-depth-of-field-L i {
        position: absolute;
        display: block;
      }
      .ac-depth-of-field .ac-depth-of-field-sky i {
        inset: -150px -160px -30px;
        background:
          radial-gradient(ellipse 26px 10px at 30% 22%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(ellipse 20px 8px at 72% 12%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(circle at 50% 70%, #fff 0 12px, transparent 13px) 0 0 / 220px 100% repeat-x,
          linear-gradient(180deg, #f2f8ff, var(--ice) 70%, var(--sky));
      }
      .ac-depth-of-field .ac-depth-of-field-far i {
        left: -330px;
        right: -330px;
        bottom: 30px;
        height: 70px;
        background: radial-gradient(ellipse 60px 46px at 50% 100%, #a9d0ff 98%, transparent) 0 100% / 120px 70px
          repeat-x;
      }
      .ac-depth-of-field .ac-depth-of-field-gr i {
        left: -330px;
        right: -330px;
        bottom: -60px;
        height: 96px;
        background: linear-gradient(#b6dcff, #8fc2ff);
      }
      .ac-depth-of-field .ac-depth-of-field-mid i {
        left: -304px;
        right: -356px;
        bottom: 26px;
        height: 64px;
        background:
          radial-gradient(circle 15px at 24px 22px, var(--cobalt) 97%, transparent) 0 0 / 52px 64px repeat-x,
          linear-gradient(90deg, transparent 22px, var(--navy) 22px 26px, transparent 26px) 0 100% / 52px 30px repeat-x;
      }
      .ac-depth-of-field .ac-depth-of-field-sub i {
        left: 100px;
        bottom: 26px;
        width: 20px;
        height: 34px;
        border-radius: 10px 10px 5px 5px;
        background: var(--blue);
      }
      .ac-depth-of-field .ac-depth-of-field-sub i::before {
        content: "";
        position: absolute;
        left: 3px;
        top: -16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
      }
      .ac-depth-of-field .ac-depth-of-field-near i {
        left: -330px;
        right: -330px;
        bottom: -16px;
        height: 46px;
        background: radial-gradient(ellipse 34px 26px at 50% 100%, #0f2563 97%, transparent) 0 100% / 110px 46px
          repeat-x;
      }
      .ac-depth-of-field .ac-depth-of-field-sky i {
        background: linear-gradient(180deg, #2a3f8f, var(--navy));
      }
      .ac-depth-of-field .ac-depth-of-field-bk b {
        position: absolute;
        border-radius: 50%;
        background: rgba(201, 230, 255, 0.8);
        filter: blur(calc(var(--blur, 6px) * 0.5));
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-depth-of-field .ac-depth-of-field-bk b {
          animation: ac-depth-of-field-tw 3s ease-in-out infinite alternate;
          animation-delay: var(--d);
        }
      }
      .ac-depth-of-field .ac-depth-of-field-far {
        filter: blur(var(--blur, 6px));
      }
      .ac-depth-of-field .ac-depth-of-field-gr,
      .ac-depth-of-field .ac-depth-of-field-mid {
        filter: blur(calc(var(--blur, 6px) * 0.5));
      }
      .ac-depth-of-field .ac-depth-of-field-near {
        filter: blur(calc(var(--blur, 6px) * 1.2));
      }
      .ac-depth-of-field .ac-depth-of-field-sub i {
        transform: scale(1.4);
        transform-origin: 50% 100%;
      }
      @keyframes ac-depth-of-field-tw {
        from {
          opacity: 0.45;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "depth-of-field",
        name: "被写界深度",
        en: "Depth of field (bokeh)",
        cat: "カメラ",
        kind: "motion",
        description:
          "ピントが合う奥行きの範囲を狭くして、主役だけをくっきり、手前や奥をなめらかにぼかす表現です。奥の光は丸い玉のぼけ（ボケ）になり、主役が浮かび上がって見えます。",
        use: "主役を目立たせたいヒーロー、商品写真、モーダルやメニューの背景、3D の製品ビュー。",
        params: [{ key: "blur", label: "ぼけの強さ", value: 6, min: 0, max: 14, step: 1, unit: "px" }],
        spec: [
          [
            "書き方",
            "奥行きごとのレイヤーに、ピントからの距離に比例した <code>filter: blur()</code>（例：奥 = 強さ、中 = 強さ × 0.5、主役 = 0）",
          ],
          ["ボケ", "奥の小さな光を、<code>blur</code> で大きく柔らかい丸にする（光は丸、形は保たない）"],
          ["本格的に", "3D ではポストプロセスの被写界深度（three.js の <code>BokehPass</code>）で、深度に応じてぼかす"],
          ["動きを減らす設定", "ボケのまたたきを止める（ぼかしはそのまま）"],
          [
            "出典",
            '<a href="https://github.com/mrdoob/three.js/tree/dev/examples/jsm/postprocessing" target="_blank" rel="noopener">three.js examples: postprocessing</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
