<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>吹き飛ぶ退出（Bomb exit） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-bomb-exit"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="sb-card ac-bomb-exit-c"
          style="width: 140px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 46px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 77px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 49px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-bomb-exit .ac-bomb-exit-c {
        animation:
          ac-bomb-exit-in 300ms cubic-bezier(0.22, 1, 0.36, 1) both,
          ac-bomb-exit-out var(--out, 700ms) cubic-bezier(0.55, 0, 1, 0.45) 1200ms forwards;
      }
      @keyframes ac-bomb-exit-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ac-bomb-exit-out {
        0% {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
        100% {
          opacity: 0;
          transform: translate(160px, -40px) rotate(var(--spin, 160deg));
          filter: blur(var(--blur, 12px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-bomb-exit-out {
          from {
            opacity: 1;
          }
          to {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "bomb-exit",
        name: "吹き飛ぶ退出",
        en: "Bomb exit",
        cat: "登場・退出",
        kind: "motion",
        description:
          "要素が回転しながら勢いよく横へ飛び、ぼやけて消える退出の動きです。爆風に吹き飛ばされたような強い印象になります。",
        use: "ゲームの演出、取り消せる削除の派手な見せ方、遊びのある画面。普段の UI では強すぎるので控えめに。",
        params: [
          { key: "out", label: "退出の時間", value: 700, min: 300, max: 1500, step: 50, unit: "ms" },
          { key: "spin", label: "回転", value: 160, min: 0, max: 360, step: 10, unit: "deg" },
          { key: "blur", label: "ぼかし", value: 12, min: 0, max: 30, step: 1, unit: "px" },
        ],
        total: (p) => 300 + 900 + p["out"],
        spec: [
          [
            "退出",
            "<code>translate(160px, -40px) rotate(回転)</code>、<code>filter: blur(0 → ぼかし)</code>、<code>opacity 1 → 0</code>｜in",
          ],
          ["デモ", "退出だけの動き。プレビューでは先に 300ms のフェードで出している"],
          ["動きを減らす設定", "飛ばさず、透明度で消すだけにする"],
          [
            "出典",
            '<a href="https://www.minimamente.com/project/magic/" target="_blank" rel="noopener">Magic Animations</a>',
          ],
        ],
        loop: 2400,
      });
    </script>
  </body>
</html>
