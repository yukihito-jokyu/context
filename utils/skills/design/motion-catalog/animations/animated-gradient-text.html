<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流れるグラデーション文字（Animated gradient text） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-animated-gradient-text"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="ac-animated-gradient-text-t"
          style="
            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: 0.02em;
            font-size: 30px;
            line-height: 39px;
          "
        >
          Soft Motion
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-animated-gradient-text .ac-animated-gradient-text-t {
        background: linear-gradient(90deg, var(--cobalt), var(--sky), var(--aqua), var(--cobalt));
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-animated-gradient-text .ac-animated-gradient-text-t {
          animation: ac-animated-gradient-text-flow var(--dur, 4000ms) linear infinite;
        }
      }
      @keyframes ac-animated-gradient-text-flow {
        from {
          background-position: 0% 50%;
        }
        to {
          background-position: 300% 50%;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "animated-gradient-text",
        name: "流れるグラデーション文字",
        en: "Animated gradient text",
        cat: "文字",
        kind: "motion",
        description:
          "文字の中に塗ったグラデーションが、ゆっくり横へ流れ続ける表現です。文字そのものは動かないので読みやすさを保ちながら、見出しに生きた光沢を与えます。",
        use: "ヒーローの見出し、新機能のラベル、ブランド名、AI 関連の強調。",
        params: [{ key: "dur", label: "一巡の時間", value: 4000, min: 1500, max: 10000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "<code>background: linear-gradient(90deg, 色A, 色B, 色C, 色A)</code>、<code>background-size: 300%</code>、<code>background-clip: text</code>、文字色は透明",
          ],
          [
            "動き",
            "<code>background-position: 0% → 300%</code>（画像1周期の整数倍）｜linear｜くり返し（最初と最後の色をそろえる）",
          ],
          ["色", "同系色の濃淡で流すと上品。ここでは cobalt → sky → aqua"],
          ["動きを減らす設定", "流れを止め、グラデーションの静止画にする"],
          [
            "出典",
            '<a href="https://magicui.design/docs/components/animated-gradient-text" target="_blank" rel="noopener">Magic UI: Animated Gradient Text</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
