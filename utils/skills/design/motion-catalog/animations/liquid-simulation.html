<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流れる液体（Free-surface liquid simulation） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-liquid-simulation"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "liquid-simulation",
        name: "流れる液体",
        en: "Free-surface liquid simulation",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "小さな粒に「近すぎると押し合い、離れると寄り合う」力をかけ、容器の液体が傾きに合わせて流れ、波立つ様子を物理で動かします。プレビューは簡単な計算で近い形にしています。",
        use: "飲料・化学系の製品の演出、ゲームの水、液体の量を表す UI（残量・進み具合）、遊び心のある背景。",
        params: [{ key: "tilt", label: "傾ける角度", value: 18, min: 0, max: 35, step: 1, unit: "°" }],
        spec: [
          [
            "作り方",
            "粒子法（SPH・PBF など）：各粒の近くの粒の数から密度を求め、決めた密度より高ければ外へ、低ければ内へ押す。重力と壁との衝突を足す",
          ],
          ["見せ方", "粒を少し大きめの円で描いてぼかし、しきい値で輪郭を出すと液面がつながって見える（メタボール）"],
          [
            "本格的に",
            "数千〜数万の粒は WebGPU のコンピュートか WebGL のフラグメントシェーダーで動かす（PBF・FLIP）。3D なら液面をメッシュにして屈折させる",
          ],
          ["動きを減らす設定", "流れる動きをやめ、液体が平らに溜まった静止画にする"],
          [
            "出典",
            '<a href="https://www.sidefx.com/docs/houdini/vellum/fluidsetups.html" target="_blank" rel="noopener">sidefx.com（fluidsetups）</a>、<a href="https://dev.epicgames.com/documentation/en-us/unreal-engine/niagara-fluids-reference-in-unreal-engine" target="_blank" rel="noopener">dev.epicgames.com（niagara-fluids-reference-in-）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const n = 180,
              P0 = [];
            for (let i = 0; i < n; i++) P0.push({ x: 40 + (i % 13) * 7, y: 50 + Math.floor(i / 13) * 7, vx: 0, vy: 0 });
            const box = [24, 18, 196, 132],
              h = 11,
              h2 = h * h;
            const step = (gx, gy) => {
              for (const p of P0) {
                p.vx += gx;
                p.vy += gy;
                p.ox = p.x;
                p.oy = p.y;
                p.x += p.vx;
                p.y += p.vy;
              }
              for (let i = 0; i < n; i++) {
                const a = P0[i];
                let d = 0,
                  dn = 0;
                const nb = [];
                for (let j = 0; j < n; j++) {
                  if (i === j) continue;
                  const b = P0[j],
                    dx = b.x - a.x,
                    dy = b.y - a.y,
                    r2 = dx * dx + dy * dy;
                  if (r2 < h2) {
                    const q = 1 - Math.sqrt(r2) / h;
                    d += q * q;
                    dn += q * q * q;
                    nb.push([b, dx, dy, q]);
                  }
                }
                const pr = 0.04 * (d - 3.2),
                  pn = 0.1 * dn;
                for (const [b, dx, dy, q] of nb) {
                  const r = Math.hypot(dx, dy) || 1,
                    D = (pr * q + pn * q * q) * 0.5,
                    ux = (dx / r) * D,
                    uy = (dy / r) * D;
                  b.x += ux;
                  b.y += uy;
                  a.x -= ux;
                  a.y -= uy;
                }
              }
              for (const p of P0) {
                p.x = Math.min(box[2], Math.max(box[0], p.x));
                p.y = Math.min(box[3], Math.max(box[1], p.y));
                p.vx = (p.x - p.ox) * 0.99;
                p.vy = (p.y - p.oy) * 0.99;
              }
            };
            if (rm) for (let i = 0; i < 300; i++) step(0, 0.12);
            return raf((t) => {
              const a = rm ? 0 : (sin(t * 0.9) * v.tilt * Math.PI) / 180;
              if (!rm) step(sin(a) * 0.12, cos(a) * 0.12);
              g.clearRect(0, 0, W, H);
              g.save();
              g.translate(110, 75);
              g.rotate(-a);
              g.translate(-110, -75);
              g.strokeStyle = col("line");
              g.lineWidth = 3;
              g.strokeRect(box[0] - 5, box[1] - 5, box[2] - box[0] + 10, box[3] - box[1] + 10);
              blur(2, col("blue"));
              for (const p of P0) dot(p.x, p.y, 5.5, col("blue"));
              blur(0);
              g.restore();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
