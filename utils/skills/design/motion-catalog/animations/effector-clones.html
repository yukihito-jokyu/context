<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>テクスチャで動かす複製（Texture-driven clone animation (effector)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-effector-clones"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "effector-clones",
        name: "テクスチャで動かす複製",
        en: "Texture-driven clone animation (effector)",
        cat: "スクロール",
        kind: "motion",
        description:
          "同じ形をたくさん並べ（クローン）、動くテクスチャの明るさを各クローンの位置で読み、その値で大きさや回転を変える方法です。左上の小さな絵が、動かしているテクスチャです。",
        use: "3D のモーショングラフィックス、ヒーローの背景、ロゴの組み立て。",
        params: [{ key: "speed", label: "テクスチャの動く速さ", value: 1, min: 0, max: 3, step: 0.1, unit: "" }],
        spec: [
          [
            "仕組み",
            "クローンの位置でテクスチャの値 v を読み、<code>scale = 最小 + v × 幅</code>、<code>rotate = v × 角度</code> にする",
          ],
          [
            "ツールでは",
            "Cinema 4D の MoGraph のシェーダーエフェクター（ノイズ・グラデーション）、Blender のジオメトリノードのテクスチャ",
          ],
          [
            "Web では",
            "canvas で格子の点ごとにノイズを計算して描く。数が多いときは WebGL のインスタンス描画で、頂点シェーダーでノイズを読む",
          ],
          ["動きを減らす設定", "テクスチャの動きを止め、クローンが並んだ静止画にする"],
          [
            "出典",
            '<a href="https://help.maxon.net/c4d/en-us/Content/html/7443.html" target="_blank" rel="noopener">help.maxon.net（7443）</a>、<a href="https://help.maxon.net/c4d/en-us/Content/html/OESHADER.html" target="_blank" rel="noopener">help.maxon.net（OESHADER）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const fld = (x, y, T) =>
              0.5 + 0.5 * sin(x * 0.045 + T * 1.5) * cos(y * 0.06 - T) * 0.8 + 0.1 * sin((x + y) * 0.08 + T * 2);
            return raf((t) => {
              const T = rm ? 0.5 : t * v.speed;
              g.clearRect(0, 0, W, H);
              for (let j = 0; j < 7; j++)
                for (let i = 0; i < 11; i++) {
                  const x = 20 + i * 18,
                    y = 21 + j * 18,
                    f = Math.min(1, Math.max(0, fld(x, y, T))),
                    s = 3 + 6 * f;
                  g.save();
                  g.translate(x, y);
                  g.rotate((f * Math.PI) / 2);
                  g.fillStyle = f > 0.6 ? col("blue") : f > 0.35 ? col("sky") : col("ice");
                  g.fillRect(-s, -s, s * 2, s * 2);
                  g.restore();
                }
              g.fillStyle = "#fff";
              g.fillRect(4, 4, 42, 30);
              for (let j = 0; j < 14; j++)
                for (let i = 0; i < 20; i++) {
                  const f = Math.min(1, Math.max(0, fld(20 + i * 10, 21 + j * 9, T)));
                  g.fillStyle = `rgba(27,58,138,${f})`;
                  g.fillRect(5 + i * 2, 5 + j * 2, 2, 2);
                }
              g.strokeStyle = col("line");
              g.strokeRect(4.5, 4.5, 41, 29);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
