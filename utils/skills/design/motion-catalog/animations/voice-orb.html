<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声に反応する球（Voice orb (twisting strands)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-voice-orb"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "voice-orb",
        name: "声に反応する球",
        en: "Voice orb (twisting strands)",
        cat: "ループ・常時の動き",
        kind: "motion",
        description:
          "すりガラスの球の中で、色の違う光の筋がねじれながら回り、声が入るとふくらんで波打ち、静かになると細くまとまって 1 つに溶け合う動きです。音声アシスタントが聞いている・話していることを伝えます。プレビューは canvas で近い形にしています（元の作例は WebGL）。",
        use: "音声アシスタント・AI のチャットの入力中・応答中の表示、録音中の表示、音声入力のボタン。",
        params: [{ key: "amt", label: "ふくらみの強さ", value: 1, min: 0, max: 1.5, step: 0.05, unit: "" }],
        spec: [
          [
            "作り方",
            "筋ごとに閉じた曲線 <code>r(θ) = 基本 × (1 + 音量 × 波(θ, t))</code> を描き、ぼかしと加算合成で重ねて、球の形で切り抜く。筋ごとに波の数・速さ・位相を変える",
          ],
          [
            "音量",
            "マイクの音量（Web Audio の <code>AnalyserNode</code>）を、上がるときは速く、下がるときはゆっくり追わせてから使う。小さいときは筋がそろって重なる。聞き取り中・応答中は文字でも示す",
          ],
          ["本格的に", "WebGL のシェーダーで、筋の発光と屈折するガラスの縁を描く"],
          ["動きを減らす設定", "筋の回転と波を止め、静かな状態の球の静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/llms.txt" target="_blank" rel="noopener">React Bits（コンポーネント一覧）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const cx = 110,
              cy = 75,
              R = 52,
              cols3 = ["90,209,255", "59,130,246", "167,139,250"];
            let lvl = 0,
              last = 0;
            return raf((t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              const c = t % 6,
                talk = rm ? 0 : c > 2 && c < 5.2 ? 0.45 + 0.55 * Math.abs(Math.sin(t * 6.3) * Math.sin(t * 2.1)) : 0.05;
              lvl += (talk - lvl) * (1 - Math.pow(1 - (talk > lvl ? 0.25 : 0.05), dt * 60));
              /* 上がるときは速く、下がるときはゆっくり（経過時間で） */ const T = rm ? 0 : t;
              g.globalCompositeOperation = "source-over";
              g.clearRect(0, 0, W, H);
              g.save();
              g.beginPath();
              g.arc(cx, cy, R, 0, TAU);
              g.clip();
              const bg = g.createRadialGradient(cx - 14, cy - 18, 4, cx, cy, R);
              bg.addColorStop(0, "rgba(255,255,255,.16)");
              bg.addColorStop(1, "rgba(255,255,255,.04)");
              g.fillStyle = bg;
              g.fillRect(0, 0, W, H);
              g.globalCompositeOperation = "lighter";
              cols3.forEach((cc, k) => {
                g.beginPath();
                for (let i = 0; i <= 72; i++) {
                  const a = (i / 72) * TAU,
                    w =
                      Math.sin(a * (2 + k) + T * (1.3 + k * 0.4) + k * 2.1) * Math.sin(a * 3 - T * (0.9 + k * 0.3) + k),
                    r = R * (0.36 + lvl * v.amt * 0.46 * (0.5 + 0.5 * w) + 0.015 * Math.sin(a * 2 + T * 2 + k));
                  const x = cx + Math.cos(a + T * 0.3 * (k - 1)) * r,
                    y = cy + Math.sin(a + T * 0.3 * (k - 1)) * r * (0.75 + 0.25 * lvl);
                  i ? g.lineTo(x, y) : g.moveTo(x, y);
                }
                g.closePath();
                blur(6, `rgba(${cc},.5)`);
                g.fillStyle = `rgba(${cc},.2)`;
                g.fill();
                blur(1, `rgba(${cc},.9)`);
                g.strokeStyle = `rgba(${cc},.95)`;
                g.lineWidth = 2.2;
                g.stroke();
              });
              blur(0);
              g.restore();
              g.globalCompositeOperation = "source-over";
              g.strokeStyle = "rgba(255,255,255,.28)";
              g.lineWidth = 1.5;
              g.beginPath();
              g.arc(cx, cy, R, 0, TAU);
              g.stroke();
              g.strokeStyle = "rgba(255,255,255,.5)";
              g.lineWidth = 2;
              g.beginPath();
              g.arc(cx, cy, R - 3, -2.4, -1.6);
              g.stroke();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
