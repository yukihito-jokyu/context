<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>折りたたまれる文字（Folding text） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-folding-text"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center; perspective: 400px"
      >
        <div
          class="ac-folding-text-w"
          style="
            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: 0.02em;
            font-size: 34px;
            line-height: 44px;
          "
        >
          <span class="ac-folding-text-a">FOLD</span><span class="ac-folding-text-b">FOLD</span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-folding-text .ac-folding-text-w {
        display: grid;
        color: var(--ink);
      }
      .ac-folding-text .ac-folding-text-a,
      .ac-folding-text .ac-folding-text-b {
        grid-area: 1 / 1;
      }
      .ac-folding-text .ac-folding-text-a {
        clip-path: inset(0 0 50% 0);
        transform-origin: 50% 50%;
        color: var(--cobalt);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-folding-text .ac-folding-text-a {
          animation: ac-folding-text-fold var(--dur, 700ms) cubic-bezier(0.65, 0, 0.35, 1) 400ms both;
        }
      }
      .ac-folding-text .ac-folding-text-b {
        clip-path: inset(50% 0 0 0);
        color: var(--navy);
      }
      @keyframes ac-folding-text-fold {
        0% {
          transform: rotateX(0);
          filter: brightness(1);
        }
        50% {
          transform: rotateX(-88deg);
          filter: brightness(0.6);
        }
        100% {
          transform: rotateX(0);
          filter: brightness(1);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "folding-text",
        name: "折りたたまれる文字",
        en: "Folding text",
        cat: "文字",
        kind: "motion",
        description:
          "文字の上半分が、折り目を軸にして紙のように手前へ倒れて閉じ、また起き上がって開く表現です。立体的な折り紙のような、手で触れられそうな見出しになります。",
        use: "見出しの登場、ブランドのタイトル、カードの表示切り替え、案内板風の演出。",
        params: [{ key: "dur", label: "時間", value: 700, min: 300, max: 1500, step: 50, unit: "ms" }],
        spec: [
          [
            "分け方",
            "同じ文字を2つ重ね（片方は <code>aria-hidden</code>）、<code>clip-path: inset(0 0 50% 0)</code>（上半分）と <code>inset(50% 0 0 0)</code>（下半分）にする",
          ],
          [
            "動き",
            "上半分を <code>transform-origin: 50% 50%</code>（折り目）で <code>rotateX(0 → -90deg → 0)</code>｜in-out｜親に <code>perspective</code>",
          ],
          ["影", "倒れている間は上半分を暗くすると、紙の折れ目らしくなる"],
          ["動きを減らす設定", "折る動きをやめ、透明度で出し入れする"],
          [
            "出典",
            '<a href="https://reactbits.dev/text-animations/fold-text" target="_blank" rel="noopener">React Bits: Fold Text</a>',
          ],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
