<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>極座標（Polar coordinates） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-polar-coordinates"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "polar-coordinates",
        name: "極座標",
        en: "Polar coordinates",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "横に並んだ絵（縦の棒や地平線）を、中心から放射状に広がる円形の絵へ変える（またはその逆の）変形です。棒グラフが花火のような放射状の形に、地平線が小さな惑星のような形になります。",
        use: "タイトルやロゴの印象的な変形、データの見せ方の切り替え（棒グラフ → 放射状）、ループ映像のモーショングラフィックス。",
        params: [{ key: "dur", label: "片道の時間", value: 2400, min: 800, max: 6000, step: 100, unit: "ms" }],
        spec: [
          ["仕組み", "横位置 x → 角度（x / 幅 × 360°）、縦位置 y → 半径。途中は元の位置と円の位置を補間する"],
          ["向き", "下の辺を中心に集めると「小さな惑星」、上の辺を中心にすると「トンネル」"],
          ["ツールでは", "After Effects の Polar Coordinates（Rect to Polar）。データなら D3 の放射状の棒グラフ"],
          ["動きを減らす設定", "変形の動きを止め、円形の状態で止める"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Distort）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const bars = Array.from({ length: 24 }, (_, i) => 0.25 + 0.7 * Math.abs(sin(i * 1.7) * cos(i * 0.6)));
            return raf((t) => {
              const T = v.dur / 1000,
                ph = rm ? 1 : Math.min(1, Math.max(0, (0.5 - 0.5 * cos((t / T) * Math.PI)) * 1.3 - 0.15)),
                e = ph * ph * (3 - 2 * ph);
              g.clearRect(0, 0, W, H);
              const map = (x, y) => {
                const rx = 20 + x * 180,
                  ry = 130 - y * 100,
                  a = -Math.PI / 2 + x * TAU,
                  r = 10 + y * 58;
                return [rx + (110 + r * cos(a) - rx) * e, ry + (75 + r * sin(a) - ry) * e];
              };
              bars.forEach((b, i) => {
                const x0 = i / 24 + 0.006,
                  x1 = (i + 1) / 24 - 0.006;
                g.beginPath();
                const n = 6;
                for (let k = 0; k <= n; k++) g.lineTo(...map(x0 + ((x1 - x0) * k) / n, 0));
                for (let k = n; k >= 0; k--) g.lineTo(...map(x0 + ((x1 - x0) * k) / n, b));
                g.closePath();
                g.fillStyle = i % 3 ? col("sky") : col("blue");
                g.fill();
              });
              g.strokeStyle = col("navy");
              g.lineWidth = 2;
              g.beginPath();
              for (let k = 0; k <= 60; k++) g.lineTo(...map(k / 60, 0));
              g.stroke();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
