<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>浮いて移る共有要素（Gravity-connected transition） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-gravity-connected-transition" style="position: relative; width: 220px; height: 160px">
        <div class="ac-gravity-connected-transition-list">
          <span class="sb-grad-aqua" style="width: 44px; height: 44px; border-radius: 12px"></span
          ><span class="sb-grad-sky" style="width: 44px; height: 44px; border-radius: 12px"></span
          ><span class="sb-grad-deep" style="width: 44px; height: 44px; border-radius: 12px"></span>
        </div>
        <div class="ac-gravity-connected-transition-dst">
          <span class="ac-gravity-connected-transition-ph"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 90px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 60px"></span>
        </div>
        <span class="ac-gravity-connected-transition-m sb-grad-sky"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-gravity-connected-transition .ac-gravity-connected-transition-list {
        position: absolute;
        left: 14px;
        top: 104px;
        display: flex;
        gap: 10px;
        transition: opacity 300ms;
      }
      .ac-gravity-connected-transition .ac-gravity-connected-transition-dst {
        position: absolute;
        left: 14px;
        top: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        opacity: 0;
        transition: opacity 300ms;
      }
      .ac-gravity-connected-transition .ac-gravity-connected-transition-ph {
        width: 192px;
        height: 64px;
      }
      .ac-gravity-connected-transition .ac-gravity-connected-transition-m {
        position: absolute;
        left: 68px;
        top: 104px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        transform-origin: 0 0;
      }
      .ac-gravity-connected-transition.is-open .ac-gravity-connected-transition-dst {
        opacity: 1;
        transition-delay: calc(var(--dur, 600ms) * 0.5);
      }
      .ac-gravity-connected-transition.is-open .ac-gravity-connected-transition-list {
        opacity: 0.25;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "gravity-connected-transition",
        name: "浮いて移る共有要素",
        en: "Gravity-connected transition",
        cat: "画面移動・ナビ",
        kind: "motion",
        description:
          "一覧の画像を押すと、その画像がいったん手前に浮き上がり（影が濃くなり）、少し沈むような弧を描いて、次の画面の大きな画像の位置へ移る動きです。重さのある物を持ち上げて運ぶような、つながりのある遷移になります。",
        use: "一覧から詳細への遷移、写真のギャラリー、メディアの再生画面への移動。",
        params: [
          { key: "dur", label: "時間", value: 600, min: 300, max: 1200, step: 50, unit: "ms" },
          { key: "lift", label: "浮く大きさ", value: 1.1, min: 1, max: 1.3, step: 0.02, unit: "" },
        ],
        total: (p) => p["dur"],
        spec: [
          ["浮く", "最初の 25% で <code>scale(浮く大きさ)</code> と影を濃く（手前に来る）"],
          ["移る", "残りで行き先の位置・大きさへ。軌道は少し下にたわむ弧｜in-out"],
          [
            "仕組み",
            "Windows の Connected Animation の Gravity 設定と同じ考え方。Web では共有要素の遷移（View Transitions）か FLIP",
          ],
          ["動きを減らす設定", "浮きと弧をやめ、行き先の画面をフェードで出す"],
          [
            "出典",
            '<a href="https://learn.microsoft.com/en-us/windows/apps/develop/motion/connected-animation" target="_blank" rel="noopener">Microsoft: Connected animation</a>',
          ],
        ],
        loop: 3000,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const m = stage.querySelector(".ac-gravity-connected-transition-m"),
              r = stage.firstElementChild;
            const go = () => {
              r.classList.add("is-open");
              const L = v.lift;
              const kf = rm
                ? [
                    { opacity: 0, transform: "translate(-54px, -94px) scale(4.36, 1.45)" },
                    { opacity: 1, transform: "translate(-54px, -94px) scale(4.36, 1.45)" },
                  ]
                : [
                    { transform: "none", boxShadow: "0 0 0 rgba(0,0,0,0)" },
                    {
                      transform: `translate(-2px, -6px) scale(${L})`,
                      boxShadow: "0 18px 30px rgba(18,26,43,.28)",
                      offset: 0.25,
                      easing: "cubic-bezier(0.65, 0, 0.35, 1)",
                    },
                    {
                      transform: "translate(-30px, -40px) scale(2.6, 1.3)",
                      boxShadow: "0 14px 26px rgba(18,26,43,.2)",
                      offset: 0.6,
                    },
                    { transform: "translate(-54px, -94px) scale(4.36, 1.45)", boxShadow: "0 0 0 rgba(0,0,0,0)" },
                  ];
              m.animate(kf, { duration: v.dur, fill: "forwards" });
            };
            return seq(3000, [
              [600, go],
              [
                2400,
                () => {
                  r.classList.remove("is-open");
                  m.getAnimations().forEach((a) => a.cancel());
                },
              ],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
