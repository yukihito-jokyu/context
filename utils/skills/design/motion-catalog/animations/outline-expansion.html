<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>広がる輪郭（Outline expansion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-outline-expansion"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <span class="ac-outline-expansion-b"
          ><span class="sb-bar sb-bar--xs sb-bar--on-blue" style="width: 60px"></span
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-outline-expansion .ac-outline-expansion-b {
        position: relative;
        display: grid;
        place-items: center;
        width: 130px;
        height: 46px;
        border-radius: 14px;
        background: var(--blue);
      }
      .ac-outline-expansion .ac-outline-expansion-b::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        border: 2px solid var(--blue);
        opacity: 0;
        transition:
          inset var(--dur, 300ms) cubic-bezier(0.22, 1, 0.36, 1),
          opacity var(--dur, 300ms),
          border-radius var(--dur, 300ms);
      }
      .ac-outline-expansion .ac-outline-expansion-b.is-on::before {
        inset: -7px;
        border-radius: 19px;
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-outline-expansion .ac-outline-expansion-b::before {
          transition: opacity 150ms;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "outline-expansion",
        name: "広がる輪郭",
        en: "Outline expansion",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "ボタンにポインターを乗せると、ボタンの外側に輪郭線が現れて少し離れたところまで広がり、ボタンを囲むように強調する動きです。押す前の注目と期待感を高めます。",
        use: "主要な CTA ボタン、アイコンボタン、選択中のカード、フォーカスの表示。",
        params: [{ key: "dur", label: "時間", value: 300, min: 100, max: 700, step: 10, unit: "ms" }],
        spec: [
          [
            "書き方",
            "疑似要素の枠（2px）を <code>inset: 0</code> から <code>inset: -6px</code> へ（または <code>scale</code>）、<code>opacity 0 → 1</code>｜out",
          ],
          ["逆向き", "外から内へ縮んで重なる型（outline in）もある"],
          ["フォーカス", "キーボード操作の <code>:focus-visible</code> にも同じ表示を使うと一貫する"],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          ["出典", '<a href="https://ianlunn.github.io/Hover/" target="_blank" rel="noopener">Hover.css</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const el = stage.querySelector(".ac-outline-expansion-b");
            return seq(2600, [
              [600, () => el.classList.add("is-on")],
              [1900, () => el.classList.remove("is-on")],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
