<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>泡（Bubbles） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-bubbles"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
          background: linear-gradient(180deg, var(--ice), var(--sky));
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "bubbles",
        name: "泡",
        en: "Bubbles",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "丸い泡が、ゆらゆらと左右に揺れながら浮かび上がり、上で消えたりはじけたりする表現です。透明な縁と小さな光の点が、泡らしさを作ります。",
        use: "飲み物・お風呂・水まわりのブランド、水中の背景、待ち時間の演出、成功時のやわらかな演出。",
        params: [{ key: "n", label: "泡の数", value: 18, min: 4, max: 40, step: 1, unit: "個" }],
        spec: [
          ["動き", "浮く速さは大きい泡ほど速く。横揺れは <code>sin(時間 × 周波数 + ずれ)</code> で泡ごとにずらす"],
          ["見た目", "中はほぼ透明、縁を薄い色、左上に小さな白い光の点"],
          ["はじける", "上の端に着いたら、輪が少し広がって消える（150〜250ms）"],
          ["動きを減らす設定", "浮かぶ動きを止め、泡を止まった状態で見せる"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/effects-and-animation-presets/effect-list.html" target="_blank" rel="noopener">Adobe After Effects: Effect list（Simulation）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const bs = [],
              pops = [];
            const add = (y) =>
              bs.push({
                x: 15 + rnd() * 190,
                y: y ?? 160 + rnd() * 40,
                r: 3 + rnd() * 9,
                ph: rnd() * TAU,
                f: 1 + rnd() * 2,
              });
            for (let i = 0; i < 40; i++) add(rnd() * 160);
            let last = 0;
            const frame = (t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              g.clearRect(0, 0, W, H);
              bs.slice(0, v.n).forEach((b) => {
                if (!rm) b.y -= (18 + b.r * 3.2) * dt;
                const x = b.x + (rm ? 0 : 6 * sin(t * b.f + b.ph));
                if (!rm && b.y < 8 + b.r) {
                  pops.push({ x, y: b.y, r: b.r, t: 0 });
                  Object.assign(b, { y: 160 + rnd() * 30, x: 15 + rnd() * 190 });
                  return;
                }
                g.fillStyle = "rgba(255,255,255,.18)";
                g.strokeStyle = "rgba(255,255,255,.85)";
                g.lineWidth = 1.3;
                g.beginPath();
                g.arc(x, b.y, b.r, 0, TAU);
                g.fill();
                g.stroke();
                dot(x - b.r * 0.35, b.y - b.r * 0.35, Math.max(1, b.r * 0.22), "#fff");
              });
              for (let i = pops.length - 1; i >= 0; i--) {
                const p = pops[i];
                p.t += dt;
                if (p.t > 0.22) {
                  pops.splice(i, 1);
                  continue;
                }
                g.strokeStyle = `rgba(255,255,255,${1 - p.t / 0.22})`;
                g.beginPath();
                g.arc(p.x, p.y, p.r * (1 + p.t * 5), 0, TAU);
                g.stroke();
              }
            };
            if (rm) {
              frame(0);
              return null;
            } // 動きを減らす設定：止まった状態を一度だけ描く
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
