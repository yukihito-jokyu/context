<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>色をはさむ切り替え（Dip to color (black / white)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-dip-to-color"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div
          class="ac-dip-to-color-s ac-dip-to-color-a"
          style="
            background:
              radial-gradient(circle at 72% 30%, #fff 0 12px, transparent 13px),
              radial-gradient(ellipse at 25% 115%, var(--cobalt) 0 46%, transparent 47%),
              radial-gradient(ellipse at 85% 120%, var(--navy) 0 50%, transparent 51%),
              linear-gradient(160deg, var(--ice), var(--sky));
          "
        ></div>
        <div
          class="ac-dip-to-color-s ac-dip-to-color-b"
          style="
            background:
              radial-gradient(circle at 30% 32%, #eaf2ff 0 11px, transparent 12px),
              radial-gradient(circle at 62% 22%, #fff 0 1.5px, transparent 2px),
              radial-gradient(circle at 82% 40%, #fff 0 1.5px, transparent 2px),
              radial-gradient(ellipse at 70% 118%, #0f2563 0 52%, transparent 53%),
              linear-gradient(200deg, #2a3f8f, var(--navy));
          "
        ></div>
        <div class="ac-dip-to-color-s ac-dip-to-color-k"></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-dip-to-color .ac-dip-to-color-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-dip-to-color .ac-dip-to-color-k {
        background: #0b1020;
        opacity: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-dip-to-color .ac-dip-to-color-k {
          animation: ac-dip-to-color-k var(--dur, 2600ms) ease-in-out infinite alternate;
        }
      }
      .ac-dip-to-color .ac-dip-to-color-b {
        animation: ac-dip-to-color-t var(--dur, 2600ms) step-end infinite alternate;
      }
      @keyframes ac-dip-to-color-k {
        0%,
        25% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        75%,
        100% {
          opacity: 0;
        }
      }
      @keyframes ac-dip-to-color-t {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes ac-dip-to-color-rf {
        0%,
        45% {
          opacity: 0;
        }
        55%,
        100% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-dip-to-color .ac-dip-to-color-b {
          animation-name: ac-dip-to-color-rf;
          animation-timing-function: linear;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "dip-to-color",
        name: "色をはさむ切り替え",
        en: "Dip to color (black / white)",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "前のショットをいったん黒（または白・好きな色）に溶かし、その色から次のショットを浮かび上がらせる切り替えです。黒は区切り・時間の経過、白は回想・明るい驚きを感じさせます。",
        use: "章の区切り、動画の始まりと終わり、場面が大きく変わるとき、ログイン後のウェルカム画面。",
        params: [{ key: "dur", label: "片道の長さ", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          ["書き方", "上に単色の層を置き、<code>opacity 0 → 1 → 0</code>。いちばん濃くなった瞬間に A → B を入れ替える"],
          ["色", "黒：区切り・終わり、白：回想・ひらめき、ブランド色：ロゴへのつなぎ"],
          ["時間", "暗くなる・明るくなるで合わせて 600〜1000ms。真っ黒の時間を少し置くと区切りが強まる"],
          ["動きを減らす設定", "色をはさまず、短いクロスフェードにする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/premiere/desktop/add-video-effects/effects-and-transitions-library/list-of-video-transitions.html" target="_blank" rel="noopener">Adobe Premiere: List of Video transitions</a>、<a href="https://support.apple.com/en-il/guide/imovie-iphone/kna737b471f/ios" target="_blank" rel="noopener">Apple: iMovie のトランジション</a>、<a href="https://docs.imaster.org/davinci-resolve-21-manual/part-7-editing-effects-and-transitions/ch.-55-using-transitions" target="_blank" rel="noopener">DaVinci Resolve 21 リファレンスマニュアル（写し）: Using Transitions</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
