<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>レーダーの走査（Radar sweep） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-radar-sweep"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-radar-sweep-r">
          <span class="ac-radar-sweep-sw"></span
          ><i class="ac-radar-sweep-p" style="left: 74.76006844729035%; top: 66.93927420185106%" data-a="0.6"></i
          ><i class="ac-radar-sweep-p" style="left: 39.70123044803145%; top: 64.14868706684283%" data-a="2.2"></i
          ><i class="ac-radar-sweep-p" style="left: 14.129663346634118%; top: 32.2991822682059%" data-a="3.6"></i
          ><i class="ac-radar-sweep-p" style="left: 57.09155463658065%; top: 26.026893133421538%" data-a="5.0"></i
          ><i class="ac-radar-sweep-p" style="left: 56.37376785875904%; top: 86.95436487456726%" data-a="1.4"></i>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-radar-sweep .ac-radar-sweep-r {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 130px;
        height: 130px;
        margin: -65px 0 0 -65px;
        border-radius: 50%;
        background:
          radial-gradient(
            circle,
            transparent 0 32%,
            rgba(122, 184, 255, 0.25) 32.5% 33%,
            transparent 33.5% 65%,
            rgba(122, 184, 255, 0.25) 65.5% 66%,
            transparent 66.5%
          ),
          linear-gradient(rgba(122, 184, 255, 0.2), rgba(122, 184, 255, 0.2)) center / 1px 100% no-repeat,
          linear-gradient(rgba(122, 184, 255, 0.2), rgba(122, 184, 255, 0.2)) center / 100% 1px no-repeat;
        box-shadow: inset 0 0 0 1px rgba(122, 184, 255, 0.35);
      }
      .ac-radar-sweep .ac-radar-sweep-sw {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(122, 184, 255, 0) 0deg,
          rgba(122, 184, 255, 0) 290deg,
          rgba(122, 184, 255, 0.55) 360deg
        );
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-radar-sweep .ac-radar-sweep-sw {
          animation: ac-radar-sweep-rot var(--dur, 3000ms) linear infinite;
        }
      }
      .ac-radar-sweep .ac-radar-sweep-p {
        position: absolute;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: var(--aqua);
        box-shadow: 0 0 6px var(--aqua);
        opacity: 0;
      }
      @keyframes ac-radar-sweep-rot {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-radar-sweep .ac-radar-sweep-p {
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "radar-sweep",
        name: "レーダーの走査",
        en: "Radar sweep",
        cat: "背景",
        kind: "motion",
        description:
          "円形の画面の中を、光の扇が中心を軸にぐるりと回り、通ったところにある点が光って、ゆっくり消えていく表現です。探している・見張っている・見つけた、を伝えます。",
        use: "検索・スキャン中の表示、位置情報・近くのものを探す画面、セキュリティ・監視系のサービス。",
        params: [{ key: "dur", label: "一周の時間", value: 3000, min: 1000, max: 8000, step: 100, unit: "ms" }],
        spec: [
          ["扇", "<code>conic-gradient</code>（明るい色 → 透明）を <code>rotate(0 → 360deg)</code>｜linear｜くり返し"],
          ["点", "扇の角度が点の角度を通過した瞬間に、点を明るくして <code>opacity 1 → 0</code>（1–2秒）"],
          ["目盛り", "同心円と十字の線を薄い色で描く"],
          [
            "控えめに",
            "背景は主役ではない。コントラストと速さを抑え、前景の文字が読めることを優先する。画面外・非表示のときは止める",
          ],
          ["動きを減らす設定", "背景の動きを止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/backgrounds/radar" target="_blank" rel="noopener">React Bits: Radar</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const ps = [...stage.querySelectorAll(".ac-radar-sweep-p")];
            if (rm) return null;
            let prev = 0;
            const sweep = stage.querySelector(".ac-radar-sweep-sw").getAnimations()[0]; /* 扇と同じ時計で角度を出す */
            return raf((t) => {
              const ang = (((sweep ? sweep.currentTime : t * 1000) / v.dur) % 1) * Math.PI * 2;
              ps.forEach((p) => {
                let a = (+p.dataset.a + Math.PI / 2) % (Math.PI * 2);
                if ((prev <= a && ang >= a) || (prev > ang && (a >= prev || a <= ang)))
                  p.animate(
                    [
                      { opacity: 1, transform: "scale(1.6)" },
                      { opacity: 0, transform: "scale(1)" },
                    ],
                    { duration: v.dur * 0.6, easing: "ease-out" },
                  );
              });
              prev = ang;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
