<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ねじれて登場（Twister entrance） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-twister-entrance"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="sb-card ac-twister-entrance-c"
          style="width: 140px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 46px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 77px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 49px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-twister-entrance .ac-twister-entrance-c {
        animation: ac-twister-entrance-in var(--in, 1000ms) ease-out both;
      }
      @keyframes ac-twister-entrance-in {
        0% {
          opacity: 0;
          transform-origin: 0 100%;
          transform: rotate(360deg) translateY(-100%);
        }
        30% {
          opacity: 0.6;
          transform-origin: 0 100%;
          transform: rotate(360deg) translateY(-100%);
        }
        100% {
          opacity: 1;
          transform-origin: 100% 100%;
          transform: rotate(0) translateY(0);
        }
      }
      @keyframes ac-twister-entrance-rf {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-twister-entrance .ac-twister-entrance-c {
          animation: ac-twister-entrance-rf 200ms ease-out both !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "twister-entrance",
        name: "ねじれて登場",
        en: "Twister entrance",
        cat: "登場・退出",
        kind: "motion",
        description:
          "上からねじれるように一回転しながら降りてきて、所定の位置に収まる動きです。竜巻に運ばれてきたような勢いがあります。",
        use: "遊びのある演出、ゲームの登場、キャンペーンのバナー。",
        params: [{ key: "in", label: "登場の時間", value: 1000, min: 400, max: 2000, step: 50, unit: "ms" }],
        total: (p) => p["in"],
        spec: [
          [
            "登場",
            "0–30%：<code>transform-origin: 0 100%</code> で <code>rotate(360deg) translateY(-100%)</code>、30–100%：<code>transform-origin: 100% 100%</code> へ移しながら <code>rotate(0) translateY(0)</code>",
          ],
          ["イージング", "ease-out"],
          ["動きを減らす設定", "回転と移動をやめ、透明度の切り替えだけにする"],
          [
            "出典",
            '<a href="https://www.minimamente.com/project/magic/" target="_blank" rel="noopener">Magic Animations</a>',
          ],
        ],
        loop: 2400,
      });
    </script>
  </body>
</html>
