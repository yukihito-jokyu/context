<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表示する項目の切り替え（Animated data schema change (drill-down)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-data-schema-change"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "data-schema-change",
        name: "表示する項目の切り替え",
        en: "Animated data schema change (drill-down)",
        cat: "データの可視化",
        kind: "motion",
        description:
          "グラフに表示するデータの項目（次元）が変わるときの遷移です。「地域ごとの合計」から「地域 × 年」に掘り下げると、1 本の棒が内訳に分かれ、横へ分かれて並び直すので、どの値が何に分かれたかを目で追えます。",
        use: "ダッシュボードのドリルダウン、分類や集計の単位の切り替え。",
        params: [{ key: "dur", label: "1段の時間", value: 500, min: 200, max: 1200, step: 50, unit: "ms" }],
        spec: [
          [
            "順序",
            "① 色で内訳を見せる（積み上げ）→ ② 内訳を横へずらして並べ直す。戻すときは逆の順にする。1 段 300〜500ms",
          ],
          [
            "対応",
            "元の棒と分かれた後の値の対応（合計が同じ）を保ったまま形を変える。対応しない項目はフェードで出し入れする",
          ],
          ["動きを減らす設定", "形の変化をやめ、切り替え前後をクロスフェードする"],
          [
            "出典",
            '<a href="https://sites.stat.columbia.edu/gelman/communication/HeerRobertson2007.pdf" target="_blank" rel="noopener">sites.stat.columbia.edu（HeerRobertson2007）</a>、<a href="https://idl.cs.washington.edu/files/2019-AnimatedAggregates-EuroVis.pdf" target="_blank" rel="noopener">idl.cs.washington.edu（2019-AnimatedAggregates-Euro）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const D = [
                [30, 40],
                [22, 28],
                [50, 38],
              ],
              base = 130,
              sm = (u) => u * u * (3 - 2 * u),
              cl = (u) => Math.min(1, Math.max(0, u));
            return raf((t) => {
              const M = v.dur / 1000,
                T = t % (4 * M + 3),
                p =
                  T < 1
                    ? 0
                    : T < 1 + 2 * M
                      ? (T - 1) / M
                      : T < 2.5 + 2 * M
                        ? 2
                        : T < 2.5 + 4 * M
                          ? 2 - (T - 2.5 - 2 * M) / M
                          : 0;
              g.clearRect(0, 0, W, H);
              g.fillStyle = col("line");
              g.fillRect(16, base, 188, 1.5);
              const draw = (c1, c2, al) =>
                D.forEach((sub, i) => {
                  const cx = 50 + i * 60;
                  let acc = 0;
                  sub.forEach((val, j) => {
                    const h = val * 1.3,
                      sx = cx - 14,
                      sw = 28,
                      sy = base - acc - h,
                      gx = cx - 16 + j * 18,
                      gw = 14,
                      gy = base - h;
                    const x = sx + (gx - sx) * c2,
                      w = sw + (gw - sw) * c2,
                      y = sy + (gy - sy) * c2;
                    g.fillStyle = j === 0 ? col("blue") : c1 > 0.5 ? col("sky") : col("blue");
                    g.globalAlpha = (j ? 0.6 + 0.4 * c1 : 1) * al;
                    g.fillRect(x, y, w, h - 0.5);
                    g.globalAlpha = 1;
                    acc += h;
                  });
                });
              if (rm) {
                const q = sm(cl(p / 2));
                draw(0, 0, 1 - q);
                draw(1, 1, q);
              } /* 動きを減らす設定：切り替え前後の完成形をクロスフェード */
              else draw(sm(cl(p)), sm(cl(p - 1)), 1);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
