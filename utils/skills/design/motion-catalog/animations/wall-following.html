<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>壁に沿って進む（Wall following） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-wall-following"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "wall-following",
        name: "壁に沿って進む",
        en: "Wall following",
        cat: "移動・変形",
        kind: "motion",
        description:
          "エージェントが壁から一定の距離を保ちながら、壁に沿って進む動きです。壁の角では曲がり、離れすぎたら近づき、近づきすぎたら離れます。",
        use: "ゲームの巡回する敵、迷路を探る動き、輪郭に沿って動く飾り、建物の周りを回るカメラ。",
        params: [],
        spec: [
          [
            "仕組み",
            "壁の上でいちばん近い点を探し、そこから壁の法線方向へ決めた距離だけ離した点を作る。その点を進む向きへ少し先へずらした点に向かう",
          ],
          ["角", "先読みの点が角を越えたら、次の辺を使う。内角では早めに曲がる"],
          ["組み合わせ", "道に沿う（path following）の一種として、壁を少し外側へずらした道に沿わせてもよい"],
          ["動きを減らす設定", "エージェントの動きを止め、向きと目標の静止画にする"],
          [
            "出典",
            '<a href="https://www.red3d.com/cwr/steer/" target="_blank" rel="noopener">red3d.com（steer）</a>、<a href="https://www.red3d.com/cwr/steer/Wall.html" target="_blank" rel="noopener">red3d.com（Wall）</a>、<a href="https://www.red3d.com/cwr/steer/gdc99/" target="_blank" rel="noopener">Craig Reynolds: Steering Behaviors For Autonomous Characters</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const lim = (x, y, m) => {
              const l = Math.hypot(x, y);
              return l > m && l > 0 ? [(x / l) * m, (y / l) * m] : [x, y];
            };
            const ag = (x, y, a = 0, s = 1) => ({ x, y, vx: cos(a) * s, vy: sin(a) * s, w: rnd() * TAU });
            const seek = (a, tx, ty, ms) => {
              const dx = tx - a.x,
                dy = ty - a.y,
                l = Math.hypot(dx, dy) || 1;
              return [(dx / l) * ms - a.vx, (dy / l) * ms - a.vy];
            };
            const go = (a, f, mf, ms) => {
              const [fx, fy] = lim(f[0], f[1], mf);
              a.vx += fx;
              a.vy += fy;
              [a.vx, a.vy] = lim(a.vx, a.vy, ms);
              a.x += a.vx;
              a.y += a.vy;
            };
            const wrap = (a) => {
              if (a.x < -8) a.x += W + 16;
              if (a.x > W + 8) a.x -= W + 16;
              if (a.y < -8) a.y += H + 16;
              if (a.y > H + 8) a.y -= H + 16;
            };
            const sep = (a, all, r) => {
              let fx = 0,
                fy = 0;
              for (const b of all) {
                if (b === a) continue;
                const dx = a.x - b.x,
                  dy = a.y - b.y,
                  d = Math.hypot(dx, dy);
                if (d > 0 && d < r) {
                  fx += ((dx / d) * (r - d)) / r;
                  fy += ((dy / d) * (r - d)) / r;
                }
              }
              return [fx, fy];
            };
            const tri = (a, c, s = 1) => {
              g.save();
              g.translate(a.x, a.y);
              g.rotate(Math.atan2(a.vy, a.vx));
              g.fillStyle = c;
              g.beginPath();
              g.moveTo(7 * s, 0);
              g.lineTo(-5 * s, 4 * s);
              g.lineTo(-5 * s, -4 * s);
              g.closePath();
              g.fill();
              g.restore();
            };
            const bg = () => {
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
            };
            const steps = (() => {
              let acc = 0,
                last = null,
                warmed = false;
              return (t, fn, warm = 90) => {
                if (rm) {
                  if (!warmed) {
                    warmed = true;
                    for (let i = 0; i < warm; i++) fn();
                  }
                  return;
                }
                if (last !== null) acc += Math.min(0.1, t - last);
                last = t;
                for (let n = 0; acc >= 1 / 60 && n < 6; n++) {
                  fn();
                  acc -= 1 / 60;
                }
              };
            })();
            const R = [60, 40, 100, 70],
              off = 14,
              a = ag(40, 30, 0, 1.4);
            const per = 2 * (R[2] + R[3] + 4 * off),
              at = (s) => {
                s = ((s % per) + per) % per;
                const x0 = R[0] - off,
                  y0 = R[1] - off,
                  w = R[2] + 2 * off,
                  h = R[3] + 2 * off;
                if (s < w) return [x0 + s, y0];
                s -= w;
                if (s < h) return [x0 + w, y0 + s];
                s -= h;
                if (s < w) return [x0 + w - s, y0 + h];
                s -= w;
                return [x0, y0 + h - s];
              };
            let s = 0;
            return raf((t) => {
              steps(t, () => {
                let best = 0,
                  bd = 1e9;
                for (let k = 0; k < per; k += 2) {
                  const p = at(k),
                    d = Math.hypot(p[0] - a.x, p[1] - a.y);
                  if (d < bd) {
                    bd = d;
                    best = k;
                  }
                }
                s = best;
                const [tx, ty] = at(s + 20);
                go(a, seek(a, tx, ty, 1.4), 0.1, 1.4);
              });
              bg();
              g.fillStyle = col("ice");
              g.fillRect(R[0], R[1], R[2], R[3]);
              g.strokeStyle = col("cobalt");
              g.lineWidth = 3;
              g.strokeRect(R[0], R[1], R[2], R[3]);
              g.strokeStyle = col("line");
              g.lineWidth = 1;
              g.setLineDash([3, 3]);
              g.strokeRect(R[0] - off, R[1] - off, R[2] + 2 * off, R[3] + 2 * off);
              g.setLineDash([]);
              dot(...at(s + 20), 2.5, "#e5484d");
              tri(a, col("blue"));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
