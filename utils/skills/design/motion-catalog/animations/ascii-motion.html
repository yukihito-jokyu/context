<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文字で描くアニメーション（ASCII motion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-ascii-motion"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <pre class="ac-ascii-motion-p"></pre>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-ascii-motion .ac-ascii-motion-p {
        margin: 0;
        font:
          700 9px/9px ui-monospace,
          Menlo,
          monospace;
        color: var(--cobalt);
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "ascii-motion",
        name: "文字で描くアニメーション",
        en: "ASCII motion",
        cat: "文字",
        kind: "motion",
        description:
          "記号や文字（. : - = + * # @）を格子に並べ、明るさの違いで形を描き、その配列を書き換えて動かす表現です。光が回り込む球体を、文字だけで描いています。レトロでデジタルな雰囲気が出ます。",
        use: "開発者向けのサイト、ターミナル風の演出、ローディング、レトロ・ハッカー風のブランド。",
        params: [{ key: "speed", label: "回る速さ", value: 1, min: 0.2, max: 3, step: 0.1, unit: "" }],
        spec: [
          [
            "仕組み",
            "毎フレーム、各マスの明るさ（ここでは球の法線と光の向きの内積）を計算し、明るい順に <code>@#%*+=-:. </code> の文字に置き換える",
          ],
          [
            "描画",
            "等幅フォントの <code>&lt;pre&gt;</code> の文字を書き換えるか、canvas に描く（描画は <code>aria-hidden</code>）。画像や動画を変換する型もある",
          ],
          ["速さ", "30fps 程度で十分。文字の更新はまとめて1回で行う"],
          ["動きを減らす設定", "回転を止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/text-animations/ascii-text" target="_blank" rel="noopener">React Bits: ASCII Text</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const p = stage.querySelector(".ac-ascii-motion-p"),
              CH = " .:-=+*#%@",
              W = 34,
              H = 15;
            const frame = (t) => {
              const lx = Math.cos(t * v.speed),
                lz = Math.sin(t * v.speed),
                ly = -0.5;
              let s = "";
              for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                  const nx = ((x - W / 2 + 0.5) / (W / 2)) * 1.05,
                    ny = (y - H / 2 + 0.5) / (H / 2),
                    d = nx * nx + ny * ny;
                  if (d > 1) {
                    s += " ";
                    continue;
                  }
                  const nz = Math.sqrt(1 - d),
                    b = Math.max(0, nx * lx + ny * ly + nz * lz) / 1.12;
                  s += CH[Math.min(9, Math.floor(b * 10))];
                }
                s += "\n";
              }
              p.textContent = s;
            };
            if (rm) {
              frame(0.6);
              return null;
            }
            let last = -1;
            return raf((t) => {
              if (t - last < 1 / 30) return;
              last = t;
              frame(t);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
