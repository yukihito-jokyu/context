<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>先回りして追う・逃げる（Pursuit and evasion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-pursuit-evasion"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "pursuit-evasion",
        name: "先回りして追う・逃げる",
        en: "Pursuit and evasion",
        cat: "移動・変形",
        kind: "motion",
        description:
          "動いている相手を追うとき、今いる場所ではなく「少し先に相手がいるはずの場所」を予測してそこへ向かう動きです。逃げる側も、追ってくる相手の予測位置から離れます。ただ追うより早く追いつき、うまくかわします。",
        use: "ゲームの追跡・迎撃、ボールを追う選手、動く目標へ向かう UI の飾り。",
        params: [],
        spec: [
          [
            "予測",
            "予測の時間 T = 相手までの距離 ÷ 自分の速さ（上限を決める）。予測位置 = 相手の位置 + 相手の速さ × T",
          ],
          ["仕組み", "予測位置に向かって「追う（seek）」、逃げるときは予測位置から「逃げる（flee）」"],
          ["見せ方", "予測位置に印を出すと、先回りしているのが分かる"],
          ["動きを減らす設定", "エージェントの動きを止め、向きと目標の静止画にする"],
          [
            "出典",
            '<a href="https://www.red3d.com/cwr/steer/" target="_blank" rel="noopener">red3d.com（steer）</a>、<a href="https://www.red3d.com/cwr/steer/PursueEvade.html" target="_blank" rel="noopener">red3d.com（PursueEvade）</a>、<a href="https://www.red3d.com/cwr/steer/gdc99/" target="_blank" rel="noopener">Craig Reynolds: Steering Behaviors For Autonomous Characters</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const lim = (x, y, m) => {
              const l = Math.hypot(x, y);
              return l > m && l > 0 ? [(x / l) * m, (y / l) * m] : [x, y];
            };
            const ag = (x, y, a = 0, s = 1) => ({ x, y, vx: cos(a) * s, vy: sin(a) * s, w: rnd() * TAU });
            const seek = (a, tx, ty, ms) => {
              const dx = tx - a.x,
                dy = ty - a.y,
                l = Math.hypot(dx, dy) || 1;
              return [(dx / l) * ms - a.vx, (dy / l) * ms - a.vy];
            };
            const go = (a, f, mf, ms) => {
              const [fx, fy] = lim(f[0], f[1], mf);
              a.vx += fx;
              a.vy += fy;
              [a.vx, a.vy] = lim(a.vx, a.vy, ms);
              a.x += a.vx;
              a.y += a.vy;
            };
            const wrap = (a) => {
              if (a.x < -8) a.x += W + 16;
              if (a.x > W + 8) a.x -= W + 16;
              if (a.y < -8) a.y += H + 16;
              if (a.y > H + 8) a.y -= H + 16;
            };
            const sep = (a, all, r) => {
              let fx = 0,
                fy = 0;
              for (const b of all) {
                if (b === a) continue;
                const dx = a.x - b.x,
                  dy = a.y - b.y,
                  d = Math.hypot(dx, dy);
                if (d > 0 && d < r) {
                  fx += ((dx / d) * (r - d)) / r;
                  fy += ((dy / d) * (r - d)) / r;
                }
              }
              return [fx, fy];
            };
            const tri = (a, c, s = 1) => {
              g.save();
              g.translate(a.x, a.y);
              g.rotate(Math.atan2(a.vy, a.vx));
              g.fillStyle = c;
              g.beginPath();
              g.moveTo(7 * s, 0);
              g.lineTo(-5 * s, 4 * s);
              g.lineTo(-5 * s, -4 * s);
              g.closePath();
              g.fill();
              g.restore();
            };
            const bg = () => {
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
            };
            const steps = (() => {
              let acc = 0,
                last = null,
                warmed = false;
              return (t, fn, warm = 90) => {
                if (rm) {
                  if (!warmed) {
                    warmed = true;
                    for (let i = 0; i < warm; i++) fn();
                  }
                  return;
                }
                if (last !== null) acc += Math.min(0.1, t - last);
                last = t;
                for (let n = 0; acc >= 1 / 60 && n < 6; n++) {
                  fn();
                  acc -= 1 / 60;
                }
              };
            })();
            const P0 = ag(20, 120, -0.5, 1),
              Q = ag(160, 40, 2, 1.6);
            let ph = 0;
            return raf((t) => {
              steps(t, () => {
                ph += 0.02;
                const sf = [cos(ph * 1.3) * 0.08, sin(ph * 2.1) * 0.08];
                go(Q, sf, 0.05, 1.6);
                wrap(Q);
                const d = Math.hypot(Q.x - P0.x, Q.y - P0.y),
                  T = Math.min(40, d / 2.2);
                go(P0, seek(P0, Q.x + Q.vx * T, Q.y + Q.vy * T, 2.2), 0.07, 2.2);
                wrap(P0);
                if (d < 8) {
                  P0.x = 20;
                  P0.y = 120;
                }
              });
              const d = Math.hypot(Q.x - P0.x, Q.y - P0.y),
                T = Math.min(40, d / 2.2),
                px = Q.x + Q.vx * T,
                py = Q.y + Q.vy * T;
              bg();
              g.strokeStyle = "rgba(229,72,77,.6)";
              g.setLineDash([3, 3]);
              g.beginPath();
              g.moveTo(Q.x, Q.y);
              g.lineTo(px, py);
              g.stroke();
              g.setLineDash([]);
              dot(px, py, 3, "#e5484d");
              tri(Q, col("cobalt"));
              tri(P0, col("blue"));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
