<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>体感時間（Perceptual duration） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-perceptual-duration"
        style="
          position: relative;
          width: 200px;
          height: 150px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        "
      >
        <div class="ac-perceptual-duration-g">
          <svg viewBox="0 0 80 80" width="80" height="80" style="overflow: visible">
            <path d="M0,80 L80,80 M0,80 L0,0" stroke="var(--bar)" stroke-width="2" fill="none" />
            <path d="M0,0 L80,0" stroke="var(--bar)" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
            <path
              data-curve
              d="M0,80 L80,0"
              stroke="var(--cobalt)"
              stroke-width="3"
              fill="none"
              stroke-linejoin="round"
              stroke-linecap="round"
            /></svg
          ><span data-marker class="ac-perceptual-duration-mk"></span
          ><span class="ac-perceptual-duration-dx"><span class="ac-perceptual-duration-dy"></span></span>
        </div>
        <div style="position: relative; width: 200px; height: 32px">
          <span
            style="
              position: absolute;
              left: 0;
              right: 0;
              top: 15px;
              height: 2px;
              border-radius: 2px;
              background: var(--bar);
            "
          ></span
          ><span
            class="sb-thumb sb-grad-sky ac-perceptual-duration-t"
            style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-perceptual-duration {
        --ease: linear;
        --sdur: 1000ms;
      }
      .ac-perceptual-duration .ac-perceptual-duration-g {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .ac-perceptual-duration .ac-perceptual-duration-dx {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 10px;
        height: 80px;
        margin-left: -5px;
        animation: ac-perceptual-duration-x var(--sdur) linear both;
      }
      .ac-perceptual-duration .ac-perceptual-duration-dy {
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px #fff;
        animation: ac-perceptual-duration-y var(--sdur) var(--ease) both;
      }
      .ac-perceptual-duration .ac-perceptual-duration-t {
        animation: ac-perceptual-duration-m var(--sdur) var(--ease) both;
      }
      .ac-perceptual-duration .ac-perceptual-duration-mk {
        position: absolute;
        top: -6px;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--blue-soft);
        box-shadow: 0 0 0 1px var(--bar-on-soft);
      }
      @keyframes ac-perceptual-duration-x {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(80px);
        }
      }
      @keyframes ac-perceptual-duration-y {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-80px);
        }
      }
      @keyframes ac-perceptual-duration-m {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(150px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-perceptual-duration .ac-perceptual-duration-dx,
        .ac-perceptual-duration .ac-perceptual-duration-dy,
        .ac-perceptual-duration .ac-perceptual-duration-t {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "perceptual-duration",
        name: "体感時間",
        en: "Perceptual duration",
        cat: "スプリング",
        kind: "concept",
        description:
          "ばねは最後に小さく揺れ続けるため、計算上の終わりは見た目より遅くなります。人が「もう止まった」と感じる時間を体感時間と呼び、ばねの指定に使います。グラフの縦線が体感時間です。",
        use: "ばねの動きの長さをデザイナーと話すとき、ほかの動きと時間をそろえるとき。",
        params: [
          { key: "dur", label: "体感時間", value: 500, min: 200, max: 1000, step: 50, unit: "ms" },
          { key: "bounce", label: "弾み", value: 0.2, min: 0, max: 0.6, step: 0.05, unit: "" },
        ],
        spec: [
          ["縦線", "体感時間。そのあとの小さな揺れは、ほとんど気づかれない"],
          ["考え方", "次の動きは、計算上の終わりではなく体感時間を基準につなげる"],
          ["グラフ", "横が時間、縦が進み具合（点線が目標）。線が点線を越えるのが行き過ぎ（オーバーシュート）"],
          [
            "実装",
            'Framer Motion の <code>type: "spring"</code>、React Spring、SwiftUI、CSS なら <code>linear()</code> に書き出す（このデモも数値計算 → <code>linear()</code>）',
          ],
          ["動きを減らす設定", "弾みをやめ、短い ease-out か透明度の切り替えにする"],
          ["出典", "Animation Vocabulary（Spring Animations）"],
        ],
        loop: 2800,
        run: (stage, v) => {
          const simulate = (k, c, m) => {
            let x = 0,
              v = 0,
              t = 0,
              calm = 0,
              settled = false;
            const dt = 1 / 120,
              pts = [0];
            while (t < 4) {
              const a = (-k * (x - 1) - c * v) / m;
              v += a * dt;
              x += v * dt;
              t += dt;
              pts.push(x);
              if (Math.abs(x - 1) < 0.002 && Math.abs(v) < 0.02) {
                if (++calm > 10) {
                  settled = true;
                  break;
                }
              } else calm = 0;
            }
            if (!settled) {
              const n = Math.min(
                pts.length - 1,
                72,
              ); /* 4 秒で止まり切らないときは、最後の 0.6 秒で目標へなめらかに着地させる */
              for (let j = 0; j <= n; j++) {
                const i = pts.length - 1 - n + j,
                  u = j / n;
                pts[i] = 1 + (pts[i] - 1) * (1 - u * u * (3 - 2 * u));
              }
            }
            pts[pts.length - 1] = 1;
            return { pts, dur: Math.round((pts.length - 1) * dt * 1000) };
          };
          const apply = (pts, dur, marker) => {
            const step = Math.max(1, Math.floor(pts.length / 64)),
              keep = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
            stage.firstElementChild.style.setProperty("--ease", `linear(${keep.map((p) => +p.toFixed(4)).join(", ")})`);
            stage.firstElementChild.style.setProperty("--sdur", `${dur}ms`);
            const path = stage.querySelector("[data-curve]");
            if (path)
              path.setAttribute(
                "d",
                "M" +
                  keep
                    .map((p, i) => `${((i / (keep.length - 1)) * 80).toFixed(1)},${((1 - p) * 80).toFixed(1)}`)
                    .join(" L"),
              );
            const mk = stage.querySelector("[data-marker]");
            if (mk && marker != null) mk.style.left = `${Math.min(1, marker / dur) * 80}px`;
            const out = stage.querySelector("[data-dur]");
            if (out) out.textContent = "";
          };
          const T = v.dur / 1000,
            k = Math.pow((2 * Math.PI) / T, 2),
            c = ((1 - v.bounce) * 4 * Math.PI) / T;
          const r = simulate(k, c, 1);
          apply(r.pts, r.dur, v.dur);
        },
      });
    </script>
  </body>
</html>
