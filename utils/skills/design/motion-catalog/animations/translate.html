<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>移動（トランスレート）（Translate） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-translate"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div style="position: relative; width: 72px; height: 72px">
          <span
            style="
              position: absolute;
              inset: 0;
              border-radius: 18px;
              box-shadow: inset 0 0 0 2px var(--bar-strong);
              opacity: 0.6;
            "
          ></span
          ><span
            class="sb-thumb sb-grad-sky ac-translate-t"
            style="width: 72px; height: 72px; border-radius: 20px"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-translate .ac-translate-t {
        display: block;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-translate .ac-translate-t {
          animation: ac-translate-m var(--dur, 600ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-translate-m {
        from {
          transform: translateX(calc(var(--dist, 56px) / -2));
        }
        to {
          transform: translateX(calc(var(--dist, 56px) / 2));
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "translate",
        name: "移動（トランスレート）",
        en: "Translate",
        cat: "移動・変形",
        kind: "motion",
        description:
          "要素の位置を、X軸（横）や Y軸（縦）にずらす動きです。レイアウトを崩さずに動かせるので、多くの動きの土台になります。点線の枠が元の位置です。",
        use: "スライド、ドロワー、ドラッグ、浮き上がり、位置の入れ替え。",
        params: [
          { key: "dist", label: "移動の距離", value: 56, min: 8, max: 90, step: 2, unit: "px" },
          { key: "dur", label: "片道の時間", value: 600, min: 150, max: 1500, step: 50, unit: "ms" },
        ],
        spec: [
          [
            "動き",
            "<code>translateX(-距離/2 ↔ +距離/2)</code>｜in-out <code>cubic-bezier(0.65, 0, 0.35, 1)</code>｜<code>alternate</code> で往復",
          ],
          [
            "注意",
            "<code>left</code> や <code>top</code> ではなく <code>transform: translate()</code> で動かす（レイアウトを計算し直さない）",
          ],
          ["動きを減らす設定", "往復をやめ、止めておく"],
          ["出典", "Animation Vocabulary（Movement & Transforms）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
