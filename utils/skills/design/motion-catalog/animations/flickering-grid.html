<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>格子の明滅（Flickering grid） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-flickering-grid"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "flickering-grid",
        name: "格子の明滅",
        en: "Flickering grid",
        cat: "背景",
        kind: "motion",
        description:
          "小さな四角が格子状に並び、それぞれがランダムなタイミングで明るくなったり暗くなったりする背景です。LED の表示板や、遠くの街の明かりのような、静かなざわめきがあります。",
        use: "テック・データ系のヒーロー、CTA の背景、ダークテーマのセクション。",
        params: [
          { key: "rate", label: "変わる割合", value: 0.04, min: 0.005, max: 0.2, step: 0.005, unit: "" },
          { key: "gap", label: "間隔", value: 7, min: 4, max: 12, step: 1, unit: "px" },
        ],
        spec: [
          ["仕組み", "マスごとに明るさを持ち、毎コマ一部のマス（確率 2–5%）だけ新しいランダムな明るさに変える"],
          ["描画", "canvas に小さな四角（2–4px、間隔 6–8px）を描く。外側はマスクで薄くする"],
          [
            "控えめに",
            "背景は主役ではない。コントラストと速さを抑え、前景の文字が読めることを優先する。画面外・非表示のときは止める",
          ],
          ["動きを減らす設定", "背景の動きを止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://magicui.design/docs/components/flickering-grid" target="_blank" rel="noopener">Magic UI: Flickering Grid</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const nx = Math.floor(W / v.gap),
              ny = Math.floor(H / v.gap),
              a = Array.from({ length: nx * ny }, () => Math.random() * 0.5),
              c = col("blue") || "#2563eb";
            const draw = () => {
              g.clearRect(0, 0, W, H);
              g.fillStyle = c;
              for (let i = 0; i < a.length; i++) {
                const x = i % nx,
                  y = Math.floor(i / nx),
                  m = 1 - Math.hypot(x / nx - 0.5, y / ny - 0.5) * 1.6;
                g.globalAlpha = Math.max(0, a[i] * m);
                g.fillRect(x * v.gap + 1, y * v.gap + 1, 3, 3);
              }
              g.globalAlpha = 1;
            };
            draw();
            if (rm) return null;
            const iv = setInterval(() => {
              for (let i = 0; i < a.length; i++) if (Math.random() < v.rate) a[i] = Math.random() * 0.6;
              draw();
            }, 60);
            return () => clearInterval(iv);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
