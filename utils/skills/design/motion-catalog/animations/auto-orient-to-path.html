<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>軌道に向きを合わせる（Auto-orient to path） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-auto-orient-to-path" style="position: relative; width: 220px; height: 146px">
        <div style="display: grid; gap: 14px">
          <div style="position: relative; width: 220px; height: 66px">
            <svg width="220" height="66" style="position: absolute; inset: 0; overflow: visible">
              <path
                d="M10,56 C60,-14 160,-14 210,56"
                fill="none"
                stroke="var(--bar)"
                stroke-width="2"
                stroke-dasharray="4 5"
              /></svg
            ><span
              class="ac-auto-orient-to-path-a"
              style="
                position: absolute;
                left: 0;
                top: 0;
                width: 30px;
                height: 20px;
                background: var(--blue);
                clip-path: polygon(0 15%, 62% 15%, 62% 0, 100% 50%, 62% 100%, 62% 85%, 0 85%);
                border-radius: 3px;
              "
            ></span>
          </div>
          <div style="position: relative; width: 220px; height: 66px">
            <svg width="220" height="66" style="position: absolute; inset: 0; overflow: visible">
              <path
                d="M10,56 C60,-14 160,-14 210,56"
                fill="none"
                stroke="var(--bar)"
                stroke-width="2"
                stroke-dasharray="4 5"
              /></svg
            ><span
              class="ac-auto-orient-to-path-b"
              style="
                position: absolute;
                left: 0;
                top: 0;
                width: 30px;
                height: 20px;
                background: var(--shape-idle);
                clip-path: polygon(0 15%, 62% 15%, 62% 0, 100% 50%, 62% 100%, 62% 85%, 0 85%);
                border-radius: 3px;
              "
            ></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-auto-orient-to-path .ac-auto-orient-to-path-a,
      .ac-auto-orient-to-path .ac-auto-orient-to-path-b {
        offset-path: path("M10,56 C60,-14 160,-14 210,56");
        offset-anchor: center;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-auto-orient-to-path .ac-auto-orient-to-path-a,
        .ac-auto-orient-to-path .ac-auto-orient-to-path-b {
          animation: ac-auto-orient-to-path-go var(--dur, 1800ms) cubic-bezier(0.65, 0, 0.35, 1) both;
        }
      }
      .ac-auto-orient-to-path .ac-auto-orient-to-path-a {
        offset-rotate: auto;
      }
      .ac-auto-orient-to-path .ac-auto-orient-to-path-b {
        offset-rotate: 0deg;
      }
      @keyframes ac-auto-orient-to-path-go {
        from {
          offset-distance: 0%;
        }
        to {
          offset-distance: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-auto-orient-to-path .ac-auto-orient-to-path-a,
        .ac-auto-orient-to-path .ac-auto-orient-to-path-b {
          offset-distance: 100%;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "auto-orient-to-path",
        name: "軌道に向きを合わせる",
        en: "Auto-orient to path",
        cat: "移動・変形",
        kind: "concept",
        description:
          "カーブに沿って動く要素の向きを、その瞬間の進む方向（軌道の接線）に合わせる考え方です。上の矢印は向きが軌道に沿い、下の矢印は向きが固定のままなので、横すべりしているように見えます。",
        use: "地図上の乗り物、紙飛行機・矢印・魚などの「頭」がある物の移動、パスに沿うアイコン。",
        params: [{ key: "dur", label: "時間", value: 1800, min: 600, max: 4000, step: 100, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "向きを合わせる",
            "<code>offset-path</code> と <code>offset-rotate: auto</code>（CSS）。GSAP なら MotionPath の <code>autoRotate: true</code>",
          ],
          ["比べる", "下の矢印は <code>offset-rotate: 0deg</code>（向きは固定）"],
          ["移動", "<code>offset-distance: 0 → 100%</code>｜in-out"],
          ["動きを減らす設定", "移動をやめ、終点に置く（向きは終点の接線に合わせる）"],
          [
            "出典",
            '<a href="https://gsap.com/docs/v3/Plugins/MotionPathPlugin/" target="_blank" rel="noopener">GSAP MotionPath</a>、<a href="https://www.w3.org/TR/motion-1/" target="_blank" rel="noopener">W3C Motion Path</a>',
          ],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
