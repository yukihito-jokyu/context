<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文字に合わせて変わるカーソル（Adaptive caret） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-adaptive-caret" style="position: relative; width: 220px; height: 150px">
        <div class="ac-adaptive-caret-tx" style="font: 800 22px/30px var(--font-sans); color: var(--ink)">
          Type here
        </div>
        <div class="ac-adaptive-caret-tx2">
          <span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 150px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 110px"></span>
        </div>
        <span class="ac-adaptive-caret-c"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-adaptive-caret .ac-adaptive-caret-tx {
        position: absolute;
        left: 50px;
        top: 31px;
      }
      .ac-adaptive-caret .ac-adaptive-caret-tx2 {
        position: absolute;
        left: 34px;
        top: 84px;
        display: grid;
        gap: 8px;
      }
      .ac-adaptive-caret .ac-adaptive-caret-c {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 8px;
        background: var(--blue);
        opacity: 0.85;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-adaptive-caret .ac-adaptive-caret-c {
          transition:
            width 180ms cubic-bezier(0.22, 1, 0.36, 1),
            height 180ms cubic-bezier(0.22, 1, 0.36, 1),
            margin 180ms cubic-bezier(0.22, 1, 0.36, 1),
            border-radius 180ms;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-adaptive-caret .ac-adaptive-caret-c {
          display: none;
        }
      }
      .ac-adaptive-caret .ac-adaptive-caret-c.is-text {
        width: 2.5px;
        height: 30px;
        margin: -15px 0 0 -1px;
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "adaptive-caret",
        name: "文字に合わせて変わるカーソル",
        en: "Adaptive caret",
        cat: "カーソル",
        kind: "motion",
        description:
          "ふだんは小さな丸いカーソルが、文字の上に来ると細い縦棒（文字を選べる形）に変わり、文字の高さにぴったり合う動きです。どこで何ができるかが、カーソルの形で分かります。",
        use: "独自のカーソルを使うサイト、エディタ、ポートフォリオ、文字を選んでコピーさせたいページ。",
        params: [],
        spec: [
          [
            "形",
            "通常：直径 16px の丸。文字の上：幅 2px・高さ＝文字の行の高さの棒（<code>line-height</code>。<code>normal</code> なら1行の高さを実測）",
          ],
          ["切り替え", "幅・高さ・角丸を 150–200ms の out（spring でもよい）で補間。位置はポインターにそのまま付ける"],
          ["タッチ端末", "マウスのない端末（<code>hover: none</code>）では出さない"],
          ["動きを減らす設定", "ポインターへの追従や軌跡をやめ、通常のカーソルだけにする"],
          [
            "出典",
            '<a href="https://motion.dev/examples/vue-cursor" target="_blank" rel="noopener">Motion: cursor</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const mkway =
              (pts, seg, hold = 0.3) =>
              (t) => {
                const n = pts.length,
                  k = (t % (n * seg)) / seg,
                  i = Math.floor(k),
                  f0 = k - i,
                  f = Math.max(0, (f0 - hold) / (1 - hold)),
                  e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2,
                  a = pts[i],
                  b = pts[(i + 1) % n];
                return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
              };
            const loop8 = (t, cx = 110, cy = 75, rx = 85, ry = 45) => [
              cx + rx * Math.sin(t * 0.9),
              cy + ry * Math.sin(t * 1.7),
            ];
            const c = stage.querySelector(".ac-adaptive-caret-c"),
              tx = stage.querySelector(".ac-adaptive-caret-tx"),
              root = stage.firstElementChild;
            const way = mkway(
              [
                [30, 110],
                [60, 46],
                [160, 46],
                [190, 110],
                [110, 120],
              ],
              1.2,
            );
            return raf((t) => {
              const [x, y] = way(t),
                b = root.getBoundingClientRect(),
                r = tx.getBoundingClientRect(),
                on = x > r.left - b.left && x < r.right - b.left && y > r.top - b.top && y < r.bottom - b.top;
              c.classList.toggle("is-text", on);
              c.style.transform = `translate(${x}px, ${on ? r.top - b.top + r.height / 2 : y}px)`;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
