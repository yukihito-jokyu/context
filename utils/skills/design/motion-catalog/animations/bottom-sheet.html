<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ボトムシート（Bottom sheet） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-bottom-sheet"
        style="
          position: relative;
          width: 200px;
          height: 160px;
          border-radius: 22px;
          overflow: hidden;
          background: var(--bg);
          box-shadow: inset 0 0 0 1px var(--line);
        "
      >
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px">
          <span class="sb-bar sb-bar--md sb-bar--strong" style="width: 110px"></span
          ><span class="sb-bar sb-bar--sm" style="width: 160px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--soft" style="width: 130px"></span
          ><span class="sb-bar sb-bar--sm" style="width: 150px"></span>
        </div>
        <div class="ac-bottom-sheet-dim"></div>
        <div class="sb-sheet ac-bottom-sheet-sheet">
          <span class="sb-handle"></span><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 110px"></span
          ><span class="sb-btn sb-btn--primary sb-btn--s" style="height: 32px; width: 100%"
            ><span class="sb-bar sb-bar--xs sb-bar--on-blue" style="width: 60px"></span
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-bottom-sheet .ac-bottom-sheet-dim {
        position: absolute;
        inset: 0;
        background: rgba(18, 26, 43, var(--dim, 0.35));
        animation:
          ac-bottom-sheet-fade-in var(--dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1) both,
          ac-bottom-sheet-fade-out var(--close, 200ms) cubic-bezier(0.55, 0, 1, 0.45) calc(var(--dur, 260ms) + 1400ms)
            forwards;
      }
      .ac-bottom-sheet .ac-bottom-sheet-sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 16px 16px;
        gap: 10px;
        animation:
          ac-bottom-sheet-up var(--dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1) both,
          ac-bottom-sheet-down var(--close, 200ms) cubic-bezier(0.55, 0, 1, 0.45) calc(var(--dur, 260ms) + 1400ms)
            forwards;
      }
      @keyframes ac-bottom-sheet-up {
        from {
          transform: translateY(100%);
        }
        to {
          transform: none;
        }
      }
      @keyframes ac-bottom-sheet-down {
        from {
          transform: none;
        }
        to {
          transform: translateY(100%);
        }
      }
      @keyframes ac-bottom-sheet-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ac-bottom-sheet-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-bottom-sheet .ac-bottom-sheet-sheet {
          animation:
            ac-bottom-sheet-fade-in var(--dur, 260ms) both,
            ac-bottom-sheet-fade-out var(--close, 200ms) calc(var(--dur, 260ms) + 1400ms) forwards;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "bottom-sheet",
        name: "ボトムシート",
        en: "Bottom sheet",
        cat: "Soft Blue の部品",
        kind: "motion",
        description:
          "画面の下から操作パネルがせり上がる動きです。後ろの画面を少し暗くして、いまはシートに集中する場面だと伝えます。閉じるときは同じ道を下に戻ります。",
        use: "スマホでの確認、共有メニュー、詳細設定など、今の画面の上で短く操作させたい場面。",
        params: [
          { key: "dur", label: "開く時間", value: 260, min: 100, max: 600, step: 10, unit: "ms" },
          { key: "close", label: "閉じる時間", value: 200, min: 100, max: 600, step: 10, unit: "ms" },
          { key: "dim", label: "背景の暗さ", value: 0.35, min: 0, max: 0.6, step: 0.05, unit: "" },
        ],
        total: (p) => p["dur"] + 1400 + p["close"],
        spec: [
          [
            "開く",
            "<code>&lt;dialog&gt;</code> を <code>showModal()</code> で開き <code>translateY(100% → 0)</code>｜out <code>cubic-bezier(0.22, 1, 0.36, 1)</code>",
          ],
          ["背景", "<code>rgba(18, 26, 43, 背景の暗さ)</code> の幕を <code>opacity 0 → 1</code> で同時に出す"],
          [
            "閉じる",
            "<code>translateY(0 → 100%)</code>｜in <code>cubic-bezier(0.55, 0, 1, 0.45)</code>｜幕も同時に消し、終わったら <code>close()</code>",
          ],
          ["動きを減らす設定", "移動をやめ、シートと幕の透明度の切り替えだけにする"],
          ["出典", "Soft Blue「モーション」のボトムシート"],
        ],
        loop: 3000,
      });
    </script>
  </body>
</html>
