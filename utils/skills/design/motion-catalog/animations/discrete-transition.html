<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表示・非表示の遷移（Discrete transition） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-discrete-transition"
        style="
          position: relative;
          width: 220px;
          height: 140px;
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          padding-top: 10px;
          box-sizing: border-box;
        "
      >
        <div class="ac-discrete-transition-col">
          <span class="sb-btn sb-btn--s sb-btn--soft"
            ><span class="sb-bar sb-bar--xs sb-bar--on-soft" style="width: 30px"></span
          ></span>
          <div class="ac-discrete-transition-p ac-discrete-transition-ok">
            <span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 70px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 50px"></span>
          </div>
        </div>
        <div class="ac-discrete-transition-col">
          <span class="sb-btn sb-btn--s sb-btn--soft"
            ><span class="sb-bar sb-bar--xs sb-bar--on-soft" style="width: 30px"></span
          ></span>
          <div class="ac-discrete-transition-p ac-discrete-transition-ng">
            <span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 70px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 50px"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-discrete-transition .ac-discrete-transition-col {
        position: relative;
        width: 100px;
        display: grid;
        justify-items: start;
        gap: 8px;
      }
      .ac-discrete-transition .ac-discrete-transition-p {
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 96px;
        padding: 12px;
        box-sizing: border-box;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow-float);
        opacity: 0;
        scale: 0.96;
        transform-origin: top left;
      }
      .ac-discrete-transition .ac-discrete-transition-p.is-open {
        display: flex;
        opacity: 1;
        scale: 1;
      }
      .ac-discrete-transition .ac-discrete-transition-ok {
        transition:
          opacity var(--dur, 220ms) cubic-bezier(0.22, 1, 0.36, 1),
          scale var(--dur, 220ms) cubic-bezier(0.22, 1, 0.36, 1),
          display var(--dur, 220ms) allow-discrete;
      }
      .ac-discrete-transition .ac-discrete-transition-ng {
        transition:
          opacity var(--dur, 220ms) cubic-bezier(0.22, 1, 0.36, 1),
          scale var(--dur, 220ms) cubic-bezier(0.22, 1, 0.36, 1);
      }
      @starting-style {
        .ac-discrete-transition .ac-discrete-transition-p.is-open {
          opacity: 0;
          scale: 0.96;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-discrete-transition .ac-discrete-transition-p {
          scale: 1;
        }
        @starting-style {
          .ac-discrete-transition .ac-discrete-transition-p.is-open {
            scale: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "discrete-transition",
        name: "表示・非表示の遷移",
        en: "Discrete transition",
        cat: "順序・タイミング",
        kind: "concept",
        description:
          "display: none のような、途中の値がない切り替えも遷移の中に組み込む考え方です。左は消えるときもフェードが最後まで見えますが、右は display が先に切り替わり、消えるときに一瞬で消えてしまいます。",
        use: "ポップオーバー、ダイアログ、メニュー、トーストなど、display や hidden で出し入れする要素。",
        params: [{ key: "dur", label: "時間", value: 220, min: 100, max: 600, step: 10, unit: "ms" }],
        spec: [
          [
            "書き方",
            "<code>transition: opacity 時間, scale 時間, display 時間 allow-discrete</code>（または <code>transition-behavior: allow-discrete</code>）",
          ],
          ["出るとき", "<code>@starting-style</code> で始まりの姿（<code>opacity: 0; scale: .96</code>）を決める"],
          [
            "比べる",
            "右は <code>allow-discrete</code> なし。消えるときに一瞬で消える。Firefox では左も同じなので、透明にしてから <code>hidden</code> に",
          ],
          ["動きを減らす設定", "拡大をやめ、透明度の遷移だけにする"],
          [
            "出典",
            '<a href="https://www.w3.org/TR/css-transitions-2/" target="_blank" rel="noopener">W3C CSS Transitions Level 2</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const ps = stage.querySelectorAll(".ac-discrete-transition-p");
            return seq(2400, [
              [200, () => ps.forEach((p) => p.classList.add("is-open"))],
              [1400, () => ps.forEach((p) => p.classList.remove("is-open"))],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
