<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パタパタ表示（Split-flap text） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-split-flap-text"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div class="ac-split-flap-text-w"></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-split-flap-text .ac-split-flap-text-w {
        display: flex;
        gap: 3px;
      }
      .ac-split-flap-text .ac-split-flap-text-f {
        position: relative;
        width: 24px;
        height: 34px;
        border-radius: 4px;
        background: var(--toast);
        color: #fff;
        font:
          800 22px/34px ui-monospace,
          Menlo,
          monospace;
        text-align: center;
        overflow: hidden;
      }
      .ac-split-flap-text .ac-split-flap-text-f::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 16.5px;
        height: 1px;
        background: rgba(0, 0, 0, 0.45);
      }
      .ac-split-flap-text .ac-split-flap-text-f span {
        display: block;
        transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "split-flap-text",
        name: "パタパタ表示",
        en: "Split-flap text",
        cat: "文字",
        kind: "motion",
        description:
          "駅や空港の発着案内板のように、1文字ずつの板がパタパタとめくれて、ランダムな文字を経由しながら新しい表示に切り替わる動きです。機械仕掛けの心地よいリズムがあります。",
        use: "時刻表・スコア・カウントダウン、ニュースの見出し、レトロ・旅行系のデザイン、数値の更新。",
        params: [
          { key: "flip", label: "1回のめくり", value: 70, min: 30, max: 200, step: 5, unit: "ms" },
          { key: "gap", label: "1文字ごとの遅れ", value: 40, min: 0, max: 120, step: 5, unit: "ms" },
        ],
        spec: [
          [
            "1回のめくり",
            "板の上半分を <code>rotateX(0 → -90deg)</code>、下半分（次の文字）を <code>rotateX(90deg → 0)</code>｜それぞれめくり時間の半分｜in・out",
          ],
          [
            "切り替え",
            "目標の文字に着くまで、決まった順番（A→B→C…）かランダムな文字を何回か経由する（途中の文字は <code>aria-hidden</code>）。i 文字目は i × 遅れ だけ遅れて始める",
          ],
          ["音", "めくりに合わせて小さなクリック音を付けると本物らしい（任意）"],
          ["動きを減らす設定", "めくりを省き、文字をすぐ切り替える"],
          [
            "出典",
            '<a href="https://reactbits.dev/text-animations/split-flap-text" target="_blank" rel="noopener">React Bits: Split Flap Text</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const w = stage.querySelector(".ac-split-flap-text-w"),
              A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
              words = ["TOKYO", "OSAKA", "KYOTO", "NAGOYA"];
            let wi = 0;
            w.innerHTML = Array.from(
              { length: 6 },
              () => '<span class="ac-split-flap-text-f"><span> </span></span>',
            ).join("");
            const fs = [...w.children];
            let ts = [];
            const show_ = (word) => {
              const target = word.padEnd(6, " ");
              fs.forEach((f, i) => {
                const s = f.firstElementChild;
                let n = rm ? 0 : 4 + (i % 3);
                const step = () => {
                  const c = n > 0 ? A[Math.floor(Math.random() * A.length)] : target[i];
                  if (!rm)
                    s.animate(
                      [
                        { transform: "scaleY(1)" },
                        { transform: "scaleY(.05)", offset: 0.5 },
                        { transform: "scaleY(1)" },
                      ],
                      { duration: v.flip },
                    );
                  setTimeout(
                    () => {
                      s.textContent = c;
                    },
                    rm ? 0 : v.flip / 2,
                  );
                  if (n-- > 0) ts.push(setTimeout(step, v.flip));
                };
                ts.push(setTimeout(step, rm ? 0 : i * v.gap));
              });
            };
            show_(words[0]);
            const stop = seq(2600, [
              [
                1300,
                () => {
                  wi = (wi + 1) % words.length;
                  show_(words[wi]);
                },
              ],
            ]);
            return () => {
              stop();
              ts.forEach(clearTimeout);
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
