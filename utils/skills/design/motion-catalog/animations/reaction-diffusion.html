<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>反応拡散（Reaction–diffusion (Gray–Scott)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-reaction-diffusion"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "reaction-diffusion",
        name: "反応拡散",
        en: "Reaction–diffusion (Gray–Scott)",
        cat: "背景",
        kind: "motion",
        description:
          "2 種類の物質が広がりながら反応する、という規則を画面の全部の点で計算し続けると、斑点が分裂したり、しまやサンゴのような形が育っていきます。",
        use: "研究・バイオ・科学系のブランドの背景、ジェネラティブなヒーロー、ローディングの演出。",
        params: [{ key: "steps", label: "1フレームの計算回数", value: 8, min: 1, max: 20, step: 1, unit: "回" }],
        spec: [
          [
            "規則",
            "各点の濃さ A・B を毎ステップ <code>A += Da∇²A − AB² + f(1−A)</code>、<code>B += Db∇²B + AB² − (k+f)B</code> で更新する（Gray–Scott）",
          ],
          ["模様", "f と k の組で模様が変わる（例：f 0.037・k 0.065 で分裂する斑点）"],
          ["本格的に", "WebGL で 2 枚のテクスチャを交互に書き換える（ピンポン）"],
          ["動きを減らす設定", "模様が育ちきった1コマの静止画にする"],
          [
            "出典",
            '<a href="https://github.com/dueyama/gray-scott-3d" target="_blank" rel="noopener">github.com（gray-scott-3d）</a>、<a href="https://thecodingtrain.com/challenges/13-reaction-diffusion" target="_blank" rel="noopener">thecodingtrain.com（13-reaction-diffusion）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const lw = 110,
              lh = 75,
              off = document.createElement("canvas");
            off.width = lw;
            off.height = lh;
            const og = off.getContext("2d"),
              img = og.createImageData(lw, lh),
              px = img.data;
            const blit = () => {
              og.putImageData(img, 0, 0);
              g.imageSmoothingEnabled = false;
              g.drawImage(off, 0, 0, W, H);
            };
            const put = (i, r, gg, b) => {
              px[i * 4] = r;
              px[i * 4 + 1] = gg;
              px[i * 4 + 2] = b;
              px[i * 4 + 3] = 255;
            };
            const N = lw * lh;
            let A = new Float32Array(N),
              B = new Float32Array(N),
              A2 = new Float32Array(N),
              B2 = new Float32Array(N),
              t0 = 0;
            const seed = () => {
              A.fill(1);
              B.fill(0);
              for (let s = 0; s < 7; s++) {
                const cx = 8 + Math.floor(rnd() * 94),
                  cy = 6 + Math.floor(rnd() * 62);
                for (let y = -3; y <= 3; y++) for (let x = -3; x <= 3; x++) B[(cy + y) * lw + cx + x] = 1;
              }
            };
            const step = () => {
              const f = 0.0367,
                k = 0.0649;
              for (let y = 1; y < lh - 1; y++)
                for (let x = 1; x < lw - 1; x++) {
                  const i = y * lw + x,
                    a = A[i],
                    b = B[i];
                  const la =
                    0.2 * (A[i - 1] + A[i + 1] + A[i - lw] + A[i + lw]) +
                    0.05 * (A[i - lw - 1] + A[i - lw + 1] + A[i + lw - 1] + A[i + lw + 1]) -
                    a;
                  const lb =
                      0.2 * (B[i - 1] + B[i + 1] + B[i - lw] + B[i + lw]) +
                      0.05 * (B[i - lw - 1] + B[i - lw + 1] + B[i + lw - 1] + B[i + lw + 1]) -
                      b,
                    ab = a * b * b;
                  A2[i] = a + la - ab + f * (1 - a);
                  B2[i] = b + 0.5 * lb + ab - (k + f) * b;
                }
              [A, A2] = [A2, A];
              [B, B2] = [B2, B];
            };
            seed();
            for (let i = 0; i < (rm ? 2500 : 300); i++) step();
            return raf((t) => {
              if (!rm) {
                if (t - t0 > 16) {
                  seed();
                  for (let i = 0; i < 300; i++) step();
                  t0 = t;
                }
                for (let i = 0; i < v.steps; i++) step();
              }
              for (let i = 0; i < N; i++) {
                const c = Math.min(1, Math.max(0, B[i] * 3));
                put(i, 235 - 200 * c, 243 - 150 * c, 255 - 20 * c);
              }
              blit();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
