<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文字がはじけ飛ぶ（Text explosion） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-text-explosion"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <div
          style="
            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: 0.02em;
            font-size: 32px;
            line-height: 41px;
            display: flex;
          "
          aria-hidden="true"
        >
          <span class="ac-text-explosion-ch" style="--i: 0" aria-hidden="true">B</span
          ><span class="ac-text-explosion-ch" style="--i: 1" aria-hidden="true">O</span
          ><span class="ac-text-explosion-ch" style="--i: 2" aria-hidden="true">O</span
          ><span class="ac-text-explosion-ch" style="--i: 3" aria-hidden="true">M</span
          ><span class="ac-text-explosion-ch" style="--i: 4" aria-hidden="true">!</span>
        </div>
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
          "
          >BOOM!</span
        >
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-text-explosion .ac-text-explosion-ch {
        display: inline-block;
        animation:
          ac-text-explosion-x var(--dur, 700ms) cubic-bezier(0.22, 1, 0.36, 1) 600ms both,
          ac-text-explosion-back var(--dur, 700ms) cubic-bezier(0.34, 1.56, 0.64, 1)
            calc(600ms + var(--dur, 700ms) + 500ms) forwards;
      }
      @keyframes ac-text-explosion-x {
        from {
          transform: none;
          opacity: 1;
        }
        to {
          transform: translate(var(--x), var(--y)) rotate(var(--r));
          opacity: 0;
        }
      }
      @keyframes ac-text-explosion-back {
        from {
          transform: translate(var(--x), var(--y)) rotate(var(--r));
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-text-explosion-x {
          from {
            opacity: 1;
          }
          to {
            opacity: 0;
          }
        }
        @keyframes ac-text-explosion-back {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "text-explosion",
        name: "文字がはじけ飛ぶ",
        en: "Text explosion",
        cat: "文字",
        kind: "motion",
        description:
          "文字が1文字ずつばらばらに、回転しながら四方へはじけ飛んで消え、また元の場所へ集まってくる動きです。強い驚きや、すべてをリセットする瞬間を表せます。",
        use: "ゲームの演出、削除・リセットの表現、エンタメ系の見出し、クリックで遊べる文字。",
        params: [
          { key: "dur", label: "飛ぶ時間", value: 700, min: 300, max: 1500, step: 50, unit: "ms" },
          { key: "dist", label: "飛ぶ距離", value: 90, min: 30, max: 160, step: 5, unit: "px" },
        ],
        spec: [
          ["分け方", "1文字ずつ要素に分ける（読み上げ用に元の文字列を残す）"],
          [
            "飛ぶ",
            "各文字にランダムな角度 θ と回転を決め、<code>translate(cosθ × 距離, sinθ × 距離) rotate(±360deg)</code>、<code>opacity → 0</code>｜out",
          ],
          ["戻る", "同じ道を逆に、spring で戻すと気持ちよく収まる"],
          ["動きを減らす設定", "飛び散る動きをやめ、透明度で消して戻すだけにする"],
          ["出典", '<a href="https://animata.design/docs" target="_blank" rel="noopener">Animata</a>'],
        ],
        loop: 3000,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            stage.querySelectorAll(".ac-text-explosion-ch").forEach((c, i) => {
              const a = (i / 5) * Math.PI * 2 + Math.random() * 0.8,
                d = v.dist * (0.7 + Math.random() * 0.5);
              c.style.setProperty("--x", `${Math.cos(a) * d}px`);
              c.style.setProperty("--y", `${Math.sin(a) * d}px`);
              c.style.setProperty("--r", `${(Math.random() - 0.5) * 720}deg`);
            });
            return null;
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
