<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>いいねの弾け（Like / heart burst） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-like-heart-burst" style="position: relative; width: 200px; height: 150px">
        <span class="ac-like-heart-burst-ring"></span><i class="ac-like-heart-burst-p" style="--a: 0deg"></i
        ><i class="ac-like-heart-burst-p" style="--a: 45deg"></i><i class="ac-like-heart-burst-p" style="--a: 90deg"></i
        ><i class="ac-like-heart-burst-p" style="--a: 135deg"></i
        ><i class="ac-like-heart-burst-p" style="--a: 180deg"></i
        ><i class="ac-like-heart-burst-p" style="--a: 225deg"></i
        ><i class="ac-like-heart-burst-p" style="--a: 270deg"></i
        ><i class="ac-like-heart-burst-p" style="--a: 315deg"></i
        ><span class="ac-like-heart-burst-h"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"
            /></svg></span
        ><span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-like-heart-burst .ac-like-heart-burst-h {
        position: absolute;
        left: 76px;
        top: 51px;
        width: 48px;
        height: 48px;
        transition: transform 120ms cubic-bezier(0.55, 0, 1, 0.45);
      }
      .ac-like-heart-burst .ac-like-heart-burst-h svg {
        width: 48px;
        height: 48px;
        fill: none;
        stroke: var(--ink-muted);
        stroke-width: 1.8;
      }
      .ac-like-heart-burst .ac-like-heart-burst-h.is-down {
        transform: scale(0.8);
      }
      .ac-like-heart-burst .ac-like-heart-burst-h.is-on svg {
        fill: var(--blue);
        stroke: var(--blue);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-like-heart-burst .ac-like-heart-burst-h.is-on {
          animation: ac-like-heart-burst-pop var(--dur, 500ms) cubic-bezier(0.34, 1.56, 0.64, 1);
        }
      }
      .ac-like-heart-burst .ac-like-heart-burst-ring {
        position: absolute;
        left: 70px;
        top: 45px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 6px solid var(--sky);
        box-sizing: border-box;
        opacity: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-like-heart-burst .ac-like-heart-burst-ring.is-on {
          animation: ac-like-heart-burst-ring calc(var(--dur, 500ms) * 0.8) cubic-bezier(0.22, 1, 0.36, 1);
        }
      }
      .ac-like-heart-burst .ac-like-heart-burst-p {
        position: absolute;
        left: 97px;
        top: 72px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--sky);
        opacity: 0;
      }
      .ac-like-heart-burst .ac-like-heart-burst-p:nth-of-type(even) {
        background: var(--cobalt);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-like-heart-burst .ac-like-heart-burst-p.is-on {
          animation: ac-like-heart-burst-p var(--dur, 500ms) cubic-bezier(0.22, 1, 0.36, 1)
            calc(var(--dur, 500ms) * 0.15);
        }
      }
      @keyframes ac-like-heart-burst-pop {
        from {
          transform: scale(0.8);
        }
        50% {
          transform: scale(1.2);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes ac-like-heart-burst-ring {
        from {
          opacity: 1;
          transform: scale(0);
          border-width: 12px;
        }
        to {
          opacity: 0;
          transform: scale(1.4);
          border-width: 0;
        }
      }
      @keyframes ac-like-heart-burst-p {
        from {
          opacity: 1;
          transform: rotate(var(--a)) translateY(-28px) scale(1);
        }
        to {
          opacity: 0;
          transform: rotate(var(--a)) translateY(calc(-28px - var(--spread, 30px))) scale(0.3);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-like-heart-burst .ac-like-heart-burst-h.is-down {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "like-heart-burst",
        name: "いいねの弾け",
        en: "Like / heart burst",
        cat: "操作への反応",
        kind: "motion",
        description:
          "いいねを押すと、輪郭だけのハートが一瞬縮んでから、青く塗られて大きく弾み、まわりに輪と小さな粒が飛び散る動きです。押した瞬間の気持ちよさが、もう一度押したくなる手応えになります。",
        use: "いいね・お気に入り・スター・拍手のボタン、ブックマーク。",
        params: [
          { key: "dur", label: "時間", value: 500, min: 250, max: 1000, step: 10, unit: "ms" },
          { key: "spread", label: "粒の飛ぶ距離", value: 30, min: 10, max: 50, step: 2, unit: "px" },
        ],
        total: (p) => p["dur"],
        spec: [
          ["ハート", "押す：<code>scale(.8)</code>｜離す：塗りに切り替えて <code>scale(.8 → 1.2 → 1)</code>｜spring"],
          ["輪", "ハートの後ろに輪を <code>scale(0 → 1.4)</code>、線を細くしながら <code>opacity → 0</code>"],
          [
            "粒",
            "8個の粒を円周上の方向へ <code>translate(粒の飛ぶ距離)</code>、縮みながら消える｜out｜取り消すときは粒を出さない",
          ],
          ["動きを減らす設定", "弾みと粒をやめ、塗りの切り替えだけにする"],
          [
            "出典",
            '<a href="https://tympanus.net/codrops/2016/02/23/icon-animations-powered-by-mo-js/" target="_blank" rel="noopener">Codrops: icon animations with mo.js</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const h = stage.querySelector(".ac-like-heart-burst-h"),
              fx = stage.querySelectorAll(".ac-like-heart-burst-ring, .ac-like-heart-burst-p");
            move(190, 150, 0);
            return seq(3400, [
              [
                0,
                () => {
                  h.classList.remove("is-on");
                  fx.forEach((e) => e.classList.remove("is-on"));
                },
              ],
              [
                100,
                () => {
                  show(1);
                  move(110, 86, 500);
                },
              ],
              [700, () => h.classList.add("is-down")],
              [
                850,
                () => {
                  h.classList.remove("is-down");
                  h.classList.add("is-on");
                  fx.forEach((e) => e.classList.add("is-on"));
                },
              ],
              [1500, () => move(190, 150, 500)],
              [1900, () => show(0)],
            ]);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
