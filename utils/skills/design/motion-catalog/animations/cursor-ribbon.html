<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>リボンの軌跡（Cursor ribbon） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-cursor-ribbon" style="position: relative; width: 220px; height: 150px">
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cursor-ribbon",
        name: "リボンの軌跡",
        en: "Cursor ribbon",
        cat: "カーソル",
        kind: "motion",
        description:
          "ポインターのあとを、なめらかな帯（リボン）が少し遅れてついてくる動きです。先端は太く、後ろへいくほど細く薄くなり、空中に描いた筆跡のように流れます。",
        use: "アート・クリエイティブ系のサイト、イベントのヒーロー、遊び心のある背景。",
        params: [{ key: "n", label: "帯の長さ", value: 24, min: 8, max: 50, step: 1, unit: "点" }],
        spec: [
          [
            "点の列",
            "20–40個の点を持ち、先頭はポインターへ、i 番目は i-1 番目へ、毎フレーム少しずつ近づける（後ろほど遅れる）",
          ],
          ["描画", "隣どうしの点を線でつなぎ、線の太さと不透明度を先頭から後ろへ小さくする（canvas）"],
          ["色", "先頭から後ろへ色を変える（ここでは blue → sky）"],
          ["タッチ端末", "マウスのない端末（<code>hover: none</code>）では出さない"],
          ["動きを減らす設定", "ポインターへの追従や軌跡をやめ、通常のカーソルだけにする"],
          [
            "出典",
            '<a href="https://reactbits.dev/animations/ribbons" target="_blank" rel="noopener">React Bits: Ribbons</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const mkway =
              (pts, seg, hold = 0.3) =>
              (t) => {
                const n = pts.length,
                  k = (t % (n * seg)) / seg,
                  i = Math.floor(k),
                  f0 = k - i,
                  f = Math.max(0, (f0 - hold) / (1 - hold)),
                  e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2,
                  a = pts[i],
                  b = pts[(i + 1) % n];
                return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
              };
            const loop8 = (t, cx = 110, cy = 75, rx = 85, ry = 45) => [
              cx + rx * Math.sin(t * 0.9),
              cy + ry * Math.sin(t * 1.7),
            ];
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const n = v.n,
              ps = Array.from({ length: n }, () => [110, 75]),
              c1 = col("blue") || "#2563eb",
              c2 = col("sky") || "#7ab8ff";
            return raf((t) => {
              const tgt = loop8(t * 1.3);
              ps[0][0] += (tgt[0] - ps[0][0]) * 0.5;
              ps[0][1] += (tgt[1] - ps[0][1]) * 0.5;
              for (let i = 1; i < n; i++) {
                ps[i][0] += (ps[i - 1][0] - ps[i][0]) * (rm ? 1 : 0.45);
                ps[i][1] += (ps[i - 1][1] - ps[i][1]) * (rm ? 1 : 0.45);
              }
              g.clearRect(0, 0, W, H);
              g.lineCap = "round";
              for (let i = 1; i < n; i++) {
                const k = 1 - i / n;
                g.strokeStyle = i < n / 3 ? c1 : c2;
                g.globalAlpha = k;
                g.lineWidth = 2 + 10 * k;
                g.beginPath();
                g.moveTo(ps[i - 1][0], ps[i - 1][1]);
                g.lineTo(ps[i][0], ps[i][1]);
                g.stroke();
              }
              g.globalAlpha = 1;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
