<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ジーニーエフェクト（Genie effect (Magic Lamp)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-genie-effect"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "genie-effect",
        name: "ジーニーエフェクト",
        en: "Genie effect (Magic Lamp)",
        cat: "状態の遷移",
        kind: "motion",
        description:
          "ウインドウをしまうとき、下の方から漏斗のように細くすぼまりながら、ランプに吸い込まれる魔人のように Dock のアイコンへ流れ込む動きです。戻すときは逆にアイコンから湧き出して広がります。どこへしまわれたのかが一目で分かります。",
        use: "ウインドウやパネルの最小化、アプリへの格納、カートやフォルダへ物を入れる演出。",
        params: [{ key: "dur", label: "しまう時間", value: 700, min: 300, max: 2000, step: 50, unit: "ms" }],
        spec: [
          [
            "形",
            "ウインドウを横の細い帯に分け、帯ごとに、しまう先へ近いほど幅をアイコンの幅へ細める（漏斗の形）。前半は形だけ曲げ、後半で全体を漏斗に沿って下へ流し込む",
          ],
          ["時間", "0.4〜0.6 秒。macOS では Shift を押すとゆっくり再生できる"],
          [
            "Web では",
            "canvas や WebGL で帯ごとに描く（メッシュの変形）。CSS だけなら <code>clip-path</code> と <code>scale</code> で近い形にする",
          ],
          ["動きを減らす設定", "形の変形をやめ、縮めながらフェードしてしまう"],
          [
            "出典",
            '<a href="https://archive.computerhistory.org/resources/access/text/2018/10/102738558-05-01-acc.pdf" target="_blank" rel="noopener">archive.computerhistory.org（102738558-05-01-acc）</a>、<a href="https://patents.google.com/patent/US20090303242A1/en" target="_blank" rel="noopener">patents.google.com（en）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const off = document.createElement("canvas"),
              ww = 140,
              wh = 90;
            off.width = ww * 2;
            off.height = wh * 2;
            const o = off.getContext("2d");
            o.scale(2, 2);
            o.fillStyle = "#fff";
            o.beginPath();
            o.roundRect(0, 0, ww, wh, 8);
            o.fill();
            o.fillStyle = col("ice");
            o.fillRect(0, 0, ww, 16);
            ["#ff6b6b", "#ffc145", "#4ade80"].forEach((c, i) => {
              o.fillStyle = c;
              o.beginPath();
              o.arc(10 + i * 9, 8, 3, 0, TAU);
              o.fill();
            });
            o.fillStyle = col("sky");
            o.beginPath();
            o.roundRect(10, 24, 52, 52, 6);
            o.fill();
            o.fillStyle = col("bar");
            for (let i = 0; i < 4; i++) o.fillRect(72, 28 + i * 12, 56 - i * 8, 5);
            const X0 = 40,
              Y0 = 16,
              DY = 134,
              IL = 142,
              IR = 158,
              sm = (u) => u * u * (3 - 2 * u),
              cl = (u) => Math.min(1, Math.max(0, u));
            return raf((t) => {
              const M = v.dur / 1000,
                T = t % (2 * M + 2.2),
                p =
                  T < 0.8
                    ? 0
                    : T < 0.8 + M
                      ? (T - 0.8) / M
                      : T < 1.9 + M
                        ? 1
                        : T < 1.9 + 2 * M
                          ? 1 - (T - 1.9 - M) / M
                          : 0;
              g.clearRect(0, 0, W, H);
              g.fillStyle = "rgba(219,234,254,.8)";
              g.beginPath();
              g.roundRect(60, DY - 2, 100, 16, 6);
              g.fill();
              g.fillStyle = col("blue");
              g.beginPath();
              g.roundRect(IL, DY + 1, IR - IL, 10, 3);
              g.fill();
              g.fillStyle = col("sky");
              g.beginPath();
              g.roundRect(70, DY + 1, 16, 10, 3);
              g.roundRect(96, DY + 1, 16, 10, 3);
              g.fill();
              if (rm) {
                g.globalAlpha = 1 - p;
                const s = 1 - p * 0.6;
                g.drawImage(off, 110 - (ww * s) / 2, Y0 + p * 60, ww * s, wh * s);
                g.globalAlpha = 1;
                return;
              }
              const a1 = sm(cl(p / 0.45)),
                a2 = sm(cl((p - 0.3) / 0.7)),
                shift = a2 * (DY - Y0);
              for (let r = 0; r < wh; r++) {
                const y = Y0 + r + shift;
                if (y > DY) break;
                const u = cl((y - Y0) / (DY - Y0)),
                  sh = sm(u) * a1,
                  L = X0 + (IL - X0) * sh,
                  R = X0 + ww + (IR - X0 - ww) * sh;
                g.drawImage(off, 0, r * 2, ww * 2, 2, L, y, R - L, 1.3);
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
