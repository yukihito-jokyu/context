<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>読み進み具合のバー（Scroll progress indicator） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-scroll-progress-indicator" style="position: relative; width: 200px; height: 160px">
        <div
          class="ac-scroll-progress-indicator-sc"
          style="
            width: 200px;
            height: 160px;
            overflow-y: auto;
            scrollbar-width: none;
            border-radius: 22px;
            background: var(--bg);
            box-shadow: inset 0 0 0 1px var(--line);
          "
        >
          <div class="ac-scroll-progress-indicator-bar"><i></i></div>
          <span class="ac-scroll-progress-indicator-ring"></span>
          <div style="display: flex; flex-direction: column; gap: 9px; padding: 10px 14px 16px">
            <span class="sb-bar sb-bar--xs" style="width: 150px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 170px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 130px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 160px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 120px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 170px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 150px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 110px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 165px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 140px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 170px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 125px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 155px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 168px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 100px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 150px"></span
            ><span class="sb-bar sb-bar--xs" style="width: 170px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 130px"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-scroll-progress-indicator .ac-scroll-progress-indicator-bar {
        position: sticky;
        top: 0;
        z-index: 1;
        height: var(--h, 4px);
        background: var(--bg);
      }
      .ac-scroll-progress-indicator .ac-scroll-progress-indicator-bar i {
        display: block;
        height: 100%;
        background: var(--blue);
        transform-origin: left;
        transform: scaleX(0);
      }
      .ac-scroll-progress-indicator .ac-scroll-progress-indicator-ring {
        position: sticky;
        float: right;
        top: 12px;
        margin: 0 10px -26px 0;
        z-index: 1;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: conic-gradient(var(--blue) var(--p, 0%), var(--bar-soft) 0);
        -webkit-mask: radial-gradient(circle, transparent 7px, #000 8px);
        mask: radial-gradient(circle, transparent 7px, #000 8px);
      }
      @property --p {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 0%;
      }
      /* 未対応のブラウザでは JS がスクロールのたびに値を入れる */
      @supports (animation-timeline: scroll()) and (scroll-timeline: --ac-spi y) {
        .ac-scroll-progress-indicator .ac-scroll-progress-indicator-sc {
          scroll-timeline: --ac-spi y;
        }
        .ac-scroll-progress-indicator .ac-scroll-progress-indicator-bar i {
          animation: ac-scroll-progress-indicator-grow linear both;
          animation-timeline: --ac-spi;
        }
        .ac-scroll-progress-indicator .ac-scroll-progress-indicator-ring {
          animation: ac-scroll-progress-indicator-ring linear both;
          animation-timeline: --ac-spi;
        }
      }
      @keyframes ac-scroll-progress-indicator-grow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes ac-scroll-progress-indicator-ring {
        from {
          --p: 0%;
        }
        to {
          --p: 100%;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "scroll-progress-indicator",
        name: "読み進み具合のバー",
        en: "Scroll progress indicator",
        cat: "スクロール",
        kind: "motion",
        description:
          "ページをどこまで読み進めたかを、上端のバーの長さ（や円の満ち具合）で示す動きです。スクロールに合わせて伸び縮みし、残りの量がひと目で分かります。",
        use: "ブログ・記事・ドキュメント、長い規約、オンボーディングの読み物。",
        params: [{ key: "h", label: "バーの太さ", value: 4, min: 2, max: 10, step: 1, unit: "px" }],
        spec: [
          [
            "動き",
            "バー：<code>scaleX(0 → 1)</code>（<code>transform-origin: left</code>）、円：<code>conic-gradient</code> の角度｜イージングは <code>linear</code>",
          ],
          [
            "CSS",
            "<code>animation-timeline: scroll(root)</code> で、ページ全体のスクロール量に連動させる。未対応なら <code>scroll</code> イベントで値を入れる",
          ],
          [
            "置き場所",
            "上端に固定（<code>position: fixed</code> / <code>sticky</code>）。本文の邪魔にならない細さにする",
          ],
          ["動きを減らす設定", "バーは情報なのでそのまま残す（なめらかに伸ばす補間はしなくてよい）"],
          ["出典", '<a href="https://magicui.design/docs/components" target="_blank" rel="noopener">Magic UI</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const auto = (sc, ms) => {
              let raf,
                start = null;
              const tick = (now) => {
                if (start === null) start = now;
                const t = (now - start) % (ms + 1000),
                  p = Math.min(1, t / ms),
                  max = sc.scrollHeight - sc.clientHeight;
                sc.scrollTop = max * (0.5 - Math.cos(Math.PI * p) / 2);
                raf = requestAnimationFrame(tick);
              };
              raf = requestAnimationFrame(tick);
              return () => cancelAnimationFrame(raf);
            };
            const sc = stage.querySelector(".ac-scroll-progress-indicator-sc"),
              stop = auto(sc, 3600);
            if (CSS.supports("(animation-timeline: scroll()) and (scroll-timeline: --ac-spi y)")) return stop;
            const bar = sc.querySelector(".ac-scroll-progress-indicator-bar i"),
              ring = sc.querySelector(".ac-scroll-progress-indicator-ring");
            const update = () => {
              const max = sc.scrollHeight - sc.clientHeight,
                p = max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 0;
              bar.style.transform = `scaleX(${p})`;
              ring.style.setProperty("--p", `${p * 100}%`);
            };
            sc.addEventListener("scroll", update, { passive: true });
            update();
            return () => {
              stop();
              sc.removeEventListener("scroll", update);
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
