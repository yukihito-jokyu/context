<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>目で追う（Look-at (eyes follow)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-eye-look-at" style="position: relative; width: 220px; height: 150px">
        <div class="ac-eye-look-at-hd">
          <div class="ac-eye-look-at-fc">
            <span class="ac-eye-look-at-ew"><i></i></span><span class="ac-eye-look-at-ew"><i></i></span>
          </div>
        </div>
        <span class="ac-eye-look-at-ball"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-eye-look-at .ac-eye-look-at-hd {
        position: absolute;
        left: 70px;
        top: 36px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(160deg, var(--ice), var(--sky));
        overflow: hidden;
      }
      .ac-eye-look-at .ac-eye-look-at-fc {
        position: absolute;
        left: 12px;
        top: 22px;
        display: flex;
        gap: 10px;
      }
      .ac-eye-look-at .ac-eye-look-at-ew {
        position: relative;
        width: 23px;
        height: 23px;
        border-radius: 50%;
        background: #fff;
        box-shadow: inset 0 0 0 1.5px rgba(27, 58, 138, 0.2);
      }
      .ac-eye-look-at .ac-eye-look-at-ew i {
        position: absolute;
        left: 6px;
        top: 6px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--navy);
      }
      .ac-eye-look-at .ac-eye-look-at-ball {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "eye-look-at",
        name: "目で追う",
        en: "Look-at (eyes follow)",
        cat: "キャラクター",
        kind: "motion",
        description:
          "キャラクターの目が動く物を見つめ続け、少し遅れて頭も同じ向きへ回る動きです。目が先、頭が後という順番が自然で、キャラクターが周りに気づいている感じが出ます。",
        use: "マスコットがカーソルや入力欄を見る演出、ゲームの敵キャラクター、ログイン画面のキャラクター、チュートリアル。",
        params: [{ key: "k", label: "頭の追いつく速さ", value: 0.08, min: 0.02, max: 0.3, step: 0.01, unit: "" }],
        spec: [
          ["目", "目標への向きを毎フレーム計算し、黒目を白目の中で動かす（動ける範囲を半径で制限）"],
          ["頭", "頭（顔のパーツ全体）は目標へ <code>現在 += (目標 − 現在) × 0.08</code> の遅れで向ける"],
          ["仕組み", "3D ではルックアット・コンストレイント（向きを目標に向ける制約）で作る"],
          ["動きを減らす設定", "頭の遅れをやめ、黒目だけを動かす"],
          [
            "出典",
            '<a href="https://github.com/grapefrukt/juicy-breakout/blob/master/src/com/grapefrukt/games/juicy/Settings.as" target="_blank" rel="noopener">Juicy Breakout（Jonasson & Purho）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const fc = stage.querySelector(".ac-eye-look-at-fc"),
              ball = stage.querySelector(".ac-eye-look-at-ball"),
              ps = [...stage.querySelectorAll(".ac-eye-look-at-ew i")];
            let hx = 0,
              hy = 0,
              last = null;
            const look = (bx, by, dt) => {
              ball.style.transform = `translate(${bx}px, ${by}px)`;
              const dx = bx - 110,
                dy = by - 76,
                d = Math.hypot(dx, dy) || 1,
                tx = (dx / 110) * 14,
                ty = (dy / 80) * 12;
              const k = rm ? 0 : 1 - Math.pow(1 - v.k, dt * 60);
              hx += (tx - hx) * k;
              hy += (ty - hy) * k;
              fc.style.transform = `translate(${hx}px, ${hy}px)`; /* k は 60fps で1フレームあたりの割合 */
              ps.forEach((p) => {
                p.style.transform = `translate(${(dx / d) * 5}px, ${(dy / d) * 5}px)`;
              });
            };
            if (rm) {
              look(180, 50, 0);
              return null;
            } // 動きを減らす設定：目標を止め、黒目をそちらへ向けたまま
            return raf((t) => {
              const dt = last === null ? 1 / 60 : Math.min(0.05, t - last);
              last = t;
              look(110 + 95 * Math.sin(t * 1.3), 75 + 55 * Math.sin(t * 2.1 + 0.5), dt);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
