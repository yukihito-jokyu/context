<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ゲルストナー波（Gerstner waves） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-gerstner-waves"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "gerstner-waves",
        name: "ゲルストナー波",
        en: "Gerstner waves",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "水面の点を上下だけでなく前後にも円を描くように動かして、波の山はとがって集まり、谷は広く平らになる、本物の海に近い波を作る方法です。いくつかの向き・長さの波を足し合わせると、うねりが重なった海面になります。",
        use: "海・旅行・アウトドアの背景、ゲームの水面、3D の海のシーン、落ち着いたヒーロー。",
        params: [{ key: "q", label: "山のとがり具合（Q）", value: 0.7, min: 0, max: 1, step: 0.05, unit: "" }],
        spec: [
          [
            "式",
            "元の位置 x₀ の点を <code>x = x₀ − Q·A·sin(k·x₀ − ωt)</code>、<code>y = A·cos(k·x₀ − ωt)</code> へ動かす（A は高さ、k は波の細かさ、Q はとがり具合）",
          ],
          ["重ねる", "向き・波長・速さの違う 3〜5 個の波を足す。波長の長い波ほど速く進む（<code>ω = √(g·k)</code>）"],
          ["本格的に", "3D の海は、頂点シェーダーで格子の頂点をずらし、法線も同じ式から求めて光を当てる"],
          ["動きを減らす設定", "波の動きを止め、海面の静止画にする"],
          [
            "出典",
            '<a href="https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-1-effective-water-simulation-physical-models?source=post_page---------------------------" target="_blank" rel="noopener">developer.nvidia.com（chapter-1-effective-water-si）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const waves = [
              [0.045, 9, 1],
              [0.09, 4, 1.7],
              [0.16, 2, -1.3],
            ];
            const pt = (x0, t) => {
              let x = x0,
                y = 0;
              for (const [k, A, s] of waves) {
                const w = Math.sqrt(9.8 * k) * 1.8 * s,
                  ph = k * x0 - w * t;
                x -= v.q * A * sin(ph);
                y += A * cos(ph);
              }
              return [x, 82 - y];
            };
            return raf((t) => {
              const T = rm ? 0 : t;
              g.clearRect(0, 0, W, H);
              const gr = g.createLinearGradient(0, 60, 0, H);
              gr.addColorStop(0, col("sky"));
              gr.addColorStop(1, col("cobalt"));
              g.beginPath();
              g.moveTo(-10, H);
              for (let x0 = -20; x0 <= W + 20; x0 += 3) {
                const [x, y] = pt(x0, T);
                g.lineTo(x, y);
              }
              g.lineTo(W + 10, H);
              g.closePath();
              g.fillStyle = gr;
              g.fill();
              for (const x0 of [50, 110, 170]) {
                const [x, y] = pt(x0, T);
                g.strokeStyle = "rgba(255,255,255,.5)";
                g.lineWidth = 1;
                g.beginPath();
                g.arc(x0, 82, 9, 0, TAU);
                g.stroke();
                dot(x, y, 3, "#fff");
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
