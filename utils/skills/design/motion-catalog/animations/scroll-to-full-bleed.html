<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画面いっぱいに広がる（Scroll-to-full-bleed media） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-scroll-to-full-bleed" style="position: relative; width: 200px; height: 160px">
        <div
          class="ac-scroll-to-full-bleed-sc"
          style="
            width: 200px;
            height: 160px;
            overflow-y: auto;
            scrollbar-width: none;
            border-radius: 22px;
            background: var(--bg);
            box-shadow: inset 0 0 0 1px var(--line);
          "
        >
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px">
            <span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 120px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 160px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 140px"></span>
          </div>
          <div style="height: 40px"></div>
          <span class="ac-scroll-to-full-bleed-m sb-grad-hero"></span>
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px">
            <span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 150px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 120px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 160px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 100px"></span>
          </div>
          <div style="height: 30px"></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-scroll-to-full-bleed .ac-scroll-to-full-bleed-m {
        display: block;
        height: 130px;
        margin: 0 auto;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-scroll-to-full-bleed .ac-scroll-to-full-bleed-m {
          clip-path: inset(0 calc((100% - var(--from, 70%)) / 2) round var(--r, 20px));
        }
        /* 未対応のブラウザでは JS が位置から進み具合を出して clip-path を入れる */
        @supports (animation-timeline: view()) and (animation-range: entry 0% cover 55%) {
          .ac-scroll-to-full-bleed .ac-scroll-to-full-bleed-m {
            animation: ac-scroll-to-full-bleed-grow linear both;
            animation-timeline: view();
            animation-range: entry 0% cover 55%;
          }
        }
      }
      @keyframes ac-scroll-to-full-bleed-grow {
        to {
          clip-path: inset(0 0 round 0);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "scroll-to-full-bleed",
        name: "画面いっぱいに広がる",
        en: "Scroll-to-full-bleed media",
        cat: "スクロール",
        kind: "motion",
        description:
          "スクロールして画像や動画の枠が画面に入ってくると、角の丸い小さな枠から、画面の端から端までいっぱいの大きさへ広がっていく動きです。ページの中で、主役のビジュアルに一気に没入させます。",
        use: "製品紹介の動画、ランディングページの写真、ストーリーの見せ場、作品の詳細。",
        params: [
          { key: "from", label: "広がる前の幅", value: 70, min: 40, max: 95, step: 5, unit: "%" },
          { key: "r", label: "広がる前の角丸", value: 20, min: 0, max: 40, step: 2, unit: "px" },
        ],
        spec: [
          [
            "動き",
            "幅 <code>広がる前の幅 → 100%</code>（または <code>scale</code> / <code>clip-path: inset()</code>）と角丸 <code>→ 0</code>｜スクロール量に連動",
          ],
          [
            "CSS",
            "<code>animation-timeline: view()</code>、<code>animation-range: entry 0% cover 55%</code>。未対応なら JS で位置から進み具合を出す",
          ],
          [
            "負荷",
            "大きな動画は <code>width</code> を動かすと重い。<code>clip-path</code> か <code>scale</code> で広げるとよい",
          ],
          ["動きを減らす設定", "広げる動きをやめ、最初から画面いっぱいで見せる"],
          ["出典", '<a href="https://reactbits.dev/get-started/index" target="_blank" rel="noopener">React Bits</a>'],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const auto = (sc, ms) => {
              let raf,
                start = null;
              const tick = (now) => {
                if (start === null) start = now;
                const t = (now - start) % (ms + 1000),
                  p = Math.min(1, t / ms),
                  max = sc.scrollHeight - sc.clientHeight;
                sc.scrollTop = max * (0.5 - Math.cos(Math.PI * p) / 2);
                raf = requestAnimationFrame(tick);
              };
              raf = requestAnimationFrame(tick);
              return () => cancelAnimationFrame(raf);
            };
            const sc = stage.querySelector(".ac-scroll-to-full-bleed-sc"),
              stop = auto(sc, 3600);
            if (rm || CSS.supports("(animation-timeline: view()) and (animation-range: entry 0% cover 55%)"))
              return stop;
            const m = sc.querySelector(".ac-scroll-to-full-bleed-m");
            const update = () => {
              const top = m.getBoundingClientRect().top - sc.getBoundingClientRect().top;
              const p = Math.min(1, Math.max(0, (sc.clientHeight - top) / ((sc.clientHeight + m.offsetHeight) * 0.55))),
                q = 1 - p; /* entry 0% → cover 55% */
              m.style.clipPath = `inset(0 calc((100% - var(--from, 70%)) / 2 * ${q}) round calc(var(--r, 20px) * ${q}))`;
            };
            sc.addEventListener("scroll", update, { passive: true });
            update();
            return () => {
              stop();
              sc.removeEventListener("scroll", update);
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
