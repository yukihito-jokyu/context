<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>セルアニメ風（Cel-animation style） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-cel-animation-style" style="position: relative; width: 200px; height: 150px">
        <span class="ac-cel-animation-style-sh"></span><span class="ac-cel-animation-style-c"><i></i><i></i></span
        ><span class="ac-cel-animation-style-gr"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-cel-animation-style .ac-cel-animation-style-gr {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 20px;
        height: 3px;
        border-radius: 2px;
        background: var(--ink);
      }
      .ac-cel-animation-style .ac-cel-animation-style-c {
        position: absolute;
        left: 76px;
        bottom: 23px;
        width: 48px;
        height: 48px;
        border-radius: 50% 50% 46% 46%;
        background: var(--sky);
        border: 3px solid var(--ink);
        box-sizing: border-box;
        box-shadow: inset -8px -6px 0 rgba(30, 60, 140, 0.25);
        transform-origin: 50% 100%;
      }
      .ac-cel-animation-style .ac-cel-animation-style-c i {
        position: absolute;
        top: 14px;
        width: 6px;
        height: 9px;
        border-radius: 3px;
        background: var(--ink);
        left: 12px;
      }
      .ac-cel-animation-style .ac-cel-animation-style-c i + i {
        left: auto;
        right: 12px;
      }
      .ac-cel-animation-style .ac-cel-animation-style-sh {
        position: absolute;
        left: 80px;
        bottom: 16px;
        width: 40px;
        height: 8px;
        border-radius: 50%;
        background: rgba(18, 26, 43, 0.15);
      }
      /* コマ送りは run（Web Animations API）で、ループ全体の進み具合に steps() をかける */
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cel-animation-style",
        name: "セルアニメ風",
        en: "Cel-animation style",
        cat: "表現スタイル",
        kind: "style",
        description:
          "はっきりした輪郭線とベタ塗りの絵を、1秒に12コマ程度の「コマ送り」で切り替えて動かす、手描きアニメの表現です。なめらかすぎない動きが、温かく親しみやすい印象を作ります。",
        use: "キャラクターの登場する画面、オンボーディング、空の状態のイラスト、ブランドの物語。",
        params: [{ key: "fps", label: "1秒あたりのコマ数", value: 12, min: 6, max: 24, step: 1, unit: "" }],
        spec: [
          ["表現形式", "輪郭線（2–3px の濃い線）とベタ塗り・1段の影の絵"],
          ["演出", "決めのポーズを強く見せ、間のコマは少なく（ポーズからポーズへ）"],
          ["個別の動き", "跳ねる・つぶれる（squash & stretch）、まばたき。<code>steps()</code> でコマ送りにする"],
          ["時間・質感", "12コマ/秒（2コマ打ち）。イージングは各ポーズ間で強め"],
          ["カタログの関連", "squash-stretch / pose-to-pose / stepped-animation / sprite-sheet-playback"],
          ["動きを減らす設定", "コマ送りの動きを止め、決めのポーズの静止画にする"],
          [
            "出典",
            '<a href="https://www.adobe.com/creativecloud/animation/discover/cel-animation.html" target="_blank" rel="noopener">Adobe: cel animation</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          const c = stage.querySelector(".ac-cel-animation-style-c"),
            sh = stage.querySelector(".ac-cel-animation-style-sh");
          /* CSS の steps() はキーフレームの区間ごとにかかる。1/fps 秒ごとに送るため、全体の easing に渡す */
          const opt = { duration: 1000, iterations: Infinity, easing: `steps(${v.fps}, jump-none)` };
          const a = c.animate(
            [
              { transform: "scale(1.25, .7)" },
              { transform: "scale(.85, 1.2) translateY(-20px)", offset: 0.15 },
              { transform: "translateY(-62px) scale(1)", offset: 0.45 },
              { transform: "scale(.9, 1.12) translateY(-8px)", offset: 0.75 },
              { transform: "scale(1.25, .7)", offset: 0.85 },
              { transform: "scale(1.25, .7)" },
            ],
            opt,
          );
          const b = sh.animate(
            [
              { transform: "scale(1.1)", opacity: 1 },
              { transform: "scale(.6)", opacity: 0.5, offset: 0.45 },
              { transform: "scale(1.1)", opacity: 1, offset: 0.85 },
              { transform: "scale(1.1)", opacity: 1 },
            ],
            opt,
          );
          return () => {
            a.cancel();
            b.cancel();
          };
        },
      });
    </script>
  </body>
</html>
