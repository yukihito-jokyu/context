<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>戻り先を先に見せる（Predictive back） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-predictive-back" style="position: relative; width: 220px; height: 160px">
        <div class="ac-predictive-back-ph">
          <div class="ac-predictive-back-prev">
            <div
              class="sb-item"
              style="width: 130px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-aqua" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 90px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 130px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-sky" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 90px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
            <div
              class="sb-item"
              style="width: 130px; padding: 8px 12px; gap: 10px; box-sizing: border-box; border-radius: 18px"
            >
              <span class="sb-thumb sb-grad-deep" style="width: 24px; height: 24px; border-radius: 8px"></span
              ><span class="sb-lines" style="gap: 6px"
                ><span class="sb-bar sb-bar--xs sb-bar--strong" style="width: 90px"></span
                ><span class="sb-bar sb-bar--xxs sb-bar--soft" style="width: 56px"></span
              ></span>
            </div>
          </div>
          <div class="ac-predictive-back-cur">
            <span class="sb-hero sb-grad-deep" style="display: block; height: 50px; border-radius: 12px"></span
            ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 100px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 80px"></span
            ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 90px"></span>
          </div>
        </div>
        <span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-predictive-back .ac-predictive-back-ph {
        position: absolute;
        left: 35px;
        top: 6px;
        width: 150px;
        height: 148px;
        border-radius: 18px;
        overflow: hidden;
        background: var(--bg);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .ac-predictive-back .ac-predictive-back-prev {
        position: absolute;
        inset: 0;
        padding: 10px;
        display: grid;
        gap: 8px;
        align-content: start;
        filter: brightness(0.85);
      }
      .ac-predictive-back .ac-predictive-back-cur {
        position: absolute;
        inset: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--surface);
        transform-origin: 100% 50%;
        box-shadow: -6px 0 18px rgba(18, 26, 43, 0.12);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "predictive-back",
        name: "戻り先を先に見せる",
        en: "Predictive back",
        cat: "画面移動・ナビ",
        kind: "motion",
        description:
          "画面の端から戻るジェスチャーを始めると、今の画面が指に合わせて少し縮んで横へずれ、その後ろに戻り先の画面がのぞく動きです。離せば戻り、途中でやめれば元に戻るので、戻る前に行き先を確かめられます。プレビューは指の動きを再現した近い形です。",
        use: "Android アプリの戻る操作、スマホのナビゲーション、ボトムシート・ダイアログを閉じる操作。",
        params: [
          { key: "scale", label: "縮む大きさ", value: 0.9, min: 0.8, max: 1, step: 0.01, unit: "" },
          { key: "dur", label: "確定の時間", value: 300, min: 150, max: 600, step: 10, unit: "ms" },
        ],
        spec: [
          [
            "引いている間",
            "今の画面：<code>scale(1 → 縮む大きさ)</code>、<code>translateX</code> を少し、角を丸める。戻り先：少し暗い状態から明るく。指に付いてくる",
          ],
          ["離したとき", "確定なら今の画面を横へ出しながら消す、取り消しなら元へ戻す｜out"],
          [
            "Android",
            "<code>OnBackPressedCallback</code> の <code>handleOnBackProgressed</code> で進み具合（0–1）を受け取る",
          ],
          ["動きを減らす設定", "縮みとずれをやめ、確定したらフェードで戻る"],
          [
            "出典",
            '<a href="https://developer.android.com/develop/ui/compose/system/predictive-back-setup?hl=en" target="_blank" rel="noopener">Android: predictive back</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const c = stage.querySelector(".ac-predictive-back-cur"),
              p = stage.querySelector(".ac-predictive-back-prev");
            const at = (k, ms) => {
              c.style.transition = p.style.transition = ms
                ? `transform ${ms}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${ms}ms, border-radius ${ms}ms, filter ${ms}ms`
                : "none";
              c.style.transform = rm ? "" : `translateX(${k * 14}px) scale(${1 - (1 - v.scale) * k})`;
              c.style.borderRadius = `${k * 18}px`;
              p.style.filter = `brightness(${0.85 + 0.15 * k})`;
            };
            let anim;
            const drag = (cancel) => () => {
              const t0 = performance.now();
              cancelAnimationFrame(anim);
              const f = (now) => {
                const q = Math.min(1, (now - t0) / 800),
                  k = q * (2 - q) * (cancel ? 0.6 : 1);
                at(k, 0);
                move(38 + k * 70, 80, 0);
                if (q < 1) anim = requestAnimationFrame(f);
              };
              anim = requestAnimationFrame(f);
            };
            at(0, 0);
            c.style.opacity = 1;
            move(36, 80, 0);
            const stop = seq(6000, [
              [
                0,
                () => {
                  at(0, 0);
                  c.style.opacity = 1;
                },
              ],
              [100, () => show(1)],
              [300, drag(true)],
              [
                1200,
                () => {
                  show(0);
                  at(0, v.dur);
                },
              ],
              [
                2200,
                () => {
                  show(1);
                  move(36, 80, 0);
                },
              ],
              [2400, drag(false)],
              [
                3300,
                () => {
                  show(0);
                  c.style.transition = `transform ${v.dur}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${v.dur}ms`;
                  c.style.transform = rm ? "" : "translateX(160px) scale(.9)";
                  c.style.opacity = 0;
                  p.style.filter = "none";
                },
              ],
              [
                5000,
                () => {
                  c.style.transition = "opacity 300ms";
                  c.style.transform = "";
                  c.style.opacity = 1;
                  c.style.borderRadius = "0px";
                  p.style.filter = "brightness(.85)";
                },
              ],
            ]);
            return () => {
              stop();
              cancelAnimationFrame(anim);
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
