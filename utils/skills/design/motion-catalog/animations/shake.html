<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シェイク（Shake / Wiggle） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-shake" style="position: relative; width: 200px; height: 80px; display: grid; place-items: center">
        <div class="sb-field sb-field--focus ac-shake-f" style="width: 200px">
          <span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 70px"></span><span class="sb-caret"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      @media (prefers-reduced-motion: no-preference) {
        .ac-shake .ac-shake-f {
          animation: ac-shake-shake var(--dur, 400ms) cubic-bezier(0.65, 0, 0.35, 1) 300ms both;
        }
      }
      @keyframes ac-shake-shake {
        20% {
          transform: translateX(calc(var(--dist, 8px) * -1));
        }
        40% {
          transform: translateX(var(--dist, 8px));
        }
        60% {
          transform: translateX(calc(var(--dist, 8px) * -0.5));
        }
        80% {
          transform: translateX(calc(var(--dist, 8px) * 0.5));
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "shake",
        name: "シェイク",
        en: "Shake / Wiggle",
        cat: "操作への反応",
        kind: "motion",
        description:
          "要素を左右に小刻みに揺らして、「それはできない」「入力が違う」と伝える動きです。首を横に振るしぐさに近く、言葉がなくても拒否が伝わります。",
        use: "パスワードの間違い、入力エラー、押せないボタンを押したとき。",
        params: [
          { key: "dist", label: "揺れ幅", value: 8, min: 2, max: 16, step: 1, unit: "px" },
          { key: "dur", label: "時間", value: 400, min: 200, max: 800, step: 10, unit: "ms" },
        ],
        total: (p) => p["dur"],
        spec: [
          ["動き", "<code>translateX</code> を 0 → -幅 → +幅 → -幅/2 → +幅/2 → 0 と、だんだん小さく｜in-out"],
          ["組み合わせ", "エラーの色やメッセージと一緒に使う（揺れだけに頼らない）"],
          ["動きを減らす設定", "揺れをやめ、エラーの色とメッセージだけで伝える"],
          ["出典", "Animation Vocabulary（Feedback & Interaction）"],
        ],
        loop: 1600,
      });
    </script>
  </body>
</html>
