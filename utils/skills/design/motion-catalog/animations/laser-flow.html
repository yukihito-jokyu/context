<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流れ当たる光線（Laser flow） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-laser-flow"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
        <div class="ac-laser-flow-card"><i></i><i></i></div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-laser-flow .ac-laser-flow-card {
        position: absolute;
        left: 60px;
        top: 72px;
        width: 100px;
        height: 56px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        display: grid;
        align-content: center;
        gap: 7px;
        padding: 0 14px;
        box-sizing: border-box;
      }
      .ac-laser-flow .ac-laser-flow-card i {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.5);
      }
      .ac-laser-flow .ac-laser-flow-card i + i {
        width: 60%;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "laser-flow",
        name: "流れ当たる光線",
        en: "Laser flow",
        cat: "背景",
        kind: "motion",
        description:
          "上から差し込む 1 本の光線を中身（カード）に当て、当たった所で光をはじけさせ、そこからカードの縁に沿って左右へ光が流れ落ちていく背景です。視線を中身へ導きます。プレビューは canvas で近い形にしています（元の作例は WebGL）。",
        use: "新機能の発表、料金プランの注目のカード、製品のヒーロー、ローンチのページ。",
        params: [{ key: "speed", label: "流れる速さ", value: 75, min: 20, max: 160, step: 5, unit: "px/秒" }],
        spec: [
          [
            "作り方",
            "光線は縦のグラデーションの線を少しちらつかせる。当たる点に放射状の光を置き、縁に沿って左右に流れる光の粒を、加算合成で尾を引かせて描く",
          ],
          ["縁の流れ", "当たった点からの縁の上の距離 s を毎秒 60〜90px 進め、角を回って下の中央で合流させる"],
          ["本格的に", "WebGL のシェーダーで、光線と縁までの距離からにじみ・飛び散りを計算する"],
          ["動きを減らす設定", "光の流れとちらつきを止め、光線が当たった静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/llms.txt" target="_blank" rel="noopener">React Bits（コンポーネント一覧）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const P0 = [],
              top = 72,
              L = 156;
            let last = 0,
              acc = 0;
            const pos = (s, d) =>
              s < 50
                ? [110 + d * s, top]
                : s < 106
                  ? [110 + d * 50, top + (s - 50)]
                  : [110 + d * (50 - (s - 106)), top + 56];
            return raf((t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              g.globalCompositeOperation = "source-over";
              g.clearRect(0, 0, W, H);
              g.globalCompositeOperation = "lighter";
              const fl = rm ? 1 : 0.85 + 0.15 * Math.sin(t * 31) * Math.sin(t * 7),
                bm = g.createLinearGradient(0, 0, 0, top);
              bm.addColorStop(0, "rgba(120,180,255,0)");
              bm.addColorStop(1, `rgba(170,215,255,${0.9 * fl})`);
              g.fillStyle = bm;
              g.fillRect(109, 0, 2, top);
              blur(4);
              g.fillRect(106, 0, 8, top);
              blur(0);
              const sp = g.createRadialGradient(110, top, 0, 110, top, 26 * fl);
              sp.addColorStop(0, "rgba(220,240,255,.9)");
              sp.addColorStop(0.3, "rgba(120,180,255,.45)");
              sp.addColorStop(1, "rgba(120,180,255,0)");
              g.fillStyle = sp;
              g.fillRect(70, top - 30, 80, 60);
              if (!rm) {
                acc += dt * 26;
                while (acc > 1) {
                  acc--;
                  P0.push({ s: 0, d: Math.random() < 0.5 ? -1 : 1, sp: v.speed * (0.8 + Math.random() * 0.4) });
                }
              }
              for (let i = P0.length - 1; i >= 0; i--) {
                const p = P0[i];
                p.s += p.sp * dt;
                if (p.s > L) {
                  P0.splice(i, 1);
                  continue;
                }
                const a = 1 - p.s / L;
                for (let j = 0; j < 8; j++) {
                  const s = p.s - j * 2.2;
                  if (s < 0) break;
                  const [x, y] = pos(s, p.d);
                  g.fillStyle = `rgba(150,200,255,${a * (1 - j / 8) * 0.6})`;
                  g.beginPath();
                  g.arc(x, y, 1.6, 0, TAU);
                  g.fill();
                }
              }
              if (rm) {
                g.strokeStyle = "rgba(150,200,255,.5)";
                g.lineWidth = 1.5;
                for (const d of [-1, 1]) {
                  g.beginPath();
                  for (let s = 0; s <= 80; s += 4) {
                    const [x, y] = pos(s, d);
                    s ? g.lineTo(x, y) : g.moveTo(x, y);
                  }
                  g.stroke();
                }
              }
              g.globalCompositeOperation = "source-over";
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
