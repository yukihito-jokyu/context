<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>リビール（Reveal） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-reveal" style="position: relative; width: 220px; height: 130px">
        <span
          class="sb-hero sb-hero--tall sb-grad-hero ac-reveal-h"
          style="display: block; width: 220px; height: 130px"
        ></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-reveal .ac-reveal-h {
        animation: ac-reveal-in var(--dur, 600ms) cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      @keyframes ac-reveal-in {
        from {
          clip-path: inset(0 100% 0 0 round 20px);
        }
        to {
          clip-path: inset(0 0 0 0 round 20px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-reveal-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "reveal",
        name: "リビール",
        en: "Reveal",
        cat: "登場・退出",
        kind: "motion",
        description:
          "要素の見える範囲を少しずつ広げて、隠れていた中身を覆いを外すように見せる動きです。clip-path やマスクで切り抜く範囲を動かします。",
        use: "ヒーロー画像、見出し、写真の登場、セクションの切り替え。",
        params: [{ key: "dur", label: "時間", value: 600, min: 200, max: 1500, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          [
            "動き",
            "<code>clip-path: inset(0 100% 0 0) → inset(0 0 0 0)</code>（左から右へ）｜in-out <code>cubic-bezier(0.65, 0, 0.35, 1)</code>",
          ],
          ["方向", "読む方向（左から右、上から下）に合わせる"],
          ["動きを減らす設定", "切り抜きの動きをやめ、透明度の切り替えだけにする"],
          ["出典", "Animation Vocabulary（Entrances & Exits）"],
        ],
        loop: 2200,
      });
    </script>
  </body>
</html>
