<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>非対称イージング（Asymmetric easing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-asymmetric-easing"
        style="
          position: relative;
          width: 200px;
          height: 160px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          gap: 10px;
        "
      >
        <div class="ac-asymmetric-easing-g">
          <svg viewBox="0 0 80 80" width="80" height="80" style="overflow: visible">
            <path d="M0,80 L80,80 M0,80 L0,0" stroke="var(--bar)" stroke-width="2" fill="none" />
            <path d="M0,80 L80,0" stroke="var(--bar)" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
            <path
              class="ac-asymmetric-easing-curve"
              d="M0,80 C40.0,80.0 0.0,0.0 80,0"
              stroke="var(--cobalt)"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            /></svg
          ><span class="ac-asymmetric-easing-dx"><span class="ac-asymmetric-easing-dy"></span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="position: relative; width: 200px; height: 32px">
            <span
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 15px;
                height: 2px;
                border-radius: 2px;
                background: var(--bar);
              "
            ></span
            ><span
              class="sb-thumb sb-grad-aqua ac-asymmetric-easing-t ac-asymmetric-easing-sym"
              style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
            ></span>
          </div>
          <div style="position: relative; width: 200px; height: 32px">
            <span
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 15px;
                height: 2px;
                border-radius: 2px;
                background: var(--bar);
              "
            ></span
            ><span
              class="sb-thumb sb-grad-sky ac-asymmetric-easing-t"
              style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
            ></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-asymmetric-easing .ac-asymmetric-easing-g {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .ac-asymmetric-easing .ac-asymmetric-easing-dx {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 10px;
        height: 80px;
        margin-left: -5px;
        animation: ac-asymmetric-easing-x var(--dur, 1000ms) linear both;
      }
      .ac-asymmetric-easing .ac-asymmetric-easing-dy {
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px #fff;
        animation: ac-asymmetric-easing-y var(--dur, 1000ms) cubic-bezier(0.5, 0, 0, 1) both;
      }
      .ac-asymmetric-easing .ac-asymmetric-easing-t {
        animation: ac-asymmetric-easing-m var(--dur, 1000ms) cubic-bezier(0.5, 0, 0, 1) both;
      }
      @keyframes ac-asymmetric-easing-x {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(80px);
        }
      }
      @keyframes ac-asymmetric-easing-y {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-80px);
        }
      }
      @keyframes ac-asymmetric-easing-m {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(168px);
        }
      }
      @keyframes ac-asymmetric-easing-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-asymmetric-easing .ac-asymmetric-easing-dx {
          transform: translateX(80px);
          animation-name: none;
        }
        .ac-asymmetric-easing .ac-asymmetric-easing-dy {
          transform: translateY(-80px);
          animation-name: ac-asymmetric-easing-fade;
        }
        .ac-asymmetric-easing .ac-asymmetric-easing-t {
          transform: translateX(168px);
          animation-name: ac-asymmetric-easing-fade;
        }
      }
      .ac-asymmetric-easing .ac-asymmetric-easing-sym {
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "asymmetric-easing",
        name: "非対称イージング",
        en: "Asymmetric easing",
        cat: "イージング",
        kind: "concept",
        description:
          "加速と減速の速さを左右で変えた速度変化です。上は左右対称の ease-in-out、下は「すっと動き出して、長く減速する」非対称の曲線。非対称のほうが、生き物のような自然さが出ます。",
        use: "画面内の移動、カードの展開、ブランドらしい動きの質感づくり。",
        params: [{ key: "dur", label: "時間", value: 1000, min: 200, max: 2000, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["上（対称）", "<code>cubic-bezier(0.65, 0, 0.35, 1)</code>"],
          ["下（非対称）", "<code>cubic-bezier(0.5, 0, 0, 1)</code>"],
          ["グラフ", "非対称の曲線。横が時間、縦が進み具合"],
          ["動きを減らす設定", "終点に固定し、透明度だけを変える"],
          ["出典", "Animation Vocabulary（Easing）"],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
