<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>五次（Quint）（Quintic easing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-quint-easing"
        style="
          position: relative;
          width: 200px;
          height: 150px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        "
      >
        <div class="ac-quint-easing-g">
          <svg viewBox="0 0 80 80" width="80" height="80" style="overflow: visible">
            <path d="M0,80 L80,80 M0,80 L0,0" stroke="var(--bar)" stroke-width="2" fill="none" />
            <path d="M0,80 L80,0" stroke="var(--bar)" stroke-width="1.5" stroke-dasharray="3 4" fill="none" />
            <path
              class="ac-quint-easing-curve"
              d="M0,80 C17.6,0.0 28.8,0.0 80,0"
              stroke="var(--cobalt)"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            /></svg
          ><span class="ac-quint-easing-dx"><span class="ac-quint-easing-dy"></span></span>
        </div>
        <div style="position: relative; width: 200px; height: 32px">
          <span
            style="
              position: absolute;
              left: 0;
              right: 0;
              top: 15px;
              height: 2px;
              border-radius: 2px;
              background: var(--bar);
            "
          ></span
          ><span
            class="sb-thumb sb-grad-sky ac-quint-easing-t"
            style="position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 10px"
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-quint-easing .ac-quint-easing-g {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .ac-quint-easing .ac-quint-easing-dx {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 10px;
        height: 80px;
        margin-left: -5px;
        animation: ac-quint-easing-x var(--dur, 1000ms) linear both;
      }
      .ac-quint-easing .ac-quint-easing-dy {
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px #fff;
        animation: ac-quint-easing-y var(--dur, 1000ms) cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .ac-quint-easing .ac-quint-easing-t {
        animation: ac-quint-easing-m var(--dur, 1000ms) cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes ac-quint-easing-x {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(80px);
        }
      }
      @keyframes ac-quint-easing-y {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-80px);
        }
      }
      @keyframes ac-quint-easing-m {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(168px);
        }
      }
      @keyframes ac-quint-easing-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-quint-easing .ac-quint-easing-dx {
          transform: translateX(80px);
          animation-name: none;
        }
        .ac-quint-easing .ac-quint-easing-dy {
          transform: translateY(-80px);
          animation-name: ac-quint-easing-fade;
        }
        .ac-quint-easing .ac-quint-easing-t {
          transform: translateX(168px);
          animation-name: ac-quint-easing-fade;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "quint-easing",
        name: "五次（Quint）",
        en: "Quintic easing",
        cat: "イージング",
        kind: "concept",
        description:
          "五次関数（t⁵）で作る曲線です。ほとんどの移動を最初の短い時間で終え、残りをゆっくり止まる時間に使います。Soft Blue の out はこの曲線です。",
        use: "要素の登場、ポップオーバー、トースト、スクロールで現れる要素。",
        params: [{ key: "dur", label: "時間", value: 1000, min: 200, max: 2000, step: 50, unit: "ms" }],
        total: (p) => p["dur"],
        spec: [
          ["out（このデモ）", "<code>cubic-bezier(0.22, 1, 0.36, 1)</code>"],
          ["in", "<code>cubic-bezier(0.64, 0, 0.78, 0)</code>"],
          ["in-out", "<code>cubic-bezier(0.83, 0, 0.17, 1)</code>"],
          ["印象", "速い・軽快・現代的。UI の登場に向く"],
          ["グラフ", "横が時間、縦が進み具合。点線は等速（linear）"],
          ["動きを減らす設定", "終点に固定し、透明度だけを変える"],
          ["出典", '<a href="https://easings.net/" target="_blank" rel="noopener">Easings.net</a>'],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
