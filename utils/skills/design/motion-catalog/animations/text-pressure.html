<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>押し広がる文字（Text pressure） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-text-pressure" style="position: relative; width: 230px; height: 140px">
        <div
          class="ac-text-pressure-w"
          style="
            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: 0.02em;
            font-size: 30px;
            line-height: 39px;
          "
          aria-hidden="true"
        >
          <span class="ac-text-pressure-ch" style="--i: 0" aria-hidden="true">P</span
          ><span class="ac-text-pressure-ch" style="--i: 1" aria-hidden="true">R</span
          ><span class="ac-text-pressure-ch" style="--i: 2" aria-hidden="true">E</span
          ><span class="ac-text-pressure-ch" style="--i: 3" aria-hidden="true">S</span
          ><span class="ac-text-pressure-ch" style="--i: 4" aria-hidden="true">S</span
          ><span class="ac-text-pressure-ch" style="--i: 5" aria-hidden="true">U</span
          ><span class="ac-text-pressure-ch" style="--i: 6" aria-hidden="true">R</span
          ><span class="ac-text-pressure-ch" style="--i: 7" aria-hidden="true">E</span>
        </div>
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
          "
          >PRESSURE</span
        ><span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-text-pressure .ac-text-pressure-w {
        position: absolute;
        left: 0;
        right: 0;
        top: 50px;
        display: flex;
        justify-content: center;
      }
      .ac-text-pressure .ac-text-pressure-ch {
        display: inline-block;
        transform-origin: 50% 100%;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "text-pressure",
        name: "押し広がる文字",
        en: "Text pressure",
        cat: "文字",
        kind: "motion",
        description:
          "ポインターが近づいた文字ほど背が高く太くなり、離れた文字は細く縮む表現です。ポインターの動きに合わせて圧力の波が文字の列を伝わるように見えます。",
        use: "ヒーローの大見出し、ポートフォリオのタイトル、タイポグラフィが主役のページ、ブランドサイト。",
        params: [
          { key: "range", label: "影響する距離", value: 70, min: 30, max: 140, step: 5, unit: "px" },
          { key: "max", label: "最大の伸び", value: 1.6, min: 1.1, max: 2.2, step: 0.05, unit: "" },
        ],
        spec: [
          ["計算", "各文字の中心からポインターまでの距離 d で、強さ <code>f = max(0, 1 - d / 影響する距離)</code>"],
          [
            "変形",
            "<code>scaleY(1 + (最大 - 1) × f)</code>、太さを f に合わせて上げる（可変フォントの <code>wght</code> 軸なら連続的に変えられる）",
          ],
          ["なめらかさ", "値は毎フレーム少しずつ追いかける（lerp 0.2 前後）"],
          ["動きを減らす設定", "変形をやめ、ポインターに近い文字の色だけを変える"],
          [
            "出典",
            '<a href="https://reactbits.dev/text-animations/text-pressure" target="_blank" rel="noopener">React Bits: Text Pressure</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cs = [...stage.querySelectorAll(".ac-text-pressure-ch")],
              root = stage.firstElementChild,
              k = cs.map(() => 0);
            cur.style.transition = "none";
            show(1);
            return raf((t) => {
              const b = root.getBoundingClientRect(),
                rs = cs.map((c) => c.getBoundingClientRect()),
                px = 115 + 100 * Math.sin(t * 0.9),
                py = 70; // 先にまとめて測り、そのあとで書き込む
              cur.style.transform = `translate(${px}px, ${py + 26}px)`;
              cs.forEach((c, i) => {
                const r = rs[i],
                  d = Math.abs(r.left - b.left + r.width / 2 - px),
                  f = Math.max(0, 1 - d / v.range);
                k[i] += (f - k[i]) * 0.2;
                c.style.transform = rm ? "" : `scaleY(${1 + (v.max - 1) * k[i]}) scaleX(${1 - 0.15 * k[i]})`;
                c.style.fontWeight = rm ? 500 : k[i] > 0.4 ? 800 : k[i] > 0.15 ? 700 : 500;
                c.style.color = k[i] > 0.3 ? "var(--blue)" : "";
              });
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
