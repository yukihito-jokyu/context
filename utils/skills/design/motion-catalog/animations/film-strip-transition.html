<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>フィルムストリップ（Film strip transition） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-film-strip-transition"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--navy);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-film-strip-transition-st">
          <i
            style="
              background:
                radial-gradient(circle at 72% 30%, #fff 0 12px, transparent 13px),
                radial-gradient(ellipse at 25% 115%, var(--cobalt) 0 46%, transparent 47%),
                radial-gradient(ellipse at 85% 120%, var(--navy) 0 50%, transparent 51%),
                linear-gradient(160deg, var(--ice), var(--sky));
            "
          ></i
          ><i
            style="
              background:
                radial-gradient(circle at 30% 32%, #eaf2ff 0 11px, transparent 12px),
                radial-gradient(circle at 62% 22%, #fff 0 1.5px, transparent 2px),
                radial-gradient(circle at 82% 40%, #fff 0 1.5px, transparent 2px),
                radial-gradient(ellipse at 70% 118%, #0f2563 0 52%, transparent 53%),
                linear-gradient(200deg, #2a3f8f, var(--navy));
            "
          ></i>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-film-strip-transition .ac-film-strip-transition-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-film-strip-transition .ac-film-strip-transition-st {
        position: absolute;
        left: 0;
        top: 0;
        height: 150px;
        width: 480px;
        display: flex;
        gap: 40px;
        padding: 0;
        transform-origin: 110px 75px;
        animation: ac-film-strip-transition-t var(--dur, 2600ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
      }
      .ac-film-strip-transition .ac-film-strip-transition-st::before,
      .ac-film-strip-transition .ac-film-strip-transition-st::after {
        content: "";
        position: absolute;
        left: -60px;
        right: -60px;
        height: 34px;
        background:
          repeating-linear-gradient(90deg, transparent 0 8px, rgba(255, 255, 255, 0.9) 8px 18px, transparent 18px 26px)
            center / auto 12px no-repeat,
          #0b1430;
      }
      .ac-film-strip-transition .ac-film-strip-transition-st::before {
        top: -40px;
      }
      .ac-film-strip-transition .ac-film-strip-transition-st::after {
        bottom: -40px;
      }
      .ac-film-strip-transition .ac-film-strip-transition-st i {
        flex: none;
        width: 220px;
        height: 150px;
      }
      @keyframes ac-film-strip-transition-t {
        0%,
        15% {
          transform: scale(1);
        }
        35% {
          transform: scale(0.5);
        }
        65% {
          transform: translateX(-260px) scale(0.5);
          transform-origin: 370px 75px;
        }
        85%,
        100% {
          transform: translateX(-260px) scale(1);
          transform-origin: 370px 75px;
        }
      }
      @keyframes ac-film-strip-transition-cut {
        0% {
          transform: none;
        }
        50%,
        100% {
          transform: translateX(-260px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-film-strip-transition .ac-film-strip-transition-st {
          animation-name: ac-film-strip-transition-cut;
          animation-timing-function: step-end;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "film-strip-transition",
        name: "フィルムストリップ",
        en: "Film strip transition",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "前のショットが小さく引いて、フィルムの1コマとして見えたあと、フィルムが横に送られて次のコマ（次のショット）になり、また大きく戻る切り替えです。映像らしさや、思い出をめくる感じを出せます。",
        use: "動画作品の紹介、思い出・アルバムの画面、作品ギャラリー、プロジェクトの事例紹介。",
        params: [{ key: "dur", label: "片道の長さ", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "コマを横に並べた帯（上下に送り穴）を作り、<code>scale(1 → 0.55)</code> → <code>translateX(−1コマ)</code> → <code>scale(1)</code> を順に",
          ],
          ["送り穴", "<code>repeating-linear-gradient</code> で白い四角を並べる"],
          ["時間", "引く・送る・戻すを 3 等分。送りは in-out"],
          ["動きを減らす設定", "引きと送りの動きをやめ、カットにする"],
          [
            "出典",
            '<a href="https://docs.imaster.org/davinci-resolve-21-manual/part-7-editing-effects-and-transitions/ch.-55-using-transitions" target="_blank" rel="noopener">DaVinci Resolve 21 リファレンスマニュアル（写し）: Using Transitions</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
