<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>かじって進むローダー（Arcade (chomping) loader） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-arcade-loader"
        style="position: relative; width: 200px; height: 130px; display: grid; place-items: center"
      >
        <div style="position: relative; display: flex; align-items: center; width: 130px">
          <span class="ac-arcade-loader-m"></span><span class="ac-arcade-loader-dots"><i></i><i></i><i></i></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-arcade-loader .ac-arcade-loader-m {
        position: relative;
        z-index: 1;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--blue);
        clip-path: polygon(50% 50%, 100% 10%, 100% 0, 0 0, 0 100%, 100% 100%, 100% 90%);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-arcade-loader .ac-arcade-loader-m {
          animation: ac-arcade-loader-chomp calc(var(--dur, 800ms) / 2) cubic-bezier(0.65, 0, 0.35, 1) infinite
            alternate;
        }
      }
      @keyframes ac-arcade-loader-chomp {
        from {
          clip-path: polygon(50% 50%, 100% 5%, 100% 0, 0 0, 0 100%, 100% 100%, 100% 95%);
        }
        to {
          clip-path: polygon(50% 50%, 100% 50%, 100% 0, 0 0, 0 100%, 100% 100%, 100% 50%);
        }
      }
      .ac-arcade-loader .ac-arcade-loader-dots {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 90px;
        height: 8px;
        margin: -4px 0 0 0;
        overflow: hidden;
      }
      .ac-arcade-loader .ac-arcade-loader-dots i {
        position: absolute;
        left: 0;
        top: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sky);
        transform: translateX(90px);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-arcade-loader .ac-arcade-loader-dots i {
          animation: ac-arcade-loader-eat var(--dur, 800ms) linear infinite;
        }
      }
      .ac-arcade-loader .ac-arcade-loader-dots i:nth-child(2) {
        animation-delay: calc(var(--dur, 800ms) / -3);
      }
      .ac-arcade-loader .ac-arcade-loader-dots i:nth-child(3) {
        animation-delay: calc(var(--dur, 800ms) * -2 / 3);
      }
      @keyframes ac-arcade-loader-eat {
        from {
          transform: translateX(90px);
        }
        to {
          transform: translateX(-10px);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "arcade-loader",
        name: "かじって進むローダー",
        en: "Arcade (chomping) loader",
        cat: "読み込み・進捗",
        kind: "motion",
        description:
          "口を開け閉めする丸い形が、流れてくる点を次々に食べていくローダーです。レトロなゲームのような遊び心があり、待ち時間を少し楽しくします。",
        use: "ボタン・カード・画面の読み込み中、待ち時間の短い処理。",
        params: [{ key: "dur", label: "周期", value: 800, min: 300, max: 4000, step: 50, unit: "ms" }],
        spec: [
          ["口", "<code>clip-path: polygon()</code> の切り欠き（同じ頂点数）を開く ↔ 閉じるで往復｜in-out"],
          ["点", "点を右から口へ向かって <code>linear</code> で流し、周期の 1/3 ずつずらす。口の位置で隠れる"],
          [
            "使いどころ",
            "1秒以上かかりそうなときに出す。すぐ終わる処理では出さない（ちらつく）。数秒以上なら進捗の分かる表示を使う",
          ],
          [
            "動きを減らす設定",
            "回転や移動をやめ、ゆっくりした透明度の明滅（または静止した「読み込み中」の表示）にする",
          ],
          ["出典", '<a href="https://css-loaders.com/" target="_blank" rel="noopener">CSS Loaders</a>'],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
