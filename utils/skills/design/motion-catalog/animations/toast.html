<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>トースト（Toast） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-toast" style="position: relative; width: 240px; height: 160px">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px">
          <span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 150px"></span
          ><span class="sb-bar sb-bar--sm" style="width: 190px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--soft" style="width: 120px"></span>
        </div>
        <div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center">
          <div class="sb-toast ac-toast-t" role="status" style="height: 44px; padding: 0 18px 0 6px">
            <span class="sb-toast-icon" style="width: 32px; height: 32px"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" /></svg></span
            ><span class="sb-bar sb-bar--sm sb-bar--on-dark" style="width: 90px"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-toast .ac-toast-t {
        animation:
          ac-toast-in var(--in-dur, 260ms) cubic-bezier(0.22, 1, 0.36, 1) both,
          ac-toast-out var(--out-dur, 260ms) cubic-bezier(0.55, 0, 1, 0.45)
            calc(var(--in-dur, 260ms) + var(--linger, 2500ms)) forwards;
      }
      .ac-toast .ac-toast-t:is(:hover, :focus-within) {
        animation-play-state: paused;
      }
      @keyframes ac-toast-in {
        from {
          opacity: 0;
          transform: translateY(var(--rise, 16px));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ac-toast-out {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: translateY(var(--rise, 16px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes ac-toast-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        @keyframes ac-toast-out {
          from {
            opacity: 1;
          }
          to {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "toast",
        name: "トースト",
        en: "Toast",
        cat: "Soft Blue の部品",
        kind: "motion",
        description:
          "操作の結果を、画面の下から短い通知として浮かび上がらせる動きです。下から少し浮き上がって現れ、しばらく見せたあと、沈むように消えます。作業を邪魔せずに結果だけを伝えます。",
        use: "保存・コピー・削除などの結果通知、取り消しの案内。",
        params: [
          { key: "rise", label: "浮き上がる距離", value: 16, min: 8, max: 32, step: 2, unit: "px" },
          { key: "in-dur", label: "現れる時間", value: 260, min: 100, max: 600, step: 10, unit: "ms" },
          { key: "linger", label: "見せておく時間", value: 2500, min: 1000, max: 5000, step: 100, unit: "ms" },
          { key: "out-dur", label: "消える時間", value: 260, min: 100, max: 600, step: 10, unit: "ms" },
        ],
        total: (p) => p["in-dur"] + p["linger"] + p["out-dur"],
        spec: [
          [
            "現れる",
            "<code>translateY(浮き上がる距離) → 0</code> と <code>opacity 0 → 1</code>｜out <code>cubic-bezier(0.22, 1, 0.36, 1)</code>",
          ],
          [
            "消える",
            "見せておく時間のあと <code>translateY(0 → 浮き上がる距離)</code> と <code>opacity 1 → 0</code>｜in <code>cubic-bezier(0.55, 0, 1, 0.45)</code>｜フォーカス中は待ち、終わったら要素を外す",
          ],
          ["位置", 'スマホは下中央、PC は右下。空の <code>role="status"</code> を先に置き、文だけ入れる'],
          ["動きを減らす設定", "移動をやめ、透明度の切り替えだけにする"],
          ["出典", "Soft Blue「モーション」のトースト"],
        ],
        loop: 3800,
      });
    </script>
  </body>
</html>
