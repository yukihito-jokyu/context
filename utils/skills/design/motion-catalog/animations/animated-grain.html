<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>動く粒状ノイズ（Animated grain） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-animated-grain"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <span class="sb-grad-hero" style="position: absolute; inset: 0"></span
        ><canvas
          width="110"
          height="75"
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 220px;
            height: 150px;
            mix-blend-mode: overlay;
            opacity: 0.9;
            image-rendering: pixelated;
          "
        ></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "animated-grain",
        name: "動く粒状ノイズ",
        en: "Animated grain",
        cat: "背景",
        kind: "motion",
        description:
          "画面全体に細かな粒のノイズを重ね、その粒を毎コマ入れ替えて、フィルムや古い映像のようなざらつきを出す背景です。平らなグラデーションに、空気感と質感が加わります。",
        use: "写真・映像系のヒーロー、エディトリアルなデザイン、ブランドの世界観を出す背景。",
        params: [
          { key: "amt", label: "粒の強さ", value: 0.5, min: 0.1, max: 1, step: 0.05, unit: "" },
          { key: "fps", label: "1秒あたりの入れ替え", value: 18, min: 6, max: 30, step: 1, unit: "" },
        ],
        spec: [
          [
            "仕組み",
            "小さな canvas（画面の 1/2–1/4）にランダムな明暗の点を描き、引き伸ばして重ねる（<code>mix-blend-mode: overlay</code> など）。毎コマ（12–24回/秒）描き直す",
          ],
          [
            "軽く",
            "あらかじめ数枚のノイズ画像を作って切り替えるか、SVG の <code>feTurbulence</code> の <code>seed</code> を変える",
          ],
          [
            "控えめに",
            "背景は主役ではない。コントラストと速さを抑え、前景の文字が読めることを優先する。画面外・非表示のときは止める",
          ],
          ["動きを減らす設定", "背景の動きを止め、1コマの静止画にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/animations/noise" target="_blank" rel="noopener">React Bits: Noise</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              g = cv.getContext("2d"),
              img = g.createImageData(110, 75);
            const draw = () => {
              for (let i = 0; i < img.data.length; i += 4) {
                const n = Math.random() * 255;
                img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
                img.data[i + 3] = 255 * v.amt;
              }
              g.putImageData(img, 0, 0);
            };
            draw();
            if (rm) return null;
            const iv = setInterval(draw, 1000 / v.fps);
            return () => clearInterval(iv);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
