<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>傾け（スキュー）（Skew） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-skew" style="position: relative; width: 220px; height: 150px; display: grid; place-items: center">
        <div
          class="sb-card ac-skew-t"
          style="width: 130px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 40px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 71px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 45px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      @media (prefers-reduced-motion: no-preference) {
        .ac-skew .ac-skew-t {
          animation: ac-skew-m var(--dur, 500ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-skew-m {
        to {
          transform: skewX(calc(var(--angle, 12deg) * -1));
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "skew",
        name: "傾け（スキュー）",
        en: "Skew",
        cat: "移動・変形",
        kind: "motion",
        description:
          "要素を X軸や Y軸の方向に斜めに傾け、長方形を平行四辺形のようにゆがめる動きです。勢いやスピード感を出したいときに、少しだけ使います。",
        use: "素早い移動の勢い、テキストの演出、遊びのあるホバー。",
        params: [
          { key: "angle", label: "傾ける角度", value: 12, min: 2, max: 40, step: 1, unit: "deg" },
          { key: "dur", label: "片道の時間", value: 500, min: 150, max: 1500, step: 50, unit: "ms" },
        ],
        spec: [
          [
            "動き",
            "<code>skewX(0 ↔ -角度)</code>｜in-out <code>cubic-bezier(0.65, 0, 0.35, 1)</code>｜<code>alternate</code> で往復",
          ],
          ["目安", "UI では 5–15deg まで。大きいと読みにくい"],
          ["動きを減らす設定", "傾けをやめる"],
          ["出典", "Animation Vocabulary（Movement & Transforms）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
