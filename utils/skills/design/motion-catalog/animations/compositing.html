<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>コンポジット（Compositing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-compositing"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div class="ac-compositing-stack">
          <span class="ac-compositing-layer" style="--z: 0"></span
          ><span class="ac-compositing-layer" style="--z: 1; background: var(--blue-soft)"></span
          ><span class="ac-compositing-layer ac-compositing-top" style="--z: 2"
            ><span class="sb-thumb sb-grad-sky" style="width: 40px; height: 40px; border-radius: 12px"></span
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-compositing .ac-compositing-stack {
        position: relative;
        width: 110px;
        height: 110px;
        transform: rotateX(58deg) rotateZ(-40deg);
        transform-style: preserve-3d;
      }
      .ac-compositing .ac-compositing-layer {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        background: var(--surface);
        box-shadow:
          0 0 0 1.5px var(--line),
          var(--shadow-card);
        transform: translateZ(calc(var(--z) * 26px));
        display: grid;
        place-items: center;
      }
      .ac-compositing .ac-compositing-top {
        background: rgba(255, 255, 255, 0.5);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-compositing .ac-compositing-top > span {
          animation: ac-compositing-m 1400ms cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-compositing-m {
        from {
          transform: translate(-26px, -26px);
        }
        to {
          transform: translate(26px, 26px);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "compositing",
        name: "コンポジット",
        en: "Compositing",
        cat: "パフォーマンス",
        kind: "concept",
        description:
          "動く要素を独立した層（レイヤー）に分け、GPU がその層だけを動かしたり薄くしたりする仕組みです。図は画面を層に分けて横から見たもので、いちばん上の層だけが動き、下の層は描き直されません。",
        use: "なめらかな動きの土台。何を動かすと軽いのかを判断するときの考え方。",
        params: [],
        spec: [
          ["層だけで済むもの", "<code>transform</code>、<code>opacity</code>（ほかに <code>filter</code> の一部）"],
          [
            "済まないもの",
            "<code>width</code>・<code>height</code>・<code>top</code>・<code>left</code> はレイアウトから、<code>background</code>・<code>box-shadow</code> は描き直しから",
          ],
          ["確かめる", "DevTools の Layers パネル、Rendering の Layer borders"],
          ["動きを減らす設定", "最上層の四角を中央に静止"],
          ["出典", "Animation Vocabulary（Performance）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
