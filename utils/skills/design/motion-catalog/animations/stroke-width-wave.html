<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>線の太さが波打つ（Travelling stroke-width wave） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-stroke-width-wave"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "stroke-width-wave",
        name: "線の太さが波打つ",
        en: "Travelling stroke-width wave",
        cat: "スクロール",
        kind: "motion",
        description:
          "線の形（中心の通り道）はそのままで、太い所と細い所が交互に、線に沿って流れていく動きです。線の中を何かが脈打って運ばれていくように見えます。",
        use: "ケーブルや血管・エネルギーの流れの表現、ロゴの線の演出、データの流れ、手描き風の線の装飾。",
        params: [{ key: "amp", label: "太さの振れ幅", value: 5, min: 0, max: 10, step: 0.5, unit: "px" }],
        spec: [
          [
            "仕組み",
            "線を細かい区間に分け、長さ方向の位置 s ごとに太さを <code>基本 + 振れ幅 × sin(k·s − ω·t)</code> にして描く",
          ],
          ["ツールでは", "After Effects のシェイプの「テーパー」と「波」の設定（Taper・Wave）、Illustrator の可変線幅"],
          [
            "Web では",
            "canvas で区間ごとに <code>lineWidth</code> を変えて描く。SVG なら線の両側の輪郭を計算した <code>path</code> を毎フレーム作る",
          ],
          ["動きを減らす設定", "太さの流れを止め、太さが変わった線の静止画にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/drawing-painting-and-paths/taper-shape-strokes/taper-shape-strokes.html" target="_blank" rel="noopener">helpx.adobe.com（taper-shape-strokes）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const pts = [];
            for (let i = 0; i <= 160; i++) {
              const u = i / 160;
              pts.push([14 + u * 192, 75 + 34 * sin(u * TAU * 1.2) * (0.6 + 0.4 * u)]);
            }
            return raf((t) => {
              const T = rm ? 0 : t;
              g.clearRect(0, 0, W, H);
              g.lineCap = "round";
              g.strokeStyle = col("blue");
              for (let i = 0; i < pts.length - 1; i++) {
                const u = i / 160,
                  w = 3 + v.amp * (0.5 + 0.5 * sin(u * 28 - T * 5));
                g.lineWidth = w;
                g.beginPath();
                g.moveTo(pts[i][0], pts[i][1]);
                g.lineTo(pts[i + 1][0], pts[i + 1][1]);
                g.stroke();
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
