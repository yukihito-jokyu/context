<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ざらつく文字（Fuzzy text） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-fuzzy-text"
        style="position: relative; width: 220px; height: 150px; display: grid; place-items: center"
      >
        <canvas class="ac-fuzzy-text-cv" width="220" height="80" style="width: 220px; height: 80px"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "fuzzy-text",
        name: "ざらつく文字",
        en: "Fuzzy text",
        cat: "文字",
        kind: "motion",
        description:
          "文字の輪郭が、横方向に細かくぶれ続けて、ノイズがかかったように震える表現です。電波の乱れや不安定さ、ざらついた手触りを出せます。",
        use: "ゲーム・ホラー・SF のタイトル、エラーや警告の演出、ストリート系のブランド。",
        params: [{ key: "amount", label: "ぶれの大きさ", value: 4, min: 1, max: 12, step: 1, unit: "px" }],
        spec: [
          [
            "仕組み",
            "文字を一度 canvas（<code>aria-hidden</code>。文字は HTML にも置く）に描き、1–2px の高さの横の帯ごとに、毎フレームばらばらに横へずらして描き直す",
          ],
          ["ホバー", "ホバー中だけぶれを大きくする型が多い"],
          ["別の方法", "SVG の <code>feTurbulence</code> と <code>feDisplacementMap</code> の値を動かす"],
          ["動きを減らす設定", "ぶれを止め、静止した文字にする"],
          [
            "出典",
            '<a href="https://reactbits.dev/text-animations/fuzzy-text" target="_blank" rel="noopener">React Bits: Fuzzy Text</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector(".ac-fuzzy-text-cv"),
              W = 220,
              H = 80,
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            const g = cv.getContext("2d"),
              off = document.createElement("canvas");
            off.width = W * dpr;
            off.height = H * dpr;
            const o = off.getContext("2d");
            o.scale(dpr, dpr);
            o.fillStyle = getComputedStyle(stage).getPropertyValue("--navy").trim() || "#1e3a8a";
            o.font = "800 44px " + (getComputedStyle(stage).getPropertyValue("--font-sans") || "sans-serif");
            o.textAlign = "center";
            o.textBaseline = "middle";
            o.fillText("FUZZY", W / 2, H / 2 + 2);
            const draw = (a) => {
              g.clearRect(0, 0, cv.width, cv.height);
              for (let y = 0; y < cv.height; y += 2 * dpr) {
                const dx = (Math.random() - 0.5) * a * dpr;
                g.drawImage(off, 0, y, cv.width, 2 * dpr, dx, y, cv.width, 2 * dpr);
              }
            };
            if (rm) {
              draw(0);
              return null;
            }
            let last = -1;
            return raf((t) => {
              if (t - last < 1 / 30) return;
              last = t;
              draw(v.amount * (0.6 + 0.4 * Math.sin(t * 2)));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
