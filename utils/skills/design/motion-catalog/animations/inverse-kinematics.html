<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IK（インバースキネマティクス）（Inverse kinematics (IK)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-inverse-kinematics"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas
        ><span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "inverse-kinematics",
        name: "IK（インバースキネマティクス）",
        en: "Inverse kinematics (IK)",
        cat: "キャラクター",
        kind: "motion",
        description:
          "手や足の「先端をどこに置くか」を先に決め、そこに届くように肩や肘の角度を自動で計算する動かし方です。足を地面に固定したまま体を動かす、手で物をつかむ、といった動きを簡単に正確に作れます。",
        use: "キャラクターの足を地面に着ける、手で物をつかむ・指さす、ゲームの照準、ロボットアームのデモ、カーソルへ手を伸ばすマスコット。",
        params: [],
        spec: [
          [
            "2本の骨",
            "根元から目標までの距離 d と骨の長さ a・b から、余弦定理で根元の角 θ（目標方向からのずれ）を求める：<code>cos θ = (a² + d² − b²) / (2ad)</code>",
          ],
          ["曲がる向き", "肘や膝が曲がる向きは、ポールベクター（曲げたい方向の目印）で決める"],
          ["届かないとき", "距離が a + b を超えたら、目標へ向けてまっすぐ伸ばす（3本以上は FABRIK などの反復計算）"],
          ["動きを減らす設定", "目標の動きを止め、腕を目標に届かせたポーズにする"],
          [
            "出典",
            '<a href="https://esotericsoftware.com/spine-in-depth" target="_blank" rel="noopener">Spine: In Depth（Features）</a>、<a href="https://esotericsoftware.com/spine-demos" target="_blank" rel="noopener">Spine Demos</a>、<a href="https://rive.app/features" target="_blank" rel="noopener">Rive Features</a>、<a href="https://animatorschecklist.com/en/glossary/" target="_blank" rel="noopener">The Animator\'s Checklist: Glossary</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const mkway =
              (pts, seg, hold = 0.3) =>
              (t) => {
                const n = pts.length,
                  k = (t % (n * seg)) / seg,
                  i = Math.floor(k),
                  f0 = k - i,
                  f = Math.max(0, (f0 - hold) / (1 - hold)),
                  e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2,
                  a = pts[i],
                  b = pts[(i + 1) % n];
                return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
              };
            const loop8 = (t, cx = 110, cy = 75, rx = 85, ry = 45) => [
              cx + rx * Math.sin(t * 0.9),
              cy + ry * Math.sin(t * 1.7),
            ];
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };

            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            return raf((t) => {
              const [tx, ty] = rm ? [130, 60] : loop8(t * 0.9, 120, 72, 80, 50);
              cur.style.transform = `translate(${tx}px, ${ty}px)`;
              show(1);
              g.clearRect(0, 0, W, H);
              const r = [50, 96],
                A = 52,
                B = 46;
              g.strokeStyle = col("ice");
              g.lineWidth = 1.5;
              g.setLineDash([4, 4]);
              g.beginPath();
              g.arc(r[0], r[1], A + B, 0, TAU);
              g.stroke();
              g.setLineDash([]);
              const [ex, ey, hx, hy] = ik2(r[0], r[1], tx, ty, A, B, 1);
              g.strokeStyle = col("sky");
              g.lineWidth = 1.5;
              g.beginPath();
              g.moveTo(ex, ey);
              g.lineTo(ex, ey - 16);
              g.stroke();
              dot(ex, ey - 18, 2.5, col("sky"));
              line([r, [ex, ey]], 12, col("navy"));
              line(
                [
                  [ex, ey],
                  [hx, hy],
                ],
                10,
                col("blue"),
              );
              dot(r[0], r[1], 5, "#fff");
              dot(ex, ey, 4.5, "#fff");
              dot(hx, hy, 6, col("blue"));
              g.strokeStyle = col("blue");
              g.lineWidth = 1.5;
              g.beginPath();
              g.arc(tx, ty, 9, 0, TAU);
              g.stroke();
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
