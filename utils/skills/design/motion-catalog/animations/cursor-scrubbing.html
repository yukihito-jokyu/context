<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ポインターでコマ送り（Cursor scrubbing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-cursor-scrubbing" style="position: relative; width: 220px; height: 150px">
        <div class="sb-check-circle ac-cursor-scrubbing-c" style="position: absolute; left: 82px; top: 16px">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </div>
        <div class="ac-cursor-scrubbing-tl"><span class="ac-cursor-scrubbing-hd"></span></div>
        <span class="ac-cursor" style="left: 0; top: 0; opacity: 0"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-cursor-scrubbing .ac-cursor-scrubbing-tl {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 22px;
        height: 6px;
        border-radius: 3px;
        background: var(--bar-soft);
      }
      .ac-cursor-scrubbing .ac-cursor-scrubbing-hd {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        border-radius: 3px;
        background: var(--blue);
        transform: scaleX(0);
        transform-origin: 0 0;
      }
      .ac-cursor-scrubbing .ac-cursor-scrubbing-c path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "cursor-scrubbing",
        name: "ポインターでコマ送り",
        en: "Cursor scrubbing",
        cat: "順序・タイミング",
        kind: "concept",
        description:
          "ポインターの横の位置を、アニメーションの再生位置に対応させる考え方です。右へ動かすと動きが進み、左へ戻すと巻き戻ります。時間ではなく手の動きで再生するので、触って確かめる楽しさが出ます。",
        use: "商品の360度ビュー、Lottie アイコンのホバー、ビフォー・アフター、説明図の段階表示。",
        params: [{ key: "len", label: "動きの長さ", value: 1000, min: 300, max: 3000, step: 100, unit: "ms" }],
        spec: [
          [
            "対応",
            "再生位置 = <code>(ポインターの x - 左端) / 幅 × 長さ</code>。<code>animation.currentTime</code> に入れる（再生は止めておく）。range の入力でも指定できるように",
          ],
          ["なめらかさ", "ポインターの値をそのまま入れず、少し追いかける（lerp 0.2 前後）とガタつかない"],
          ["このデモ", "丸が弾んで現れ、チェックが描かれる動きをコマ送りしている"],
          ["動きを減らす設定", "コマ送りはそのまま（ユーザーの操作）。弾む拡大と追従の補間は外す"],
          [
            "出典",
            '<a href="https://docs.lottiefiles.com/en/integrations/vscode/05_integrate/generating-interaction-snippets" target="_blank" rel="noopener">LottieFiles: interactions</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const cur = stage.querySelector(".ac-cursor");
            const move = (x, y, ms = 500) => {
              cur.style.transition = `transform ${ms}ms cubic-bezier(0.65, 0, 0.35, 1), opacity 200ms`;
              cur.style.transform = `translate(${x}px, ${y}px)`;
              if (!ms) void cur.offsetWidth;
            };
            const show = (on) => {
              cur.style.opacity = on ? 1 : 0;
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const c = stage.querySelector(".ac-cursor-scrubbing-c"),
              p = c.querySelector("path"),
              hd = stage.querySelector(".ac-cursor-scrubbing-hd");
            const a1 = c.animate(
              [
                { opacity: 0, transform: "scale(.6)" },
                { opacity: 1, transform: "scale(1)", offset: 0.5 },
                { opacity: 1, transform: "scale(1)" },
              ],
              { duration: v.len, fill: "both", easing: rm ? "linear" : "cubic-bezier(0.34, 1.56, 0.64, 1)" },
            );
            const a2 = p.animate(
              [{ strokeDashoffset: 1, offset: 0 }, { strokeDashoffset: 1, offset: 0.5 }, { strokeDashoffset: 0 }],
              { duration: v.len, fill: "both" },
            );
            a1.pause();
            a2.pause();
            let x = 10;
            cur.style.transition = "opacity 200ms";
            show(1);
            const stop = raf((t) => {
              const target = 110 + 100 * Math.sin(t * 0.9 - 1.57);
              x += (target - x) * 0.2;
              cur.style.transform = `translate(${target}px, 100px)`;
              const k = Math.min(1, Math.max(0, (x - 10) / 200));
              a1.currentTime = a2.currentTime = k * v.len;
              hd.style.transform = `scaleX(${k})`;
            });
            return () => {
              stop();
              a1.cancel();
              a2.cancel();
            };
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
