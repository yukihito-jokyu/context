<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>残る痕跡（Permanence (debris that stays)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-permanence"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "permanence",
        name: "残る痕跡",
        en: "Permanence (debris that stays)",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "ゲームで、倒した敵の跡・落ちた薬莢・こげ跡・煙などを、すぐに消さずに画面に残しておく表現です。起きたことの積み重ねが見えるので、自分の行動が世界に影響した手応えが生まれます。",
        use: "シューティングやアクションのゲーム、たくさん操作した跡が残る遊び心のある UI、作業の積み重ねを見せる演出。",
        params: [{ key: "keep", label: "残す数の上限", value: 30, min: 5, max: 80, step: 1, unit: "個" }],
        spec: [
          [
            "残すもの",
            "薬莢（弾を撃つたび横へはじけ、地面で止まる）、こげ跡や血しぶきのような地面の印、ゆっくり薄れる煙",
          ],
          ["上限", "数が増えすぎないよう、古いものから薄くして消す（例：最大 50 個、30 秒）"],
          ["動き", "薬莢は放物線で飛んで 1〜2 回はねて止まる。煙は上へゆっくり広がりながら薄れる"],
          ["動きを減らす設定", "飛び散る動きをやめ、痕跡が少しずつ増えるだけにする"],
          [
            "出典",
            '<a href="https://medienwissenschaft.uni-bayreuth.de/wp-content/uploads/GxD-10-Game-Feel.pdf#page=7" target="_blank" rel="noopener">The Art of Screenshake の解説（Bayreuth 大学）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const shells = [],
              marks = [],
              smoke = [];
            let last = 0,
              next = 0.3,
              cnt = 0;
            return raf((t) => {
              const dt = Math.min(0.05, t - last);
              last = t;
              g.clearRect(0, 0, W, H);
              g.fillStyle = col("ice");
              g.fillRect(0, 120, W, 30);
              if (t > next) {
                next = t + 0.35;
                cnt++;
                shells.push({
                  x: 60,
                  y: 90,
                  vx: -30 - rnd() * 50,
                  vy: -90 - rnd() * 40,
                  r: rnd() * 6,
                  w: (rnd() - 0.5) * 20,
                  rest: false,
                });
                if (cnt % 3 === 0) {
                  marks.push({ x: 120 + rnd() * 90, y: 124 + rnd() * 20, s: 4 + rnd() * 5 });
                  smoke.push({ x: 150 + rnd() * 50, y: 120, t: 0 });
                }
                if (cnt > 40) {
                  shells.length = 0;
                  marks.length = 0;
                  cnt = 0;
                }
              }
              while (shells.length > v.keep) shells.shift();
              marks.forEach((m) => {
                g.fillStyle = "rgba(27,58,138,.28)";
                g.beginPath();
                g.ellipse(m.x, m.y, m.s * 1.6, m.s * 0.6, 0, 0, TAU);
                g.fill();
              });
              for (let i = smoke.length - 1; i >= 0; i--) {
                const s = smoke[i];
                s.t += dt;
                if (s.t > 3) {
                  smoke.splice(i, 1);
                  continue;
                }
                g.globalAlpha = 0.35 * (1 - s.t / 3);
                if (rm) dot(s.x, s.y - 14, 10, col("sky"));
                else dot(s.x + 6 * sin(s.t * 2), s.y - s.t * 18, 6 + s.t * 7, col("sky"));
                g.globalAlpha = 1;
              }
              shells.forEach((s) => {
                if (!s.rest) {
                  if (rm) {
                    s.x += s.vx * 0.4;
                    s.y = 126;
                    s.rest = true;
                  } else {
                    s.vy += 400 * dt;
                    s.x += s.vx * dt;
                    s.y += s.vy * dt;
                    s.r += s.w * dt;
                    if (s.y > 126) {
                      s.y = 126;
                      s.vy *= -0.35;
                      s.vx *= 0.5;
                      s.w *= 0.5;
                      if (Math.abs(s.vy) < 20) s.rest = true;
                    }
                  }
                }
                g.save();
                g.translate(s.x, s.y);
                g.rotate(s.r);
                g.fillStyle = "#e0a93a";
                g.fillRect(-3, -1.5, 6, 3);
                g.restore();
              });
              g.fillStyle = col("navy");
              g.fillRect(40, 84, 44, 12);
              g.fillRect(48, 94, 10, 16);
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
