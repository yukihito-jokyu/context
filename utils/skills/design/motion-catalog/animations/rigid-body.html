<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剛体の物理（Rigid-body physics） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-rigid-body"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "rigid-body",
        name: "剛体の物理",
        en: "Rigid-body physics",
        cat: "移動・変形",
        kind: "motion",
        description:
          "形の変わらない固い物（箱やボール）が、重力で落ち、ぶつかり、はね返り、転がって止まるまでを、物理の計算で動かす方法です。手で付けた動きでは出せない、本物らしい重さとばらつきが出ます。",
        use: "物が落ちてたまる演出（カートに商品が入る、タグが降ってくる）、ゲーム、遊び心のある 404 ページ、データの数を物の数で見せる表現。",
        params: [{ key: "rest", label: "はね返りの強さ", value: 0.45, min: 0, max: 0.9, step: 0.05, unit: "" }],
        spec: [
          [
            "計算",
            "毎フレーム、重力で速さを足し、位置を進め、重なった物どうしを押し離して速さをはね返す（反発係数 0.2〜0.6、摩擦で回転を減らす）",
          ],
          ["回転", "ぶつかった位置と向きから回転の速さも変える。転がるボールは、進んだ距離 ÷ 半径 だけ回す"],
          [
            "本格的に",
            "物理エンジン（Rapier・Ammo.js・Matter.js・Box2D）を使う。three.js の物理の例（<code>physics_*</code>）が参考になる",
          ],
          ["動きを減らす設定", "物理の動きを止め、止まった状態の静止画にする"],
          [
            "出典",
            '<a href="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/files.json" target="_blank" rel="noopener">three.js examples（一覧）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            let bs = [],
              last = 0,
              t0 = -9;
            const reset = () => {
              sd = 7;
              bs = Array.from({ length: 9 }, (_, i) => ({
                x: 40 + rnd() * 140,
                y: -20 - i * 34,
                vx: (rnd() - 0.5) * 60,
                vy: 0,
                r: 10 + rnd() * 8,
                a: 0,
              }));
            };
            const frame = (t) => {
              const dt = Math.min(0.025, t - last);
              last = t;
              if (t - t0 > 5) {
                reset();
                t0 = t;
              }
              g.clearRect(0, 0, W, H);
              g.fillStyle = col("ice");
              g.fillRect(0, 134, W, 16);
              for (let it = 0; it < (rm ? 60 : 2); it++) {
                const h = rm ? 0.03 : dt / 2;
                bs.forEach((b) => {
                  b.vy += 600 * h;
                  b.x += b.vx * h;
                  b.y += b.vy * h;
                  b.a += (b.vx * h) / b.r;
                  if (b.y > 134 - b.r) {
                    b.y = 134 - b.r;
                    b.vy *= -v.rest;
                    b.vx *= 0.96;
                  }
                  if (b.x < b.r) {
                    b.x = b.r;
                    b.vx *= -v.rest;
                  }
                  if (b.x > W - b.r) {
                    b.x = W - b.r;
                    b.vx *= -v.rest;
                  }
                });
                for (let i = 0; i < bs.length; i++)
                  for (let j = i + 1; j < bs.length; j++) {
                    const a = bs[i],
                      b = bs[j],
                      dx = b.x - a.x,
                      dy = b.y - a.y,
                      d = Math.hypot(dx, dy),
                      m = a.r + b.r;
                    if (d < m && d > 0) {
                      const nx = dx / d,
                        ny = dy / d,
                        o = (m - d) / 2;
                      a.x -= nx * o;
                      a.y -= ny * o;
                      b.x += nx * o;
                      b.y += ny * o;
                      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                      if (rv < 0) {
                        const imp = (-(1 + v.rest) * rv) / 2;
                        a.vx -= imp * nx;
                        a.vy -= imp * ny;
                        b.vx += imp * nx;
                        b.vy += imp * ny;
                      }
                    }
                  }
              }
              bs.forEach((b, i) => {
                dot(b.x, b.y, b.r, i % 3 === 0 ? col("blue") : i % 3 === 1 ? col("sky") : col("cobalt"));
                g.strokeStyle = "rgba(255,255,255,.85)";
                g.lineWidth = 2.5;
                g.lineCap = "round";
                g.beginPath();
                g.moveTo(b.x, b.y);
                g.lineTo(b.x + cos(b.a) * b.r * 0.7, b.y + sin(b.a) * b.r * 0.7);
                g.stroke();
              });
            };
            if (rm) {
              for (let i = 0; i < 10; i++) frame(0);
              return null;
            } // 動きを減らす設定：止まった形を一度だけ描く
            return raf(frame);
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
