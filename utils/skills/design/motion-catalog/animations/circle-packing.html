<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>円の詰め込み（Animated circle packing） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-circle-packing"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "circle-packing",
        name: "円の詰め込み",
        en: "Animated circle packing",
        cat: "背景",
        kind: "motion",
        description:
          "空いている場所に小さな円が次々と現れ、まわりの円や枠にぶつかるまでふくらみます。大きな円の隙間を小さな円が埋めていき、画面がだんだん泡のように満たされていきます。",
        use: "ジェネラティブなヒーロー、データの量を表す演出、ポスター風の背景、ローディング。",
        params: [{ key: "rate", label: "1フレームに置く数", value: 2, min: 1, max: 8, step: 1, unit: "個" }],
        spec: [
          [
            "規則",
            "でたらめな点を選び、既存の円の中でなければ半径 1 の円を置く。毎フレーム、どの円にも枠にも触れていない円の半径を少しずつ増やす",
          ],
          [
            "止まる",
            "触れた円は成長を止める。新しい円を置けない回数が続いたら（埋まったら）全体をフェードしてやり直す",
          ],
          ["Web では", "数百個までは canvas で全部の組み合わせを調べてよい。多いときは格子で近くの円だけを調べる"],
          ["動きを減らす設定", "ふくらむ動きをやめ、埋まった状態の静止画にする"],
          [
            "出典",
            '<a href="https://thecodingtrain.com/challenges/50-animated-circle-packing" target="_blank" rel="noopener">thecodingtrain.com（50-animated-circle-packing）</a>、<a href="https://github.com/aljazfrancic/generative-art-gallery" target="_blank" rel="noopener">github.com（generative-art-gallery）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            let cs = [],
              fails = 0,
              fade = 0;
            const free = (x, y, r) =>
              x - r > 2 &&
              x + r < W - 2 &&
              y - r > 2 &&
              y + r < H - 2 &&
              cs.every((c) => Math.hypot(c.x - x, c.y - y) > c.r + r + 1);
            const tick = () => {
              for (let k = 0; k < v.rate; k++) {
                const x = rnd() * W,
                  y = rnd() * H;
                if (free(x, y, 1)) {
                  cs.push({ x, y, r: 1, on: true });
                  fails = 0;
                } else fails++;
              }
              for (const c of cs)
                if (c.on) {
                  c.r += 0.5;
                  if (
                    c.x - c.r < 2 ||
                    c.x + c.r > W - 2 ||
                    c.y - c.r < 2 ||
                    c.y + c.r > H - 2 ||
                    cs.some((o) => o !== c && Math.hypot(o.x - c.x, o.y - c.y) < o.r + c.r + 1)
                  )
                    c.on = false;
                }
            };
            if (rm) {
              for (let i = 0; i < 400; i++) tick();
            }
            return raf(() => {
              if (!rm) {
                if (fails > 400) fade += 0.03;
                if (fade >= 1) {
                  cs = [];
                  fails = 0;
                  fade = 0;
                } else tick();
              }
              g.fillStyle = col("surface");
              g.fillRect(0, 0, W, H);
              g.globalAlpha = 1 - fade;
              for (const c of cs) {
                g.strokeStyle = c.on ? col("blue") : col("sky");
                g.lineWidth = 1.4;
                g.beginPath();
                g.arc(c.x, c.y, c.r, 0, TAU);
                g.stroke();
                if (c.r > 12) dot(c.x, c.y, c.r * 0.35, col("ice"));
              }
              g.globalAlpha = 1;
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
