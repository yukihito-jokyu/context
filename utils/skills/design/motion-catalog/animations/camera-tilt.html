<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ティルト（Tilt） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-camera-tilt"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <div class="ac-camera-tilt-cam">
          <div class="ac-camera-tilt-L ac-camera-tilt-sky"><i></i></div>
          <div class="ac-camera-tilt-L ac-camera-tilt-far"><i></i></div>
          <div class="ac-camera-tilt-L ac-camera-tilt-gr"><i></i></div>
          <div class="ac-camera-tilt-L ac-camera-tilt-mid"><i></i></div>
          <div class="ac-camera-tilt-L ac-camera-tilt-sub"><i></i></div>
          <div class="ac-camera-tilt-L ac-camera-tilt-near"><i></i></div>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-camera-tilt .ac-camera-tilt-cam,
      .ac-camera-tilt .ac-camera-tilt-L {
        position: absolute;
        inset: 0;
      }
      .ac-camera-tilt .ac-camera-tilt-L i {
        position: absolute;
        display: block;
      }
      .ac-camera-tilt .ac-camera-tilt-sky i {
        inset: -150px -160px -30px;
        background:
          radial-gradient(ellipse 26px 10px at 30% 22%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(ellipse 20px 8px at 72% 12%, #fff 97%, transparent) 0 0 / 220px 100% repeat-x,
          radial-gradient(circle at 50% 70%, #fff 0 12px, transparent 13px) 0 0 / 220px 100% repeat-x,
          linear-gradient(180deg, #f2f8ff, var(--ice) 70%, var(--sky));
      }
      .ac-camera-tilt .ac-camera-tilt-far i {
        left: -330px;
        right: -330px;
        bottom: 30px;
        height: 70px;
        background: radial-gradient(ellipse 60px 46px at 50% 100%, #a9d0ff 98%, transparent) 0 100% / 120px 70px
          repeat-x;
      }
      .ac-camera-tilt .ac-camera-tilt-gr i {
        left: -330px;
        right: -330px;
        bottom: -60px;
        height: 96px;
        background: linear-gradient(#b6dcff, #8fc2ff);
      }
      .ac-camera-tilt .ac-camera-tilt-mid i {
        left: -304px;
        right: -356px;
        bottom: 26px;
        height: 64px;
        background:
          radial-gradient(circle 15px at 24px 22px, var(--cobalt) 97%, transparent) 0 0 / 52px 64px repeat-x,
          linear-gradient(90deg, transparent 22px, var(--navy) 22px 26px, transparent 26px) 0 100% / 52px 30px repeat-x;
      }
      .ac-camera-tilt .ac-camera-tilt-sub i {
        left: 100px;
        bottom: 26px;
        width: 20px;
        height: 34px;
        border-radius: 10px 10px 5px 5px;
        background: var(--blue);
      }
      .ac-camera-tilt .ac-camera-tilt-sub i::before {
        content: "";
        position: absolute;
        left: 3px;
        top: -16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
      }
      .ac-camera-tilt .ac-camera-tilt-near i {
        left: -330px;
        right: -330px;
        bottom: -16px;
        height: 46px;
        background: radial-gradient(ellipse 34px 26px at 50% 100%, #0f2563 97%, transparent) 0 100% / 110px 46px
          repeat-x;
      }
      .ac-camera-tilt .ac-camera-tilt-cam {
        transform: translateY(0);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-camera-tilt .ac-camera-tilt-cam {
          animation: ac-camera-tilt-k0 var(--dur, 2400ms) cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
        }
      }
      @keyframes ac-camera-tilt-k0 {
        0%,
        20% {
          transform: translateY(0);
        }
        80%,
        100% {
          transform: translateY(80px);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "camera-tilt",
        name: "ティルト",
        en: "Tilt",
        cat: "カメラ",
        kind: "motion",
        description:
          "カメラの位置は動かさず、向きだけを上下に振る動きです。足元から見上げて大きさや高さを見せたり、空から地面へ視線を下ろして場面を紹介したりできます。",
        use: "縦長のヒーロー画像、建物や商品の高さを見せる紹介、縦長のイラストの見渡し、スクロールに合わせた見上げ。",
        params: [{ key: "dur", label: "片道の時間", value: 2400, min: 800, max: 6000, step: 100, unit: "ms" }],
        spec: [
          ["書き方", "景色全体を <code>translateY</code>｜in-out。手前も奥も同じ量だけ動かす"],
          ["見上げ", "上へ振ると「大きさ・期待」、下へ振ると「着地・紹介」の印象になる"],
          ["速さ", "画面の高さを 2〜4 秒。止めた構図で始めて止めた構図で終える"],
          ["動きを減らす設定", "カメラの動きをやめ、最初（または最後）の構図で止める"],
          [
            "出典",
            '<a href="https://www.studiobinder.com/camera-shots/camera-movements/" target="_blank" rel="noopener">StudioBinder: Camera Movements</a>、<a href="https://www.masterclass.com/articles/guide-to-camera-moves" target="_blank" rel="noopener">MasterClass: Guide to Camera Moves</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
