<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>跳ねて止まる（Tin entrance / exit） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-tin-entrance-exit"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="sb-card ac-tin-entrance-exit-c"
          style="width: 140px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 46px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 77px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 49px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-tin-entrance-exit .ac-tin-entrance-exit-c {
        animation: ac-tin-entrance-exit-in var(--in, 900ms) ease-out both;
      }
      @keyframes ac-tin-entrance-exit-in {
        0% {
          opacity: 0;
          transform: translateY(var(--dist, 120px));
        }
        50%,
        70%,
        90% {
          opacity: 1;
          transform: scale(var(--pulse, 1.1));
        }
        60%,
        80%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes ac-tin-entrance-exit-rf {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-tin-entrance-exit .ac-tin-entrance-exit-c {
          animation: ac-tin-entrance-exit-rf 200ms ease-out both !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "tin-entrance-exit",
        name: "跳ねて止まる",
        en: "Tin entrance / exit",
        cat: "登場・退出",
        kind: "motion",
        description:
          "下から一気に上がってきて、着いたところで小さく3回脈打ってから落ち着く動きです。ブリキのおもちゃのような、カチャカチャとした手触りがあります。",
        use: "ゲームのボタン、ご褒美のバッジ、注意を引きたいお知らせ。",
        params: [
          { key: "in", label: "登場の時間", value: 900, min: 400, max: 2000, step: 50, unit: "ms" },
          { key: "dist", label: "移動の距離", value: 120, min: 40, max: 200, step: 10, unit: "px" },
          { key: "pulse", label: "脈の大きさ", value: 1.1, min: 1, max: 1.3, step: 0.02, unit: "" },
        ],
        total: (p) => p["in"],
        spec: [
          [
            "登場",
            "0%：<code>translateY(移動の距離)</code>、50% / 70% / 90%：<code>scale(脈の大きさ)</code>、60% / 80% / 100%：<code>scale(1)</code>",
          ],
          ["イージング", "各区間 ease-out"],
          ["動きを減らす設定", "移動と脈打ちをやめ、透明度の切り替えだけにする"],
          [
            "出典",
            '<a href="https://www.minimamente.com/project/magic/" target="_blank" rel="noopener">Magic Animations</a>',
          ],
        ],
        loop: 2400,
      });
    </script>
  </body>
</html>
