<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>棒の波ローダー（Bar-wave loader） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-bar-wave-loader"
        style="position: relative; width: 200px; height: 130px; display: grid; place-items: center"
      >
        <div class="ac-bar-wave-loader-w">
          <i style="--k: 0"></i><i style="--k: 1"></i><i style="--k: 2"></i><i style="--k: 3"></i><i style="--k: 4"></i>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-bar-wave-loader .ac-bar-wave-loader-w {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 44px;
      }
      .ac-bar-wave-loader .ac-bar-wave-loader-w i {
        width: 6px;
        height: 100%;
        border-radius: 3px;
        background: var(--blue);
        transform: scaleY(0.4);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-bar-wave-loader .ac-bar-wave-loader-w i {
          animation: ac-bar-wave-loader-s var(--dur, 1200ms) cubic-bezier(0.65, 0, 0.35, 1)
            calc(var(--k) * var(--dur, 1200ms) / 10) infinite;
        }
      }
      @keyframes ac-bar-wave-loader-s {
        0%,
        40%,
        100% {
          transform: scaleY(0.4);
        }
        20% {
          transform: scaleY(1);
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "bar-wave-loader",
        name: "棒の波ローダー",
        en: "Bar-wave loader",
        cat: "読み込み・進捗",
        kind: "motion",
        description:
          "縦に並んだ細い棒が、左から順に背伸びするように伸び縮みし、波が流れていくように見えるローダーです。音楽のイコライザーのようなリズムがあります。",
        use: "音声・音楽の処理中、チャットの応答待ち、ボタンの読み込み中。",
        params: [{ key: "dur", label: "周期", value: 1200, min: 300, max: 4000, step: 50, unit: "ms" }],
        spec: [
          ["動き", "各棒を <code>scaleY(.4 → 1 → .4)</code>（0 / 20 / 40%）｜in-out｜くり返し"],
          ["ずらし", "i 本目を周期の 1/10 × i だけ遅らせる"],
          [
            "使いどころ",
            "1秒以上かかりそうなときに出す。すぐ終わる処理では出さない（ちらつく）。数秒以上なら進捗の分かる表示を使う",
          ],
          [
            "動きを減らす設定",
            "回転や移動をやめ、ゆっくりした透明度の明滅（または静止した「読み込み中」の表示）にする",
          ],
          [
            "出典",
            '<a href="https://raw.githubusercontent.com/tobiasahlin/SpinKit/master/spinkit.css" target="_blank" rel="noopener">SpinKit</a>',
          ],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
