<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FK（フォワードキネマティクス）（Forward kinematics (FK)） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-forward-kinematics"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "forward-kinematics",
        name: "FK（フォワードキネマティクス）",
        en: "Forward kinematics (FK)",
        cat: "キャラクター",
        kind: "motion",
        description:
          "腕や脚のようにつながった骨を、根元（肩）から順に 1 本ずつ回して、先端（手）の位置を決める動かし方です。肩を回すと肘から先が全部ついてくるので、弧を描く大きな振りやしなやかな動きを作りやすい方法です。",
        use: "キャラクターの腕を振る・投げる動き、しっぽや髪の揺れ、ロボットアームのデモ、ゲームのキャラクター。",
        params: [{ key: "lag", label: "関節ごとの遅れ", value: 0.6, min: 0, max: 1.5, step: 0.05, unit: "" }],
        spec: [
          ["仕組み", "子の骨の位置 = 親の骨の先端、子の角度 = 親の角度 + 自分の角度。根元から順に計算する"],
          ["動かし方", "肩 → 肘 → 手首の順に、少しずつ遅らせて回すと、むちのようなしなやかさが出る（重なり合う動き）"],
          ["IK との違い", "FK は角度を決めて先端が結果として決まる。IK は先端の位置を決めて角度を逆算する"],
          ["動きを減らす設定", "動きを止め、腕を伸ばしたポーズにする"],
          [
            "出典",
            '<a href="https://animatorschecklist.com/en/glossary/" target="_blank" rel="noopener">The Animator\'s Checklist: Glossary</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            const seg = (x, y, a, l) => [x + sin(a) * l, y + cos(a) * l];
            const line = (pts, w, c) => {
              g.lineCap = "round";
              g.lineJoin = "round";
              g.lineWidth = w;
              g.strokeStyle = c;
              g.beginPath();
              g.moveTo(pts[0][0], pts[0][1]);
              for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
              g.stroke();
            };
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const limb = (x, y, a1, l1, a2, l2, w, c) => {
              const k = seg(x, y, a1, l1),
                f = seg(k[0], k[1], a1 + a2, l2);
              line([[x, y], k, f], w, c);
              return [k, f];
            };
            // 人：hip（腰）の位置と pose（lean 体の傾き, t1/s1 手前の脚, t2/s2 奥の脚, u1/f1 手前の腕, u2/f2 奥の腕）
            const figure = (x, y, p, L = { t: 18, s: 18, b: 30, u: 14, f: 13, h: 9 }) => {
              const near = col("blue"),
                far = col("sky"),
                nx = x + sin(p.lean || 0) * L.b,
                ny = y - cos(p.lean || 0) * L.b;
              limb(x, y, p.t2, L.t, p.s2, L.s, 7, far);
              limb(nx, ny + 3, p.u2, L.u, p.f2, L.f, 6, far);
              line(
                [
                  [x, y],
                  [nx, ny],
                ],
                11,
                near,
              );
              dot(nx + sin(p.lean || 0) * (L.h + 3), ny - cos(p.lean || 0) * (L.h + 3), L.h, near);
              limb(x, y, p.t1, L.t, p.s1, L.s, 7, near);
              limb(nx, ny + 3, p.u1, L.u, p.f1, L.f, 6, near);
            };
            const ground = (y, off, gap = 22) => {
              g.fillStyle = col("ice");
              g.fillRect(0, y, W, H - y);
              g.strokeStyle = col("sky");
              g.lineWidth = 2;
              for (let x = -((off % gap) + gap) % gap; x < W; x += gap) {
                g.beginPath();
                g.moveTo(x, y + 8);
                g.lineTo(x + 8, y + 8);
                g.stroke();
              }
            };
            // 2本の骨の IK：根元 (x, y) から長さ a, b で目標 (tx, ty) へ。bend = ±1 で曲がる向き。関節の位置を返す
            const ik2 = (x, y, tx, ty, a, b, bend = 1) => {
              let dx = tx - x,
                dy = ty - y,
                d = Math.hypot(dx, dy);
              const dd = Math.max(Math.abs(a - b) + 0.01, Math.min(d, a + b - 0.01)),
                base = d ? Math.atan2(dy, dx) : -Math.PI / 2,
                c = Math.max(-1, Math.min(1, (a * a + dd * dd - b * b) / (2 * a * dd))),
                th = base - bend * Math.acos(c);
              return [x + cos(th) * a, y + sin(th) * a, x + cos(base) * dd, y + sin(base) * dd];
            };
            const tr = [];
            return raf((t) => {
              const ph = rm ? 0.5 : t * 2.2;
              g.clearRect(0, 0, W, H);
              const a1 = 2.1 + 0.8 * sin(ph),
                a2 = 0.8 * sin(ph - v.lag),
                a3 = 0.7 * sin(ph - v.lag * 2);
              const p0 = [50, 110],
                p1 = seg(p0[0], p0[1], a1, 48),
                p2 = seg(p1[0], p1[1], a1 + a2, 40),
                p3 = seg(p2[0], p2[1], a1 + a2 + a3, 24);
              tr.push(p3);
              if (tr.length > 60) tr.shift();
              g.strokeStyle = col("ice");
              g.lineWidth = 3;
              g.beginPath();
              tr.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
              g.stroke();
              const arc = (p, base, a, r) => {
                g.strokeStyle = col("sky");
                g.lineWidth = 2;
                g.beginPath();
                const s = Math.PI / 2 - base,
                  e = Math.PI / 2 - (base + a);
                g.arc(p[0], p[1], r, Math.min(s, e), Math.max(s, e));
                g.stroke();
              };
              arc(p0, 2.1, a1 - 2.1, 18);
              arc(p1, a1, a2, 14);
              arc(p2, a1 + a2, a3, 11);
              line([p0, p1], 12, col("navy"));
              line([p1, p2], 10, col("cobalt"));
              line([p2, p3], 8, col("blue"));
              [p0, p1, p2].forEach((p) => dot(p[0], p[1], 4.5, "#fff"));
              dot(p3[0], p3[1], 6, col("blue"));
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
