<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>モーションブラー（Motion blur） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-motion-blur" style="position: relative; width: 220px; height: 120px">
        <svg width="0" height="0" style="position: absolute">
          <filter id="ac-mb-f" x="-50%" y="-10%" width="200%" height="120%">
            <feGaussianBlur class="ac-motion-blur-gb" stdDeviation="0 0" />
          </filter></svg
        ><span class="ac-motion-blur-t sb-grad-sky"></span>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-motion-blur .ac-motion-blur-t {
        position: absolute;
        left: 0;
        top: 40px;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        filter: url(#ac-mb-f);
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "motion-blur",
        name: "モーションブラー",
        en: "Motion blur",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "速く動いている物を、動いている方向にだけぼかす表現です。カメラで撮った動く物のように、速さと勢いが自然に伝わります。止まるとぼけが消えて、くっきり見えます。プレビューは SVG のフィルターで速さに応じたぼかしをかけています。",
        use: "スピード感のある登場・退出、ゲーム、スポーツ・車の演出、大きな移動の遷移。",
        params: [{ key: "k", label: "ぼかしの強さ", value: 1.2, min: 0, max: 3, step: 0.1, unit: "" }],
        spec: [
          ["ぼかし", 'SVG の <code>feGaussianBlur stdDeviation="横 0"</code>（横方向だけ）を、速さに比例させる'],
          ["速さ", "前のフレームとの位置の差。止まったら 0"],
          ["負荷", "フィルターは重い。大きな要素や常時の動きでは使わない。残像（smear / echo）で代用する手もある"],
          ["動きを減らす設定", "動きをやめ、最後の状態（または色の変化だけ）にする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/after-effects/desktop/apply-effects-and-animation-presets/list-of-effects/time-effects.html" target="_blank" rel="noopener">Adobe: time effects</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const t0 = stage.querySelector(".ac-motion-blur-t"),
              gb = stage.querySelector(".ac-motion-blur-gb");
            let lx = null,
              lt = 0;
            if (rm) {
              t0.style.transform = "translateX(90px)";
              return null;
            } // 動きを減らす設定：止めてぼかさない
            return raf((t) => {
              const dt = Math.max(1 / 240, Math.min(0.05, t - lt));
              lt = t;
              const k = (t % 2) / 2,
                e = k < 0.5 ? 0.5 - Math.cos(Math.PI * k * 2) / 2 : 0.5 + Math.cos(Math.PI * (k - 0.5) * 2) / 2,
                x = 10 + e * 160;
              t0.style.transform = `translateX(${x}px)`;
              const vel = lx === null ? 0 : Math.abs(x - lx) / (dt * 60);
              lx = x;
              gb.setAttribute("stdDeviation", `${(vel * v.k).toFixed(2)} 0`);
            }); // 速さは 1/60 秒あたり
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
