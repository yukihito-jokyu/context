<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>へこんだまま残る（Plastic deformation） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-plastic-deformation"
        style="
          position: relative;
          width: 220px;
          height: 150px;
          border-radius: 20px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: var(--shadow-card);
        "
      >
        <canvas width="220" height="150" style="position: absolute; left: 0; top: 0"></canvas>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion"></style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "plastic-deformation",
        name: "へこんだまま残る",
        en: "Plastic deformation",
        cat: "仕上げ・効果",
        kind: "motion",
        description:
          "物を押したり曲げたりしたとき、力が小さければ元に戻り（弾性）、限度（降伏点）を超えるとへこみや曲がりがそのまま残る（塑性）変形です。金属の板がへこむ、缶がつぶれる、といった重さと硬さのある変形になります。左は元に戻る素材、右は曲がりが残る素材です。",
        use: "製品の耐久性の説明、ゲームの車や物のへこみ、工業・素材系のビジュアル、物理の教材。",
        params: [{ key: "yield", label: "降伏点（残り始める曲がり）", value: 8, min: 0, max: 20, step: 1, unit: "px" }],
        spec: [
          [
            "仕組み",
            "変形量のうち、降伏点を超えた分を「残る変形」に足していく。力を外すと、残る変形の位置までしか戻らない",
          ],
          [
            "見せ方",
            "押している間は同じように曲げ、離した瞬間の戻り方の違いで素材の違いを見せる。戻るときは少し揺らす",
          ],
          ["本格的に", "3D では、物理エンジンの塑性の設定や、衝突の位置で頂点を押し込んで元に戻さない処理で作る"],
          ["動きを減らす設定", "曲げる動きをやめ、曲がりが残った状態の静止画にする"],
          [
            "出典",
            '<a href="https://www.sidefx.com/products/houdini/vfx/vellum/" target="_blank" rel="noopener">sidefx.com（vellum）</a>',
          ],
        ],
        loop: 0,
        run: (stage, v) => {
          const mq = matchMedia("(prefers-reduced-motion: reduce)"),
            html0 = stage.innerHTML;
          const start = () => {
            const seq = (period, steps) => {
              let ts = [];
              const once = () => {
                ts = steps.map(([at, fn]) => setTimeout(fn, at));
              };
              once();
              const iv = setInterval(once, period);
              return () => {
                clearInterval(iv);
                ts.forEach(clearTimeout);
              };
            };
            const raf = (fn) => {
              let id,
                t0 = performance.now(),
                seen = true; // 画面外にある間は描画を止める
              const io = new IntersectionObserver(([e]) => {
                seen = e.isIntersecting;
              });
              io.observe(stage);
              const f = (now) => {
                if (seen) fn(Math.max(0, now - t0) / 1000);
                id = requestAnimationFrame(f);
              };
              id = requestAnimationFrame(f);
              return () => {
                cancelAnimationFrame(id);
                io.disconnect();
              };
            };
            const rm = mq.matches;
            const cv = stage.querySelector("canvas"),
              W = +cv.getAttribute("width"),
              H = +cv.getAttribute("height"),
              dpr = devicePixelRatio || 1;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + "px";
            cv.style.height = H + "px";
            const g = cv.getContext("2d");
            g.scale(dpr, dpr);
            const css = getComputedStyle(stage),
              col = (k) => css.getPropertyValue("--" + k).trim();
            g.filter = "blur(1px)";
            const canFilter = g.filter === "blur(1px)";
            g.filter = "none"; // canvas の filter が使えないブラウザでは影でにじませる
            const blur = (px, c = "rgba(150,200,255,.7)") => {
              if (canFilter) g.filter = px ? `blur(${px}px)` : "none";
              else {
                g.shadowBlur = px * 2;
                g.shadowColor = px ? c : "transparent";
              }
            };
            const TAU = Math.PI * 2,
              sin = Math.sin,
              cos = Math.cos;
            let sd = 7;
            const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
            const dot = (x, y, r, c) => {
              g.fillStyle = c;
              g.beginPath();
              g.arc(x, y, r, 0, TAU);
              g.fill();
            };
            const bar = (x0, d, lab) => {
              g.strokeStyle = col("blue");
              g.lineWidth = 8;
              g.lineCap = "round";
              g.beginPath();
              g.moveTo(x0, 70);
              g.quadraticCurveTo(x0 + 45, 70 + d * 2, x0 + 90, 70);
              g.stroke();
              g.fillStyle = col("navy");
              g.fillRect(x0 - 4, 70, 8, 30);
              g.fillRect(x0 + 86, 70, 8, 30);
              g.fillStyle = col("ink-muted");
              g.font = "600 11px sans-serif";
              g.textAlign = "center";
              g.fillText(lab, x0 + 45, 130);
            };
            return raf((t) => {
              const T = t % 4,
                push = rm ? 0 : T < 1 ? T : T < 1.6 ? 1 : 0,
                ret = T < 1.6 ? 0 : Math.min(1, (T - 1.6) / 0.6),
                mx = 26;
              const press = push * mx,
                wob = ret > 0 && ret < 1 ? Math.sin(ret * 14) * (1 - ret) * 3 : 0,
                perm = Math.max(0, mx - v.yield);
              const dE = rm ? 0 : T < 1.6 ? press : (1 - ret) * mx * (1 - ret) + wob,
                dP = rm ? perm : T < 1.6 ? press : perm + (mx - perm) * (1 - ret) * (1 - ret) + wob * 0.5;
              g.clearRect(0, 0, W, H);
              bar(14, dE / 2, "元に戻る（弾性）");
              bar(116, dP / 2, "残る（塑性）");
              if (T < 1.6 && !rm) {
                g.fillStyle = col("ink");
                for (const x of [59, 161]) {
                  g.fillRect(x - 10, 70 + press - 26, 20, 12);
                  g.fillRect(x - 2, 0, 4, 70 + press - 26);
                }
              }
            });
          };
          let stop = start();
          const restart = () => {
            if (typeof stop === "function") stop();
            stage.innerHTML = html0;
            stop = start();
          };
          mq.addEventListener("change", restart);
          return () => {
            mq.removeEventListener("change", restart);
            if (typeof stop === "function") stop();
          };
        },
      });
    </script>
  </body>
</html>
