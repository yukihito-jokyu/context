    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-spiral-wipe .ac-spiral-wipe-s {
        position: absolute;
        inset: 0;
        background-size: cover;
      }
      .ac-spiral-wipe .ac-spiral-wipe-c {
        position: absolute;
        transform: scale(0);
        animation: ac-spiral-wipe-c calc(var(--dur, 2600ms) * 2) cubic-bezier(0.22, 1, 0.36, 1) infinite;
        animation-delay: calc(var(--k) * var(--dur, 2600ms) * 0.6);
      }
      @keyframes ac-spiral-wipe-c {
        0% {
          transform: scale(0);
        }
        6%,
        50% {
          transform: scale(1);
        }
        56%,
        100% {
          transform: scale(0);
        }
      }
      @keyframes ac-spiral-wipe-rf {
        0%,
        3% {
          opacity: 0;
        }
        6%,
        50% {
          opacity: 1;
        }
        53%,
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-spiral-wipe .ac-spiral-wipe-c {
          transform: none;
          animation: ac-spiral-wipe-rf calc(var(--dur, 2600ms) * 2) linear infinite;
        }
      }
    </style>

    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "spiral-wipe",
        name: "渦巻きのワイプ",
        en: "Spiral wipe / Spiral boxes",
        cat: "映像の切り替え",
        kind: "motion",
        description:
          "画面を小さなブロックに分け、外側から内側へ渦を巻く順番でブロックを次々と入れ替えていく切り替えです。順番が目で追えるので、楽しく、少しレトロな印象になります。",
        use: "ゲームやレトロ風の場面転換、楽しいスライドショー。",
        params: [{ key: "dur", label: "片道の長さ", value: 2600, min: 1200, max: 6000, step: 100, unit: "ms" }],
        spec: [
          [
            "書き方",
            "次のショットを格子（例：6×4）に切ったブロックとして並べ、外周から内へ渦の順に <code>animation-delay</code> をずらして出す",
          ],
          ["出方", "1つずつ <code>scale(0 → 1)</code> か、パッと表示（<code>step-end</code>）"],
          ["順番", "<code>--k</code>（0〜1 の順番）を各ブロックに持たせ、遅れ = <code>--k × 全体の時間</code>"],
          ["動きを減らす設定", "ブロックの順番の動きをやめ、短いクロスフェードにする"],
          [
            "出典",
            '<a href="https://helpx.adobe.com/premiere/desktop/add-video-effects/effects-and-transitions-library/list-of-video-transitions.html" target="_blank" rel="noopener">Adobe Premiere: List of Video transitions</a>、<a href="https://docs.imaster.org/davinci-resolve-21-manual/part-7-editing-effects-and-transitions/ch.-55-using-transitions" target="_blank" rel="noopener">DaVinci Resolve 21 リファレンスマニュアル（写し）: Using Transitions</a>',
          ],
        ],
        loop: 0,
      });
