<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>パルス（Pulse） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div class="ac-pulse" style="position: relative; width: 220px; height: 150px; display: grid; place-items: center">
        <div style="position: relative; display: grid; place-items: center">
          <span class="ac-pulse-ring"></span
          ><span class="ac-pulse-ring" style="animation-delay: calc(var(--dur, 1600ms) / -2)"></span
          ><span class="sb-fab" style="position: relative"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" /></svg
          ></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-pulse .ac-pulse-ring {
        position: absolute;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--blue);
        opacity: 0.15;
        transform: scale(1.3);
      }
      @keyframes ac-pulse-pulse {
        from {
          transform: scale(1);
          opacity: 0.45;
        }
        to {
          transform: scale(var(--size, 1.8));
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .ac-pulse .ac-pulse-ring {
          opacity: 0;
          transform: none;
          animation: ac-pulse-pulse var(--dur, 1600ms) cubic-bezier(0.22, 1, 0.36, 1) 3;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "pulse",
        name: "パルス",
        en: "Pulse",
        cat: "ループ・常時の動き",
        kind: "motion",
        description:
          "輪が外へ広がりながら消えるのをくり返して、脈を打つように注意を引く動きです。「ここを見て」「いま動いています」を静かに伝えます。",
        use: "新しいボタンの案内、ライブ中・録音中の表示、オンラインの状態、地図の現在地。",
        params: [
          { key: "dur", label: "1拍の時間", value: 1600, min: 800, max: 3000, step: 100, unit: "ms" },
          { key: "size", label: "広がる大きさ", value: 1.8, min: 1.2, max: 2.5, step: 0.1, unit: "" },
        ],
        spec: [
          ["輪", "同じ形の輪を <code>scale(1 → 広がる大きさ)</code> と <code>opacity 0.45 → 0</code>｜out｜3回"],
          ["本体", "本体は動かさない（読む・押すのを邪魔しない）"],
          ["注意", "注意を引き終えたら止める（数回、または操作されるまで）"],
          ["動きを減らす設定", "広がりをやめ、輪を薄く表示したままにする"],
          ["出典", "Animation Vocabulary（Looping & Ambient Motion）"],
        ],
        loop: 0,
      });
    </script>
  </body>
</html>
