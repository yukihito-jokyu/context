<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>煙のように出入り（Puff in / out） | Animation Catalog</title>
    <link rel="stylesheet" href="../shared/catalog.css" />

    <!-- プレビュー（Soft Blue で描いた見本。実装対象ではない） -->
    <template id="stage">
      <div
        class="ac-puff-in-out"
        style="position: relative; width: 200px; height: 150px; display: grid; place-items: center"
      >
        <div
          class="sb-card ac-puff-in-out-c"
          style="width: 140px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box"
        >
          <span class="sb-hero sb-grad-hero" style="height: 46px; border-radius: 14px"></span
          ><span class="sb-bar sb-bar--sm sb-bar--strong" style="width: 77px"></span
          ><span class="sb-bar sb-bar--xs sb-bar--soft" style="width: 49px"></span>
        </div>
      </div>
    </template>

    <!-- 動きの本体。params の値は var(--key, 初期値) で受け取る -->
    <style id="motion">
      .ac-puff-in-out .ac-puff-in-out-c {
        animation:
          ac-puff-in-out-in var(--in, 600ms) cubic-bezier(0.22, 1, 0.36, 1) both,
          ac-puff-in-out-out var(--out, 500ms) cubic-bezier(0.55, 0, 1, 0.45) calc(var(--in, 600ms) + 1000ms) forwards;
      }
      @keyframes ac-puff-in-out-in {
        from {
          opacity: 0;
          transform: scale(var(--big, 2));
          filter: blur(var(--blur, 4px));
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      @keyframes ac-puff-in-out-out {
        from {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
        to {
          opacity: 0;
          transform: scale(var(--big, 2));
          filter: blur(var(--blur, 4px));
        }
      }
      @keyframes ac-puff-in-out-rf-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ac-puff-in-out-rf-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ac-puff-in-out .ac-puff-in-out-c {
          animation-name: ac-puff-in-out-rf-in, ac-puff-in-out-rf-out;
        }
      }
    </style>
  </head>
  <body>
    <script src="../shared/detail.js"></script>
    <script>
      CatalogDetail.mount({
        id: "puff-in-out",
        name: "煙のように出入り",
        en: "Puff in / out",
        cat: "登場・退出",
        kind: "motion",
        description:
          "大きくぼやけた状態から、縮みながらピントが合って現れる動きです。消えるときは逆に、膨らみながらぼやけて消えます。煙や湯気のような、柔らかい出入りです。",
        use: "ヒーローの見出し、写真の切り替え、魔法のような演出。",
        params: [
          { key: "in", label: "登場の時間", value: 600, min: 200, max: 2000, step: 50, unit: "ms" },
          { key: "out", label: "退出の時間", value: 500, min: 200, max: 2000, step: 50, unit: "ms" },
          { key: "big", label: "大きさ", value: 2, min: 1.1, max: 3, step: 0.1, unit: "" },
          { key: "blur", label: "ぼかし", value: 4, min: 0, max: 16, step: 1, unit: "px" },
        ],
        total: (p) => p["in"] + 1000 + p["out"],
        spec: [
          [
            "登場",
            "<code>scale(大きさ → 1)</code>、<code>filter: blur(ぼかし → 0)</code>、<code>opacity 0 → 1</code>｜out",
          ],
          ["退出", "<code>scale(1 → 大きさ)</code>、<code>blur(0 → ぼかし)</code>、<code>opacity → 0</code>｜in"],
          ["負荷", "<code>filter: blur</code> は重い。大きな要素や多数の要素には使わない"],
          ["動きを減らす設定", "拡大とぼかしをやめ、透明度の切り替えだけにする"],
          [
            "出典",
            '<a href="https://www.minimamente.com/project/magic/" target="_blank" rel="noopener">Magic Animations</a>',
          ],
        ],
        loop: 2600,
      });
    </script>
  </body>
</html>
