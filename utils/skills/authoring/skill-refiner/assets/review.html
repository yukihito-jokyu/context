<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スキルの検証・改善</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f1;
  --paper: #fff;
  --ink: #24362c;
  --muted: #657366;
  --line: #d5ddd4;
  --field-line: #bdcabe;
  --accent: #245d47;
  --soft: #eef6ef;
}
* { box-sizing: border-box; }
body {
  max-width: 820px;
  margin: 40px auto;
  padding: 20px;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.8 system-ui;
}
header, main, footer { margin: 0; padding: 0; }
h1 { font-size: 28px; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.badge {
  display: inline-block;
  background: var(--soft);
  color: var(--accent);
  padding: 3px 12px;
  border-radius: 20px;
}
details, .panel {
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-top: 16px;
}
summary { cursor: pointer; padding: 20px; font-weight: 650; }
.content, .panel { padding: 20px; }
textarea, select {
  display: block;
  width: 100%;
  font: inherit;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--field-line);
  padding: 10px;
  border-radius: 7px;
}
textarea { min-height: 110px; }
#response { min-height: 180px; }
label { display: block; margin-top: 20px; }
button {
  cursor: pointer;
  font: inherit;
  border: 1px solid var(--field-line);
  border-radius: 7px;
  background: var(--accent);
  color: white;
  padding: 10px 16px;
  margin: 14px 8px 14px 0;
}
button:disabled { opacity: .55; cursor: wait; }
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--soft);
  padding: 14px;
  border-radius: 8px;
  font: 13px/1.7 ui-monospace, monospace;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.scroll { overflow-x: auto; }
iframe { width: 100%; height: 480px; border: 1px solid var(--line); border-radius: 7px; }
.flow { display: flex; flex-wrap: wrap; gap: 8px; }
.flow span { background: var(--soft); padding: 5px 10px; border-radius: 6px; }
.current { outline: 2px solid var(--accent); }
blockquote { margin: 10px 0; padding: 10px; border-left: 3px solid var(--accent); }
input { accent-color: var(--accent); }
:focus-visible { outline: 3px solid #bc9b4c; outline-offset: 3px; }
.good { color: var(--accent); }
.warning { color: #a06328; }
@media (max-width: 600px) {
  body { margin: 20px auto; padding: 16px; }
  .panel, .content, summary { padding: 14px; }
  iframe { height: 350px; }
}
</style></head><body>
<header><h1 id="title">スキルの検証・改善</h1><p id="meta" class="muted"></p><p id="stage" class="badge"></p><p>論点を開いて内容を確認し、下の回答欄から指摘・承認をまとめて送信できます。</p><div class="flow" id="flow"></div></header>
<main>
<details open><summary>1. 対象スキルと題材</summary><div class="content" id="inputs"></div></details>
<details><summary>2. 成果物と実行担当</summary><div class="content" id="outputs"></div></details>
<details><summary>3. 人間の指摘と評価基準</summary><div class="content" id="rubric"></div></details>
<details><summary>4. 評価結果と改善案</summary><div class="content" id="results"></div></details>
<details><summary>5. 回答履歴と検証の範囲</summary><div class="content" id="history"></div></details>
<section class="panel"><h2>この版への回答</h2><p id="version" class="muted"></p><form id="answer-form"><label for="action">進め方</label><select id="action" required><option value="">選んでください</option></select><label for="notes">指摘・補足（論点や題材名を添えてください）</label><textarea id="notes" placeholder="気になった点、期待する結果、その理由など"></textarea><label><input type="checkbox" id="confirmed">表示された版と、選んだ進め方を確認した</label><button class="primary" type="submit" id="submit">回答を一括送信する</button><button type="button" id="reload">最新の内容を読み込む</button><p id="message" role="status" aria-live="polite"></p><div id="offline" hidden><label for="response">AIへ返す回答</label><textarea id="response" readonly></textarea><button type="button" id="copy">回答をコピーする</button><button type="button" id="download">回答を保存する</button><p class="muted">オフラインではAIへ直接届きません。回答を共有してください。AIは版を照合し、会話上の明示的な回答として扱います。</p></div></form></section>
</main><footer><p class="muted">指摘は送信するまで草稿です。承認は明示的な操作でのみ保存します。新しい版の確認には再読込が必要です。</p><p class="muted">このページは <a href="https://github.com/anthropics/claude-plugins-community/blob/main/html-plan/skills/html-plan/SKILL.md">html-plan</a> の論点別確認・一括回答と、<a href="https://github.com/linkc-skills/HTML-Plan">linkc-skills版</a>の保存方式を参考にしています。</p></footer>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
(()=>{'use strict';const {state:s,token}=JSON.parse(document.getElementById('review-data').textContent),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),p=t=>'<p>'+esc(t)+'</p>',pre=t=>'<pre>'+esc(t)+'</pre>';
$('title').textContent=s.name+' の検証・改善';$('meta').textContent='反復 '+s.iteration+' · 表示版 '+s.revision;$('stage').textContent=s.stage_title;$('version').textContent='回答対象: 表示版 '+s.revision+' / '+s.stage_title+' / スキル '+s.skill_hash.slice(0,12);
const phases=[['入力','input_review'],['作成','generating'],['指摘','feedback_review'],['評価基準','rubric_review'],['評価','evaluating'],['改善案','analysis_review'],['再評価','results_review'],['最終確認','final_review']];$('flow').innerHTML=phases.map(([n,k])=>'<span class="'+(s.stage===k?'current':'')+'">'+n+'</span>').join('');
$('inputs').innerHTML=p('スキル: '+s.name)+p('実行する版: '+s.skill)+s.cases.map(c=>'<h3>'+esc(c.id)+'</h3>'+pre(c.task)+p('入力: '+(c.files.map(f=>f.path).join(', ')||'なし'))).join('');
const headers=['題材','反復','役割','担当ID','状態'],rows=s.runs.map(r=>[r.case,r.iteration,r.role==='generate'?'成果物の作成':r.role==='evaluate'?'評価':r.role,r.agent_id||'未登録',r.status==='complete'?'完了':r.status==='error'?'実行失敗':r.status==='running'?'実行中':'起動待ち']);function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
$('outputs').innerHTML=(rows.length?table(headers,rows):p('成果物の作成はまだ始まっていません。'))+s.artifacts.map(a=>{const url='/artifact/'+a.path.split('/').map(encodeURIComponent).join('/');return '<details><summary>'+esc(a.case+' / 反復'+a.iteration+' / '+a.path.split('/').pop())+'</summary><div class="content">'+(token&&a.html?'<iframe sandbox="allow-scripts" loading="lazy" title="'+esc(a.path)+'" src="'+url+'"></iframe>':'')+(token?'<p><a target="_blank" rel="noopener" href="'+url+'">成果物を開く</a></p>':p('成果物の場所: '+a.path))+'</div></details>'}).join('');
const feedback=s.responses.filter(r=>r.action==='feedback');$('rubric').innerHTML=feedback.map(r=>'<blockquote>'+esc(r.notes)+'</blockquote>').join('')+(s.rubric_data?table(['評価項目','指摘との対応','採点方法','重み','最低点'],s.rubric_data.criteria.map(c=>[c.label,c.feedback,c.method,c.weight,c.minimum??0]))+p('合格条件: 加重平均 '+s.rubric_data.threshold+' 以上、かつ各項目の最低点以上。')+p('評価基準の版: '+s.rubric.hash):p('人間の指摘を受け取ってから評価基準を作成します。'));
const graded=s.runs.filter(r=>r.role==='evaluate'&&r.status==='complete');$('results').innerHTML=(graded.length?table(['題材','反復','点数','判定','根拠'],graded.map(r=>[r.case,r.iteration,r.score.toFixed(3),r.passed?'合格':'不合格',r.grades.map(g=>g.id+': '+g.evidence).join('\n')])):p('承認した評価基準で採点した結果はまだありません。'))+s.runs.filter(r=>r.status==='error').map(r=>p('実行失敗: '+r.case+' / '+r.error))+ (s.analysis_data?p(s.analysis_data.summary)+s.analysis_data.changes.map(c=>'<details><summary>'+esc(c.path+' · '+c.reason)+'</summary><div class="content"><h3>変更前</h3>'+pre(c.before===null?'新規ファイル':c.before)+'<h3>変更後</h3>'+pre(c.after)+'</div></details>').join(''):p('改善案は評価結果とスキル本文を照合して作成します。'))+(s.loop?p('自動ループ中: 開始反復 '+s.loop.start+' / 上限 '+s.loop.limit+'回。合格、上限、実行失敗で停止します。'):p('自動ループは現在有効ではありません。'));
$('history').innerHTML=s.responses.map(r=>'<details><summary>'+esc(r.stage+' · '+r.action+' · 表示版'+r.revision)+'</summary><div class="content">'+pre(r.notes||'補足なし')+p(r.processed?'AIの回答: '+r.answer:'AIの確認待ち')+'</div></details>').join('')+p('hooksのイベント記録: '+s.hook_checks.length+'件。設定を作成しただけでは実環境で制止できることの証明になりません。')+p('hooksが対象外のツール経路や、共有ファイルから見える情報は残ります。scriptsは固定版と成果物の改変を検査します。')+pre(s.history.map(h=>h.at+' '+h.event).join('\n'));
for(const [value,label] of s.actions){const o=document.createElement('option');o.value=value;o.textContent=label;$('action').append(o)}
const key='skill-refiner-draft:'+s.workspace+':'+s.stage+':'+s.revision;try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){$('notes').value=d.notes||'';$('action').value=d.action||''}}catch{}
for(const id of ['notes','action'])$(id).addEventListener('input',()=>{try{localStorage.setItem(key,JSON.stringify({notes:$('notes').value,action:$('action').value}))}catch{}$('offline').hidden=true});$('reload').onclick=()=>location.reload();
$('answer-form').onsubmit=async e=>{e.preventDefault();if(!$('confirmed').checked){$('message').textContent='表示版と進め方を確認したチェックを付けてください。';return}const payload={revision:s.revision,stage:s.stage,action:$('action').value,notes:$('notes').value};if(['comment','feedback'].includes(payload.action)&&!payload.notes.trim()){$('message').textContent='指摘を入力してください。';return}if(!token){$('response').value=JSON.stringify({workspace:s.workspace,...payload},null,2);$('offline').hidden=false;$('message').textContent='回答を作成しました。コピーまたは保存して共有してください。';return}$('submit').disabled=true;try{const response=await fetch('/api/respond',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw new Error(data.error||'保存できませんでした');$('message').textContent='回答を保存しました。AIの確認後に最新の内容を読み込んでください。';try{localStorage.removeItem(key)}catch{} }catch(error){$('message').textContent=error.message+'。内容を確認して再読込してください。';$('submit').disabled=false}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('response').value);$('message').textContent='回答をコピーしました。'}catch{$('response').focus();$('response').select();$('message').textContent='選択した回答をコピーしてください。'}};$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([$('response').value],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='skill-refiner-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
})();
</script></body></html>
