<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検証するスキルと題材</title><style>body{max-width:820px;margin:40px auto;padding:20px;font:16px/1.8 system-ui;color:#24362c;background:#f5f6f1}h1{font-size:28px}label{display:block;margin-top:20px}input,textarea{display:block;width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #bdcabe;border-radius:7px;background:white}textarea{min-height:110px}button{font:inherit;padding:10px 16px;margin:14px 8px 14px 0;cursor:pointer;border-radius:7px;border:1px solid #bdcabe;background:#245d47;color:white}section{border:1px solid #d5ddd4;padding:20px;border-radius:10px;margin-top:16px}#response{min-height:180px}.muted{color:#657366}</style></head><body><h1>検証するスキルと題材</h1><p>対象スキルは1つ、題材は1つ以上必要です。入力が揃うまで実行を開始しません。</p><form id="form"><label for="skill">対象スキル名、または正本の場所</label><input id="skill" required placeholder="例: explain-html"><div id="cases"><section><label>何を作る・実行するか<textarea class="task" required placeholder="依頼内容と、期待する成果物を書いてください。"></textarea></label></section></div><button type="button" id="add">題材を追加する</button><button type="submit">入力をまとめる</button></form><div id="output" hidden><label for="response">AIに共有する入力</label><textarea id="response" readonly></textarea><button id="copy">入力をコピーする</button><button id="download">入力を保存する</button><p class="muted">コピーした入力または保存したファイルをAIに共有してください。必要な入力ファイルがある場合は、その場所も添えてください。</p></div><p id="message" role="status"></p><script>(()=>{const $=id=>document.getElementById(id);$('add').onclick=()=>{const section=document.createElement('section'),label=document.createElement('label'),task=document.createElement('textarea'),remove=document.createElement('button');label.textContent='何を作る・実行するか';task.className='task';task.required=true;label.append(task);remove.type='button';remove.textContent='この題材を削除する';remove.onclick=()=>section.remove();section.append(label,remove);$('cases').append(section)};$('form').onsubmit=e=>{e.preventDefault();const cases=[...document.querySelectorAll('.task')].map((t,i)=>({id:'case-'+(i+1),task:t.value.trim(),files:[]}));if(cases.some(c=>!c.task))return;$('response').value=JSON.stringify({skill:$('skill').value.trim(),cases},null,2);$('output').hidden=false;$('message').textContent='入力を作成しました。AIへ共有すると内容の確認へ進みます。'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('response').value);$('message').textContent='入力をコピーしました。'}catch{$('response').focus();$('response').select()}};$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([$('response').value],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='skill-refiner-input.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}})();</script></body></html>
