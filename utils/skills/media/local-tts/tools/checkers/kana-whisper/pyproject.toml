[project]
name = "local-tts-checker-kana-whisper"
version = "0.1.0"
description = "Kana Whisper reading check for local-tts"
requires-python = ">=3.11,<3.13"
license = "MIT"
# Same torch split as the engines: macOS torch 2.15.0 (MPS), Windows/Linux torch 2.8.0 with CUDA 12.8.
dependencies = [
    "transformers==4.57.3",
    "torch==2.15.0; sys_platform == 'darwin'",
    "torchaudio==2.11.1; sys_platform == 'darwin'",
    "torch==2.8.0; sys_platform != 'darwin'",
    "torchaudio==2.8.0; sys_platform != 'darwin'",
    "numpy",
    "soundfile",
    "huggingface-hub",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
