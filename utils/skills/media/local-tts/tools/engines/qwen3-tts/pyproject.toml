[project]
name = "local-tts-engine-qwen3-tts"
version = "0.1.0"
description = "Qwen3-TTS engine server for local-tts"
requires-python = ">=3.11,<3.13"
license = "MIT"
# qwen-tts pins transformers 4.57.3 and leaves torch open. Same torch split as VoxCPM2:
# macOS torch 2.15.0 (MPS), Windows/Linux torch 2.8.0 with CUDA 12.8 wheels.
dependencies = [
    "qwen-tts==0.1.1",
    "torch==2.15.0; sys_platform == 'darwin'",
    "torchaudio==2.11.1; sys_platform == 'darwin'",
    "torch==2.8.0; sys_platform != 'darwin'",
    "torchaudio==2.8.0; sys_platform != 'darwin'",
    "numpy",
    "soundfile",
    "huggingface-hub",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
